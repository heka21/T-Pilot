# Flashcards for PAKA 3.1 (take-off and landing performance). See content/README.md for the format.
- id: PAKA-PC001
  elements: ["PAKA 3.1.1"]
  front: "Effect of headwind, tailwind, higher temperature, lower QNH and higher elevation on take-off and landing distance?"
  back: "Headwind decreases both. Tailwind increases both markedly. Higher temperature, lower QNH and higher elevation all raise density height, increasing both distances and reducing take-off climb gradient."
- id: PAKA-PC002
  elements: ["PAKA 3.1.1"]
  front: "Effect of runway slope and surface on take-off and landing distance?"
  back: "Upslope increases take-off and decreases landing distance; downslope the reverse. Wet sealed: little change to take-off, landing longer. Wet grass increases both; slush increases both greatly; dry sealed is the baseline."
- id: PAKA-PC003
  elements: ["PAKA 3.1.1"]
  front: "Ground effect, wind shear and frost: effect on take-off and landing?"
  back: "Ground effect: may lift off early but not climb, and causes float on landing; climb sags on leaving it. Wind shear with loss of headwind: longer take-off and dangerous loss of airspeed and climb. Frost: increases take-off distance, may prevent lift-off, reduces climb."
- id: PAKA-PC004
  elements: ["PAKA 3.1.2", "PAKA 3.1.3"]
  front: "Pressure height vs density height, and using the altimeter for QNH, pressure height and elevation?"
  back: "Pressure height: altimeter reading with 1013 set. Density height: pressure height corrected about 120 ft per degree from ISA; performance follows it. Dial set to elevation shows QNH on the subscale; subscale QNH shows elevation (within 100 ft for VFR)."
- id: PAKA-PC005
  elements: ["PAKA 3.1.4"]
  front: "Maximum structural take-off/landing weight versus climb weight limit?"
  back: "Structural weights are fixed by airframe strength (POH). The climb weight limit is the weight at which the required take-off climb gradient can still be met at the day's density height. Permitted take-off weight is the lowest of structural, climb, runway-length and landing-weight limits."
- id: PAKA-PC006
  elements: ["PAKA 3.1.5"]
  front: "Likely results of exceeding weight limits?"
  back: "Longer take-off and landing, lower climb rate and gradient, higher stall and approach speeds, reduced cruise speed, range and manoeuvrability, structural, undercarriage, tyre and brake limits exceeded, and a regulatory breach."
