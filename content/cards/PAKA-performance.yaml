# Flashcards for PAKA 3.1 (take-off and landing performance). See content/README.md for the format.
- id: PAKA-PC001
  elements: ["PAKA 3.1.1"]
  front: "Effect of headwind, tailwind, higher temperature, lower QNH and higher elevation on take-off and landing distance?"
  back: "Headwind decreases both. Tailwind increases both markedly. Higher temperature, lower QNH and higher elevation all raise density height, increasing both distances and reducing take-off climb gradient."
  stem: "Compared with ISA sea level conditions, a hot day at a high-elevation aerodrome with low QNH will:"
  options:
    - "Increase take-off distance but reduce landing distance, with no change to climb gradient."
    - "Increase take-off and landing distances and reduce the take-off climb gradient."
    - "Increase take-off and landing distances but improve the take-off climb gradient."
    - "Reduce take-off and landing distances, because the thinner air causes less drag."
  answer: 1
- id: PAKA-PC002
  elements: ["PAKA 3.1.1"]
  front: "Effect of runway slope and surface on take-off and landing distance?"
  back: "Upslope increases take-off and decreases landing distance; downslope the reverse. Wet sealed: little change to take-off, landing longer. Wet grass increases both; slush increases both greatly; dry sealed is the baseline."
  stem: "Compared with a dry sealed runway, a wet sealed runway gives:"
  options:
    - "Take-off distance longer, landing distance little changed."
    - "Both distances greatly increased, as on a slush-covered runway."
    - "Take-off distance little changed, landing distance longer."
    - "Take-off distance shorter, landing distance little changed."
  answer: 2
- id: PAKA-PC003
  elements: ["PAKA 3.1.1"]
  front: "Ground effect, wind shear and frost: effect on take-off and landing?"
  back: "Ground effect: may lift off early but not climb, and causes float on landing; climb sags on leaving it. Wind shear with loss of headwind: longer take-off and dangerous loss of airspeed and climb. Frost: increases take-off distance, may prevent lift-off, reduces climb."
  stem: "An aeroplane lifts off early in ground effect. As it climbs out of ground effect it is likely to:"
  options:
    - "Climb more steeply as the extra lift from ground effect builds."
    - "Accelerate quickly as drag falls away above the runway surface."
    - "Float level, with no change in its climb performance."
    - "Lose climb performance and may sink back towards the runway."
  answer: 3
- id: PAKA-PC004
  elements: ["PAKA 3.1.2", "PAKA 3.1.3"]
  front: "Pressure height vs density height, and using the altimeter for QNH, pressure height and elevation?"
  back: "Pressure height: altimeter reading with 1013 set. Density height: pressure height corrected about 120 ft per degree from ISA; performance follows it. Dial set to elevation shows QNH on the subscale; subscale QNH shows elevation (within 100 ft for VFR)."
  stem: "An aerodrome has a pressure height of 2,000 ft and the temperature is ISA +20°C. The density height is approximately:"
  options:
    - "4,400 ft."
    - "2,240 ft."
    - "3,200 ft."
    - "6,800 ft."
  answer: 0
- id: PAKA-PC005
  elements: ["PAKA 3.1.4"]
  front: "Maximum structural take-off/landing weight versus climb weight limit?"
  back: "Structural weights are fixed by airframe strength (POH). The climb weight limit is the weight at which the required take-off climb gradient can still be met at the day's density height. Permitted take-off weight is the lowest of structural, climb, runway-length and landing-weight limits."
  stem: "The permitted take-off weight on a given day is:"
  options:
    - "The highest of the structural, climb, runway-length and landing-weight limits."
    - "The maximum structural take-off weight in the POH, on every day."
    - "The climb weight limit, since it already allows for the day's density height."
    - "The lowest of the structural, climb, runway-length and landing-weight limits."
  answer: 3
- id: PAKA-PC006
  elements: ["PAKA 3.1.5"]
  front: "Likely results of exceeding weight limits?"
  back: "Longer take-off and landing, lower climb rate and gradient, higher stall and approach speeds, reduced cruise speed, range and manoeuvrability, structural, undercarriage, tyre and brake limits exceeded, and a regulatory breach."
  stem: "Taking off above the maximum take-off weight will result in:"
  options:
    - "A longer take-off, a lower climb rate and a higher stall speed."
    - "A longer take-off, a lower climb rate and a lower stall speed."
    - "A longer take-off, a higher climb rate and a higher stall speed."
    - "A shorter take-off, a lower climb rate and a higher stall speed."
  answer: 0
