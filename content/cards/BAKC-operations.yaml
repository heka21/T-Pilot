# BAKC 5.x and 6.x flashcards.
- id: BAKC-OC001
  elements: ["BAKC 5.1.2"]
  front: "Which charts show controlled airspace and PRD areas, and which does not?"
  back: "VTC, VNC and ERC-L show them. The WAC shows no airspace at all."
  stem: "Which of these charts shows no controlled airspace or PRD areas?"
  options:
    - "The World Aeronautical Chart (WAC)."
    - "The Visual Terminal Chart (VTC)."
    - "The Visual Navigation Chart (VNC)."
    - "The En Route Chart, Low level (ERC-L)."
  answer: 0
- id: BAKC-OC002
  elements: ["BAKC 5.1.1"]
  front: "What is an isogonal?"
  back: "A dashed line on the chart joining points of equal magnetic variation, labelled in degrees east or west; used to convert true to magnetic."
  stem: "An isogonal on an aeronautical chart is a line joining points of equal:"
  options:
    - "Compass deviation, used to convert magnetic direction to compass."
    - "Magnetic variation, used to convert true direction to magnetic."
    - "Magnetic dip, used to correct the compass for turning errors."
    - "Terrain elevation, used to find the lowest safe altitude."
  answer: 1
- id: BAKC-OC003
  elements: ["BAKC 5.2.1"]
  front: "Units for runway length and width in ERSA?"
  back: "Metres. Elevation is in feet; navigation distances are in nautical miles."
  stem: "In ERSA, runway length and width are given in:"
  options:
    - "Feet, with aerodrome elevation in metres."
    - "Feet, with aerodrome elevation also in feet."
    - "Metres, with aerodrome elevation in feet."
    - "Metres, with aerodrome elevation also in metres."
  answer: 2
- id: BAKC-OC004
  elements: ["BAKC 5.2.2"]
  front: "RA1, RA2 and RA3 restricted area status?"
  back: "RA1: clearance normally available, plan through. RA2: clearance unlikely at short notice. RA3: no clearance available."
  stem: "A restricted area on your planned route has the status RA2. This means:"
  options:
    - "A clearance is normally available, so you may plan through it."
    - "No clearance through it will be available, whatever the notice given."
    - "It is active only when it has been activated by NOTAM."
    - "A clearance through it is unlikely to be given at short notice."
  answer: 3
- id: BAKC-OC005
  elements: ["BAKC 5.2.3"]
  front: "ERSA hours of activity abbreviations H24, HJ, HN, NOTAM?"
  back: "H24 continuous; HJ daylight (sunrise to sunset); HN night; NOTAM means activated by NOTAM. Times are UTC: add 8 hours for WST."
  stem: "In ERSA, a facility with hours of activity HJ operates:"
  options:
    - "Continuously, 24 hours a day."
    - "From sunrise to sunset, in daylight."
    - "From sunset to sunrise, during the night."
    - "Only when activated by NOTAM."
  answer: 1
- id: BAKC-OC006
  elements: ["BAKC 6.1.1"]
  front: "Four things to check on the maintenance release before flight?"
  back: "Within hours and date limits; no maintenance overdue; daily inspection certified today; no uncleared defect that grounds the aircraft."
  stem: "Before flight, the pilot checks that the maintenance release shows the aircraft is:"
  options:
    - "Within hours and date limits, no maintenance overdue, a daily certified this week, no grounding defect."
    - "Within hours and date limits, no maintenance overdue, today's pre-flight certified, no grounding defect."
    - "Within hours and date limits, no maintenance overdue, today's daily certified, no grounding defect."
    - "Within hours and date limits, no maintenance overdue, today's daily certified, no defects of any kind."
  answer: 2
- id: BAKC-OC007
  elements: ["BAKC 6.1.2"]
  front: "Daily inspection versus pre-flight inspection?"
  back: "Daily: once a day, to a schedule, certified on the maintenance release by an authorised person. Pre-flight: before every flight, by the pilot, not certified."
  stem: "Which statement about the daily and pre-flight inspections is correct?"
  options:
    - "The daily is done once a day and certified on the maintenance release; the pre-flight is before every flight, not certified."
    - "The daily is done once a day and not certified; the pre-flight is done before every flight and certified on the maintenance release."
    - "The daily replaces the pre-flight for the first flight of the day, and both are certified on the maintenance release."
    - "A pre-flight by an authorised pilot replaces the daily, and neither inspection is certified on the maintenance release."
  answer: 0
- id: BAKC-OC008
  elements: ["BAKC 6.1.3"]
  front: "How is a defect recorded?"
  back: "In Part 2 of the maintenance release: description, date, aircraft time, signature. The aircraft does not fly until an engineer clears it or endorses a permissible unserviceability."
  stem: "A pilot finds a defect on the aircraft. It must be recorded:"
  options:
    - "In Part 3 of the maintenance release, beside the daily inspection certification for that day."
    - "In the aircraft's flight log, and passed on verbally to the next pilot or duty instructor."
    - "In the pilot's own logbook, with description, date, aircraft time and signature."
    - "In Part 2 of the maintenance release, with description, date, aircraft time and signature."
  answer: 3
- id: BAKC-OC009
  elements: ["BAKC 6.2.1"]
  front: "Pressure height versus density height?"
  back: "Pressure height: altimeter reading with 1013 set. Density height: pressure height corrected for temperature; the figure that governs performance."
  stem: "Density height is:"
  options:
    - "The altimeter reading with 1013 hPa set; it is the figure that governs performance."
    - "Pressure height corrected for temperature; it is the figure that governs performance."
    - "Aerodrome elevation corrected for QNH; it is the altimeter reading with 1013 hPa set."
    - "Pressure height corrected for wind component; it is the figure that governs take-off distance."
  answer: 1
- id: BAKC-OC010
  elements: ["BAKC 6.2.3"]
  front: "Formula for pressure height from elevation and QNH?"
  back: "PH = elevation + (1013 − QNH) × 30 ft. Low QNH raises the pressure height."
  stem: "Aerodrome elevation is 1,000 ft and QNH is 1003 hPa. The pressure height is about:"
  options:
    - "1,030 ft, since each hPa is worth about 3 ft."
    - "1,300 ft, since low QNH raises pressure height."
    - "700 ft, since low QNH lowers pressure height."
    - "1,000 ft, since pressure height equals elevation."
  answer: 1
- id: BAKC-OC011
  elements: ["BAKC 6.2.3"]
  front: "Formula for density height?"
  back: "DH = PH + 120 × (OAT − ISA temp), where ISA temp = 15 − 2 × PH/1,000."
  stem: "Pressure height is 2,000 ft and the OAT is 31 degrees. The density height is about:"
  options:
    - "3,440 ft."
    - "3,920 ft."
    - "4,400 ft."
    - "5,720 ft."
  answer: 2
- id: BAKC-OC012
  elements: ["BAKC 6.2.2"]
  front: "Altimeter subscale settings to read elevation, pressure height and local QNH?"
  back: "Aerodrome QNH set: reads elevation. 1013 set: reads pressure height. Dial set to elevation: subscale shows local QNH."
  stem: "On the ground with 1013 hPa set on the subscale, the altimeter reads:"
  options:
    - "Aerodrome elevation, as it does with QNH set."
    - "Density height at the aerodrome."
    - "Zero, as it does with the local QNH set."
    - "Pressure height at the aerodrome."
  answer: 3
- id: BAKC-OC013
  elements: ["BAKC 6.2.4"]
  front: "Effect of a tailwind of 10 percent of lift-off speed on take-off distance?"
  back: "About 20 percent longer. Headwind shortens, tailwind lengthens, both markedly."
  stem: "A tailwind of 10 percent of the lift-off speed increases the take-off distance by about:"
  options:
    - "20 percent."
    - "10 percent."
    - "5 percent."
    - "100 percent."
  answer: 0
- id: BAKC-OC014
  elements: ["BAKC 6.2.5"]
  front: "What is the climb weight limit?"
  back: "The performance-limited (WAT) weight at which the required climb gradient can still be achieved at the day's density height; may be below structural MTOW. Take-off weight is the lowest of all limits."
  stem: "The climb weight limit is:"
  options:
    - "The structural maximum take-off weight, which applies whatever the density height."
    - "The weight at which the required climb gradient can still be met at the day's density height."
    - "The weight at which the required climb gradient can be achieved at sea level in ISA conditions."
    - "The weight at which a Vx climb clears a 50 ft obstacle from the shortest runway available."
  answer: 1
- id: BAKC-OC015
  elements: ["BAKC 6.3.1"]
  front: "Limit load factors for normal, utility and aerobatic category? Design load factor?"
  back: "+3.8/−1.52, +4.4/−1.76, +6.0/−3.0. Design (ultimate) load = limit × 1.5."
  stem: "The limit load factors for a utility category aeroplane are:"
  options:
    - "+3.8 g and −1.52 g."
    - "+6.0 g and −3.0 g."
    - "+4.4 g and −1.76 g."
    - "+5.7 g and −2.28 g."
  answer: 2
- id: BAKC-OC016
  elements: ["BAKC 6.3.1"]
  front: "How does VA change with weight?"
  back: "VA decreases as weight decreases: a lighter aeroplane reaches the limit load factor at a lower speed."
  stem: "As the aeroplane's weight decreases, the manoeuvring speed VA:"
  options:
    - "Decreases, because a lighter aeroplane reaches the limit load factor at a lower speed."
    - "Increases, because a lighter aeroplane reaches the limit load factor at a higher speed."
    - "Stays the same, because it is fixed at the top of the green arc on the ASI."
    - "Increases, because a lighter aeroplane has a lower stall speed in level flight."
  answer: 0
- id: BAKC-OC017
  elements: ["BAKC 6.3.2"]
  front: "Most common ways to exceed structural limits?"
  back: "Spiral dives and harsh pull-outs, steep turns at speed, turbulence above VA, flap above VFE, flying the yellow arc in rough air."
  stem: "Which of these is a common way to exceed an aeroplane's structural limits?"
  options:
    - "Slowing below VA before entering rough air."
    - "Extending flap below VFE on the approach."
    - "Climbing at full power at Vy in smooth air."
    - "Flying in the yellow arc in rough air."
  answer: 3
- id: BAKC-OC018
  elements: ["BAKC 6.4.1"]
  front: "Define arm, moment and CG."
  back: "Arm: distance from datum. Moment: weight × arm. CG: total moment ÷ total weight."
  stem: "Moment and CG are calculated as:"
  options:
    - "Moment = weight ÷ arm; CG = total weight ÷ total moment."
    - "Moment = weight × arm; CG = total weight ÷ total moment."
    - "Moment = weight × arm; CG = total moment ÷ total weight."
    - "Moment = arm ÷ weight; CG = total moment ÷ total weight."
  answer: 2
- id: BAKC-OC019
  elements: ["BAKC 6.4.2"]
  front: "AVGAS litres to kilograms?"
  back: "Multiply by the SG: 0.72 kg per litre in the CASA workbook (0.71 in some manuals; use the figure given). Kilograms to litres: divide."
  stem: "Using the CASA workbook specific gravity for AVGAS, 100 litres of AVGAS has a mass of:"
  options:
    - "72 kg."
    - "139 kg."
    - "100 kg."
    - "7.2 kg."
  answer: 0
- id: BAKC-OC020
  elements: ["BAKC 6.4.3"]
  front: "CG aft of the limit, weight under MTOW: what do you do?"
  back: "Move weight forward or remove rear weight, then recalculate the CG (the divisor changes too)."
  stem: "Loading calculations show the CG aft of the limit while the weight is under MTOW. The pilot should:"
  options:
    - "Add ballast to the rear baggage area, then recalculate the CG."
    - "Proceed, because the CG limits apply only when the weight exceeds MTOW."
    - "Proceed, but trim fully nose-down for take-off to compensate."
    - "Move weight forward or remove rear weight, then recalculate the CG."
  answer: 3
- id: BAKC-OC021
  elements: ["BAKC 6.4.4"]
  front: "Effects of a forward CG? Of an aft CG?"
  back: "Forward: nose heavy, higher stall speed, may lack elevator to flare, very stable. Aft: light pitch control, unstable, poor or impossible stall and spin recovery."
  stem: "Compared with an aft CG, a forward CG gives:"
  options:
    - "A lower stall speed, less stability, and light pitch control."
    - "A higher stall speed, more stability, and maybe too little elevator to flare."
    - "A higher stall speed, less stability, and poor or impossible stall and spin recovery."
    - "A lower stall speed, more stability, and plenty of elevator to flare."
  answer: 1
- id: BAKC-OC022
  elements: ["BAKC 6.4.4"]
  front: "Consequences of taking off over MTOW?"
  back: "Longer take-off, lower climb, higher stall and landing speeds, longer landing, reduced range, structural loads beyond certification."
  stem: "Taking off above MTOW results in:"
  options:
    - "A shorter take-off, lower climb and higher stall speed."
    - "A longer take-off, lower climb and lower stall speed."
    - "A longer take-off, lower climb and higher stall speed."
    - "A longer take-off, lower climb and increased range."
  answer: 2
