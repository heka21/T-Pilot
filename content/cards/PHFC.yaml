# Flashcards for unit PHFC (human factors). See content/README.md for the format.
# 2.1 Basic health
- id: PHFC-C001
  elements: ["PHFC 2.1.1"]
  front: "Why should you not fly with a head cold?"
  back: "Swollen eustachian tubes and sinuses cannot equalise on descent: severe ear or sinus pain, possible burst eardrum. Fever and decongestant side effects also impair performance."
- id: PHFC-C002
  elements: ["PHFC 2.1.1"]
  front: "Name the coronary risk factors in the syllabus."
  back: "Smoking, high cholesterol, obesity, hereditary (family history). They raise the risk of sudden incapacitation (heart attack, stroke)."
- id: PHFC-C003
  elements: ["PHFC 2.1.2"]
  front: "What must you do before flying on any new medication?"
  back: "Get clearance from a DAME (or CASA), and trial it on the ground first to check side effects. Applies to over-the-counter and herbal products too."
- id: PHFC-C004
  elements: ["PHFC 2.1.3"]
  front: "IMSAFE stands for?"
  back: "Illness, Medication, Stress, Alcohol, Fatigue, Eating (and hydration). The pilot in command assesses fitness before every flight; the medical certificate is only a minimum."
# 2.2 Health and fitness
- id: PHFC-C005
  elements: ["PHFC 2.2.2"]
  front: "Alcohol elimination rate, and what speeds it up?"
  back: "About one standard drink (10 g) per hour, mainly by the liver. Nothing speeds it up: not coffee, showers, exercise or oxygen."
- id: PHFC-C006
  elements: ["PHFC 2.2.2"]
  front: "Alcohol rules for pilots (cite the source)."
  back: "No alcohol within 8 hours before flight ('bottle to throttle'), not under the influence, blood alcohol limit 0.02 g/100 mL. CASR 91.520 and Part 99 (verify current text). Eight hours is a minimum; a hangover can impair for much longer."
- id: PHFC-C007
  elements: ["PHFC 2.2.2"]
  front: "Best fluids for rehydration, and which to avoid?"
  back: "Water or diluted electrolyte drinks. Avoid alcohol and lots of caffeine (diuretics) and very sugary drinks."
- id: PHFC-C008
  elements: ["PHFC 2.2.1", "PHFC 2.2.3"]
  front: "CASA's approach to medical conditions; and what makes drug use 'abuse'?"
  back: "Only conditions that present a flight safety hazard are disqualifying (many are OK with conditions). Abuse is a behaviour: any use that compromises safety, regardless of addiction or frequency."
- id: PHFC-C009
  elements: ["PHFC 2.2.4"]
  front: "Flying after a blood donation?"
  back: "Wait at least 24 hours (varies between individuals; ask your DAME). Reduced blood volume and oxygen capacity (anaemic hypoxia), fainting risk."
# 2.3 Hyperventilation
- id: PHFC-C010
  elements: ["PHFC 2.3.2"]
  front: "Define hyperventilation and give its main causes."
  back: "Over-breathing beyond the body's needs, lowering blood CO2. Causes: anxiety, fear, stress, pain, motion sickness, hypoxia."
- id: PHFC-C011
  elements: ["PHFC 2.3.1"]
  front: "Classic hyperventilation symptoms and cure?"
  back: "Dizziness, tingling in fingers and lips, muscle spasm, visual disturbance. Cure: slow the breathing deliberately, talk out loud. At altitude, treat as hypoxia first (oxygen/descend)."
- id: PHFC-C012
  elements: ["PHFC 2.3.1", "PHFC 2.3.2"]
  front: "Hypoxia or hyperventilation: two distinguishing clues?"
  back: "Hyperventilation can happen at any altitude, with muscle spasm and tingling under stress. Hypoxia is at altitude (or CO), insidious, with euphoria and cyanosis."
# 2.4 Atmospheric pressure changes
- id: PHFC-C013
  elements: ["PHFC 2.4.1"]
  front: "Trapped gas volume at 18,000 ft compared with sea level?"
  back: "About double (pressure about half; Boyle's law). Gut and teeth hurt on the climb; ears and sinuses on the descent."
- id: PHFC-C014
  elements: ["PHFC 2.4.1"]
  front: "Ear or sinus block on descent: what do you do?"
  back: "Climb back until it eases, equalise (swallow, yawn, Valsalva), then descend more slowly. Prevention: don't fly with a cold."
- id: PHFC-C015
  elements: ["PHFC 2.4.2"]
  front: "Waiting time before flying after scuba diving (common guideline)?"
  back: "At least 12 hours after a no-decompression dive; at least 24 hours after a dive needing decompression stops or multiple dives. Risk: decompression sickness from dissolved nitrogen. Check current CASA guidance."
# 2.5 Ear
- id: PHFC-C016
  elements: ["PHFC 2.5.1"]
  front: "Semicircular canals vs otoliths?"
  back: "Semicircular canals sense angular acceleration (roll, pitch, yaw). Otoliths sense linear acceleration and gravity. Both in the inner ear; the cochlea is for hearing."
- id: PHFC-C017
  elements: ["PHFC 2.5.2"]
  front: "Purpose of the eustachian tube?"
  back: "Connects middle ear to throat to equalise middle-ear pressure. Air vents out easily on climb; must be opened actively on descent."
- id: PHFC-C018
  elements: ["PHFC 2.5.3"]
  front: "Three effects of noise exposure in the syllabus?"
  back: "Hearing loss (temporary threshold shift short-term; permanent high-frequency loss long-term), reduced speech intelligibility, increased fatigue."
# 2.6 Hearing protection (tagged to 2.5.3)
- id: PHFC-C019
  elements: ["PHFC 2.6.1"]
  front: "Recommended methods of hearing protection?"
  back: "Well-sealed headset (ANR best for low-frequency engine noise), earplugs (under headset if needed), keep volume low, maintain ear seals, protect on the ground near engines, limit exposure, regular hearing tests."
- id: PHFC-C020
  elements: ["PHFC 2.6.1"]
  front: "What does ANR do best?"
  back: "Cancels low-frequency engine and propeller drone with an opposite sound wave. Lets you hear radio at lower volume and reduces fatigue."
- id: PHFC-C021
  elements: ["PHFC 2.6.1"]
  front: "Three things that defeat hearing protection?"
  back: "Turning the volume up, worn or hardened ear seals, glasses arms or hair breaking the seal. Cotton wool is not effective protection."
# 2.7 Vision, disorientation, illusions
- id: PHFC-C022
  elements: ["PHFC 2.7.1", "PHFC 2.7.3"]
  front: "Rods vs cones, and the night blind spot?"
  back: "Cones: fovea, colour, detail, daylight. Rods: periphery, low light, movement, no colour. No rods in the fovea, so look 10-15 degrees off-centre at night."
- id: PHFC-C023
  elements: ["PHFC 2.7.2"]
  front: "Dark adaptation time, and things that degrade night vision?"
  back: "About 30 minutes for rods (cones 7-10 min). Degraded by bright light, hypoxia (from about 5,000 ft), smoking/CO, alcohol, fatigue, vitamin A deficiency, age."
- id: PHFC-C024
  elements: ["PHFC 2.7.4", "PHFC 2.7.5"]
  front: "Empty-field myopia, and the right sunglasses?"
  back: "With nothing to focus on, the eye relaxes to 1-2 m and misses distant traffic; refocus on distant objects. Sunglasses: neutral grey, non-polarised, good optical quality; keep prescriptions current."
- id: PHFC-C025
  elements: ["PHFC 2.7.6"]
  front: "Collision-course traffic and the scanning technique?"
  back: "Constant relative bearing: no movement on the windscreen, then 'blossoms'. Scan in 10-15 degree sectors, about 1 second per fixation."
- id: PHFC-C026
  elements: ["PHFC 2.7.7", "PHFC 2.7.8", "PHFC 2.7.9"]
  front: "Define disorientation; which senses keep equilibrium; why are they unreliable?"
  back: "Incorrect perception of attitude, motion or position. Eyes, inner ear (vestibular), proprioception (seat of the pants). The last two can't tell gravity from acceleration and miss slow or sustained changes."
- id: PHFC-C027
  elements: ["PHFC 2.7.10"]
  front: "Somatogravic illusion?"
  back: "Forward acceleration (night take-off, go-around) feels like nose-up pitch; pilot pushes forward into the ground. Deceleration feels nose-down."
- id: PHFC-C028
  elements: ["PHFC 2.7.10"]
  front: "The leans, graveyard spin, autokinetic illusion?"
  back: "Leans: unnoticed slow roll then quick correction feels like a bank the other way. Graveyard spin: after recovery you feel a spin the opposite way and re-enter. Autokinetic: a stared-at light in darkness seems to move."
- id: PHFC-C029
  elements: ["PHFC 2.7.11", "PHFC 2.7.12"]
  front: "Black-hole approach, narrow runway, upslope runway: which way do you err? And the cure for illusions?"
  back: "All make you feel high, so you fly too low. Cure: believe the instruments (PAPI, planned profile); susceptibility rises with fatigue, alcohol, hypoxia, low currency."
# 2.8 Motion sickness
- id: PHFC-C030
  elements: ["PHFC 2.8.1"]
  front: "Basic cause of motion sickness?"
  back: "Sensory conflict between the eyes and the inner ear vestibular organs."
- id: PHFC-C031
  elements: ["PHFC 2.8.2"]
  front: "Factors that aggravate motion sickness?"
  back: "Turbulence, anxiety, head movements, looking down inside, heat and smells, hunger or heavy meal, alcohol/hangover, fatigue, being a passenger, inexperience."
- id: PHFC-C032
  elements: ["PHFC 2.8.3"]
  front: "Combating motion sickness in flight?"
  back: "Fresh air, cool cabin, eyes on the horizon, head still, fly the aircraft, smooth flying, land if it worsens. No drowsy anti-sickness drugs for pilots."
# 2.9 g effects
- id: PHFC-C033
  elements: ["PHFC 2.9.1"]
  front: "Order of effects under increasing positive g?"
  back: "Grey-out, tunnel vision, black-out (still conscious), then G-LOC. Vision goes before consciousness because blood pools in the lower body."
- id: PHFC-C034
  elements: ["PHFC 2.9.1"]
  front: "Effects of negative g?"
  back: "Blood forced to the head: fullness, headache, congested eyes, red-out, slowing heart rate. Tolerance only about -2 to -3 g. Push-pull lowers positive-g tolerance."
- id: PHFC-C035
  elements: ["PHFC 2.9.1"]
  front: "How to raise positive g tolerance?"
  back: "Apply g gradually, tense leg and abdominal muscles (straining manoeuvre), be fit, hydrated, fed and rested. No alcohol or hangover."
# 2.10 Toxic hazards
- id: PHFC-C036
  elements: ["PHFC 2.10.1"]
  front: "Carbon monoxide: properties and main source in light aircraft?"
  back: "Colourless, odourless, tasteless; binds haemoglobin 200-250 times more readily than oxygen (anaemic hypoxia). Main source: cracked exhaust in the cabin heater muff."
- id: PHFC-C037
  elements: ["PHFC 2.10.1"]
  front: "CO symptoms and in-flight treatment?"
  back: "Headache, dizziness, drowsiness, nausea, impaired judgement, (late) cherry-red lips, unconsciousness. Heater off, fresh air vents open, oxygen if available, no smoking, land ASAP, get medical help."
- id: PHFC-C038
  elements: ["PHFC 2.10.2"]
  front: "Effects of fuel vapour and other toxic fumes in the cabin?"
  back: "Headache, nausea, dizziness, eye and throat irritation, intoxicated feeling, drowsiness; fire risk. Smoke from wiring gives CO and cyanide. Ventilate, stop the source, land."
# 2.11 Atmosphere
- id: PHFC-C039
  elements: ["PHFC 2.11.1"]
  front: "Composition of air, and pressure and temperature with height?"
  back: "78% nitrogen, 21% oxygen, 1% other (constant with height). Pressure halves by about 18,000 ft. ISA temperature falls 2°C/1,000 ft from +15°C to -56.5°C at about 36,000 ft."
- id: PHFC-C040
  elements: ["PHFC 2.11.2"]
  front: "How does oxygen reach the tissues and CO2 leave?"
  back: "Oxygen diffuses from alveoli into blood, carried by haemoglobin, pumped by the heart to the tissues. CO2 returns mainly as bicarbonate in plasma and diffuses into the alveoli to be breathed out. Breathing rate is driven by CO2."
- id: PHFC-C041
  elements: ["PHFC 2.11.3"]
  front: "Partial pressure of oxygen: definition and sea-level value?"
  back: "The part of total pressure due to oxygen: 0.21 × total pressure (Dalton). Sea level about 213 hPa (160 mmHg); about half at 18,000 ft. It drives oxygen into the blood."
# 2.12 Hypoxia
- id: PHFC-C042
  elements: ["PHFC 2.12.1"]
  front: "Four types of hypoxia with an example each?"
  back: "Hypoxic (altitude), anaemic (CO, blood donation), stagnant (g, cold), histotoxic (alcohol, drugs)."
- id: PHFC-C043
  elements: ["PHFC 2.12.1"]
  front: "Time of useful consciousness at 18,000 / 25,000 / 30,000 / 40,000 ft?"
  back: "About 20-30 min / 3-5 min / 1-2 min / 15-20 s. Roughly halved after rapid decompression or with activity."
- id: PHFC-C044
  elements: ["PHFC 2.12.1"]
  front: "Why is hypoxia insidious, and when does night vision suffer?"
  back: "Euphoria, overconfidence, lack of self-criticism and a false sense of security: the pilot feels fine. Night vision degrades from about 5,000 ft."
- id: PHFC-C045
  elements: ["PHFC 2.12.1"]
  front: "Combating altitude hypoxia, and where are the oxygen rules?"
  back: "Descend below 10,000 ft or use supplemental oxygen. Requirements for unpressurised aircraft above 10,000 ft are in the Part 91 MOS (check current text). Susceptibility up with smoking, alcohol, fatigue, cold, exercise, rapid climb."
# 2.13 Human factors considerations
- id: PHFC-C046
  elements: ["PHFC 2.13.1"]
  front: "Capacity of short-term memory, and the remedy?"
  back: "About 7 ± 2 items for 15-30 seconds, easily lost when interrupted. Write things down; use checklists, mnemonics and other aides-memoire."
- id: PHFC-C047
  elements: ["PHFC 2.13.2"]
  front: "DECIDE model?"
  back: "Detect, Estimate, Choose, Identify, Do, Evaluate. Improve decisions with personal minimums, alternates and decision points set on the ground."
- id: PHFC-C048
  elements: ["PHFC 2.13.3"]
  front: "Stress, arousal and performance?"
  back: "Inverted U (Yerkes-Dodson): best at moderate arousal. High stress narrows attention, cuts memory, rushes decisions. Environmental stressors: heat, cold, noise, vibration. Manage: identify, reduce, prepare, relax, keep fit."
- id: PHFC-C049
  elements: ["PHFC 2.13.4"]
  front: "Acute vs chronic fatigue?"
  back: "Acute: short-term (long day, one bad night), cured by sleep. Chronic: accumulated over weeks (sleep debt, stress, illness), needs extended rest and fixing the cause."
# 2.14 First aid and survival
- id: PHFC-C050
  elements: ["PHFC 2.14.1"]
  front: "Where is first aid and survival information found, and what is DRSABCD?"
  back: "ERSA EMERG section (check current edition). Danger, Response, Send for help, Airway, Breathing, CPR (30:2), Defibrillation."
- id: PHFC-C051
  elements: ["PHFC 2.14.1"]
  front: "Survival priorities after a remote forced landing?"
  back: "Protection (first aid, shelter), location (stay with the aircraft, ELT/PLB, signals), water, food. Conserve sweat, not water."
- id: PHFC-C052
  elements: ["PHFC 2.14.1"]
  front: "Ground-to-air codes V, X, N, Y, arrow?"
  back: "V require assistance; X require medical assistance; N no; Y yes; arrow proceeding in this direction."
# 2.15 TEM
- id: PHFC-C053
  elements: ["PHFC 2.15.1", "PHFC 2.15.2", "PHFC 2.15.3"]
  front: "The three layers of TEM, and what is a threat?"
  back: "Threats, errors, undesired aircraft states. A threat is outside the pilot's influence, adds complexity and must be managed (weather, traffic, terrain, defects, passengers, time pressure). Process: anticipate, recognise, recover."
- id: PHFC-C054
  elements: ["PHFC 2.15.4", "PHFC 2.15.5"]
  front: "Committed error example, and how checklists help?"
  back: "Wrong fuel tank selected for take-off; trapped by the cruise FREDA check, corrected and fuel state confirmed. Checklists/SOPs reduce reliance on memory, standardise actions and cross-check to trap errors."
- id: PHFC-C055
  elements: ["PHFC 2.15.6", "PHFC 2.15.8"]
  front: "UAS example, and the priority order to manage it?"
  back: "Pressing on under lowering cloud leads to low flight near terrain and cloud. Priorities: aviate, navigate, communicate. Recover early (turn back, go around)."
- id: PHFC-C056
  elements: ["PHFC 2.15.7", "PHFC 2.15.9"]
  front: "Resources for a lost or weather-threatened pilot, and the role of relationships?"
  back: "ATC/FIS (surveillance, PAN PAN), 121.5, other aircraft, GNSS, charts, ERSA, passengers, POH. Good rapport with passengers, ATC, instructors and engineers makes help easier to ask for and decisions easier to make."
