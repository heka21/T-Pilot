# Flashcards for PFRA 2.1 to 2.7 and 2.9 (2.8 security is in PFRA-security.yaml). See content/README.md for the format.
- id: PFRA-C001
  elements: ["PFRA 2.1.1"]
  front: "Where are publications obtained, and why keep them amended?"
  back: "Legislation (CAR, CASR, MOS, CAOs): Federal Register of Legislation and CASA. AIP, ERSA, charts, SUPs, AICs: Airservices (subscription or free online), amended on the 28-day AIRAC cycle; NOTAMs from NAIPS. Out-of-date documents mean wrong frequencies, airspace and procedures."
- id: PFRA-C002
  elements: ["PFRA 2.1.2"]
  front: "Which reference for: licence privileges; rules of the air and fuel; maintenance release; aerodrome data and PRD?"
  back: "Licences: CASR Part 61 and its MOS. Rules of the air, VMC, fuel: CASR Part 91 and its MOS. Maintenance release and pilot maintenance: CAR 1988 Part 4A and Schedule 8. Aerodrome data, PRD, emergency procedures: ERSA."
- id: PFRA-C003
  elements: ["PFRA 2.1.2", "PFRA 2.1.4"]
  front: "What are the three parts of the AIP Book?"
  back: "GEN (general: units, abbreviations, services), ENR (en route: rules, airspace, navigation, charts, SAR) and AD (aerodromes). Abbreviations are in GEN 2.2, units in GEN 2.1."
- id: PFRA-C004
  elements: ["PFRA 2.1.3"]
  front: "How is a NOTAM structured and what time zone are its validity times?"
  back: "Identifier and series, location (ICAO code), validity period in UTC (B from, C to, PERM or EST), subject and text. Head office NOTAMs cover whole FIRs."
- id: PFRA-C005
  elements: ["PFRA 2.1.3"]
  front: "What is an AIP Supplement (SUP)?"
  back: "A temporary or advance change to the AIP too long for a NOTAM, such as air show airspace or long-term works. Numbered by year (e.g. H23/26), and permitted in the exam as part of the AIP."
- id: PFRA-C006
  elements: ["PFRA 2.1.4"]
  front: "Decode HJ, HN, H24, HO, PPR, PAL, LL, UL."
  back: "HJ sunrise to sunset; HN night; H24 continuous; HO hours of operation; PPR prior permission required; PAL pilot-activated lighting; LL and UL lower and upper limit of airspace."
- id: PFRA-C007
  elements: ["PFRA 2.2.1"]
  front: "Main PPL(A) privileges compared with the RPL?"
  back: "PIC or co-pilot in private operations without RPL weight, distance or airspace limits: passengers anywhere, all airspace, controlled aerodromes, above 10,000 ft (oxygen rules). Night needs a night VFR rating, IMC an instrument rating; no hire or reward beyond permitted cost sharing."
- id: PFRA-C008
  elements: ["PFRA 2.2.1"]
  front: "PPL recent experience requirements?"
  back: "Day passengers: 3 take-offs and 3 landings in previous 90 days in the category. Night passengers: 3 night take-offs and landings in 90 days plus night VFR rating. Flight review within 24 months; Class 2 (or Basic Class 2) medical."
- id: PFRA-C009
  elements: ["PFRA 2.2.1"]
  front: "Classification of operations: what can a PPL holder fly as PIC?"
  back: "Private operations (Part 91), including equal cost sharing with no profit. Aerial work and air transport for hire or reward need a CPL or ATPL. Test: is anyone paying beyond equal cost sharing?"
- id: PFRA-C010
  elements: ["PFRA 2.2.2"]
  front: "Flight and duty time limits for a PPL in private operations?"
  back: "CAO 48.1 imposes no limits on private operations, but the pilot must not fly fatigued and must comply with any operator or training organisation limits; private hours count toward those cumulative limits."
- id: PFRA-C011
  elements: ["PFRA 2.3.1"]
  front: "Documents to carry on a private VFR flight?"
  back: "Flight manual (POH) with loading data, current maintenance release, current charts, ERSA and AIP information, licence, medical and photo ID, and any approvals relied on. Check CASR 91.105 for whether CofR and CofA must be carried."
- id: PFRA-C012
  elements: ["PFRA 2.3.2"]
  front: "Rules on carrying and discharging firearms?"
  back: "Carry only as permitted: with PIC knowledge and consent, unloaded, not accessible in flight, complying with security and state firearms laws. Discharge from an aircraft is prohibited except under a specific CASA approval."
- id: PFRA-C013
  elements: ["PFRA 2.3.2"]
  front: "Aerodromes where operations are not restricted to runways?"
  back: "Published in ERSA; the whole marked landing area may be used, choosing a path into wind. Otherwise operations are confined to runways and landing on grass between them is an offence."
- id: PFRA-C014
  elements: ["PFRA 2.3.2"]
  front: "Prohibited, restricted and danger areas: may you enter?"
  back: "Prohibited: never. Restricted: not when active without clearance from the controlling authority (RA1/2/3 shows likelihood); inactive treated as surrounding airspace. Danger: no clearance needed, but avoid or use caution."
- id: PFRA-C015
  elements: ["PFRA 2.3.3"]
  front: "When is the SECURITY prefix used? Give examples."
  back: "SECURITY three times for safety of navigation or important weather warnings, not emergencies. E.g. unlit crane, birds or animals on the runway, drone, parachute drop, microburst or severe wind shear on approach, dust storm."
- id: PFRA-C016
  elements: ["PFRA 2.4.1"]
  front: "PPL-level planning responsibilities before flight (beyond the RPL checks)?"
  back: "Get weather and operational briefing (forecasts, NOTAMs), plan route and cruising levels for VFR and airspace, calculate fuel including holding and alternate, check weight and balance, submit flight notification or SARTIME, confirm aerodromes are suitable."
- id: PFRA-C017
  elements: ["PFRA 2.4.1"]
  front: "VFR alternate minima, and holding fuel for TEMPO and INTER?"
  back: "When, from 30 min before to 60 min after ETA, the destination forecast has more than SCT cloud below 1,500 ft, visibility under 8 km, a probability of fog, mist, dust or thunderstorms, or crosswind beyond limits. Holding fuel instead: 60 min for TEMPO, 30 min for INTER. Verify against the current Part 91 MOS."
- id: PFRA-C018
  elements: ["PFRA 2.4.1"]
  front: "Rules for carrying cargo and animals?"
  back: "Cargo: secured, not blocking exits or controls, within floor loading limits and included in weight and balance. Animals: only with PIC consent, restrained in a container or harness, weight included."
- id: PFRA-C019
  elements: ["PFRA 2.4.1"]
  front: "Rules on sick or handicapped persons and parachutists?"
  back: "Sick or handicapped: only if the PIC is satisfied they can be carried safely, not seated where they could obstruct an exit or controls, briefed and assisted. Parachutists: CASR Part 105, approved organisation and drop zone, coordinated with ATS."
- id: PFRA-C020
  elements: ["PFRA 2.4.1"]
  front: "Flotation, survival equipment and dangerous goods requirements?"
  back: "Life jackets for each occupant when a single-engine aeroplane is over water beyond gliding distance of land. Designated remote areas: water, ELT, signalling equipment, first aid kit. Dangerous goods: CASR Part 92 prohibits them except as permitted; PIC refuses anything not allowed."
- id: PFRA-C021
  elements: ["PFRA 2.4.2"]
  front: "Radio test before taxi and listening watch requirements?"
  back: "Before taxi check frequency, squelch and volume and make a radio check (readability 1 to 5). In flight keep a continuous watch on the CTAF within 10 nm of a non-controlled aerodrome, ATC near controlled airspace, otherwise area frequency; monitor 121.5 where able."
- id: PFRA-C022
  elements: ["PFRA 2.5.1"]
  front: "Displaced threshold marking and use?"
  back: "Arrows along the centreline pointing to a transverse bar. Land beyond it; the surface before it may be used for the take-off run and for roll-out landing in the other direction."
- id: PFRA-C023
  elements: ["PFRA 2.5.1"]
  front: "Cone markers versus gable markers?"
  back: "Cones mark the edges of the runway or landing area on unsealed strips; usable surface lies between them. Gables mark the boundary of the runway strip (graded clear area), not the runway edge."
- id: PFRA-C024
  elements: ["PFRA 2.5.1"]
  front: "Meaning of a horizontal white dumbbell and a double white cross in the signal area?"
  back: "Dumbbell: use only sealed (hard) runways and taxiways; no landing on grass. Double white cross by the primary wind indicator: gliding operations in progress."
- id: PFRA-C025
  elements: ["PFRA 2.5.1"]
  front: "Runway holding position marking and HLS marking?"
  back: "Holding position: two solid and two dashed yellow lines; hold on the solid side (taxiway side). Intermediate holding position: single dashed line. HLS: letter H inside a circle, square or triangle; aeroplanes keep clear."
- id: PFRA-C026
  elements: ["PFRA 2.5.2", "PFRA 2.5.3"]
  front: "Circuit legs, dead side, and a white cross on the movement area?"
  back: "Upwind, crosswind, downwind (parallel and opposite to landing direction), base, final. Dead side is opposite the circuit side, where overflying aircraft descend before joining crosswind. A white cross marks an unserviceable area; crosses at runway ends close the runway."
- id: PFRA-C027
  elements: ["PFRA 2.6.1"]
  front: "Class C, D, E and G for VFR, and airspace speed limits?"
  back: "C and D: clearance required (C separates VFR from IFR; D gives traffic information). E: no clearance for VFR, no separation, transponder required. G: no clearance, flight information on request; Class A is closed to VFR. 250 kt IAS below 10,000 ft, 200 kt in Class D."
- id: PFRA-C028
  elements: ["PFRA 2.6.2"]
  front: "Define FIR, FIA, OCTA, CTA, CTR, report and broadcast."
  back: "FIR: flight information region (WA is in the Melbourne FIR); FIA: subdivision with its own area frequency; OCTA: Class G. CTA: controlled airspace above a lower limit (C LL 4500); CTR: from the surface around a controlled aerodrome. A report goes to ATS and is answered; a broadcast goes to all stations with no reply."
- id: PFRA-C029
  elements: ["PFRA 2.6.3"]
  front: "How should VFR tracking tolerances be applied near controlled airspace?"
  back: "Navigate to remain clear without a clearance: keep a buffer of a mile or two laterally and fly about 500 ft below a CTA step, or get a clearance first. Check current AIP ENR 1.1 for the figures."
- id: PFRA-C030
  elements: ["PFRA 2.6.4", "PFRA 2.6.2"]
  front: "CTAF procedures, and entering Class C or D?"
  back: "CTAF area: within 10 nm of a non-controlled aerodrome, ERSA frequency or 126.7; broadcast taxiing, entering runway, inbound at 10 nm, joining, clear; join overhead at 1,500 ft AAL; radio mandatory at certified and registered aerodromes. Class C/D: get the ATIS, obtain a clearance before entry, read back and comply."
- id: PFRA-C031
  elements: ["PFRA 2.6.5"]
  front: "Altimeter datums, height/altitude/flight level, and the transition altitude and level?"
  back: "QNH gives altitude (AMSL), QFE height above the aerodrome, 1013.2 a flight level (pressure altitude in hundreds of feet). Transition altitude 10,000 ft, transition level FL110: set 1013 climbing through 10,000 ft, QNH descending through FL110; no cruising in the layer. Area QNH below 1013 raises the lowest usable level to FL115 or FL120 (AIP ENR 1.7)."
- id: PFRA-C032
  elements: ["PFRA 2.6.5"]
  front: "ISA values, and the error from a wrong subscale setting?"
  back: "ISA: MSL 15 degrees C and 1013.25 hPa, lapse about 2 degrees per 1,000 ft, pressure about 1 hPa per 30 ft. So 1 hPa of subscale error is 30 ft: 1020 set with QNH 1008 over-reads 360 ft (6,500 indicated is about 6,140 ft). High to low, look out below."
- id: PFRA-C033
  elements: ["PFRA 2.7.1"]
  front: "Transponder emergency codes and VFR radio failure in Class G (ERSA EMERG)?"
  back: "7700 emergency, 7600 radio failure, 7500 unlawful interference. Radio failure in Class G: continue, remain VMC, land at the nearest suitable aerodrome, broadcast blind, squawk 7600."
- id: PFRA-C034
  elements: ["PFRA 2.7.1"]
  front: "What does the ERSA EMERG section contain?"
  back: "MAYDAY and PAN PAN formats and frequencies (current, then 121.5), transponder codes, radio failure procedures, interception signals, ditching and forced landing, SAR and ground-to-air signals, tower light signals, and emergency contacts."
- id: PFRA-C035
  elements: ["PFRA 2.7.2"]
  front: "When may a mercy flight be declared?"
  back: "By the PIC or operator when the flight is necessary to relieve suffering or save life, no other transport is available in time, the PIC judges the risk acceptable, and ATS or CASA is notified of the declaration and the rule departures, before flight where possible."
- id: PFRA-C036
  elements: ["PFRA 2.7.2"]
  front: "When must a mercy flight not be undertaken?"
  back: "When the risk outweighs the benefit, other transport or waiting would meet the need, the pilot is not competent for the conditions, or the person is not in grave danger. It changes the legal position only, not the weather."
- id: PFRA-C037
  elements: ["PFRA 2.7.3", "PFRA 2.9.3"]
  front: "ATSB reporting times for accidents and incidents?"
  back: "Immediately reportable matters (accidents, serious incidents): phone ATSB as soon as practicable (1800 011 034), then written report within 72 hours. Routine reportable matters: written report within 72 hours. Preserve the site until released."
- id: PFRA-C038
  elements: ["PFRA 2.7.5"]
  front: "Examples of hazards to navigation a pilot must report?"
  back: "Unlit or uncharted obstacles or failed obstacle lights, bird concentrations, animals, vehicles or people on a runway, unserviceable navaids or lighting, unforecast hazardous weather, drones, kites or balloons, laser illumination, bushfire smoke, unpromulgated military, parachuting or gliding."
- id: PFRA-C039
  elements: ["PFRA 2.9.1"]
  front: "Meaning of intermittent (flashing) landing or navigation lights from an aircraft?"
  back: "The aircraft is in difficulty and compelled to land; give way. Also used to acknowledge tower light signals at night and during interception."
- id: PFRA-C040
  elements: ["PFRA 2.9.2"]
  front: "Accident versus incident?"
  back: "Accident: death or serious injury, serious structural damage, or aircraft missing. Incident: any other occurrence that affects or could affect safety; a serious incident is a near-accident."
- id: PFRA-C041
  elements: ["PFRA 2.9.3"]
  front: "Besides the ATSB, where else is a defect reported?"
  back: "In the maintenance release and, where airworthiness is affected, to CASA through the defect reporting system."
- id: PFRA-C042
  elements: ["PFRA 2.9.4"]
  front: "What is a SARTIME and how is it used?"
  back: "A UTC time nominated by the pilot by which arrival will be reported, lodged with Airservices. Extend before expiry if delayed, cancel on arrival; if it expires, the uncertainty, alert and distress phases begin with JRCC coordinating."
- id: PFRA-C043
  elements: ["PFRA 2.9.5"]
  front: "Which document contains emergency procedures?"
  back: "ERSA EMERG section, with full text in AIP GEN 3.6 and ENR 1.14."
