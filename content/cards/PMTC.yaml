# Flashcards for unit PMTC (PPL meteorology). Southern hemisphere conventions. See content/README.md for the format.
- id: PMTC-C001
  elements: ["PMTC 2.1.1"]
  front: "ISA mean sea level pressure and temperature?"
  back: "1013.25 hPa (29.92 inHg) and +15 °C. Density 1.225 kg/m³."
  stem: "ISA mean sea level conditions are:"
  options:
    - "1013.25 hPa and +20 °C."
    - "1013.25 hPa and +15 °C."
    - "1013.25 inHg and +15 °C."
    - "29.92 hPa and +15 °C."
  answer: 1
- id: PMTC-C002
  elements: ["PMTC 2.1.2"]
  front: "ISA temperature and pressure lapse rates in the troposphere?"
  back: "Temperature 1.98 °C per 1,000 ft (use 2 °C). Pressure about 1 hPa per 30 ft near sea level, decreasing non-linearly (about half at 18,000 ft)."
  stem: "In the ISA troposphere, temperature and pressure fall with height at about:"
  options:
    - "3 °C per 1,000 ft, and 1 hPa per 30 ft near sea level."
    - "2 °C per 1,000 ft, and 1 hPa per 100 ft near sea level."
    - "2 °C per 1,000 ft, and 1 hPa per 30 ft near sea level."
    - "1.5 °C per 1,000 ft, and 1 hPa per 30 ft near sea level."
  answer: 2
- id: PMTC-C003
  elements: ["PMTC 2.1.3"]
  front: "Troposphere, tropopause, stratosphere: one line each."
  back: "Troposphere: surface up, temperature falls, all the weather; 8 km at the poles to 16-18 km at the equator. Tropopause: the top boundary, ISA 36,090 ft at −56.5 °C. Stratosphere: temperature constant then rising, very dry and stable."
  stem: "In the ISA, the tropopause is at about:"
  options:
    - "18,000 ft, where the temperature is −56.5 °C."
    - "36,090 ft, with a temperature of −56.5 °C."
    - "36,090 ft, with a temperature of −36.5 °C."
    - "60,000 ft, with a temperature of −56.5 °C."
  answer: 1
- id: PMTC-C004
  elements: ["PMTC 2.1.4"]
  front: "Why is almost all weather below the stratosphere?"
  back: "Nearly all the water vapour is in the troposphere, and it is heated from below so air can convect; the stratosphere is a stable inversion layer that stops rising air (hence the Cb anvil)."
  stem: "Almost all weather occurs in the troposphere because:"
  options:
    - "It holds nearly all the water vapour and is heated from above, which keeps it stable."
    - "The stratosphere is too cold for cloud, as its temperature keeps falling with height."
    - "It holds nearly all the water vapour and is heated from below, so air can convect."
    - "It holds nearly all the ozone, which condenses into cloud as the air rises and cools."
  answer: 2
- id: PMTC-C005
  elements: ["PMTC 2.2.1"]
  front: "How is surface air temperature measured, and how does runway air compare?"
  back: "In shade, about 1.2 m above short grass, in a ventilated instrument shelter. Over sunny bitumen the air can be several degrees hotter (worse performance); on a clear night it can be colder (frost, fog)."
  stem: "On a hot afternoon, the air over a sunny bitumen runway compared with the reported temperature is likely to be:"
  options:
    - "Several degrees hotter, so take-off performance is worse than calculated."
    - "Several degrees cooler, so take-off performance is better than calculated."
    - "The same, as the reported temperature is measured in the sun at runway level."
    - "Several degrees hotter, so take-off performance is better than calculated."
  answer: 0
- id: PMTC-C006
  elements: ["PMTC 2.2.2"]
  front: "DALR, SALR, and what an inversion is."
  back: "DALR 3 °C per 1,000 ft (unsaturated). SALR about 1.5 °C per 1,000 ft (latent heat released by condensation). Inversion: temperature increases with height; very stable, traps haze and fog."
  stem: "The dry and saturated adiabatic lapse rates are about:"
  options:
    - "DALR 1.5 °C per 1,000 ft and SALR 3 °C per 1,000 ft."
    - "DALR 3 °C per 1,000 ft and SALR 1.5 °C per 1,000 ft."
    - "DALR 1.98 °C per 1,000 ft and SALR 1.5 °C per 1,000 ft."
    - "DALR 5 °C per 1,000 ft and SALR 3 °C per 1,000 ft."
  answer: 1
- id: PMTC-C007
  elements: ["PMTC 2.2.2"]
  front: "Signs of stable versus unstable air?"
  back: "Stable: layer cloud, continuous rain or drizzle, poor visibility, smooth air. Unstable: heap cloud, showers, good visibility outside showers, turbulence and gusts."
  stem: "Which set of conditions indicates unstable air?"
  options:
    - "Layer cloud, continuous rain or drizzle, poor visibility and smooth air."
    - "Heap cloud, continuous drizzle, poor visibility and smooth air."
    - "Layer cloud, haze trapped under an inversion and smooth air."
    - "Heap cloud, showers, good visibility outside showers and turbulence."
  answer: 3
- id: PMTC-C008
  elements: ["PMTC 2.2.3"]
  front: "Effect on density of higher temperature, higher pressure, higher humidity?"
  back: "Temperature up: density down. Pressure up: density up. Humidity up: density down (water vapour is lighter than dry air)."
  stem: "Air density decreases when:"
  options:
    - "Temperature rises, pressure increases or humidity rises."
    - "Temperature falls, pressure falls or humidity falls."
    - "Temperature rises, pressure falls or humidity rises."
    - "Temperature rises, pressure falls or humidity falls."
  answer: 2
- id: PMTC-C009
  elements: ["PMTC 2.2.4"]
  front: "Pressure height formula, and an example."
  back: "Pressure height = elevation + (1013 − QNH) × 30 ft. Elevation 1,200 ft, QNH 1008: 1,200 + 150 = 1,350 ft. ISA there = 15 − 2.7 = 12.3 °C."
  stem: "An aerodrome has an elevation of 1,200 ft and the QNH is 1008 hPa. The pressure height is about:"
  options:
    - "1,050 ft."
    - "1,350 ft."
    - "1,200 ft, the same as the elevation."
    - "1,700 ft."
  answer: 1
- id: PMTC-C010
  elements: ["PMTC 2.2.5"]
  front: "Height, elevation, altitude, QNH, QFE?"
  back: "Height: above a datum (ground). Elevation: a surface point above MSL. Altitude: aircraft above MSL. QNH: altimeter reads elevation on the ground. QFE: altimeter reads zero on the aerodrome. QFE ≈ QNH − elevation ÷ 30."
  stem: "On the aerodrome, an altimeter with QFE set reads:"
  options:
    - "Zero, while with QNH set it reads the aerodrome elevation."
    - "The aerodrome elevation, while with QNH set it reads zero."
    - "Zero, while with QNH set it reads the pressure height."
    - "The pressure height, while with QNH set it reads the elevation."
  answer: 0
- id: PMTC-C011
  elements: ["PMTC 2.3.1"]
  front: "The ten cloud genera by level?"
  back: "High: Ci, Cc, Cs. Middle: Ac, As, Ns. Low: Sc, St. Low base, vertical extent: Cu, Cb. Low below about 6,500 ft, middle about 6,500 to 20,000 ft, high above about 20,000 ft."
  stem: "Which group contains only middle-level cloud types?"
  options:
    - "Ci, Cc, Cs."
    - "Sc, St, Ns."
    - "Ac, As, Ns, Sc."
    - "Ac, As, Ns."
  answer: 3
- id: PMTC-C012
  elements: ["PMTC 2.3.1"]
  front: "Cloud base of convective cloud from the dew point spread?"
  back: "Spread closes at about 2.5 °C per 1,000 ft, so base ≈ (T − Td) × 400 ft AGL. 29/13 gives 16 × 400 = 6,400 ft. (Some texts use ÷3 × 1,000.)"
  stem: "The surface temperature is 29 °C and the dew point is 13 °C. The base of convective cloud is about:"
  options:
    - "4,000 ft AGL."
    - "6,400 ft AGL."
    - "3,200 ft AGL."
    - "16,000 ft AGL."
  answer: 1
- id: PMTC-C013
  elements: ["PMTC 2.3.2"]
  front: "Cloud amount codes in a TAF or METAR?"
  back: "FEW 1-2 oktas, SCT 3-4, BKN 5-7, OVC 8. Base in hundreds of ft above aerodrome level. Only CB and TCU are named. NSC = nil significant cloud."
  stem: "In a TAF or METAR, the cloud group SCT035 means:"
  options:
    - "3-4 oktas with a base of 3,500 ft above mean sea level (AMSL)."
    - "3-4 oktas with a base of 3,500 ft above aerodrome level."
    - "5-7 oktas with a base of 3,500 ft above aerodrome level."
    - "3-4 oktas with a base of 350 ft above aerodrome level."
  answer: 1
- id: PMTC-C014
  elements: ["PMTC 2.3.3"]
  front: "Which cloud gives drizzle, continuous rain, showers, hail?"
  back: "Drizzle: St (and Sc). Continuous rain: Ns and thick As. Showers: Cu and Cb. Hail: Cb only."
  stem: "Hail falls only from:"
  options:
    - "Cumulonimbus (Cb)."
    - "Nimbostratus (Ns)."
    - "Altostratus (As)."
    - "Stratocumulus (Sc)."
  answer: 0
- id: PMTC-C015
  elements: ["PMTC 2.4.1"]
  front: "How do you judge flight visibility, and what is the VMC minimum below 10,000 ft?"
  back: "Note the distance (from the chart) at which known features become recognisable. Minimum 5,000 m, about 2.7 nm. 9999 in a report means 10 km or more."
  stem: "The VMC flight visibility minimum below 10,000 ft is:"
  options:
    - "5 nm, about 9,000 m."
    - "8,000 m, about 4.3 nm."
    - "5,000 ft, about 1,500 m."
    - "5,000 m, about 2.7 nm."
  answer: 3
- id: PMTC-C016
  elements: ["PMTC 2.4.2"]
  front: "Radiation fog versus advection fog?"
  back: "Radiation: clear night, light wind (2-8 kt), moist air, over land; clears with sun or stronger wind. Advection: warm moist air over a colder surface, can form in moderate wind and persist all day; clears with a wind or air mass change."
  stem: "Advection fog:"
  options:
    - "Forms on clear nights in light wind over land, and usually clears soon after the morning sun rises."
    - "Forms as warm moist air crosses a colder surface, and can persist all day in a moderate wind."
    - "Forms when warm moist air moves over a colder surface, but only when the wind is calm."
    - "Forms when cold air drains into a valley overnight, and clears soon after the sun rises."
  answer: 1
- id: PMTC-C017
  elements: ["PMTC 2.4.2"]
  front: "Met factors that reduce in-flight visibility (with codes)?"
  back: "Fog FG (<1,000 m), mist BR (1,000-5,000 m), haze HZ, smoke FU, dust DU and dust storm DS, precipitation (RA, DZ, SHRA, TSRA), low cloud, sea spray. Worst in stable air and looking into the sun."
  stem: "In a METAR, BR indicates:"
  options:
    - "Mist, with visibility 1,000 m to 5,000 m."
    - "Fog, with visibility below 1,000 m."
    - "Mist, with visibility below 1,000 m."
    - "Haze, with visibility from 1,000 m to 5,000 m."
  answer: 0
- id: PMTC-C018
  elements: ["PMTC 2.5.1"]
  front: "Southern hemisphere circulation and Buys Ballot's law?"
  back: "Clockwise around a low, anticlockwise around a high. Back to the wind, the low is on your right."
  stem: "In the southern hemisphere, if you stand with your back to the wind, the low pressure is:"
  options:
    - "On your left, with the wind blowing clockwise around it."
    - "On your right, with the wind blowing anticlockwise around it."
    - "On your right, with the wind blowing clockwise around it."
    - "On your left, with the wind blowing anticlockwise around it."
  answer: 2
- id: PMTC-C019
  elements: ["PMTC 2.5.2"]
  front: "Backing vs veering; gust vs squall?"
  back: "Backing: anticlockwise change (270 to 240). Veering: clockwise (270 to 300). Gust: a few seconds. Squall: sudden rise of at least 16 kt to 22 kt or more, lasting at least a minute."
  stem: "A wind change from 270° to 240° is:"
  options:
    - "Veering, a clockwise change in direction."
    - "Veering, an anticlockwise change in direction."
    - "Backing, an anticlockwise change in direction."
    - "Backing, a clockwise change in the wind direction."
  answer: 2
- id: PMTC-C020
  elements: ["PMTC 2.5.3"]
  front: "Surface wind compared with gradient wind in the southern hemisphere?"
  back: "Lighter and veered. Friction slows the wind, Coriolis weakens, it turns towards the low (to the right in the SH). Over land about 30° and half to two-thirds speed; over sea about 10-15°."
  stem: "In the southern hemisphere, compared with the gradient wind, the surface wind over land is:"
  options:
    - "Lighter and backed by about 30°."
    - "Stronger and veered by about 30°."
    - "Lighter and veered by about 30°."
    - "Stronger and backed by about 30°."
  answer: 2
- id: PMTC-C021
  elements: ["PMTC 2.5.4"]
  front: "Diurnal variation of surface wind over land?"
  back: "By day: mixing brings the gradient wind down, surface wind increases and backs, strongest early afternoon. By night: inversion, surface wind decreases and veers, lightest around dawn. Less variation over the sea or under cloud."
  stem: "On a clear day over land in the southern hemisphere, as heating mixes the gradient wind down, the surface wind:"
  options:
    - "Increases and veers, reaching its strongest in the early afternoon."
    - "Decreases and backs, lightest in the early afternoon."
    - "Increases and backs, strongest around dawn."
    - "Increases and backs, strongest in the early afternoon."
  answer: 3
- id: PMTC-C022
  elements: ["PMTC 2.6.1", "PMTC 2.6.2"]
  front: "Cold front passage at Perth: temperature, wind, cloud?"
  back: "Ahead: warm, NW strengthening. At the front: Cb, squalls, heavy showers, turbulence. Behind: colder, SW (wind backs), showery Cu, good visibility between showers."
  stem: "As a cold front passes Perth, the wind typically:"
  options:
    - "Veers from NW to SW, with colder air and showery Cu behind the front."
    - "Backs from NW to SW, with colder air and showery Cu behind the front."
    - "Backs from SW to NW, with warmer air and layer cloud behind the front."
    - "Backs from NW to SW, with warmer air and continuous rain behind the front."
  answer: 1
- id: PMTC-C023
  elements: ["PMTC 2.6.1", "PMTC 2.6.2"]
  front: "Warm front weather (southern hemisphere)?"
  back: "Ci, Cs, As, Ns with lowering base; wide belt of continuous rain, poor visibility, frontal fog; mostly stable (Cb may be embedded). Warmer after passage; wind backs (N to NW)."
  stem: "An approaching warm front is typically signalled by:"
  options:
    - "Ci and Cs, then As and Ns with a lowering base and continuous rain."
    - "Cu and Cb with a rising base, then a short band of heavy showers."
    - "Ns and As, then Cs and Ci with a rising base and light drizzle."
    - "Ci and Cs, then As and Ns with a rising base and scattered heavy showers."
  answer: 0
- id: PMTC-C024
  elements: ["PMTC 2.6.1"]
  front: "Wave depression and occlusion in one sentence each."
  back: "Wave: a kink on a front deepens into a low with a warm front, warm sector (St, drizzle) and cold front. Occlusion: the cold front catches the warm front, combining layer cloud and rain with embedded Cb."
  stem: "An occlusion forms when:"
  options:
    - "The warm front catches up with the cold front, clearing all cloud from the warm sector."
    - "A kink on a front deepens into a low, with a warm sector between the warm and cold fronts."
    - "Two cold fronts merge, leaving clear skies and good visibility behind them."
    - "The cold front overtakes the warm front, mixing layer cloud and rain with embedded Cb."
  answer: 3
- id: PMTC-C025
  elements: ["PMTC 2.6.1"]
  front: "Tropical cyclone and equatorial trough: key facts?"
  back: "TC: sea ≥ about 26.5 °C, >5° from the equator, clockwise in the SH, eye and eyewall, WA season Nov-Apr, Pilbara most affected. Equatorial (monsoon) trough: convergence, Cu/Cb, heavy showers and storms, light variable winds."
  stem: "A tropical cyclone needs a sea surface temperature of at least about:"
  options:
    - "26.5 °C, and forms more than 5° from the equator."
    - "26.5 °C, and forms within 1° either side of the equator."
    - "20 °C, and forms more than 5° from the equator."
    - "35 °C, and forms more than 5° from the equator."
  answer: 0
- id: PMTC-C026
  elements: ["PMTC 2.7.1"]
  front: "Mountain waves: conditions, signs, action?"
  back: "Stable air, wind about 20 kt+ across the ridge increasing with height. Signs: lenticular, cap and rotor cloud. Action: cross well above (2,000 ft+), at 45° so you can turn away, avoid the lee and rotor."
  stem: "A strong wind blows across a ridge in stable air, with lenticular cloud above it. You should cross the ridge:"
  options:
    - "Low and fast, at 90° to minimise the time spent in turbulence."
    - "Well above it (2,000 ft or more), at 90° to minimise time in the lee."
    - "Well above it (2,000 ft or more), at 45° so you can turn away."
    - "Close to the ridge on the lee side, beneath the rotor cloud."
  answer: 2
- id: PMTC-C027
  elements: ["PMTC 2.7.1"]
  front: "Thunderstorm stages and microburst sequence on approach?"
  back: "Cumulus (updraughts), mature (up and down, rain at the ground, most dangerous), dissipating (down). Microburst: headwind gain, then down-draught, then tailwind loss. Go around early, full power; stay 10 nm from mature cells."
  stem: "The most dangerous stage of a thunderstorm, with updraughts and downdraughts and rain at the ground, is the:"
  options:
    - "Mature stage."
    - "Cumulus stage."
    - "Dissipating stage."
    - "Anvil stage."
  answer: 0
- id: PMTC-C028
  elements: ["PMTC 2.7.1"]
  front: "Clear ice vs rime ice?"
  back: "Clear: large supercooled drops, 0 to −10 °C, Cu/Cb and freezing rain; hard, heavy, most dangerous. Rime: small drops, about −10 to −20 °C, stratiform cloud; white, brittle. Carb ice is separate: clear air, warm and humid."
  stem: "Clear ice is most likely to form from:"
  options:
    - "Small supercooled drops at −10 to −20 °C, in layers of stratiform cloud."
    - "Ice crystals at temperatures below −40 °C, in high cirrus cloud."
    - "Large supercooled drops at 0 to −10 °C, in Cu, Cb or freezing rain."
    - "Large supercooled drops between −20 and −40 °C, in stratiform cloud."
  answer: 2
- id: PMTC-C029
  elements: ["PMTC 2.7.2"]
  front: "When must a VFR pilot obtain a forecast (Part 91 MOS ch 7)?"
  back: "Before every flight: forecasts and reports for route, departure, destination, alternates; update if studied >1 hour before. Exception: none available, but you could return and land at departure within 1 hour; then get a destination forecast within 30 min or return."
  stem: "Under the Part 91 MOS, a VFR pilot must normally obtain forecasts and reports:"
  options:
    - "Only for flights that go more than 50 nm from the departure aerodrome."
    - "Before every flight, but only for the destination and any alternate aerodrome."
    - "Only when the destination aerodrome has a TAF issued for it."
    - "Before every flight, for the route, departure, destination and alternates."
  answer: 3
- id: PMTC-C030
  elements: ["PMTC 2.7.3"]
  front: "TAF validity window for your destination, and what a TTF is?"
  back: "Forecast must cover 30 min before to 60 min after ETA. TTF: 3-hour trend attached to the METAR/SPECI at major aerodromes; supersedes the TAF for that time. GAF cloud is AMSL; TAF/METAR cloud is above aerodrome."
  stem: "For flight planning, the destination TAF must cover the period from:"
  options:
    - "30 minutes before to 60 minutes after the ETA."
    - "60 minutes before to 30 minutes after the ETA."
    - "30 minutes before to 30 minutes after the planned ETA."
    - "The ETA to 2 hours after the ETA."
  answer: 0
- id: PMTC-C031
  elements: ["PMTC 2.7.4"]
  front: "Conditions requiring a special AIREP?"
  back: "Severe turbulence, severe icing, severe mountain wave, thunderstorms (obscured, embedded, widespread or squall line, with or without hail), heavy dust or sand storm, volcanic ash or pre-eruption activity."
  stem: "Which encounter requires a special AIREP?"
  options:
    - "Moderate turbulence or moderate icing."
    - "Light rain showers or isolated Cu."
    - "A 30° wind change at cruise level."
    - "Severe turbulence or severe icing."
  answer: 3
