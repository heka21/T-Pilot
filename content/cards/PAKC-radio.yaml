# Flashcards for PAKC 3.x radio. See content/README.md for the format.
- id: PAKC-RC001
  elements: ["PAKC 3.1.1"]
  front: "How are 3, 5, 9 and whole thousands spoken on the radio?"
  back: "TREE, FIFE, NIN-er; thousands and hundreds as TOU-SAND and HUN-dred (\"tree thousand fife hundred\" for 3,500 ft). Headings, frequencies and codes digit by digit."
- id: PAKC-RC002
  elements: ["PAKC 3.1.1"]
  front: "When may you abbreviate your call-sign (e.g. VH-ABC to 'Bravo Charlie' or 'ABC')?"
  back: "Only after the ground station has abbreviated it first. Use the full call-sign on first contact, prefixed by aircraft type, and whenever a similar call-sign is on frequency."
- id: PAKC-RC003
  elements: ["PAKC 3.1.1"]
  front: "Readability scale 1 to 5?"
  back: "1 unreadable, 2 readable now and then, 3 readable but with difficulty, 4 readable, 5 perfectly readable."
- id: PAKC-RC004
  elements: ["PAKC 3.1.1"]
  front: "How is time given on the radio, and what is Perth time in UTC?"
  back: "UTC, 24-hour clock, normally minutes only ('estimate at tree fife') and the hour added if confusion is possible. Perth (WST) = UTC + 8, no daylight saving."
- id: PAKC-RC005
  elements: ["PAKC 3.1.1"]
  front: "What is a clipped transmission and how do you prevent it?"
  back: "The first or last words lost by speaking before the PTT is fully pressed or releasing early. Press, pause, speak, finish, release. A lost call-sign or 'not' can cause the wrong action."
- id: PAKC-RC006
  elements: ["PAKC 3.2.1"]
  front: "How do you set the squelch?"
  back: "Open it until hiss is heard, set the volume against the hiss, then close the squelch until the hiss just disappears."
- id: PAKC-RC007
  elements: ["PAKC 3.2.1"]
  front: "Main items of the pre-flight radio test?"
  back: "Avionics master on after start; radio on; correct frequencies (active vs standby); MIC and receive selections on the audio panel; volume and squelch; navaids tuned and identified; headset and mic plugs; intercom/VOX threshold; radio check."
- id: PAKC-RC008
  elements: ["PAKC 3.2.1"]
  front: "What does VOX control, and does it key the transmitter?"
  back: "VOX opens the intercom when speech exceeds a set threshold. It does not key the VHF transmitter; that still needs the PTT."
- id: PAKC-RC009
  elements: ["PAKC 3.3.1"]
  front: "Radio fault-finding sequence?"
  back: "Power and avionics master, circuit breakers (reset once), frequency in the active window, volume and squelch, audio panel MIC/receive selection, plugs and headset (try another/hand mic/speaker), stuck mic (TX light), other COM, range. If unresolved: 7600 and ERSA EMERG procedure."
- id: PAKC-RC010
  elements: ["PAKC 3.3.1"]
  front: "TX light stays on and you hear nothing. Cause and action?"
  back: "Stuck microphone/PTT: you are blocking the frequency. Unplug the PTT or headset, or change to the other COM."
- id: PAKC-RC011
  elements: ["PAKC 3.3.1"]
  front: "Hiss with the squelch open, but no stations heard?"
  back: "The receiver and audio work. Suspect wrong frequency (check active window and digits) or being out of VHF range (climb, try a nearer station)."
- id: PAKC-RC012
  elements: ["PAKC 3.4.1"]
  front: "Recommended CTAF broadcasts?"
  back: "Taxiing; entering the runway; inbound by 10 nm; joining the circuit; straight-in approach if used; base/final when needed for separation; clear of the runway (optional). Format: location traffic, type, call-sign, position, level, intentions, location."
- id: PAKC-RC013
  elements: ["PAKC 3.4.1"]
  front: "The five circuit legs?"
  back: "Upwind, crosswind, downwind, base, final. Joining calls: joining crosswind, joining downwind, straight-in approach; distances in nm ('3 miles final')."
- id: PAKC-RC014
  elements: ["PAKC 3.4.1"]
  front: "Downwind call at a Class D aerodrome?"
  back: "\"(Call-sign), downwind, touch and go\" (or full stop). The tower gives your sequence; land only after \"cleared to land\" (or touch and go)."
- id: PAKC-RC015
  elements: ["PAKC 3.5.1"]
  front: "Secrecy of communications means?"
  back: "Do not divulge or use the content of messages not intended for you. Safety traffic addressed to all stations and distress messages may (and should) be acted on or relayed."
- id: PAKC-RC016
  elements: ["PAKC 3.5.1"]
  front: "Examples of unauthorised transmissions?"
  back: "Unnecessary or personal chat, profane or obscene language, false or misleading messages (especially false distress), transmissions without a call-sign, using the wrong frequency (e.g. chat on 121.5), unapproved equipment."
- id: PAKC-RC017
  elements: ["PAKC 3.6.1"]
  front: "Functions of transmitter, receiver and antenna?"
  back: "Transmitter: generates the RF carrier and modulates it (AM) with speech. Receiver: selects, amplifies and demodulates. Antenna: radiates the RF energy and collects incoming signals."
- id: PAKC-RC018
  elements: ["PAKC 3.6.1"]
  front: "Why an avionics (radio) master?"
  back: "Switches all avionics together; off for engine start and shutdown to protect them from voltage spikes, and allows avionics to be shed at once in an electrical emergency."
- id: PAKC-RC019
  elements: ["PAKC 3.6.1"]
  front: "Fuse versus circuit breaker?"
  back: "Both open a circuit on overload. A fuse melts and must be replaced with one of the same rating; a circuit breaker pops and can be reset (once only in flight)."
- id: PAKC-RC020
  elements: ["PAKC 3.7.1"]
  front: "MAYDAY versus PAN PAN?"
  back: "MAYDAY (distress): grave and imminent danger requiring immediate assistance. PAN PAN (urgency): concerns safety of the aircraft or a person but immediate assistance not required. Each said three times."
- id: PAKC-RC021
  elements: ["PAKC 3.7.1"]
  front: "Content of a distress message, in order?"
  back: "MAYDAY x3; station addressed; call-sign (and type); nature of emergency; intentions; position, level and heading; other info (POB, endurance). First on the frequency in use, then 121.5. Squawk 7700."
- id: PAKC-RC022
  elements: ["PAKC 3.7.1"]
  front: "MAYDAY RELAY and 'STOP TRANSMITTING MAYDAY'?"
  back: "MAYDAY RELAY: passing on another aircraft's distress message that has not been acknowledged. STOP TRANSMITTING MAYDAY: silence imposed on other stations during distress traffic."
- id: PAKC-RC023
  elements: ["PAKC 3.8.1"]
  front: "VFR radio failure procedure (outline; check ERSA EMERG)?"
  back: "Squawk 7600; listen out (ATIS, tower, area); transmit blind; remain in VMC; follow ERSA for your airspace; land at the most suitable aerodrome; report arrival to ATS (cancel SARTIME)."
- id: PAKC-RC024
  elements: ["PAKC 3.8.1"]
  front: "Light signals to an aircraft in flight?"
  back: "Steady green: cleared to land. Green flashes: return for landing. Steady red: give way, continue circling. Red flashes: aerodrome unsafe, do not land. White flashes: land here after steady green, then after green flashes proceed to apron."
- id: PAKC-RC025
  elements: ["PAKC 3.8.1"]
  front: "Light signals to an aircraft on the ground?"
  back: "Steady green: cleared for take-off. Green flashes: cleared to taxi. Steady red: stop. Red flashes: taxi clear of the landing area. White flashes: return to starting point."
- id: PAKC-RC026
  elements: ["PAKC 3.9.1"]
  front: "Which COM do you transmit on?"
  back: "The one chosen by the audio panel MIC (transmit) selector, on its active frequency, regardless of which receivers are selected for listening."
- id: PAKC-RC027
  elements: ["PAKC 3.9.1"]
  front: "Main audio panel controls?"
  back: "MIC selector (COM 1/2), receiver buttons (COM, NAV, ADF, DME, marker), speaker/phone, intercom volume and squelch (VOX), isolation modes (pilot isolate, crew, all), marker lights. Fail-safe usually links COM 1 to the pilot headset."
- id: PAKC-RC028
  elements: ["PAKC 3.9.1"]
  front: "Transponder controls and VFR Class G code?"
  back: "Four-digit code (0-7), mode OFF/STBY/ON/ALT, IDENT only when ATC asks. VFR in Class G squawks 1200 with ALT selected unless assigned a code."
- id: PAKC-RC029
  elements: ["PAKC 3.10.1"]
  front: "VHF line-of-sight range rule of thumb?"
  back: "Range (nm) ≈ 1.23 × √(height in ft). E.g. 2,500 ft: 1.23 × 50 ≈ 62 nm. Two elevated stations: add the two ranges."
- id: PAKC-RC030
  elements: ["PAKC 3.10.1"]
  front: "Bands: MF, HF, VHF, UHF frequencies and uses?"
  back: "MF 300 kHz-3 MHz (NDB, ground wave). HF 3-30 MHz (long-range voice, sky wave). VHF 30-300 MHz (COM 118-137, VOR/ILS 108-118, line of sight). UHF 300 MHz-3 GHz (DME, transponder, GNSS)."
- id: PAKC-RC031
  elements: ["PAKC 3.10.1"]
  front: "Factors affecting radio propagation?"
  back: "Terrain (shadowing, absorption), ionosphere (day/night changes, night effect), sunspots (HF disturbance), electrical interference, thunderstorms (static, ADF errors), power attenuation with distance."
- id: PAKC-RC032
  elements: ["PAKC 3.10.2"]
  front: "Key limitations of VHF and HF?"
  back: "VHF: line of sight, limited by height and terrain, but clear. HF: long range by sky wave, but noisy, fading, skip zone, and frequency must suit time of day (higher by day, lower at night)."
