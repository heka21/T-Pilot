# Flashcards for unit BAKC, terminology subtopics 2.1-2.5. See content/README.md for the format.
- id: BAKC-TC001
  elements: ["BAKC 2.1.1"]
  front: "Clock code: where are 12, 3, 6 and 9 o'clock, and how many degrees is one 'hour'?"
  back: "12 = straight ahead along the nose (heading, not track), 3 = right wing, 6 = behind, 9 = left wing. One hour = 30 degrees. Add 'high' or 'low' for traffic above or below."
  stem: "Traffic is reported at 2 o'clock high. It is:"
  options:
    - "60 degrees right of your track, and above you."
    - "30 degrees right of the nose, and above you."
    - "60 degrees right of the nose, and above you."
    - "60 degrees left of the nose, and above you."
  answer: 2
- id: BAKC-TC002
  elements: ["BAKC 2.1.1"]
  front: "How is a runway's 2-figure designator derived?"
  back: "Magnetic direction rounded to the nearest 10 degrees, last digit dropped (e.g. 214°M = runway 21). Ends differ by 18. Headings, tracks and winds use 3-figure groups (e.g. 090, 005, 360)."
  stem: "A runway's direction is 214°M. Its two runway designators are:"
  options:
    - "22 and 04."
    - "21 and 03."
    - "214 and 034."
    - "21 and 01."
  answer: 1
- id: BAKC-TC003
  elements: ["BAKC 2.1.2"]
  front: "Heading (HDG) versus track?"
  back: "Heading: the direction the nose (longitudinal axis) points, clockwise from north. Track: the path over the ground. The difference is drift due to wind."
  stem: "Which statement about heading and track is correct?"
  options:
    - "Heading is the path over the ground; track is where the nose points; the difference is drift."
    - "Heading is where the nose points; track is the path over the ground; the difference is variation."
    - "Heading is where the nose points; track is the path through the air; the difference is deviation."
    - "Heading is where the nose points; track is the path over the ground; the difference is drift."
  answer: 3
- id: BAKC-TC004
  elements: ["BAKC 2.1.3"]
  front: "True, magnetic, compass: what corrects each to the next, and the memory aid?"
  back: "True to magnetic: variation (depends on location). Magnetic to compass: deviation (depends on the aircraft and its heading; deviation card). 'East is least, west is best' (subtract east, add west going towards compass)."
  stem: "To convert a true heading to a compass heading, the corrections are applied:"
  options:
    - "Variation first, then deviation; subtract easterly and add westerly values."
    - "Deviation first, then variation; subtract easterly and add westerly values."
    - "Variation first, then deviation; add easterly and subtract westerly values."
    - "Deviation first, then variation; add easterly and subtract westerly values."
  answer: 0
- id: BAKC-TC005
  elements: ["BAKC 2.2.1", "BAKC 2.2.2"]
  front: "Units for navigation distance, visibility and speed; what is a knot?"
  back: "Navigation: nautical miles (1 NM = 1852 m). Visibility: metres/kilometres. Speed: knots. A knot is one nautical mile per hour (× 1.852 for km/h)."
  stem: "In Australian aviation, navigation distance, visibility and speed are given in:"
  options:
    - "Kilometres, nautical miles, and knots."
    - "Nautical miles, metres or kilometres, and knots."
    - "Statute miles, metres or kilometres, and knots."
    - "Nautical miles, metres or kilometres, and km per hour."
  answer: 1
- id: BAKC-TC006
  elements: ["BAKC 2.2.3"]
  front: "What does a wind velocity of 240/18 mean, and which reference is used where?"
  back: "Wind FROM 240 degrees at 18 kt. Forecasts (TAF, GAF) and METAR/SPECI: degrees true. ATIS and ATC surface winds: degrees magnetic."
  stem: "The ATIS gives the surface wind as 240/18. This is a wind blowing:"
  options:
    - "From 240 degrees true at 18 kt."
    - "Towards 240 degrees magnetic at 18 kt."
    - "From 240 degrees magnetic at 18 kt."
    - "Towards 240 degrees true at 18 kt."
  answer: 2
- id: BAKC-TC007
  elements: ["BAKC 2.2.4"]
  front: "IAS → CAS → TAS → GS: what correction at each step?"
  back: "IAS to CAS: instrument and position error. CAS to TAS: density (pressure altitude and temperature; about +2% per 1000 ft). TAS to GS: wind."
  stem: "Which correction converts calibrated airspeed (CAS) to true airspeed (TAS)?"
  options:
    - "Instrument and position error, from the pitot-static system."
    - "Wind, from the forecast wind velocity and direction at the cruising level."
    - "Humidity, from the dew point (about −2% per 1,000 ft)."
    - "Density, from pressure altitude and temperature (about +2% per 1,000 ft)."
  answer: 3
- id: BAKC-TC008
  elements: ["BAKC 2.3.1"]
  front: "Write 9:07 pm and 12:15 am as 4-figure groups."
  back: "2107 and 0015. Add 12 to pm hours from 1 pm; always four figures, no colon."
  stem: "Written as 4-figure time groups, 9:07 pm and 12:15 am are:"
  options:
    - "2107 and 0015."
    - "2107 and 1215."
    - "0907 and 0015."
    - "2107 and 2415."
  answer: 0
- id: BAKC-TC009
  elements: ["BAKC 2.3.2", "BAKC 2.3.3"]
  front: "WST and UTC: the conversion rule and the date trap?"
  back: "WST = UTC + 8, all year (no daylight saving in WA). WST to UTC: subtract 8 (any WST before 0800 is the previous day UTC). UTC to WST: add 8 (any UTC from 1600 is the next day WST)."
  stem: "Which statement about converting between WST and UTC is correct?"
  options:
    - "WST = UTC − 8 all year; any UTC time from 1600 is the previous day in WST."
    - "WST = UTC + 8 all year; any UTC time from 1600 is the next day in WST."
    - "WST = UTC + 8, or + 9 in summer daylight saving; the date stays the same."
    - "WST = UTC + 8 all year; any WST time before 0800 is the next day in UTC."
  answer: 1
- id: BAKC-TC010
  elements: ["BAKC 2.3.3"]
  front: "Convert 2030 UTC on 5 May to WST."
  back: "2030 + 0800 = 2830 → 0430 WST on 6 May."
  stem: "Convert 2030 UTC on 5 May to WST."
  options:
    - "0430 WST on 5 May."
    - "1230 WST on 5 May."
    - "0430 WST on 6 May."
    - "0530 WST on 6 May."
  answer: 2
- id: BAKC-TC011
  elements: ["BAKC 2.4.1"]
  front: "Height, altitude, elevation?"
  back: "Height: above a specified datum, usually the ground (AGL). Altitude: aircraft above mean sea level (QNH set). Elevation: a point on or fixed to the ground above MSL. All in feet. Altitude = elevation + height."
  stem: "An aircraft is 1,500 ft above an aerodrome whose elevation is 500 ft. Its vertical position above mean sea level is:"
  options:
    - "A height of 2,000 ft."
    - "An elevation of 2,000 ft."
    - "An altitude of 1,000 ft."
    - "An altitude of 2,000 ft."
  answer: 3
- id: BAKC-TC012
  elements: ["BAKC 2.4.2"]
  front: "Australian units for runway dimensions, temperature, pressure, weight, liquid volume, visibility?"
  back: "Metres; degrees Celsius; hectopascals; kilograms; litres; metres/kilometres."
  stem: "In Australia, temperature, pressure, weight and liquid volume are measured in:"
  options:
    - "Degrees Celsius, hectopascals, kilograms and litres."
    - "Degrees Celsius, inches of mercury, kilograms and litres."
    - "Degrees Celsius, hectopascals, pounds and litres."
    - "Degrees Celsius, hectopascals, kilograms and US gallons."
  answer: 0
- id: BAKC-TC013
  elements: ["BAKC 2.5.1"]
  front: "Kinetic and potential energy: formulas and what doubling does."
  back: "KE = ½mv² (doubling speed gives 4 × KE). PE = mgh (doubling height gives 2 × PE). Both proportional to mass."
  stem: "If an aircraft's speed doubles, its kinetic energy:"
  options:
    - "Doubles, because KE is proportional to speed."
    - "Increases four times, because KE = ½mv²."
    - "Stays the same, because KE depends only on mass."
    - "Increases four times, because KE = mgh."
  answer: 1
- id: BAKC-TC014
  elements: ["BAKC 2.5.2"]
  front: "What is the aircraft energy state?"
  back: "Its total mechanical energy: kinetic (airspeed) plus potential (height). Throttle adds or removes energy; elevator trades between speed and height; drag always removes energy."
  stem: "In the aircraft energy-state model:"
  options:
    - "The elevator adds or removes energy, and the throttle trades between speed and height."
    - "The throttle adds or removes energy, and drag adds energy during a descent."
    - "The throttle adds or removes energy, and the elevator trades speed for height."
    - "The elevator adds energy in a climb, and drag removes energy only at high speed."
  answer: 2
- id: BAKC-TC015
  elements: ["BAKC 2.5.3"]
  front: "Effect on energy of: accelerating level; climbing at constant speed; zoom with power unchanged."
  back: "Accelerating level: KE up, PE same, total up. Climbing at constant speed: PE up, KE same, total up (engine supplies it). Zoom: KE traded for PE, total roughly constant."
  stem: "An aircraft zooms into a climb with the power unchanged and its airspeed falls. Its total energy:"
  options:
    - "Stays roughly constant, as kinetic energy is traded for potential energy."
    - "Increases, because its potential energy has increased with the gain in height."
    - "Decreases, because its kinetic energy has decreased with airspeed."
    - "Increases, because the engine supplies the extra potential energy."
  answer: 0
