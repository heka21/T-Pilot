# How the narrator says abbreviations. Used by app/seed/narration.py (normalise) for every listening script.
#
# words: a capitalised token and how to say it. Matching is exact and case-sensitive, a trailing "s" is a plural
#        (NOTAMs -> "no-tams"). null means spell it letter by letter (Q N H), which is also what happens to any
#        all-capitals token not listed here; check_content lists those so they can be added deliberately.
#        Respell rather than explain: the voice reads "mee-tar" as METAR is said on the radio.
# units: abbreviations said in full when they follow a number (1,500 ft -> 1,500 feet).
#
# Check a pronunciation with: .venv/bin/python -m tools.audio.build --say "the METAR and the TAF"

