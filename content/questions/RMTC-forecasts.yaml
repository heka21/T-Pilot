- id: RMTC-F027
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "In January a high pressure system is centred in the Great Australian Bight. What gradient wind direction would you expect over Perth?"
  options:
    - "Westerly, because air flows clockwise around a high in the Southern Hemisphere."
    - "Northerly, because air flows straight out of a high towards the equator."
    - "Easterly, because air flows anticlockwise around a high in the Southern Hemisphere."
    - "Southerly, because air flows directly from the high towards Perth."
  answer: 2
  explanation: "In the Southern Hemisphere the Coriolis effect turns moving air to the left, so it circles a high anticlockwise. Perth lies on the high's northern side, where the circulation runs from east to west: the hot, dry summer easterly. Clockwise is the circulation round a low."
  references: ["RMTC 2.1"]
  difficulty: 1
- id: RMTC-F028
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "On a hot afternoon near Cunderdin, flat-based cumulus have formed over the bare paddocks. Up to roughly what level should you expect the thermal turbulence to extend?"
  options:
