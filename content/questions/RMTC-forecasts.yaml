# RMTC: RPL meteorology, bank expansion (local weather, forecasts and reports, significance of observations).
# ---------- RMTC 2.1.1 (a) thunderstorms ----------
- id: RMTC-F001
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "A February afternoon at Northam: high-based towers to the north-east trail rain shafts that evaporate before reaching the ground. What is the main threat to an aeroplane near the surface?"
  options:
    - "Little threat, because rain that does not reach the ground means a weak storm."
    - "Heavy rain on the runway reducing braking, as the rain will soon reach the ground."
    - "A strong microburst and gust front, driven by the evaporating rain, with little rain to warn you."
    - "Freezing fog forming beneath the cloud base as the rain evaporates."
  answer: 2
  explanation: "Evaporation chills the falling air, so it is heavier and accelerates downwards: dry inland storms produce some of the strongest microbursts and gust fronts, often carrying dust. The lack of rain at the surface is not a sign of a weak storm; it is the reason the downdraught is so strong."
  references: ["RMTC 2.1"]
  difficulty: 3
- id: RMTC-F002
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "Which stage of a thunderstorm cell is the most dangerous, and what marks its beginning?"
  options:
    - "The mature stage, which begins when rain and hail start falling to the ground beside the updraught."
    - "The cumulus stage, which begins when the anvil of ice cloud spreads out at the top."
    - "The dissipating stage, which begins when the updraughts are at their strongest."
    - "The cumulus stage, which begins when lightning and heavy rain first reach the surface."
  answer: 0
  explanation: "Rain at the surface and lightning mark the mature stage, when the updraught and the rain-cooled downdraught exist side by side. The cumulus stage is all updraught with no rain at the ground, and the anvil belongs to the dissipating stage."
  references: ["RMTC 2.1"]
  difficulty: 1
- id: RMTC-F003
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "Summer thunderstorms over the wheatbelt are usually triggered by surface heating. When are they most likely?"
  options:
    - "Building before dawn and peaking around sunrise."
    - "At any hour, since heating has no link to the time of day."
    - "Building after dark and peaking around midnight."
    - "Building from about midday and peaking in the late afternoon."
  answer: 3
  explanation: "Heating storms follow the sun: they build from about midday, peak in the late afternoon and die away after dark when the heating stops. It is frontal storms, triggered by lifting along a front, that can arrive at any time of day."
  references: ["RMTC 2.1"]
  difficulty: 1
- id: RMTC-F004
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "A vigorous winter cold front with thunderstorms is forecast to cross Perth around dawn. A fellow student says storms are an afternoon problem, so a dawn departure from Jandakot will be fine. What is wrong with that reasoning?"
  options:
    - "Nothing; storms need daytime heating, so a dawn front brings only light rain."
    - "Frontal storms are triggered by lifting along the front, so they can occur at any hour."
    - "Nothing; storms near Perth occur only in summer, so a winter front cannot produce them."
    - "Storms at dawn are always weaker than afternoon storms, so they can be flown through."
  answer: 1
  explanation: "The trigger decides the timing. A front lifts the air whatever the hour, so a line of frontal storms can pass through Perth at dawn; only heat-triggered storms follow the afternoon pattern."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F005
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "Heading east of York, you see a mature thunderstorm about 15 nm north of your track, its anvil spreading south into the clear air over your track ahead. What should you do?"
  options:
    - "Continue beneath the anvil, as no rain is falling from it and the cell is over 10 nm away."
    - "Fly as close to the cell as you need to, provided you stay outside the visible cloud."
    - "Turn away to stay out from under the anvil as well as 10 nm or more from the cell."
    - "Climb to pass over the top of the anvil, where the air is smooth and clear."
  answer: 2
  explanation: "Hail can fall from the anvil into clear air well outside the visible rain, and the clear air beneath the anvil is where the downdraughts are. Being more than 10 nm from the cell is not enough if your track takes you under its anvil."
  references: ["RMTC 2.1"]
  difficulty: 3
- id: RMTC-F006
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "In which months are heavy, often severe thunderstorms and tropical cyclones most likely in the Kimberley and Pilbara?"
  options:
    - "October to April, the wet season."
    - "May to September, the dry season."
    - "June to August only, in mid-winter."
    - "July to October, with the winter fronts."
  answer: 0
  explanation: "The north's wet season, October to April, brings heavy afternoon and evening storms, often severe, and tropical cyclones in the same months. May to September is the south-west's fog and front season, not the north's storm season."
  references: ["RMTC 2.1"]
  difficulty: 1
- id: RMTC-F007
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "You are in the circuit at Northam. A storm is about 8 nm away and no rain has reached the aerodrome yet. Which threat could arrive first, with no rain to warn you?"
  options:
    - "Heavy rain removing the visibility, since the rain always arrives before the wind."
    - "Radiation fog forming in the cooled air beneath the cloud."
    - "Airframe icing in the circuit, below the freezing level."
    - "The gust front: a sudden wind shift and squall, often with dust."
  answer: 3
  explanation: "The cold outflow spreads out ahead of the storm, and its leading edge, the gust front, can reach the aerodrome before the rain, bringing a sudden wind shift, a squall and often a wall of dust. In the circuit that means wind shear on take-off and landing."
  references: ["RMTC 2.1"]
  difficulty: 2
# ---------- RMTC 2.1.1 (b) low cloud ----------
- id: RMTC-F008
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "Behind a winter cold front a moist south-westerly is blowing. On a flight from Jandakot to York, where is low cloud most likely?"
  options:
    - "Over the coastal plain near Jandakot, while the hills stay clear."
    - "On the Darling Scarp and the hills east of it, a few hundred feet above the ridges."
    - "Over the Avon valley only, because cold air drains into it during the day."
    - "Nowhere on the route, because the air behind a front is always dry."
  answer: 1
  explanation: "The south-westerly is forced up the Scarp; the air expands and cools as it rises and reaches its dew point a few hundred feet above the hills, capping them in orographic cloud while the plain can stay clear. That is exactly where the York track crosses the high ground."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F009
  kind: numeric
  elements: ["RMTC 2.1.1"]
  stem: "A mid-morning observation at Northam gives a temperature of 23 degrees and a dew point of 14 degrees. Using the rule of thumb of 400 ft per degree of dew point spread, at about what height above the ground should the cumulus base be once thermals start?"
  answer: 3600
  tolerance: 100
  unit: ft
  explanation: "Spread: 23 - 14 = 9 degrees. Rising air loses about 1 degree of spread every 400 ft, so the base is about 9 x 400 = 3,600 ft above the ground. Check: 3,600 / 400 = 9 degrees, the spread. It is an estimate, and only for cumulus formed by air rising from the surface."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F010
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "Which temperature and dew point pair, from evening observations, shows air closest to forming cloud or fog?"
  options:
    - "Temperature 30, dew point 12"
    - "Temperature 22, dew point 15"
    - "Temperature 12, dew point 11"
    - "Temperature 18, dew point 8"
  answer: 2
  explanation: "The dew point spread shows how close the air is to condensing: 12 minus 11 is a spread of only 1 degree, air on the edge of cloud or fog. The other pairs have spreads of 18, 7 and 10 degrees; the highest dew point is not what matters."
  references: ["RMTC 2.1"]
  difficulty: 1
- id: RMTC-F011
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "On a winter day, stratus is lowering ahead of an approaching front. Why would the 400 ft per degree dew point spread rule give an unreliable estimate of its base?"
  options:
    - "The rule applies only to cumulus formed by air rising from the surface, not to cloud lowered by a front."
    - "The rule works only in summer, when the dew point is above 20 degrees."
    - "The rule gives the base above sea level, while stratus is measured above the aerodrome."
    - "The rule works only when the dew point spread is more than 15 degrees."
  answer: 0
  explanation: "The rule estimates where a surface thermal reaches its dew point, so it suits cumulus. Stratus lowering ahead of a front comes from warm moist air lifted over the colder air, not from surface thermals, so the rule does not apply."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F012
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "After a humid day with a strong sea breeze at Busselton, you plan a dawn departure. Why might there be low stratus over the aerodrome?"
  options:
    - "Hot air from the interior was lifted over the coast during the night."
    - "The ground warmed overnight and lifted the moist air into cloud."
    - "The sea breeze stopped the thermals, and thermals are what make stratus."
    - "The sea breeze carried moist ocean air inland, and it cooled further after dark."
  answer: 3
  explanation: "The sea breeze brings moist ocean air over the land, where it can cool further in the evening and form low stratus along the coast that spreads inland overnight. The ground cools at night, it does not warm."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F013
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "A cold front is approaching the south-west from the Indian Ocean, and in the morning there is only high cloud. How should the cloud be expected to change through the day, ahead of the front?"
  options:
    - "It should rise and clear as the front approaches."
    - "Its base should lower, from high cloud towards low cloud and rain."
    - "It should stay as high cloud until the front has passed."
    - "It should turn to fair-weather cumulus with rising bases."
  answer: 1
  explanation: "Ahead of a front warm moist air is lifted over the colder air, and the base lowers through the day from high cloud to low cloud and rain, with a freshening northerly. An afternoon return flight will meet lower cloud than the morning departure."
  references: ["RMTC 2.1"]
  difficulty: 1
# ---------- RMTC 2.1.1 (c) poor visibility ----------
- id: RMTC-F014
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "The overnight forecast for York is clear skies, high humidity and a south-westerly of 18 kt. How likely is radiation fog by dawn, and why?"
  options:
    - "Very likely, because clear skies and high humidity are all that fog needs."
    - "Very likely, because the strong wind carries moist air into the valley."
    - "Unlikely, because the wind mixes the air cooled at the ground with warmer air above."
    - "Unlikely, because high humidity stops the ground from cooling at night."
  answer: 2
  explanation: "Radiation fog also needs a light wind, about 2 to 5 kt. A wind much over 10 kt keeps mixing the chilled surface air with warmer air above, so no layer reaches its dew point; at most it gives low stratus. Clear and humid is not enough on its own."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F015
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "On a clear, humid winter night in the Avon valley, which overnight wind gives the best chance of a fog layer a few hundred feet deep by dawn?"
  options:
    - "Dead calm"
    - "About 2 to 5 kt"
    - "About 12 to 15 kt"
    - "Over 20 kt"
  answer: 1
  explanation: "A light breeze of about 2 to 5 kt stirs the cooled air through a layer a few hundred feet deep. Dead calm gives dew or frost and only a shallow ground fog, and a wind much over 10 kt mixes the chilled air away and stops fog forming."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F016
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "On a still, clear winter dawn the aerodrome at York, in the Avon valley, is in fog, while a hilltop farm strip ten miles away is clear. Why?"
  options:
    - "Cold air drains downhill overnight and pools in the low ground, where it reaches its dew point."
    - "Hilltops are more humid than valleys, so the moisture forms cloud above them instead."
    - "The sun reaches the valley floor first and evaporates the moisture into fog."
    - "The wind is always stronger in valleys, which mixes the fog down to the ground."
  answer: 0
  explanation: "Chilled air is heavier than warm air, so on sloping ground it drains downhill overnight and collects in the valleys, such as the Avon around Northam and York. A hilltop strip can be clear while the valley aerodrome nearby is fogbound."
  references: ["RMTC 2.1"]
  difficulty: 1
- id: RMTC-F017
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "At first light Northam is in radiation fog and you want to depart on a local flight. What is the usual pattern over the next few hours?"
  options:
    - "The fog clears at sunrise, so a departure at first light will be fine."
    - "The fog lasts all day, because the winter sun cannot heat the ground."
    - "The fog thickens all morning and clears only after dark."
    - "It may thicken briefly after sunrise, then clear by mid-morning, often lifting into stratus first."
  answer: 3
  explanation: "The coldest time is just after sunrise, so the fog often thickens briefly after first light. Then the sun heats the ground, the droplets evaporate from below, and the fog usually clears by mid-morning, often lifting first into low stratus."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F018
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "The February GAF for the wheatbelt forecasts no cloud. What could still give you poor visibility on a cross-country flight?"
  options:
    - "Smoke from bushfires or burn-offs, which can spread over hundreds of kilometres."
    - "Nothing, because a forecast of no cloud means 10 km visibility or more."
    - "Drizzle, which falls from clear skies on hot summer afternoons."
    - "Radiation fog, which forms in the hottest part of a summer afternoon."
  answer: 0
  explanation: "A forecast of clear skies is not a forecast of good visibility. Smoke from bushfires and controlled burns in late summer and autumn spreads over hundreds of kilometres and is worst looking into the sun: read the visibility and weather groups, not just the cloud."
  references: ["RMTC 2.1"]
  difficulty: 1
- id: RMTC-F019
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "Over the featureless wheatbelt in thick haze, the horizon has disappeared. What is the particular danger?"
  options:
    - "The magnetic compass stops working without a visible horizon."
    - "The engine overheats because the haze is full of dust."
    - "The inner ear cannot tell a gentle descending turn from level flight, so a spiral can develop."
    - "The aeroplane climbs on its own because hazy air is less dense."
  answer: 2
  explanation: "Without a horizon the pilot loses the visual reference for attitude, and the inner ear cannot distinguish a gentle descending turn from level flight; that is how pilots in haze enter a spiral without knowing it. Poor visibility also hides terrain, obstacles and other aircraft until late."
  references: ["RMTC 2.1"]
  difficulty: 2
- id: RMTC-F020
  kind: mcq
  elements: ["RMTC 2.1.1"]
  stem: "En route to Kalgoorlie in rising dust, you estimate the flight visibility at about 6 km and falling, with the horizon merging into the haze. What is the best decision?"
  options:
    - "Continue: 6 km is above the 5,000 m VMC minimum, so the flight is legal and safe."
    - "Turn back now: 5,000 m is a legal floor, and a falling visibility is the cue to turn."
    - "Descend lower, because dust is always thinner close to the ground."
    - "Continue and climb into the haze, where the visibility always improves."
  answer: 1
  explanation: "The 5,000 m VMC visibility is a legal floor, not a comfortable working figure. A visibility that is falling as you fly, with the horizon merging into haze, is the sign to turn back while you still can; dust can take the visibility to a few hundred metres in minutes."
  references: ["RMTC 2.1"]
  difficulty: 2
# ---------- RMTC 2.1.1 (d) turbulence and local winds ----------
