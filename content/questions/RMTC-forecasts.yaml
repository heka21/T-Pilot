    - "In the clear blue gaps between the clouds."
    - "Nowhere below the base, since cumulus mark only rising air."
  answer: 2
  explanation: "Each cumulus caps a column of rising air, and the air between the thermals sinks to replace it, so the blue gaps are where the sink is. Flying from cloud to gap you are lifted and then dropped."
