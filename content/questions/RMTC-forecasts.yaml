- id: RMTC-F060
  kind: mcq
  elements: ["RMTC 2.3.1"]
  stem: "Why does a field of fair-weather cumulus over the wheatbelt have flat bases at about the same height?"
  options:
    - "The thermals start with similar temperature and moisture, so they reach their dew point at a similar height."
    - "An inversion at the base level stops each cloud from growing downwards."
    - "The surface wind blows the bottom of each cloud flat as it drifts."
    - "The sinking air between the clouds presses their bases into one level."
  answer: 0
  explanation: "Each cumulus is the visible top of a thermal, and condensation starts where the rising air reaches its dew point. Because the thermals in an area begin with roughly the same temperature and moisture, they reach it at roughly the same height, so the bases line up."
