# ---------- RMTC 2.3.1 (b) wind gradient and wind shear ----------
- id: RMTC-F067
  kind: numeric
  elements: ["RMTC 2.3.1"]
  stem: "On final at 65 kt you have a 22 kt headwind at 400 ft, and the surface wind is 8 kt straight down the runway. If inertia held your groundspeed while you descended through the gradient, what would the airspeed be near the ground?"
  answer: 51
  tolerance: 1
  unit: kt
  explanation: "Groundspeed at 400 ft: 65 - 22 = 43 kt. Held through the descent into an 8 kt headwind, the airspeed becomes 43 + 8 = 51 kt. Check: the headwind falls by 22 - 8 = 14 kt, and 65 - 14 = 51 kt. A loss of headwind is a loss of airspeed, so expect to add power."
  references: ["RMTC 2.3"]
  difficulty: 3
- id: RMTC-F068
  kind: mcq
  elements: ["RMTC 2.3.1"]
  stem: "In which conditions is the wind gradient near the ground steepest?"
  options:
    - "A light wind over smooth water."
    - "A strong wind over rough ground with trees and buildings."
    - "A light wind over a smooth, bare runway."
    - "A strong wind over smooth water."
  answer: 1
  explanation: "The gradient is caused by friction slowing the air near the surface. It is steeper in strong winds and over rough ground, trees and buildings, and gentler over smooth water."
  references: ["RMTC 2.3"]
  difficulty: 2
- id: RMTC-F069
  kind: mcq
  elements: ["RMTC 2.3.1"]
  stem: "You take off with a light tailwind that increases with height through the wind gradient. What happens as you climb?"
  options:
    - "The airspeed rises and the climb angle steepens."
    - "Nothing changes, because the aeroplane moves with the air mass."
    - "The airspeed tends to fall and the climb gradient is reduced."
    - "The groundspeed falls, so obstacle clearance improves."
  answer: 2
  explanation: "An increasing tailwind is performance-decreasing shear: inertia holds the groundspeed for a moment, so the airspeed falls and the climb gradient is reduced, one more reason never to take off downwind towards obstacles. Climbing into a headwind gradient gives the opposite, a brief gain."
  references: ["RMTC 2.3"]
  difficulty: 2
- id: RMTC-F070
  kind: mcq
  elements: ["RMTC 2.3.1"]
  stem: "At dawn at Jandakot the surface is calm, but the GPWT shows a 25 kt easterly at 2,000 ft. You depart westwards on runway 24. What should you expect as you climb through the top of the inversion?"
  options:
    - "A sudden rise in airspeed and a steeper climb, because the wind increases."
    - "No change, because the wind above an inversion is always light."
    - "A gradual increase in headwind as the friction layer thins out."
    - "A sudden loss of airspeed and climb performance as a strong tailwind sets in."
  answer: 3
  explanation: "Calm, cold air lies under the inversion with strong wind, sometimes a low-level jet, just above it. Climbing west into an easterly is a sudden gain of tailwind: inertia holds the groundspeed, so the airspeed drops and the climb suffers. Met as a headwind, the same layer would raise the airspeed instead."
  references: ["RMTC 2.3"]
  difficulty: 3
- id: RMTC-F071
  kind: mcq
  elements: ["RMTC 2.3.1"]
  stem: "On approach beneath a thunderstorm, the airspeed suddenly rises and the aeroplane floats above the path. What is the most likely cause, and what follows?"
  options:
    - "The microburst's outflow headwind; next come the downdraught and a tailwind that cut airspeed."
    - "A thermal over the runway; next comes smooth air, so reduce power and land."
    - "A tailwind gust; next comes a steady headwind that floats you down the runway."
    - "The wind gradient; next comes a steady rise in airspeed all the way to the ground."
  answer: 0
  explanation: "Entering a microburst the aeroplane first meets the outflow as a headwind and floats; in the centre the downdraught pushes it down, and on the far side a tailwind takes away airspeed and lift just as the ground is close. Pulling the power off in the first phase makes the next one worse; the only defence is avoidance."
  references: ["RMTC 2.3"]
  difficulty: 3
- id: RMTC-F072
  kind: numeric
  elements: ["RMTC 2.3.1"]
  stem: "The ATIS gives the wind as 340 degrees at 12 kt gusting 26 kt, close to straight down the runway. Your normal approach speed is 63 kt. Adding half the gust factor, what approach speed should you fly?"
  answer: 70
  tolerance: 0
  unit: kt
  explanation: "Gust factor: 26 - 12 = 14 kt. Half of it: 14 / 2 = 7 kt. Approach speed: 63 + 7 = 70 kt. A gust 14 kt above the mean is also a warning of mechanical turbulence near the ground; your POH or instructor may limit the margin."
  references: ["RMTC 2.3"]
  difficulty: 2
- id: RMTC-F073
  kind: mcq
  elements: ["RMTC 2.3.1"]
  stem: "A preceding aircraft reports 'wind shear on final, plus or minus 10 kt' at Jandakot. Which set of actions best fits your approach?"
  options:
    - "Fly the normal approach speed with full flap, so you are slow over the threshold."
    - "Fly below the normal approach speed, so that any gust gives you extra lift."
    - "Continue to land whatever happens, since a go-around in shear is more dangerous."
    - "Add a speed margin, use less flap if the POH allows, and be ready to go around early."
  answer: 3
  explanation: "Shear on final means sudden changes in airspeed. A margin on the approach speed gives speed to lose in a lull, less flap makes the aeroplane less affected by gusts and easier to accelerate, and an early go-around stops the speed or path getting away from you."
  references: ["RMTC 2.3"]
  difficulty: 2
