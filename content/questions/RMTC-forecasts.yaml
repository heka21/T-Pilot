  explanation: "Virga is rain evaporating before it reaches the ground; the evaporation cools the air, which sinks, hits the ground and spreads out. Under a high-based inland storm it is the warning of a dry microburst, which is managed only by staying away."
  references: ["RMTC 2.3"]
  difficulty: 2
- id: RMTC-F066
  kind: mcq
  elements: ["RMTC 2.3.1"]
  stem: "On a hot afternoon at Northam, your final approach passes over a bare paddock and then the runway. What should you be ready for?"
  options:
    - "A perfectly steady approach, because thermals form only above 1,000 ft."
    - "Steady lift all the way down, so you can reduce power early and glide in."
    - "A loss of engine power caused by the rising warm air."
    - "Sink or lift in turn, so the aeroplane sinks short or balloons over the threshold."
  answer: 3
  explanation: "Thermals give a gain of height over the updraught and a loss in the sinking air around it, so a final over hot ground can be sink followed by lift over the runway, or the reverse. Correct early with power and attitude and be ready to go around."
