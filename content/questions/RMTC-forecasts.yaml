    - "27012KT"
  answer: 1
  explanation: "A gust group of 10 kt or more above the mean wind is a turbulence warning: 15 kt gusting 27 kt means the air near the ground is changing speed by 12 kt in seconds as it tumbles over obstacles. The others are light to moderate winds with no gusts."
