    - "Only over the crops and bush, not the paddocks."
  answer: 1
  explanation: "When the air is moist enough each thermal is capped by a flat-based cumulus, and the turbulence reaches up to that base. It is worst at low level over bare ground, which heats faster than crops, bush or water."
  references: ["RMTC 2.1"]
  difficulty: 2
# ---------- RMTC 2.2.1 forecasts, reports and broadcasts ----------
- id: RMTC-F029
  kind: mcq
  elements: ["RMTC 2.2.1"]
  stem: "Decode the wind in this report: 'METAR YPKG 120600Z 05015G27KT 9999 SCT045 33/08 Q1009'."
  options:
    - "From 050 degrees magnetic at 15 kt, gusting to 27 kt."
    - "From 050 degrees true at 15 kt, gusting to 27 kt."
    - "Towards 050 degrees true at 15 kt, gusting to 27 kt."
    - "From 050 degrees true at 27 kt, with lulls to 15 kt."
  answer: 1
  explanation: "The first three digits are the direction the wind blows from, in degrees true because a METAR is a meteorological product, and the next two the mean speed, 15 kt; G27 adds gusts to 27 kt. Only the tower and the ATIS give the wind in degrees magnetic."
  references: ["RMTC 2.2"]
  difficulty: 1
- id: RMTC-F030
  kind: mcq
  elements: ["RMTC 2.2.1"]
  stem: "A Perth report reads 'METAR YPPH 210230Z 24018KT 9999 -SHRA BKN025 18/12 Q1018'. What do '-SHRA BKN025' mean?"
  options:
    - "Heavy showers of rain, with scattered cloud at 2,500 ft above the aerodrome."
    - "Light showers of rain, with broken cloud at 25,000 ft above sea level."
    - "Light showers of rain, with broken cloud (5 to 7 oktas) at 2,500 ft above the aerodrome."
    - "Showers in the vicinity, with broken cloud (1 to 2 oktas) at 250 ft above the aerodrome."
  answer: 2
  explanation: "A minus sign means light, SH showers and RA rain. BKN is broken, 5 to 7 oktas, a ceiling, and the three digits are hundreds of feet above the aerodrome, so 025 is 2,500 ft. Heavy would be '+', and a vicinity report would carry 'VC'."
  references: ["RMTC 2.2"]
  difficulty: 2
- id: RMTC-F031
  kind: mcq
  elements: ["RMTC 2.2.1"]
  stem: "A Kalgoorlie TAF has the validity group '1418/1506'. Over what period of Western Australian local time (WST) is it valid?"
  options:
    - "1800 WST on the 14th to 0600 WST on the 15th."
    - "1000 WST on the 14th to 2200 WST on the 14th."
    - "0200 WST on the 14th to 1400 WST on the 14th."
    - "0200 WST on the 15th to 1400 WST on the 15th."
  answer: 3
  explanation: "1418 is the 14th at 1800 UTC; adding 8 hours gives 2600, which passes midnight: 0200 WST on the 15th. 1506 is the 15th at 0600 UTC, 1400 WST on the 15th. Reading UTC as local, subtracting 8, or forgetting the date change gives the other options."
  references: ["RMTC 2.2"]
  difficulty: 3
- id: RMTC-F032
  kind: mcq
  elements: ["RMTC 2.2.1"]
  stem: "Perth TAF: 'TAF YPPH 090400Z 0906/0918 03012KT 9999 FEW040 FM090800 23018KT 9999 BKN018'. Which conditions are forecast for an arrival at 1630 WST on the 9th?"
  options:
    - "Wind 230 degrees true at 18 kt, visibility 10 km or more, broken cloud at 1,800 ft."
    - "Wind 030 degrees true at 12 kt, visibility 10 km or more, few cloud at 4,000 ft."
    - "Wind 030 degrees true at 12 kt, with broken cloud at 1,800 ft and few at 4,000 ft."
    - "Either set of conditions, alternating back and forth through the afternoon."
  answer: 0
  explanation: "FM090800 is the 9th at 0800 UTC, 1600 WST, and FM is a permanent change: everything after it replaces what came before. At 1630 WST (0830 UTC) the forecast is 230 at 18 kt, 10 km or more and a broken ceiling at 1,800 ft above the aerodrome; the opening conditions no longer apply."
  references: ["RMTC 2.2"]
  difficulty: 2
- id: RMTC-F033
