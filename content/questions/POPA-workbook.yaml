# POPA: the CASA workbook take-off and landing charts, Figs 3 to 6, 12 and 13 (workbook_page shows the page in the quiz).
- id: POPA-W001
  kind: mcq
  elements: ["POPA 2.4.2"]
  stem: "Refer to the take-off weight chart, Fig 3. What take-off safety speed and flap setting does the chart assume?"
  options:
    - "60 KIAS, 10 degrees of flap"
    - "64 KIAS, zero flap"
    - "65 KIAS, 40 degrees of flap"
    - "58 KIAS, 30 degrees of flap"
  answer: 0
  workbook_page: 5
  explanation: "Fig 3's conditions box: full throttle, 10 degrees of flap, 60 KIAS safety speed, distance factor 1.15, 15 kt crosswind limit. 64 KIAS and zero flap are Fig 5's; 65 KIAS and 40 degrees are Fig 4's; 58 KIAS and 30 degrees are Fig 6's."
  references: ["POPA 2.4", "Workbook p5"]
  difficulty: 1
- id: POPA-W002
  kind: numeric
  elements: ["POPA 2.4.1"]
  stem: "Refer to Fig 3. Whatever the runway and the weather, what is the highest take-off weight the chart ever permits?"
  answer: 1090
  tolerance: 0
  unit: kg
  workbook_page: 5
  explanation: "Note (2) on Fig 3: the maximum take-off weight is 1,090 kg, also drawn as the line across the top of the weight panel. No combination of runway, wind and slope lifts the answer above it."
  references: ["POPA 2.4", "Workbook p5"]
  difficulty: 1
- id: POPA-W003
  kind: mcq
  elements: ["POPA 2.4.2"]
  stem: "Fig 3 gives two weights, (A) and (B). Which take-off weight may you use?"
  options:
    - "The lesser of (A) and (B), and never more than 1,090 kg"
    - "The greater of (A) and (B)"
    - "(A) only: (B) is for landing"
    - "The average of (A) and (B)"
  answer: 0
  workbook_page: 5
  explanation: "Note (1): the gross weight at take-off shall not exceed the lesser of (A) and (B). (A) is the weight the runway, wind, slope and surface allow; (B) is the second limit the chart draws in the weight panel. Note (2) caps everything at 1,090 kg."
  references: ["POPA 2.4", "Workbook p5"]
  difficulty: 2
- id: POPA-W004
  kind: numeric
  elements: ["POPA 2.4.2"]
  stem: "Follow the dashed worked example printed on Fig 3 to the take-off weight scale. What weight (A) does it give, to the nearest 5 kg or so?"
  answer: 1009
  tolerance: 8
  unit: kg
  workbook_page: 5
  explanation: "The example starts at about 4,600 ft pressure height (START HERE), goes across to the temperature, up to the TODA, through the surface and slope panels and down into the wind panel, then left to (A) just above the 1,000 kg line: about 1,009 kg. Reading within a few kilograms is what the exam needs; use a ruler."
  references: ["POPA 2.4", "Workbook p5"]
  difficulty: 2
- id: POPA-W005
  kind: mcq
  elements: ["POPA 2.4.2"]
  stem: "Refer to Fig 3 (maximum permitted crosswind 15 kt). Runway 32. Which reported wind exceeds the chart's crosswind limit?"
  options:
    - "020 degrees at 20 kt"
    - "350 degrees at 25 kt"
    - "290 degrees at 20 kt"
    - "320 degrees at 30 kt"
  answer: 0
  workbook_page: 5
  explanation: "Crosswind = wind speed × sin(angle off the runway). 020 is 60 degrees off 320: 20 × 0.87 = 17 kt, over 15. 350 at 25 kt: 30 degrees, 12.5 kt. 290 at 20 kt: 30 degrees, 10 kt. 320 at 30 kt: straight down the runway, no crosswind."
  references: ["POPA 2.4", "Workbook p5"]
  difficulty: 2
