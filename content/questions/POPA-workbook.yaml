  kind: mcq
  elements: ["POPA 2.4.2"]
  stem: "Refer to the landing distance chart, Fig 4. How does the landing weight affect the landing distance required from this chart?"
  options:
    - "It does not: the chart says the distance is independent of landing weight"
    - "Each 100 kg adds about 50 m"
    - "Enter the weight first, before the temperature"
    - "Weight is applied in the slope panel"
  answer: 0
  workbook_page: 6
  explanation: "The note on Fig 4: landing distance required is independent of landing weight. Weight still matters for the climb limit: the scale at the bottom left caps the landing weight for the pressure height."
