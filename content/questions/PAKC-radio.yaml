  elements: ["PAKC 3.10.2"]
  stem: "Which is a limitation of VHF communications?"
  options: ["Severe static from sunspots", "A skip zone near the transmitter", "Range limited by line of sight, height and terrain", "Large antennas are required"]
  answer: 2
  explanation: "VHF is clear and low-noise but limited to line of sight; at low level or behind hills contact is lost. Skip zones, sunspot disturbance and long antennas are HF/MF features."
