    - "During a steady turn, when the compass is steadiest."
    - "Only after the gyro has toppled."
  answer: 1
  explanation: "Bearing friction and the Earth's rotation make the DI drift. The magnetic compass suffers turning and acceleration errors, so the reset is done in steady straight and level flight."
