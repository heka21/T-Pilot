- id: BAKC-E046
  kind: mcq
  elements: ["BAKC 3.5.3"]
  stem: "With the pitot tube and its drain hole both blocked by ice, the airspeed indicator will:"
  options:
    - "Read zero."
    - "Behave like an altimeter: over-read in a climb and under-read in a descent."
    - "Be unaffected."
    - "Read the true airspeed."
  answer: 1
  explanation: "The trapped pitot pressure stays constant while the static pressure changes with height, so the indicated difference, and so the airspeed shown, rises in a climb and falls in a descent."
  references: ["BAKC 3.5"]
  difficulty: 3
- id: BAKC-E047
