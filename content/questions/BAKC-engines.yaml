  difficulty: 1
- id: BAKC-E045
  kind: mcq
  elements: ["BAKC 3.5.3"]
  stem: "If the static vent becomes completely blocked in cruise, the effect is:"
  options:
    - "Only the airspeed indicator is affected."
    - "The altimeter freezes at the blockage altitude, the VSI reads zero, and the ASI under-reads in a climb and over-reads in a descent."
    - "The altimeter reads zero and the ASI reads correctly."
    - "The VSI shows a continuous climb."
  answer: 1
  explanation: "All three pressure instruments use static pressure. With it trapped, the altimeter and VSI stop responding and the ASI compares pitot pressure with a wrong static reference."
