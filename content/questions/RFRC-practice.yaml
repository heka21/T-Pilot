    - "7600"
    - "2000"
  answer: 2
  explanation: "ERSA EMERG lists 7600 for radio failure, 7700 for emergency and 7500 for unlawful interference, along with the radio failure procedures to follow."
  references: ["RFRC 2.7", "ERSA EMERG"]
