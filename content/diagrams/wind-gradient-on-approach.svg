<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="wga">
<title>Descending through a wind gradient</title>
<desc>Left: the wind gradient. Friction slows the wind close to the ground, so the headwind is strongest a few hundred feet up and weakest at the surface. Right: an aeroplane on final into a strong headwind. As it descends the headwind decreases, the airspeed decays, the rate of descent increases and the aeroplane sinks below the intended approach path and undershoots unless the pilot adds power.</desc>
