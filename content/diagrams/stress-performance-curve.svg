<text x="529" y="180.39" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">anxiety, tunnelling,</text><text x="529" y="195.99" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">poor memory,</text><text x="529" y="211.59" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">panic</text>
