<text x="320" y="344" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Manage stress: plan and prepare thoroughly, don't fly preoccupied, slow your breathing,</text>
<text x="320" y="362" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">keep fit, sleep and eat well, talk problems through.</text>
