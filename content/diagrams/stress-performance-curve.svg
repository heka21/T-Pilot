<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="spc">
<title>Arousal and performance: the inverted U</title>
<desc>Performance against arousal follows an inverted U (the Yerkes-Dodson curve): too little arousal gives boredom and inattention, a moderate level gives the best performance, too much gives anxiety, narrowed attention, poor memory and panic.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
