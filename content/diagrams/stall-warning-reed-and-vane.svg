<text x="490" y="30" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Vane (electric)</text>
<text x="490" y="48" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">needs the master switch ON</text>
