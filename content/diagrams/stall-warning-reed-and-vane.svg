<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" data-prefix="swr">
<title>How the reed and vane stall warnings sense the stall</title>
<desc>Leading edge of a wing at a normal angle of attack and near the critical angle. As the angle increases the stagnation point, where the oncoming air stops against the wing, moves down and back under the leading edge and fast, low-pressure air whips round the nose. Reed type: the suction over the opening draws air through a reed horn in the cabin, no electrical power needed. Vane type: the vane is pushed up by air flowing forward round the leading edge, closing a microswitch that sounds a horn or lights a light; it needs the master switch on.</desc>
