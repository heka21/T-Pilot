<title>Where the ETP sits, and where the PNR sits</title>
<desc>Three copies of the note's 180 nm leg flown at 110 kt TAS. In still air the equi-time point is at the 90 nm midpoint. With a 20 kt headwind outbound (groundspeed on 90 kt, home 130 kt) it moves 16 nm towards the destination, to 106 nm, where both ways take about 49 minutes. With a 20 kt tailwind outbound (on 130 kt, home 90 kt) it moves 16 nm back towards departure, to 74 nm. Below, the note's Jandakot to Kalgoorlie leg of 295 nm with a 25 kt headwind: ETP 181 nm, and the point of no return, which depends on fuel, at 213 nm.</desc>
