<title>The three gyro instruments</title>
<desc>Attitude indicator: gyro spinning about a vertical axis, rigid in space, normally vacuum driven. Directional indicator: gyro spinning about a horizontal axis, rigid in azimuth, no magnetic sense, reset to the compass about every 10 to 15 minutes, normally vacuum driven. Turn coordinator: gyro that precesses when the aeroplane yaws and rolls, shows rate of turn, with a ball showing balance, normally electric.</desc>
