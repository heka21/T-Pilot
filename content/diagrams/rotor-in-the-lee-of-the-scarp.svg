<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 406" role="img" data-prefix="mts">
<title>Mechanical turbulence in the lee of hills and buildings</title>
<desc>West-east cross-section near Perth in a strong easterly wind. The wind flows across the plateau, over the edge of the Darling Scarp and down onto the coastal plain, where it rolls into a rotor of tumbling, turbulent air on the lee (western) side of the scarp. On a smaller scale the same happens downwind of a hangar, buildings and trees.</desc>
