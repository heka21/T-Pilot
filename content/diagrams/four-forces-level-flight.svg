<text x="330" y="88" font-size="12" fill="var(--color-brand)">through the CP, at right angles to the airflow</text>
<line x1="300" y1="200" x2="300" y2="330" stroke="var(--color-info)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="288" y="316" font-size="15" text-anchor="end" fill="var(--color-info)" font-weight="700">Weight</text>
<text x="288" y="332" font-size="12" text-anchor="end" fill="var(--color-info)">through the CG, vertically down</text>
<circle cx="300" cy="200" r="5" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2"/>
<text x="290" y="234" font-size="12" text-anchor="end" fill="var(--color-fg)" font-weight="700">CG</text>
<circle cx="318" cy="190" r="4" fill="var(--color-brand)" stroke="none"/>
