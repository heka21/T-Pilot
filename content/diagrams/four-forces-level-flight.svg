<text x="412" y="344" font-size="13" fill="var(--color-brand-fg)" font-weight="600" class="num">Lift   = Weight</text>
<text x="412" y="364" font-size="13" fill="var(--color-brand-fg)" font-weight="600" class="num">Thrust = Drag</text>
<text x="20" y="32" font-size="12" fill="var(--color-fg-muted)">CP behind CG: lift and weight form a nose-down</text><text x="20" y="47.6" font-size="12" fill="var(--color-fg-muted)">couple; the tailplane balances it.</text>
