<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="ffl">
<title>The four forces in straight and level flight</title>
<desc>Lift up through the centre of pressure, weight down through the centre of gravity, thrust forward along the thrust line and drag rearward. In steady straight and level flight lift equals weight and thrust equals drag. The centre of pressure is behind the centre of gravity, so lift and weight make a nose-down couple that a small tailplane force balances.</desc>
