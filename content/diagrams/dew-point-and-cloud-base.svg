<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="dpb">
<title>Why the cumulus base is about 400 ft per degree of spread</title>
<desc>Chart of height against temperature for a thermal leaving the ground at 24 degrees with a dew point of 16. The rising air cools at 3 degrees per 1,000 ft while its dew point falls only 0.5 degrees per 1,000 ft, so the spread closes at 2.5 degrees per 1,000 ft, 400 ft per degree. The two lines meet at about 3,200 ft, 14.4 degrees, where the air saturates: the cumulus base.</desc>
