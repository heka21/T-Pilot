<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="tuc">
<title>Time of useful consciousness shrinks with altitude</title>
<desc>Time of useful consciousness for a seated, resting person: 20 to 30 minutes at 18,000 feet, 5 to 10 minutes at 22,000, 3 to 5 minutes at 25,000, 1 to 2 minutes at 30,000, 30 to 60 seconds at 35,000 and 15 to 20 seconds at 40,000 feet. Exercise, smoking, fatigue and a rapid decompression shorten it; rapid decompression roughly halves it.</desc>
