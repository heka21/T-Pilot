<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="wtv">
<title>Wake turbulence: wing-tip vortices</title>
<desc>Seen from behind, a heavy aeroplane trails two counter-rotating vortices from its wing tips, the left one rotating clockwise and the right one anticlockwise, with downwash between them and upwash outside. They sink at about 500 feet per minute and drift with the wind. A light aeroplane entering a vortex is rolled, often faster than its ailerons can counter.</desc>
<style>.wtv-cw{animation:wtv-cw 3s linear infinite}
@keyframes wtv-cw{to{transform:rotate(360deg)}}
.wtv-ccw{animation:wtv-ccw 3s linear infinite}
@keyframes wtv-ccw{to{transform:rotate(-360deg)}}
.wtv-roll{animation:wtv-roll 6s ease-in-out infinite}
@keyframes wtv-roll{0%,15%{transform:rotate(0deg)}55%,70%{transform:rotate(-42deg)}100%{transform:rotate(0deg)}}
.wtv-flow{stroke-dasharray:6 8;animation:wtv-flow 1.2s linear infinite}
@keyframes wtv-flow{to{stroke-dashoffset:-28}}
.wtv-sink{animation:wtv-sink 6s linear infinite}
@keyframes wtv-sink{0%{transform:translateY(0);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateY(90px);opacity:0}}</style>
