<title>One CTAF broadcast, eight items in a fixed order</title>
<desc>The inbound call from the lesson, Northam traffic, Cessna 172 Alpha Bravo Charlie, 10 miles south, 2,500, inbound, estimate circuit at 25, Northam, split into its eight items: location, traffic, type, call-sign, position, level, intentions, location. Each item has a reason beside it. The aerodrome name is said first and last because many aerodromes share one frequency, often 126.7, and a pilot who tunes in late still hears the last word.</desc>
