<!-- generated by tools/diagrams/sketch.mjs from tools/diagrams/schematics/pitot-static-system.svg; edit the schematic, not this file -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="pss">
<title>The pitot-static system</title>
<desc>The pitot tube faces the airflow and senses pitot (total) pressure; it feeds only the airspeed indicator. The static vent on the side of the fuselage senses static (ambient) pressure and feeds all three pressure instruments: the airspeed indicator, the altimeter and the vertical speed indicator. The airspeed indicator measures the difference between pitot and static pressure. An alternate static source inside the cockpit can replace a blocked static vent.</desc>
