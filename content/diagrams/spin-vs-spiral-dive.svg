<title>Spin or spiral dive?</title>
<desc>Side-by-side comparison. Spin: both wings stalled, airspeed low and roughly steady, rate of descent high; recover with throttle closed, ailerons neutral, full opposite rudder, control column forward until the rotation stops, then centralise the rudder and ease out. Spiral dive: wings not stalled, airspeed high and increasing, rate of descent very high; recover with throttle closed, roll level with aileron and coordinated rudder, ease out gently, then restore power.</desc>
