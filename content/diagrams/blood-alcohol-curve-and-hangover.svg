<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="bac">
<title>Blood alcohol and the hangover after a heavy night</title>
<desc>The wedding example from the note: ten standard drinks, the last at midnight. Blood alcohol rises while drinking and for 30 to 90 minutes after the last drink, while the drinks are absorbed, then falls at a fixed rate of about one standard drink an hour, reaching about zero around 1000. The 8-hour rule expires at 0800 with alcohol still in the blood. The hangover starts as blood alcohol falls and continues after it reaches zero, for 24 hours or more after heavy drinking. The curve's height is illustrative.</desc>
