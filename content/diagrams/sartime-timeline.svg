<text x="90" y="130" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Nominate</text>
<text x="90" y="176" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">flight plan, NAIPS form,</text><text x="90" y="190.95" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">or phone or radio to</text><text x="90" y="205.9" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">Flight Information</text>
<circle cx="210" cy="150" r="6" fill="var(--color-fg)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="210" y="130" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Depart</text>

<circle cx="340" cy="150" r="8" fill="var(--color-ok)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="340" y="130" font-size="14" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="700">Planned arrival</text>
<text x="340" y="176" font-size="11.5" text-anchor="middle" fill="var(--color-ok-fg)">land: cancel at once</text>
<circle cx="480" cy="150" r="8" fill="var(--color-bad)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="480" y="130" font-size="14" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">SARTIME</text>
<text x="480" y="176" font-size="11.5" text-anchor="middle" fill="var(--color-bad-fg)">not cancelled or</text><text x="480" y="190.95" font-size="11.5" text-anchor="middle" fill="var(--color-bad-fg)">amended by now?</text>
