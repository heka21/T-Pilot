<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" data-prefix="sar">
<title>How a SARTIME works</title>
<desc>A timeline. Before flight you nominate a SARTIME in UTC, by flight plan, the NAIPS SARTIME form, or phone or radio to Flight Information, with a sensible margin after your planned arrival. If delayed, extend it by radio or phone before it expires. On landing, cancel it at once. If it is not cancelled or amended by that time, the search and rescue system begins the alerting phases: attempts to contact you, then a communications search, then a physical search by AMSA's Joint Rescue Coordination Centre.</desc>
