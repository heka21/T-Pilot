<line x1="600" y1="150" x2="618" y2="150" stroke="var(--color-fg-muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="612" y="172" font-size="11" text-anchor="end" fill="var(--color-fg-faint)">time (UTC)</text>
