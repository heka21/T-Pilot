<path d="M186 179 l4 5 l8 -11" stroke="var(--color-ok)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="126" font-size="12" fill="var(--color-fg-muted)">Unwell or injured?</text><text x="30" y="142.8" font-size="12" fill="var(--color-fg-muted)">A head cold means ear</text><text x="30" y="159.6" font-size="12" fill="var(--color-fg-muted)">and sinus block on descent.</text>
