<text x="442" y="288" font-size="12" fill="var(--color-fg-muted)">Eaten and drunk water?</text><text x="442" y="304.8" font-size="12" fill="var(--color-fg-muted)">Skipped meals mean low</text><text x="442" y="321.6" font-size="12" fill="var(--color-fg-muted)">blood sugar.</text>
