<title>IMSAFE: am I fit for this flight?</title>
<desc>Six tiles for the IMSAFE self-check before every flight: Illness, Medication, Stress, Alcohol, Fatigue, Eating and hydration, each with the question to ask. A no to any of them means do not fly; the pilot in command decides.</desc>
