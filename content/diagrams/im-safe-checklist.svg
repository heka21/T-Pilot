<path d="M392 179 l4 5 l8 -11" stroke="var(--color-ok)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="236" y="126" font-size="12" fill="var(--color-fg-muted)">Any medication, even</text><text x="236" y="142.8" font-size="12" fill="var(--color-fg-muted)">over the counter, cleared</text><text x="236" y="159.6" font-size="12" fill="var(--color-fg-muted)">with a DAME?</text>
