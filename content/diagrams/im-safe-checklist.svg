<text x="30" y="288" font-size="12" fill="var(--color-fg-muted)">8 hours bottle to throttle</text><text x="30" y="304.8" font-size="12" fill="var(--color-fg-muted)">is the minimum. A hangover</text><text x="30" y="321.6" font-size="12" fill="var(--color-fg-muted)">still impairs.</text>
