<path d="M598 179 l4 5 l8 -11" stroke="var(--color-ok)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="442" y="126" font-size="12" fill="var(--color-fg-muted)">Anxious, upset or</text><text x="442" y="142.8" font-size="12" fill="var(--color-fg-muted)">preoccupied? It narrows</text><text x="442" y="159.6" font-size="12" fill="var(--color-fg-muted)">attention and decisions.</text>
