<text x="236" y="288" font-size="12" fill="var(--color-fg-muted)">Excessively tired? A tired</text><text x="236" y="304.8" font-size="12" fill="var(--color-fg-muted)">pilot is a poor judge</text><text x="236" y="321.6" font-size="12" fill="var(--color-fg-muted)">of their own fatigue.</text>
