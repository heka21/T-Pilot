<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="rac">
<title>From the air to your cells: two loops</title>
<desc>The diaphragm draws air into the lungs' alveoli. Oxygen diffuses across the thin wall into the blood and carbon dioxide diffuses out. Haemoglobin in the red cells carries the oxygen. The heart is two pumps: the right side pumps oxygen-poor blood through the lungs, the left side pumps oxygen-rich blood through the arteries to the body's tissues, where oxygen leaves the blood and carbon dioxide enters it; the blood returns through the veins.</desc>
