<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="hsz">
<title>The HF skip zone</title>
<desc>An HF transmitter on the left. Its ground wave is heard by an aircraft 30 km away but fades out. Waves sent up too steeply pass through the ionosphere; shallower ones are bent back and return to earth far away, where an aircraft 1,500 km out hears the sky wave. Between the two, an aircraft 150 km away hears nothing: it is in the skip zone, too far for the ground wave and too close for the sky wave. Not to scale.</desc>
