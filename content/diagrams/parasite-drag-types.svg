<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="pdt">
<title>The three parts of parasite drag</title>
<desc>Form drag: a flat plate leaves a large low-pressure wake, a streamlined shape a small one. Skin friction drag: the air touching the skin is brought to rest and the boundary layer above it is sheared; a rough surface thickens it. Interference drag: where the wing meets the fuselage the two flows disturb each other, and a fillet smooths the junction. All three grow with the square of the speed.</desc>
