<rect x="170" y="144" width="96" height="52" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="218" y="168" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Frequency</text>
<text x="218" y="184" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">active window?</text>
