<text x="143" y="72" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="600">so the fault is out here: wrong</text>
<text x="143" y="88" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="600">frequency, range, nobody talking</text>
<path d="M290 282 L290 290 L620 290 L620 282" stroke="var(--color-bad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="455" y="312" font-size="13" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">No hiss: the fault is in here</text>
<text x="455" y="330" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">power, breaker, volume, audio panel, plugs</text>
<rect x="20" y="286" width="246" height="64" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="306" font-size="12" fill="var(--color-fg-muted)">One action halves the search.</text><text x="32" y="321.6" font-size="12" fill="var(--color-fg-muted)">Then try the speaker, a spare</text><text x="32" y="337.2" font-size="12" fill="var(--color-fg-muted)">headset or COM 2.</text>
<text x="20" y="378" font-size="12" fill="var(--color-fg-faint)">Hiss is the noise of an empty channel: proof that the receiver and audio path are alive.</text>
