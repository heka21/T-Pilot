<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" data-prefix="sht">
<title>The hiss test</title>
<desc>The receive chain runs from the other station, through range and terrain and the frequency set in the active window, to the receiver, the audio panel and the headset, with power, the circuit breaker and the volume feeding the radio. Open the squelch. Hiss but no stations: the receiver, audio panel and headset work, so the fault is in front of the radio: the wrong frequency, out of range or behind terrain, or nobody talking. No hiss at all: the fault is between the radio and your ear: power, breaker, volume, audio panel selection or the headset and its plugs.</desc>
