<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" role="img" data-prefix="tlc">
<title>The three stages of a thunderstorm</title>
<desc>Three side views of the same storm cell over time. Cumulus stage, about 15 minutes: a growing towering cumulus with updraughts throughout and no rain at the surface yet. Mature stage, about 15 to 30 minutes, the most dangerous: it begins when rain reaches the ground; updraughts and down-draughts side by side, a cumulonimbus with an anvil, heavy rain, hail, lightning and a gust front spreading out ahead. Dissipating stage: down-draughts throughout, the rain easing and the anvil left behind.</desc>
<style>.tlc-flow{stroke-dasharray:7 6;animation:tlc-flow 1.0s linear infinite}
@keyframes tlc-flow{to{stroke-dashoffset:-26}}</style>
