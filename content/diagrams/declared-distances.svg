<title>Declared distances and the chart figures they are compared with</title>
<desc>Plan view of the note's hypothetical runway, take-off and landing towards the right. The take-off run available, TORA, is 1,100 m of pavement. The clearway beyond the end adds to give the take-off distance available, TODA, 1,250 m; the chart's take-off distance to 50 ft, 1,020 m, fits with 230 m to spare. A stopway beyond the end adds to give the accelerate-stop distance available, ASDA. The threshold is displaced 150 m along the runway, so the landing distance available, LDA, is 950 m; the chart's landing distance of 980 m does not fit, 30 m short.</desc>
