<title>How many satellites each job needs</title>
<desc>A ladder from three to six satellites. Three: a 2D fix only, the receiver assumes a height and is less reliable. Four: a 3D fix, three for position and one for the receiver clock. Five: RAIM fault detection, the receiver can tell that one satellite is faulty and warns you. Six: fault detection and exclusion, it identifies the faulty satellite, leaves it out and keeps navigating.</desc>
