<title>The relative airflow follows the flight path</title>
<desc>Three side views. In level flight the relative airflow comes from straight ahead. In a climb the aeroplane moves up the slope, so the relative airflow comes from ahead and slightly above. In a descent it comes from ahead and slightly below. In every case it is parallel and opposite to the flight path, whatever the horizon or the nose attitude.</desc>
