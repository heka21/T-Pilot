<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" data-prefix="gef">
<title>Ground effect</title>
<desc>Two rear views of the same wing. Out of ground effect, more than a wingspan up, the wing pushes a deep downwash behind it and sheds full-sized tip vortices: induced drag. Within about half a span of the runway the ground blocks the downwash and squashes the vortices, so induced drag falls and the wing makes a little more lift at the same angle of attack. Below, the two consequences: on landing the aeroplane floats, a long way if it arrives fast; on take-off it can lift off early in ground effect, then sink back or refuse to climb as it climbs out of it.</desc>
