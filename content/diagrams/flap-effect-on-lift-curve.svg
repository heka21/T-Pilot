<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="fel">
<title>What flap does to the lift curve</title>
<desc>Lift coefficient against angle of attack with flap up and flap down. With flap down the curve is higher at every angle, the maximum lift coefficient is higher so the stall speed is lower, the same lift comes at a smaller angle of attack so the nose attitude is lower, and the critical angle is slightly lower. Drag also increases.</desc>
