<title>The landing weight can cap the take-off weight</title>
<desc>Aircraft ECHO from the note: MTOW 2,950 kg, MLW 2,725 kg, trip fuel 250 L of avgas at 0.72 kg/L, which is 180 kg. Left, taking off at the MTOW of 2,950 kg lands at 2,770 kg, 45 kg over the MLW. Right, the maximum take-off weight for this trip is the MLW plus the fuel burn, 2,725 + 180 = 2,905 kg, which lands exactly at the MLW.</desc>
