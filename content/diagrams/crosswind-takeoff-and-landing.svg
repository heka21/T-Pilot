<text x="110" y="106" font-size="12" fill="var(--color-bad)" font-weight="600">wind lifts the upwind wing</text>
<rect x="92" y="168" width="16" height="6" fill="var(--color-brand)" stroke="none"/>
<text x="100" y="236" font-size="12" fill="var(--color-brand)" font-weight="600">left aileron UP (stick left)</text>
<line x1="100" y1="176" x2="100" y2="222" stroke="var(--color-brand)" stroke-width="1" stroke-linecap="round"/>
<text x="24" y="284" font-size="12" fill="var(--color-fg)">Full aileron INTO wind at the start</text><text x="24" y="300.8" font-size="12" fill="var(--color-fg)">(stick towards the wind), less as</text><text x="24" y="317.6" font-size="12" fill="var(--color-fg)">speed builds; rudder keeps you straight</text><text x="24" y="334.4" font-size="12" fill="var(--color-fg)">against weathercocking (nose into wind).</text>
<text x="24" y="370" font-size="11" fill="var(--color-fg-muted)">High-wing aeroplanes: stronger lifting</text><text x="24" y="385.4" font-size="11" fill="var(--color-fg-muted)">tendency, the wing is high and exposed.</text>
