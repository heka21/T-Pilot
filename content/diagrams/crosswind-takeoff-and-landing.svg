<text x="340" y="170" font-size="12" fill="var(--color-brand)" font-weight="700">Crab: nose into wind,</text>
<text x="340" y="232" font-size="12" fill="var(--color-fg)">track down the centreline;</text>
<text x="340" y="248" font-size="12" fill="var(--color-fg)">rudder straightens it before touchdown</text>
<g transform="translate(392 318) rotate(-12) scale(0.9)"><path d="M-2 -8 L0 -28 L3 -28 L3 -8 Z" stroke="var(--color-fg)" stroke-width="2" fill="var(--color-surface)" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17 -5 L17 -5 L17 -2 L-17 -2 Z" stroke="var(--color-fg)" stroke-width="2" fill="var(--color-surface)" stroke-linecap="round" stroke-linejoin="round"/><path d="M-50 -1 L-8 3 L-8 7 L-50 3 Z M50 -1 L8 3 L8 7 L50 3 Z" stroke="var(--color-fg)" stroke-width="2" fill="var(--color-surface)" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="0" r="9" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2"/><path d="M-5 -6 L5 -6 L4 -2 L-4 -2 Z" stroke="var(--color-fg)" stroke-width="1" fill="var(--color-surface-2)" stroke-linecap="round" stroke-linejoin="round"/></g>
