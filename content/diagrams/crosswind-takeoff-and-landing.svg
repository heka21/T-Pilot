<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="cwt">
<title>Crosswind take-off and landing</title>
<desc>Left: seen from behind on the take-off roll with the wind from the left, the wind tends to lift the upwind wing and the fin weathercocks the nose into wind; hold full aileron into wind at the start and reduce it as speed builds, and keep straight with rudder. Right: on approach, either crab (heading into wind, tracking down the centreline, straightened with rudder just before touchdown) or wing-down (upwind wing lowered, opposite rudder keeps the nose straight; low-wing aeroplanes have less tip and flap clearance).</desc>
