<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="chc">
<title>What the RPM does during the carburettor heat check</title>
<desc>RPM against time during the run-up. Full carburettor heat makes the RPM drop because hot air is less dense. If ice was present, the RPM then rises while the heat is still on as the ice melts. With heat back to cold the RPM returns to its original value. No drop at all means the heat is not working.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="176" y="70" width="286.2" height="220" fill="var(--color-warn-soft)" stroke="none" fill-opacity="0.6"/>
<text x="319.1" y="84" font-size="13" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700">carburettor heat ON (full)</text>
<line x1="70" y1="290" x2="608" y2="290" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="butt" marker-end="url(#arrow)"/><line x1="70" y1="290" x2="70" y2="62" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="335" y="310" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">time</text>
<text x="56" y="180" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="600" transform="rotate(-90 56 180)">RPM</text>
<line x1="70" y1="136" x2="600" y2="136" stroke="var(--color-fg-faint)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="75.3" y="110" font-size="11" fill="var(--color-fg-muted)">check RPM</text><text x="75.3" y="124.3" font-size="11" fill="var(--color-fg-muted)">(often 1,700 to 1,800)</text>
<path d="M191.9 188.8 L456.9 188.8 L478.1 136" stroke="var(--color-fg-muted)" stroke-width="2" fill="none" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170.7 136 L462.2 136" stroke="var(--color-bad)" stroke-width="2" fill="none" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70 136 L170.7 136 L191.9 188.8 L239.6 193.2 L313.8 171.2 L388 166.8 L456.9 166.8 L478.1 136 L600 136" stroke="var(--color-brand)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="189.25" y1="186.6" x2="213.25" y2="256.6" stroke="var(--color-fg-muted)" stroke-width="1" stroke-linecap="round"/><circle cx="189.25" cy="186.6" r="2.5" fill="var(--color-fg)" stroke="none"/><text x="219.25" y="260.8" font-size="12" fill="var(--color-fg)">1 · RPM drops:</text><text x="219.25" y="276.4" font-size="12" fill="var(--color-fg)">hot air is less dense</text>
<line x1="335" y1="170.1" x2="425" y2="100.1" stroke="var(--color-fg-muted)" stroke-width="1" stroke-linecap="round"/><circle cx="335" cy="170.1" r="2.5" fill="var(--color-brand)" stroke="none"/><text x="431" y="104.3" font-size="12" fill="var(--color-brand)">2 · RPM rises with heat still on:</text><text x="431" y="119.9" font-size="12" fill="var(--color-brand)">ice was there and has melted</text>
<line x1="472.8" y1="140.4" x2="482.8" y2="202.4" stroke="var(--color-fg-muted)" stroke-width="1" stroke-linecap="round"/><circle cx="472.8" cy="140.4" r="2.5" fill="var(--color-fg)" stroke="none"/><text x="488.8" y="206.6" font-size="12" fill="var(--color-fg)">3 · back to cold:</text><text x="488.8" y="222.2" font-size="12" fill="var(--color-fg)">RPM returns to normal</text>
<text x="452.9" y="206.8" font-size="11" text-anchor="end" fill="var(--color-fg-muted)">no ice: stays down</text>
<text x="207.8" y="128" font-size="11" fill="var(--color-bad)" font-weight="600">no drop: heat not working</text>
<text x="330" y="30" font-size="15" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Heat on: expect a drop. A rise while still on means ice.</text>
<text x="330" y="362" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">Carburettor heat air is unfiltered: use it on the ground only for this check, and select cold before take-off.</text>
