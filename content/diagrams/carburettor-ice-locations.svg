<!-- generated by tools/diagrams/sketch.mjs from tools/diagrams/schematics/carburettor-ice-locations.svg; edit the schematic, not this file -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="cil">
<title>Where carburettor ice forms</title>
<desc>The same updraft carburettor showing the three kinds of engine ice. Impact ice forms on the air intake and filter in visible moisture at or below freezing. Fuel evaporation ice forms in the venturi and downstream of the fuel nozzle, where evaporating fuel takes heat from the air. Throttle ice forms on and behind the partly closed throttle butterfly, where the pressure drop is largest; it is the most common and most dangerous. The pressure drop and fuel evaporation together can cool the air by 20 to 30 degrees, so ice forms in air well above freezing. Carburettor heat brings hot air from a muff around the exhaust.</desc>
