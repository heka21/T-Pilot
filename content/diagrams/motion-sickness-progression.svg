<title>How motion sickness progresses</title>
<desc>Six stages in order: loss of interest and a vague unease, going quiet; yawning and increased saliva; pallor; cold sweating; nausea; vomiting. Performance falls well before vomiting: concentration and motivation drop in the first stages, so the early signs are the time to act.</desc>
