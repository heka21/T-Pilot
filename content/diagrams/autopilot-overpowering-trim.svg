<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" data-prefix="apt">
<title>Fighting an auto-trim autopilot</title>
<desc>Three traces against time. The autopilot holds altitude. The pilot pulls back on the control column against the servo, and the auto-trim runs nose-down to relieve the servo load. The pilot pulls harder and the trim runs further. Pitch hardly changes while the servo holds. At disconnect the full nose-down trim and the pilot's pull are suddenly unopposed by the servo and the aeroplane pitches sharply, possibly towards the ground.</desc>
