<title>Helicopter landing site markings</title>
<desc>Three helicopter landing sites seen from above: a letter H inside a circle, inside a square and inside a triangle, on the touchdown and lift-off area, with a lit or painted perimeter. Below, what an H tells an aeroplane pilot: keep clear, because downwash can overturn a light aeroplane taxiing nearby; helicopters arrive and depart steeply and from directions unrelated to the runway in use; and pads may be away from the runways, at a hospital, a mine site or a station.</desc>
