<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" data-prefix="ddf">
<title>How a dust devil forms</title>
<desc>Three stages over a bare paddock on a hot afternoon with little wind. One: the ground heats a thin layer of air far above the air just above it, a very unstable layer. Two: the layer breaks away at one point and air rushes in along the ground from all sides. Three: any slight rotation in the inflow is concentrated as the air converges, like a skater pulling her arms in, and a narrow, fast-spinning column of rising air picks up dust, with sharp changes of wind speed and direction around it.</desc>
<style>.ddf-spin{animation:ddf-spin 2s linear infinite}
@keyframes ddf-spin{to{stroke-dashoffset:-28}}</style>
