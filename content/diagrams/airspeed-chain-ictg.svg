<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" role="img" data-prefix="ict">
<title>From indicated airspeed to groundspeed</title>
<desc>Four speeds in order: indicated airspeed is corrected for instrument and position error to calibrated airspeed, for air density to true airspeed, and for wind to groundspeed. Example: at 8000 ft an IAS of 100 kt is about 116 kt TAS; TAS 105 kt into a 20 kt headwind gives 85 kt groundspeed.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="26" y="84" width="124" height="92" rx="12" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<text x="88" y="120" font-size="26" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="700">IAS</text>
<text x="88" y="142" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="600">indicated</text>
<text x="88" y="162" font-size="11" text-anchor="middle" fill="var(--color-brand-fg)">what the ASI shows</text>
<rect x="186" y="84" width="124" height="92" rx="12" fill="var(--color-surface-2)" stroke="none"/>
<text x="248" y="120" font-size="26" text-anchor="middle" fill="var(--color-fg)" font-weight="700">CAS</text>
<text x="248" y="142" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="600">calibrated</text>
<text x="248" y="162" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">IAS + POH correction</text>
<rect x="346" y="84" width="124" height="92" rx="12" fill="var(--color-surface-2)" stroke="none"/>
<text x="408" y="120" font-size="26" text-anchor="middle" fill="var(--color-fg)" font-weight="700">TAS</text>
<text x="408" y="142" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="600">true</text>
<text x="408" y="162" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">speed through the air</text>
<rect x="506" y="84" width="124" height="92" rx="12" fill="var(--color-surface-2)" stroke="none"/>
<text x="568" y="120" font-size="26" text-anchor="middle" fill="var(--color-fg)" font-weight="700">GS</text>
<text x="568" y="142" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="600">ground</text>
<text x="568" y="162" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">speed over the ground</text>
<line x1="154" y1="130" x2="182" y2="130" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="170" y="62" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">instrument +</text>
<text x="170" y="76" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">position error</text>
<line x1="314" y1="130" x2="342" y2="130" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="330" y="62" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">density:</text>
<text x="330" y="76" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">height, temp</text>
<line x1="474" y1="130" x2="502" y2="130" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="490" y="62" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">wind</text>
<text x="20" y="34" font-size="15" fill="var(--color-fg)" font-weight="700">Always in this order: I · C · T · G</text>
<rect x="20" y="206" width="292" height="112" rx="10" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1"/>
<text x="34" y="230" font-size="13" fill="var(--color-fg)" font-weight="700">Thinner air: TAS &gt; IAS</text>
<text x="34" y="250" font-size="12" fill="var(--color-fg-muted)">about 2% per 1000 ft of altitude</text>
<text x="34" y="276" font-size="13" fill="var(--color-fg)" class="num">8000 ft: IAS 100 kt</text>
<text x="34" y="296" font-size="13" fill="var(--color-brand)" font-weight="700" class="num">≈ TAS 116 kt</text>
<rect x="328" y="206" width="292" height="112" rx="10" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1"/>
<text x="342" y="230" font-size="13" fill="var(--color-fg)" font-weight="700">Wind: GS ≠ TAS</text>
<text x="342" y="250" font-size="12" fill="var(--color-fg-muted)">headwind subtracts, tailwind adds</text>
<text x="342" y="276" font-size="13" fill="var(--color-fg)" class="num">TAS 105 kt, 20 kt headwind</text>
<text x="342" y="296" font-size="13" fill="var(--color-brand)" font-weight="700" class="num">GS = 105 − 20 = 85 kt</text>
<text x="320" y="338" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">The aeroplane flies (stalls, rotates, has its limits) on IAS; navigation and fuel use TAS and GS.</text>
</svg>
