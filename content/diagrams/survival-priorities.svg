<title>After a forced landing: survival priorities</title>
<desc>Priorities in order: protection (first aid, shelter), location (help rescuers find you), water, then food. Stay with the aircraft: it is easier to see than a person, gives shade, and the search follows your notified route. Activate the ELT or PLB, try 121.5 MHz, and lay out ground-to-air signals: V require assistance, X require medical assistance, N no, Y yes, an arrow for proceeding in this direction.</desc>
