<text x="66" y="198" font-size="14" fill="var(--color-info-fg)" font-weight="700">Water</text>
<text x="66" y="216" font-size="11" fill="var(--color-info-fg)">cut sweat loss; rest in shade</text>
<rect x="16" y="238" width="216" height="54" rx="10" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<circle cx="42" cy="265" r="15" fill="var(--color-fg-muted)" stroke="none"/>
