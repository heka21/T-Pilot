<text x="306" y="98" font-size="11" fill="var(--color-fg)">easier to see from the air than a person;</text><text x="306" y="112.3" font-size="11" fill="var(--color-fg)">gives shade; the search follows your</text><text x="306" y="126.6" font-size="11" fill="var(--color-fg)">notified route (SARTIME or flight plan)</text>
