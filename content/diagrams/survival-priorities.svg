<text x="76" y="380" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">require</text><text x="76" y="394.3" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">assistance</text>
<rect x="182" y="332" width="32" height="32" rx="6" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="198" y="355" font-size="18" text-anchor="middle" fill="var(--color-bad)" font-weight="800">X</text>
<text x="198" y="380" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">require medical</text><text x="198" y="394.3" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">assistance</text>
<rect x="304" y="332" width="32" height="32" rx="6" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="320" y="355" font-size="18" text-anchor="middle" fill="var(--color-bad)" font-weight="800">N</text>
<text x="320" y="380" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">no</text>
