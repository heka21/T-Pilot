<text x="320" y="421" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="600">Don't walk away from the aircraft. Don't ration water to the point of dehydration:</text>
<text x="320" y="438" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">drink what you need and reduce sweat loss. No alcohol, urine or seawater.</text>
