<text x="66" y="134" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Location</text>
<text x="66" y="152" font-size="11" fill="var(--color-brand-fg)">ELT/PLB on, radio, signals</text>
<rect x="16" y="174" width="230" height="54" rx="10" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1.25"/>
