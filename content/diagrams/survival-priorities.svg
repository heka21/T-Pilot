<text x="330" y="164" font-size="11" fill="var(--color-fg-muted)">smoke by day,</text>
<text x="330" y="177" font-size="11" fill="var(--color-fg-muted)">flame by night</text>
<text x="16" y="320" font-size="13" fill="var(--color-fg)" font-weight="700">Ground-to-air signals (see ERSA): make them large and contrasting</text>
