<text x="624" y="140" font-size="12" text-anchor="end" fill="var(--color-sky-fg)" font-weight="600">free-stream relative airflow</text>
<line x1="580" y1="196" x2="474.26" y2="226.32" stroke="var(--color-info)" stroke-width="1.25" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#arrow)"/>
