<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="idd">
<title>How downwash creates induced drag</title>
<desc>A wing section flying to the right. The free-stream relative airflow comes from straight ahead, but the downwash from the wing-tip vortices makes the air at the wing move slightly down, so the effective airflow is tilted. Lift acts at right angles to that tilted airflow, so the lift vector leans backwards. Its rearward part is induced drag. Inset: seen from behind, the tip vortices push the air between them down. Angles are exaggerated.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="30" font-size="15" fill="var(--color-fg)" font-weight="700">Downwash tilts the lift vector back: the backward part is induced drag</text>
