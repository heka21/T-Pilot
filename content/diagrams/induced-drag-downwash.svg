<text x="624" y="300" font-size="12" text-anchor="end" fill="var(--color-info)" font-weight="600">effective airflow at the wing,</text><text x="624" y="315.6" font-size="12" text-anchor="end" fill="var(--color-info)" font-weight="600">tilted down by the downwash</text>
