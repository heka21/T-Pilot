<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" role="img" data-prefix="aac">
<title>Is that airspace active? The pre-flight check</title>
<desc>Four steps in order: read the chart (VTC, VNC, ERC-L) for the boundaries and limits; read ERSA, its PRD section and AIP ENR 5.1, for the hours of activity (H24, HJ, specified UTC times, or by NOTAM) and the controlling authority; check the NOTAMs for activations, changes and temporary restricted areas; if in doubt, call the controlling authority or ATC. An active restricted area needs a clearance; without one, stay out.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="20" y="20" width="600" height="54" rx="10" fill="var(--color-sky-soft)" stroke="var(--color-sky-fg)" stroke-width="1.25"/>
<circle cx="44" cy="47" r="13" fill="var(--color-sky-fg)" stroke="none"/>
<text x="44" y="52" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">1</text>
<text x="66" y="43" font-size="15" fill="var(--color-sky-fg)" font-weight="700">Chart</text>
<text x="66" y="61" font-size="11" fill="var(--color-sky-fg)" font-weight="600">VTC · VNC · ERC-L</text>
<line x1="238" y1="30" x2="238" y2="64" stroke="var(--color-sky-fg)" stroke-width="1" stroke-linecap="round"/>
<text x="252" y="43" font-size="12" fill="var(--color-sky-fg)">lateral boundaries and vertical limits, e.g. C LL 4500</text><text x="252" y="59.8" font-size="12" fill="var(--color-sky-fg)">(the WAC shows no airspace)</text>
<rect x="20" y="82" width="600" height="54" rx="10" fill="var(--color-sky-soft)" stroke="var(--color-sky-fg)" stroke-width="1.25"/>
<circle cx="44" cy="109" r="13" fill="var(--color-sky-fg)" stroke="none"/>
<text x="44" y="114" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">2</text>
<text x="66" y="105" font-size="15" fill="var(--color-sky-fg)" font-weight="700">ERSA</text>
<text x="66" y="123" font-size="11" fill="var(--color-sky-fg)" font-weight="600">PRD section · AIP ENR 5.1</text>
<line x1="238" y1="92" x2="238" y2="126" stroke="var(--color-sky-fg)" stroke-width="1" stroke-linecap="round"/>
<text x="252" y="105" font-size="12" fill="var(--color-sky-fg)">hours of activity: H24, HJ, UTC times, or by NOTAM;</text><text x="252" y="121.8" font-size="12" fill="var(--color-sky-fg)">the controlling authority; tower hours</text>
<rect x="20" y="144" width="600" height="54" rx="10" fill="var(--color-sky-soft)" stroke="var(--color-sky-fg)" stroke-width="1.25"/>
<circle cx="44" cy="171" r="13" fill="var(--color-sky-fg)" stroke="none"/>
<text x="44" y="176" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">3</text>
<text x="66" y="167" font-size="15" fill="var(--color-sky-fg)" font-weight="700">NOTAM</text>
<text x="66" y="185" font-size="11" fill="var(--color-sky-fg)" font-weight="600">today's changes</text>
<line x1="238" y1="154" x2="238" y2="188" stroke="var(--color-sky-fg)" stroke-width="1" stroke-linecap="round"/>
<text x="252" y="167" font-size="12" fill="var(--color-sky-fg)">can activate, deactivate or change an area; temporary</text><text x="252" y="183.8" font-size="12" fill="var(--color-sky-fg)">restricted areas for bushfires, air shows, VIPs</text>
<rect x="20" y="206" width="600" height="54" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<circle cx="44" cy="233" r="13" fill="var(--color-brand)" stroke="none"/>
<text x="44" y="238" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">4</text>
<text x="66" y="229" font-size="15" fill="var(--color-brand-fg)" font-weight="700">Still unsure?</text>
<text x="66" y="247" font-size="11" fill="var(--color-brand-fg)" font-weight="600">ask</text>
<line x1="238" y1="216" x2="238" y2="250" stroke="var(--color-brand)" stroke-width="1" stroke-linecap="round"/>
<text x="252" y="229" font-size="12" fill="var(--color-brand-fg)">call the controlling authority or ATC</text><text x="252" y="245.8" font-size="12" fill="var(--color-brand-fg)">on the published frequency</text>
<line x1="320" y1="270" x2="320" y2="294" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="20" y="300" width="296" height="104" rx="10" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<text x="36" y="326" font-size="15" fill="var(--color-bad-fg)" font-weight="700">Restricted area active?</text>
<text x="36" y="348" font-size="12" fill="var(--color-bad-fg)">You need the controlling authority's</text><text x="36" y="364.8" font-size="12" fill="var(--color-bad-fg)">clearance to enter, as for controlled</text><text x="36" y="381.6" font-size="12" fill="var(--color-bad-fg)">airspace. No clearance: stay out.</text>
<rect x="324" y="300" width="296" height="104" rx="10" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<text x="340" y="326" font-size="15" fill="var(--color-ok-fg)" font-weight="700">Tower closed?</text>
<text x="340" y="348" font-size="12" fill="var(--color-ok-fg)">Outside its ERSA hours a Class D</text><text x="340" y="364.8" font-size="12" fill="var(--color-ok-fg)">zone reverts to Class G (or E above)</text><text x="340" y="381.6" font-size="12" fill="var(--color-ok-fg)">and the aerodrome becomes CTAF.</text>
<text x="320" y="430" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">Military zones and areas (e.g. RAAF Pearce): active at the published hours and otherwise as notified.</text>
</svg>
