<title>Trading speed for height in a zoom</title>
<desc>An aeroplane at 100 knots raises the nose without adding power and zooms to 60 knots. Ignoring drag, the kinetic energy it loses becomes potential energy: about 280 ft of height. The energy bars show the total staying the same while the share changes.</desc>
