<title>From tints, spot heights and obstacles to a cruising height</title>
<desc>Side view along a leg. The terrain rises into the highest tint band, whose upper limit is 2,000 ft. A hilltop spot height of 2,140 ft stands above the band, and an obstacle a mile off track is marked 2,310 (290): its top is 2,310 ft above mean sea level and it is 290 ft above the ground. The highest point is the obstacle, so the rule-of-thumb minimum cruising height is 2,310 plus 1,000, which is 3,310 ft; then choose the next suitable VFR level above it.</desc>
