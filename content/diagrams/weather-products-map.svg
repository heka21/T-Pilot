<title>Which weather product answers which question</title>
<desc>A grid of the products in this lesson. Rows: forecasts, what to expect; observations, what is happening; broadcasts, an observation delivered by radio. Columns: area, aerodrome and warnings. Area forecasts: GAF, GPWT and area QNH. Aerodrome forecast: TAF. Warnings: SIGMET and AIRMET, issued only when there is a hazard. Aerodrome observations: METAR and SPECI. Broadcasts at the aerodrome: ATIS at a controlled aerodrome and AWIS at some non-towered ones.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
