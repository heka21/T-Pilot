<!-- generated by tools/diagrams/sketch.mjs from tools/diagrams/schematics/carburettor-cross-section.svg; edit the schematic, not this file -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="ccs">
<title>Inside a float-type carburettor</title>
<desc>An updraft float carburettor in cross-section. Air enters at the bottom and speeds up through the venturi, where its pressure drops. Fuel from the tank fills the float chamber, where a float and needle valve hold a constant level. The low pressure in the venturi draws fuel from the float chamber through the main jet and out of the discharge nozzle, where it atomises into the airflow. The mixture control meters the fuel reaching the jet; the throttle butterfly above the venturi controls how much mixture goes to the cylinders.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
