<text x="436" y="40" font-size="12" fill="var(--color-fg)" font-weight="600">mixture to the cylinders</text>
<text x="436" y="56" font-size="11" fill="var(--color-fg-muted)">(intake manifold)</text>
<!-- venturi annotation -->
<text x="436" y="226" font-size="13" fill="var(--color-brand)" font-weight="700">Venturi</text>
<text x="436" y="243" font-size="11" fill="var(--color-fg-muted)">air speeds up, pressure drops,</text>
<text x="436" y="257" font-size="11" fill="var(--color-fg-muted)">fuel is drawn out of the nozzle</text>
