<title>Load factor and stall speed against angle of bank</title>
<desc>In a level turn the load factor is 1 over the cosine of the bank angle and the stall speed rises with its square root: 1.41 g and 19 percent at 45 degrees, 2 g and 41 percent at 60 degrees, 3.86 g and 97 percent at 75 degrees.</desc>
