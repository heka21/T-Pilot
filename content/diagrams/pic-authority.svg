<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" data-prefix="pic">
<title>The pilot in command's powers, and their limits</title>
<desc>Responsibility for the safety of the aircraft and everyone on board comes with final authority over its operation (CASR Part 91). The powers: give safety directions, which passengers and crew must obey; refuse to carry or disembark a person whose behaviour endangers safety; take reasonable measures, including restraint, against a person committing or about to commit an offence that threatens safety, protected when done in good faith by the Crimes (Aviation) Act 1991 and the Tokyo Convention; refuse unsafe cargo or baggage, including dangerous goods not permitted; and depart from a rule or ATC clearance in an emergency, only as far as necessary for safety, reporting it afterwards.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="20" y="16" width="280" height="66" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/><text x="32" y="39.9" font-size="14" fill="var(--color-fg)" font-weight="700">Responsibility</text><text x="32" y="59.5" font-size="12" fill="var(--color-fg-muted)">for the safety of the aircraft</text><text x="32" y="75.7" font-size="12" fill="var(--color-fg-muted)">and everyone on board</text>
<rect x="340" y="16" width="280" height="66" rx="8" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/><text x="352" y="39.9" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Final authority</text><text x="352" y="59.5" font-size="12" fill="var(--color-brand-fg)">over the operation of the aircraft</text><text x="352" y="75.7" font-size="12" fill="var(--color-brand-fg)">(CASR Part 91)</text>
<line x1="306" y1="49" x2="334" y2="49" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="320" y="100" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">come together</text>
<text x="32" y="132" font-size="13" fill="var(--color-fg)" font-weight="700">You may</text>
<text x="340" y="132" font-size="13" fill="var(--color-fg)" font-weight="700">Within this limit</text>
<rect x="20" y="142" width="600" height="50" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="163" font-size="12.5" fill="var(--color-fg)" font-weight="600">Give safety directions to</text><text x="32" y="179.25" font-size="12.5" fill="var(--color-fg)" font-weight="600">passengers and crew</text>
<line x1="306" y1="167" x2="330" y2="167" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="163" font-size="12" fill="var(--color-fg-muted)">they must comply: failing to</text><text x="340" y="178.6" font-size="12" fill="var(--color-fg-muted)">is an offence</text>
<rect x="20" y="198" width="600" height="50" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="219" font-size="12.5" fill="var(--color-fg)" font-weight="600">Refuse to carry, or disembark,</text><text x="32" y="235.25" font-size="12.5" fill="var(--color-fg)" font-weight="600">a person who endangers safety</text>
<line x1="306" y1="223" x2="330" y2="223" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="228" font-size="12" fill="var(--color-fg-muted)">e.g. intoxicated or disruptive</text>
<rect x="20" y="254" width="600" height="50" rx="8" fill="var(--color-warn-soft)" stroke="none"/>
<text x="32" y="275" font-size="12.5" fill="var(--color-fg)" font-weight="600">Restrain a person committing an</text><text x="32" y="291.25" font-size="12.5" fill="var(--color-fg)" font-weight="600">offence that threatens safety</text>
<line x1="306" y1="279" x2="330" y2="279" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="275" font-size="12" fill="var(--color-warn-fg)">reasonable measures, in good faith</text><text x="340" y="290.6" font-size="12" fill="var(--color-warn-fg)">(Crimes (Aviation) Act 1991, Tokyo Conv.)</text>
<rect x="20" y="310" width="600" height="50" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="340" font-size="12.5" fill="var(--color-fg)" font-weight="600">Refuse unsafe cargo or baggage</text>
<line x1="306" y1="335" x2="330" y2="335" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="331" font-size="12" fill="var(--color-fg-muted)">including dangerous goods</text><text x="340" y="346.6" font-size="12" fill="var(--color-fg-muted)">not permitted for carriage</text>
<rect x="20" y="366" width="600" height="50" rx="8" fill="var(--color-warn-soft)" stroke="none"/>
<text x="32" y="387" font-size="12.5" fill="var(--color-fg)" font-weight="600">Depart from a rule or ATC</text><text x="32" y="403.25" font-size="12.5" fill="var(--color-fg)" font-weight="600">clearance in an emergency</text>
<line x1="306" y1="391" x2="330" y2="391" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="387" font-size="12" fill="var(--color-warn-fg)">only as far as necessary</text><text x="340" y="402.6" font-size="12" fill="var(--color-warn-fg)">for safety; report it afterwards</text>
<text x="20" y="438" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">Final authority is not unlimited: use the smallest power that restores safety.</text>
</svg>
