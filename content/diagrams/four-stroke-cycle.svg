<text x="412" y="330" font-size="11" fill="var(--color-fg-muted)">Exhaust valve open, piston moves up,</text>
<text x="412" y="344" font-size="11" fill="var(--color-fg-muted)">burnt gas pushed out</text>
<text x="400" y="380" font-size="11" fill="var(--color-fg-faint)">Each stroke is half a crankshaft turn.</text><text x="400" y="394.85" font-size="11" fill="var(--color-fg-faint)">Only the power stroke does work; the flywheel</text><text x="400" y="409.7" font-size="11" fill="var(--color-fg-faint)">and the other cylinders carry the engine</text><text x="400" y="424.55" font-size="11" fill="var(--color-fg-faint)">through the other three.</text>
