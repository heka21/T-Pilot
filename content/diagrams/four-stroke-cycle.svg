<text x="412" y="116" font-size="13" fill="var(--color-fg)" font-weight="700">1 · Induction</text>
<text x="412" y="132" font-size="11" fill="var(--color-fg-muted)">Intake valve open, piston moves down,</text>
<text x="412" y="146" font-size="11" fill="var(--color-fg-muted)">fuel–air mixture is drawn in</text>
<rect x="400" y="162" width="230" height="58" rx="8" fill="var(--color-info-soft)" stroke="none" class="fsc-p2" opacity="0"/>
<rect x="400" y="162" width="230" height="58" rx="8" fill="none" stroke="var(--color-line)" stroke-width="1"/>
<text x="412" y="182" font-size="13" fill="var(--color-fg)" font-weight="700">2 · Compression</text>
<text x="412" y="198" font-size="11" fill="var(--color-fg-muted)">Both valves closed, piston moves up,</text>
