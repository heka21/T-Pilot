<rect x="400" y="228" width="230" height="58" rx="8" fill="none" stroke="var(--color-line)" stroke-width="1"/>
<text x="412" y="248" font-size="13" fill="var(--color-fg)" font-weight="700">3 · Power</text>
<text x="412" y="264" font-size="11" fill="var(--color-fg-muted)">Spark near TDC; the burning gas</text>
<text x="412" y="278" font-size="11" fill="var(--color-fg-muted)">expands and pushes the piston down</text>
<rect x="400" y="294" width="230" height="58" rx="8" fill="var(--color-surface-2)" stroke="none" class="fsc-p4" opacity="0"/>
<rect x="400" y="294" width="230" height="58" rx="8" fill="none" stroke="var(--color-line)" stroke-width="1"/>
