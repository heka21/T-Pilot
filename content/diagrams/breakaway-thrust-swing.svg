<title>Breakaway thrust swings the blast across the apron</title>
<desc>Plan view of an apron. A jet that has been stationary with its beacon on applies breakaway thrust to start moving and turns left out of its bay, often using more power on one engine. As it turns, its blast sweeps sideways across the apron, over a light aeroplane waiting nearby. Breakaway thrust is considerably greater than idle. Not to scale.</desc>
