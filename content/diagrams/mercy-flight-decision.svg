<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" data-prefix="mfd">
<title>May this be a mercy flight?</title>
<desc>A decision flowchart. First: can the flight be made within the normal rules? If yes, there is nothing to declare; it is an ordinary flight. If no, all four conditions must hold: the flight is necessary to relieve a person's suffering or to save life (not merely carrying a sick person who is not in grave danger); no other means of transport is available in time (the need cannot be met by other transport or by waiting); the pilot in command has considered the risks and the flight can be made with an acceptable level of safety (the risk does not outweigh the benefit, and the pilot is competent for the conditions: an instrument-rated pilot and aircraft for IMC); and CASA or ATS is notified of the declaration and the departures from the rules, before the flight where possible. Any no: it must not be flown as a mercy flight. Declaring changes the legal position only, not the physics or the weather.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="28" font-size="14" fill="var(--color-fg)" font-weight="700">The pilot in command (or the operator) works down the list</text>
<rect x="20" y="44" width="340" height="54" rx="10" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="34" y="66" font-size="13" fill="var(--color-fg)" font-weight="700">Can the flight be made within</text>
<text x="34" y="84" font-size="13" fill="var(--color-fg)" font-weight="700">the normal rules?</text>
<line x1="360" y1="71" x2="402" y2="71" stroke="var(--color-ok)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="382" y="64" font-size="12" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="700">yes</text>
<rect x="404" y="44" width="216" height="54" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/><text x="414" y="64.8" font-size="12" fill="var(--color-ok-fg)">Nothing to declare: an</text><text x="414" y="81" font-size="12" fill="var(--color-ok-fg)">ordinary flight under the rules</text>
<line x1="60" y1="98" x2="60" y2="120" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="70" y="114" font-size="11" fill="var(--color-fg-muted)">no: night by a VFR-only pilot, weather below VFR minima...</text>
<rect x="20" y="126" width="340" height="62" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<circle cx="42" cy="148" r="11" fill="var(--color-brand)" stroke="none"/><text x="42" y="152" font-size="12" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">1</text>
<text x="62" y="152" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">Is it necessary to relieve a person's</text><text x="62" y="168.25" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">suffering or to save life?</text>
<line x1="360" y1="157" x2="402" y2="157" stroke="var(--color-bad)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="382" y="150" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">no</text>
<rect x="404" y="128" width="216" height="58" rx="8" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/><text x="414" y="148.35" font-size="11.5" fill="var(--color-bad-fg)">Must not be flown:</text><text x="414" y="163.3" font-size="11.5" fill="var(--color-bad-fg)">a sick person who is</text><text x="414" y="178.25" font-size="11.5" fill="var(--color-bad-fg)">not in grave danger</text>
<line x1="60" y1="188" x2="60" y2="206" stroke="var(--color-brand)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="72" y="201" font-size="11.5" fill="var(--color-brand-fg)" font-weight="700">yes</text>
<rect x="20" y="210" width="340" height="62" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<circle cx="42" cy="232" r="11" fill="var(--color-brand)" stroke="none"/><text x="42" y="236" font-size="12" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">2</text>
<text x="62" y="236" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">Is no other means of transport</text><text x="62" y="252.25" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">available in time?</text>
<line x1="360" y1="241" x2="402" y2="241" stroke="var(--color-bad)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="382" y="234" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">no</text>
<rect x="404" y="212" width="216" height="58" rx="8" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/><text x="414" y="232.35" font-size="11.5" fill="var(--color-bad-fg)">Must not be flown:</text><text x="414" y="247.3" font-size="11.5" fill="var(--color-bad-fg)">other transport, or</text><text x="414" y="262.25" font-size="11.5" fill="var(--color-bad-fg)">waiting, would do</text>
<line x1="60" y1="272" x2="60" y2="290" stroke="var(--color-brand)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="72" y="285" font-size="11.5" fill="var(--color-brand-fg)" font-weight="700">yes</text>
<rect x="20" y="294" width="340" height="82" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<circle cx="42" cy="316" r="11" fill="var(--color-brand)" stroke="none"/><text x="42" y="320" font-size="12" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">3</text>
<text x="62" y="320" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">Have you weighed the risks: an</text><text x="62" y="336.25" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">acceptable level of safety, and</text><text x="62" y="352.5" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">competent for the conditions?</text>
<line x1="360" y1="335" x2="402" y2="335" stroke="var(--color-bad)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="382" y="328" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">no</text>
<rect x="404" y="296" width="216" height="78" rx="8" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/><text x="414" y="316.35" font-size="11.5" fill="var(--color-bad-fg)">Must not be flown:</text><text x="414" y="331.3" font-size="11.5" fill="var(--color-bad-fg)">risk outweighs benefit;</text><text x="414" y="346.25" font-size="11.5" fill="var(--color-bad-fg)">IMC without an instrument-</text><text x="414" y="361.2" font-size="11.5" fill="var(--color-bad-fg)">rated pilot and aircraft</text>
<line x1="60" y1="376" x2="60" y2="394" stroke="var(--color-brand)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="72" y="389" font-size="11.5" fill="var(--color-brand-fg)" font-weight="700">yes</text>
<rect x="20" y="398" width="340" height="98" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<circle cx="42" cy="420" r="11" fill="var(--color-brand)" stroke="none"/><text x="42" y="424" font-size="12" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">4</text>
<text x="62" y="424" font-size="12.5" fill="var(--color-brand-fg)" font-weight="600">Notify CASA or ATS of the</text><text x="62" y="440.25" font-size="12.5" fill="var(--color-brand-fg)" font-weight="600">declaration and the departures</text><text x="62" y="456.5" font-size="12.5" fill="var(--color-brand-fg)" font-weight="600">from the rules, before the flight</text><text x="62" y="472.75" font-size="12.5" fill="var(--color-brand-fg)" font-weight="600">where possible</text>
<line x1="60" y1="496" x2="60" y2="514" stroke="var(--color-brand)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="20" y="518" width="340" height="50" rx="10" fill="var(--color-brand)" stroke="none"/>
<text x="190" y="540" font-size="16" text-anchor="middle" fill="var(--color-surface)" font-weight="800">Mercy flight</text>
<text x="190" y="558" font-size="12" text-anchor="middle" fill="var(--color-surface)">all four conditions met</text>
