<title>How far back the RPL currency rules look</title>
<desc>Two look-back windows ending today. To carry a passenger you need at least 3 take-offs and 3 landings in the previous 90 days in the same category of aircraft. To fly as pilot in command at all you need an aeroplane flight review within the last 24 months, valid to the end of the 24th month after it was done.</desc>
