<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="wsa">
<title>Wind gradient on approach</title>
<desc>Side view of an approach into a strong headwind that decreases near the ground. As the headwind falls away, inertia keeps the groundspeed so the indicated airspeed drops; the aeroplane sinks below the approach path and undershoots, with no change in attitude or power. Add a speed margin in strong winds and be ready with power.</desc>
