<text x="20" y="362" font-size="12" fill="var(--color-fg-muted)">Climbing makes the mixture richer (less air, same fuel): lean in the cruise, enrich in the</text><text x="20" y="377.6" font-size="12" fill="var(--color-fg-muted)">descent, full rich before landing. Re-lean after any big change of power or altitude.</text>
