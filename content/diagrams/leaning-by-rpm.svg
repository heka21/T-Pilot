<title>Leaning by RPM with a fixed-pitch propeller</title>
<desc>As the mixture is leaned in cruise the RPM rises from 2350 to a peak of 2400, then falls to 2370 and the engine roughens. The pilot enriches back to the peak and then slightly richer, as the note's worked example describes.</desc>
