<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" role="img" data-prefix="cpm">
<title>The centre of pressure moves with angle of attack</title>
<desc>Three wing sections flying to the right. At a small angle of attack the centre of pressure, where the lift acts, is well back along the chord. At a larger angle of attack, still below the critical angle, it has moved forward. Beyond the critical angle the flow separates over the rear of the wing and the centre of pressure moves rapidly rearward, part of why the nose drops at the stall.</desc>
