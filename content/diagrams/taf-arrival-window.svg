<title>Which TAF groups touch the arrival window?</title>
<desc>The note's Geraldton example on a timeline from 0230 to 0630 UTC. ETA 0400 UTC; the window runs from 30 minutes before to 60 minutes after, 0330 to 0500. The base conditions, 15012KT 9999 SCT030, pass the alternate minima. The TEMPO 0300/0600 group, 4000 SHRA BKN012, covers the whole window and fails both tests: broken cloud, more than scattered, below 1,500 ft, and visibility under 8 km. A TEMPO needs 60 minutes of holding fuel, 28 L at 28 L/h, or an alternate such as Dongara, 15 L.</desc>
