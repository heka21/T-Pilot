<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="vpl">
<title>Vapour lock after a hot shutdown</title>
<desc>Left: after a hot engine is shut down, heat soaks into the fuel lines and pump with no cooling air, the fuel boils into vapour, and a pump built for liquid cannot move bubbles, so the fuel pressure flickers and the engine surges or will not start. Right: the electric booster pump raises the pressure in the lines, pushing the vapour through or collapsing it back into liquid, and the pressure steadies in the green.</desc>
