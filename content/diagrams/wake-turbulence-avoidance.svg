<title>Take-off and landing profiles that avoid wake turbulence</title>
<desc>Side views. Taking off behind a heavier aircraft that has just departed: its vortices start at its rotation point, so lift off before that point and climb above its flight path. Landing behind a heavier aircraft that has just landed: its vortices stop at its touchdown point, so stay at or above its approach path and touch down beyond that point.</desc>
