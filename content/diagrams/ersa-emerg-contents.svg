<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="eec">
<title>What is in ERSA EMERG</title>
<desc>The pink pages of ERSA, grouped by what a pilot in trouble needs. Tell someone: the MAYDAY and PAN PAN calls and their format (callsign, nature of the emergency, intentions, position, altitude, heading, persons on board), made on the current frequency then 121.5 MHz, and the transponder codes 7700, 7600 and 7500. Deal with the problem: radio failure procedures for Class G and controlled airspace, interception signals and responses, ditching and forced landing. If you end up on the ground: the SAR phases, ELT operation and the ground-to-air signals. Also in EMERG: light signals from a control tower and emergency contact numbers for the ATSB, Airservices and the JRCC. Grouped by purpose, not page order; check your current ERSA.</desc>
