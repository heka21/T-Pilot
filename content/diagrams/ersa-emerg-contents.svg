<text x="34" y="241" font-size="12.5" fill="var(--color-brand-fg)" font-weight="700">Where</text>
<text x="34" y="257" font-size="11.5" fill="var(--color-fg)">current frequency,</text>
<text x="34" y="272" font-size="11.5" fill="var(--color-fg)">then 121.5 MHz</text>
