<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="lct">
<title>Squeezed between low cloud and rising ground</title>
<desc>Side view: a VFR aeroplane flies inland under a cloud base that lowers ahead while the ground rises towards hills. The gap between cloud and terrain narrows until there is no room to stay clear of cloud and above the minimum height. The safe choice is to turn back early while there is still room; pressing on under the cloud (scud running) into rising ground is a leading cause of fatal VFR accidents.</desc>
