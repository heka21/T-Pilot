<title>What happens when the tower closes</title>
<desc>Two side views of the same regional towered aerodrome. Left, during the tower's published hours: the control zone is Class D, a clearance is required and the tower controls the circuit. Right, outside those hours: the airspace reverts to Class G (or Class E above) and the aerodrome becomes a CTAF aerodrome. The hours are in ERSA and may be changed by NOTAM.</desc>
