<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" data-prefix="tdo">
<title>Temperature and dew point through a clear winter night</title>
<desc>Top: a chart of air temperature and dew point from sunset to mid-morning. The temperature falls all night under clear skies while the dew point stays almost level, so the spread narrows; around dawn they meet and fog forms. The coldest time is just after sunrise, when the fog often thickens, then the sun warms the air above the dew point and the fog clears by mid-morning. Bottom: three panels showing the wind. Dead calm: dew or frost and only shallow ground fog. A light wind of about 2 to 5 knots: the cooled air is stirred through a layer a few hundred feet deep and fog forms. A wind much over 10 knots: the chilled air mixes with warmer air above and fog does not form, sometimes low stratus instead.</desc>
