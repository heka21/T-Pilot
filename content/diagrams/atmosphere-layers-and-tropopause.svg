<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="alt">
<title>The layers of the atmosphere, defined by temperature</title>
<desc>Chart of ISA temperature against height. Through the troposphere the temperature falls about 2 degrees per 1,000 ft, from 15 degrees at sea level to minus 56.5 at the tropopause, 36,090 ft. In the lower stratosphere it stays at minus 56.5 to about 65,600 ft, then rises because the ozone layer absorbs ultraviolet. A cumulonimbus rises through the troposphere and spreads into an anvil at the tropopause lid. The tropopause is about 26,000 ft over the poles, 36,000 ft in mid-latitudes and 52,000 to 59,000 ft over the equator.</desc>
