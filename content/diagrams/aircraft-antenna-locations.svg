<title>Where the antennas are, and which is which</title>
<desc>Side view of a light aeroplane. A COM antenna, a blade or whip about 60 cm long (a quarter wavelength), sits on top of the fuselage, with a second COM antenna underneath, one per COM radio. The V-shaped cat's whisker NAV antenna for the VOR and ILS receivers is on the fin. Short UHF stubs underneath serve the transponder and DME.</desc>
