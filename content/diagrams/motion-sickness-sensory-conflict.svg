<rect x="150" y="192" width="190" height="64" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/><text x="162" y="215.2" font-size="14" fill="var(--color-warn-fg)" font-weight="700">Inner ear: "moving"</text><text x="162" y="235" font-size="12" fill="var(--color-warn-fg)">turbulence, turns,</text><text x="162" y="251.2" font-size="12" fill="var(--color-warn-fg)">accelerations</text>
