<text x="16" y="286" font-size="14" fill="var(--color-ok-fg)" font-weight="700">Make the senses agree:</text>
<rect x="16" y="298" width="146" height="58" rx="10" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/><text x="28" y="320.4" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Fresh air</text><text x="28" y="338.65" font-size="11" fill="var(--color-ok-fg)">vents open, keep cool</text>
