<rect x="324" y="298" width="146" height="58" rx="10" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/><text x="336" y="320.4" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Head still</text><text x="336" y="338.65" font-size="11" fill="var(--color-ok-fg)">move the eyes</text>
<rect x="478" y="298" width="146" height="58" rx="10" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/><text x="490" y="320.4" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Take the controls</text><text x="490" y="338.65" font-size="11" fill="var(--color-ok-fg)">you anticipate it</text>
<rect x="16" y="366" width="608" height="46" rx="8" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<text x="320" y="385" font-size="13" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">Pilots: no anti-motion-sickness medication.</text>
<text x="320" y="402" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">Most cause drowsiness, blurred vision and slowed reactions. Passengers may take them.</text>
