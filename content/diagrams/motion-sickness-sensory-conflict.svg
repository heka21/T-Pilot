<title>Why motion sickness happens</title>
<desc>Reading a chart in turbulence: the eyes report that you are still, the inner ear reports that you are moving. The brain receives two different pictures of motion and responds with sickness. Remedies: fresh air, eyes outside on the horizon, head still, take the controls. Pilots should not take anti-motion-sickness medication.</desc>
