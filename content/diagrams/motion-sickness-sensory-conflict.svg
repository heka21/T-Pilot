<text x="508" y="128" font-size="12" fill="var(--color-bad-fg)">unease, yawning,</text><text x="508" y="144.2" font-size="12" fill="var(--color-bad-fg)">pallor, cold sweat,</text><text x="508" y="160.4" font-size="12" fill="var(--color-bad-fg)">nausea, then</text><text x="508" y="176.6" font-size="12" fill="var(--color-bad-fg)">vomiting</text>
