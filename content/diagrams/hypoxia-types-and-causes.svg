<line x1="450" y1="94" x2="442" y2="102" stroke="var(--color-surface)" stroke-width="2" stroke-linecap="round"/>
<rect x="322" y="124" width="147" height="206" rx="10" fill="var(--color-surface)" stroke="var(--color-bad)" stroke-width="1.25"/>
<text x="334" y="146" font-size="15" fill="var(--color-bad)" font-weight="700">Stagnant</text>
<text x="334" y="184" font-size="12" fill="var(--color-fg)" font-weight="600">poor circulation</text>
<text x="334" y="206" font-size="11" fill="var(--color-fg-muted)" font-weight="700">Causes</text>
<text x="334" y="222" font-size="11" fill="var(--color-fg)">positive g, cold,</text><text x="334" y="236.85" font-size="11" fill="var(--color-fg)">shock, sitting</text><text x="334" y="251.7" font-size="11" fill="var(--color-fg)">cramped</text>
<text x="334" y="280" font-size="11" fill="var(--color-ok-fg)" font-weight="700">Combat it</text>
<text x="334" y="296" font-size="11" fill="var(--color-ok-fg)">limit g, keep</text><text x="334" y="310.85" font-size="11" fill="var(--color-ok-fg)">warm, move limbs</text>
