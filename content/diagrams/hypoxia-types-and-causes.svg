<text x="181" y="184" font-size="12" fill="var(--color-fg)" font-weight="600">blood can't carry it</text>
<text x="181" y="206" font-size="11" fill="var(--color-fg-muted)" font-weight="700">Causes</text>
<text x="181" y="222" font-size="11" fill="var(--color-fg)">carbon monoxide,</text><text x="181" y="236.85" font-size="11" fill="var(--color-fg)">smoking, blood</text><text x="181" y="251.7" font-size="11" fill="var(--color-fg)">donation, anaemia</text>
<text x="181" y="280" font-size="11" fill="var(--color-ok-fg)" font-weight="700">Combat it</text>
<text x="181" y="296" font-size="11" fill="var(--color-ok-fg)">remove CO source;</text><text x="181" y="310.85" font-size="11" fill="var(--color-ok-fg)">100% oxygen</text>
