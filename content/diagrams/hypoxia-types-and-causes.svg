<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="hyt">
<title>Four ways to starve the brain of oxygen</title>
<desc>The oxygen chain from the air to the cells, with the four types of hypoxia where they break it. Hypoxic: low oxygen partial pressure in the lungs, from altitude. Anaemic: blood cannot carry enough oxygen, from carbon monoxide, smoking, blood donation or anaemia. Stagnant: blood not circulating well, from positive g, cold or shock. Histotoxic: cells cannot use the oxygen, from alcohol, some drugs or cyanide.</desc>
