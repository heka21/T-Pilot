<text x="487" y="146" font-size="15" fill="var(--color-bad)" font-weight="700">Histotoxic</text>
<text x="487" y="184" font-size="12" fill="var(--color-fg)" font-weight="600">cells can't use it</text>
<text x="487" y="206" font-size="11" fill="var(--color-fg-muted)" font-weight="700">Causes</text>
<text x="487" y="222" font-size="11" fill="var(--color-fg)">alcohol, some</text><text x="487" y="236.85" font-size="11" fill="var(--color-fg)">drugs, cyanide</text>
<text x="487" y="280" font-size="11" fill="var(--color-ok-fg)" font-weight="700">Combat it</text>
<text x="487" y="296" font-size="11" fill="var(--color-ok-fg)">prevent it: oxygen</text><text x="487" y="310.85" font-size="11" fill="var(--color-ok-fg)">does little</text>
<rect x="16" y="342" width="608" height="86" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="32" y="366" font-size="14" fill="var(--color-warn-fg)" font-weight="700">Why it is insidious</text>
<text x="32" y="386" font-size="12" fill="var(--color-warn-fg)">Hypoxia brings euphoria, over-confidence, lack of self-criticism and a false sense of security.</text>
<text x="32" y="403" font-size="12" fill="var(--color-warn-fg)">The pilot feels fine, even good, while judgement, memory and arithmetic deteriorate.</text>
<text x="32" y="420" font-size="12" fill="var(--color-warn-fg)" font-weight="700">Rely on altitude rules and oxygen, not on how you feel.</text>
