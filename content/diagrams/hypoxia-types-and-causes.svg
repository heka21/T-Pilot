<text x="28" y="206" font-size="11" fill="var(--color-fg-muted)" font-weight="700">Causes</text>
<text x="28" y="222" font-size="11" fill="var(--color-fg)">altitude without</text><text x="28" y="236.85" font-size="11" fill="var(--color-fg)">oxygen; cabin</text><text x="28" y="251.7" font-size="11" fill="var(--color-fg)">decompression</text>
