<text x="30" y="322" font-size="26" fill="var(--color-bad-fg)" font-weight="700" class="num">P</text>
<text x="60" y="308" font-size="13" fill="var(--color-bad-fg)" font-weight="700">Prohibited</text>
<text x="60" y="326" font-size="11" fill="var(--color-bad-fg)">no flight at any time</text>
<rect x="222" y="284" width="196" height="58" rx="8" fill="var(--color-warn-soft)" stroke="none"/>
<text x="236" y="322" font-size="26" fill="var(--color-warn-fg)" font-weight="700" class="num">R</text>
<text x="266" y="308" font-size="13" fill="var(--color-warn-fg)" font-weight="700">Restricted</text>
<text x="266" y="326" font-size="11" fill="var(--color-warn-fg)">only with a clearance</text>
<rect x="428" y="284" width="196" height="58" rx="8" fill="var(--color-info-soft)" stroke="none"/>
<text x="442" y="322" font-size="26" fill="var(--color-info-fg)" font-weight="700" class="num">D</text>
<text x="472" y="308" font-size="13" fill="var(--color-info-fg)" font-weight="700">Danger</text>
<text x="472" y="326" font-size="11" fill="var(--color-info-fg)">permitted, with a hazard</text>
<text x="320" y="370" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="600">Chart: where it is and its limits. ERSA PRD: hours, authority, status. NOTAM: changes.</text>
<text x="320" y="392" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">Read the real area's details from the current ERSA.</text>
