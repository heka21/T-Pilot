<title>Reading an ERSA PRD listing</title>
<desc>An illustrative restricted area listing, not a real area: R999 Example Range, surface to 5,000 ft, hours by NOTAM, controlling authority, conditional status RA2. The letter gives the kind of area: P prohibited, R restricted, D danger. Each field answers one planning question: am I inside it vertically, is it active, who do I ask, and can I plan through it.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="16" y="30" width="290" height="230" rx="8" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2"/>
<rect x="16" y="30" width="290" height="30" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<rect x="16" y="52" width="290" height="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="161" y="50" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700">ILLUSTRATIVE: NOT A REAL AREA</text>
<text x="30" y="94" font-size="18" fill="var(--color-brand)" font-weight="700" class="num">R999</text>
<text x="92" y="94" font-size="14" fill="var(--color-fg)" font-weight="700" class="num">EXAMPLE RANGE</text>
<line x1="26" y1="108" x2="296" y2="108" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="130" font-size="12" fill="var(--color-fg-muted)">Vertical limits</text>
<text x="176" y="130" font-size="13" fill="var(--color-fg)" font-weight="700" class="num">SFC – 5000</text>
<line x1="26" y1="146" x2="296" y2="146" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="168" font-size="12" fill="var(--color-fg-muted)">Hours</text>
<text x="176" y="168" font-size="13" fill="var(--color-fg)" font-weight="700" class="num">NOTAM</text>
<line x1="26" y1="184" x2="296" y2="184" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="206" font-size="12" fill="var(--color-fg-muted)">Controlling authority</text>
<text x="176" y="206" font-size="13" fill="var(--color-fg)" font-weight="700" class="num">EXAMPLE ATC</text>
<line x1="26" y1="222" x2="296" y2="222" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="244" font-size="12" fill="var(--color-fg-muted)">Conditional status</text>
<text x="176" y="244" font-size="13" fill="var(--color-fg)" font-weight="700" class="num">RA2</text>
<line x1="310" y1="88" x2="326" y2="88" stroke="var(--color-fg-muted)" stroke-width="1" stroke-linecap="round"/>
<circle cx="310" cy="88" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="332" y="85" font-size="12" fill="var(--color-brand)" font-weight="600">R: restricted. 999: the number</text><text x="332" y="100.6" font-size="12" fill="var(--color-brand)" font-weight="600">printed on the chart beside it</text>
<line x1="310" y1="126" x2="326" y2="126" stroke="var(--color-fg-muted)" stroke-width="1" stroke-linecap="round"/>
<circle cx="310" cy="126" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="332" y="123" font-size="12" fill="var(--color-fg)" font-weight="600">Below 5,000 ft over the area,</text><text x="332" y="138.6" font-size="12" fill="var(--color-fg)" font-weight="600">you are inside it</text>
<line x1="310" y1="164" x2="326" y2="164" stroke="var(--color-fg-muted)" stroke-width="1" stroke-linecap="round"/>
<circle cx="310" cy="164" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="332" y="161" font-size="12" fill="var(--color-fg)" font-weight="600">Active when? H24, times in UTC,</text><text x="332" y="176.6" font-size="12" fill="var(--color-fg)" font-weight="600">or activated by NOTAM</text>
<line x1="310" y1="202" x2="326" y2="202" stroke="var(--color-fg-muted)" stroke-width="1" stroke-linecap="round"/>
