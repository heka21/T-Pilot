<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="htd">
<title>Heading, track and drift</title>
<desc>Plan view. The nose points along the heading, but a wind from the left side carries the aeroplane sideways, so it moves over the ground along the track. The angle between heading and track is the drift. With no wind, heading and track are the same.</desc>
