<title>What lengthens take-off and landing distances</title>
<desc>A table of arrows. Headwind shortens both; tailwind lengthens both markedly; higher temperature, lower QNH and higher elevation lengthen both through lower density; uphill slope lengthens take-off and downhill slope lengthens landing; grass, gravel and wet surfaces and higher weight lengthen both; frost on the wing lengthens take-off and may prevent it.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
