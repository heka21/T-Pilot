<title>Holding fuel or an alternate?</title>
<desc>Decision flow from the note. Lay every TAF group against the window, 30 minutes before to 60 minutes after the ETA. If nothing in the window is below the alternate minima, carry trip fuel and the fixed reserve. If something is, ask how long it lasts: an INTER requires 30 minutes of holding fuel or an alternate; a TEMPO requires 60 minutes of holding fuel or an alternate; a permanent change (FM, BECMG or the base conditions) requires an alternate, because waiting does not help. A PROB group is treated as the group it qualifies. The fixed reserve is always on top.</desc>
