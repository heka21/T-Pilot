<title>Carburettor heat: ice or no ice?</title>
<desc>Two RPM traces after full carburettor heat is applied. With ice present (the note's example) the RPM, already crept from 2400 to 2300, falls to 2200, the engine runs rough briefly, the RPM rises to 2350 as the ice melts, and on returning to cold it settles at 2400, higher than before. With no ice the RPM drops slightly, stays there, and returns to the original value on cold.</desc>
