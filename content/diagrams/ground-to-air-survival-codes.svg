<title>Ground-to-air signal codes</title>
<desc>Five symbols survivors lay out on the ground for search aircraft, as shown in the ERSA: V means require assistance, X means require medical assistance, N means no, Y means yes, and an arrow means proceeding in this direction. Make them large and contrasting: rocks on red sand, dark branches on a pale claypan, or trenches whose shadows show. Lay an arrow only if you really do leave, pointing the way you have gone.</desc>
