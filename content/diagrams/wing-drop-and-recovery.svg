<g transform="translate(145 202) rotate(-15) scale(1.1)"><path d="M0 0 C8 -14 40 -16 100 -2 C60 4 20 8 0 0 Z" stroke="var(--color-bad)" stroke-width="1.82" fill="var(--color-surface)" stroke-linecap="round" stroke-linejoin="round" transform="translate(-25 0)"/><line x1="71" y1="-1" x2="91.35" y2="12.72" stroke="var(--color-bad)" stroke-width="2.73" stroke-linecap="round"/></g>
