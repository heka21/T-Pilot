<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" data-prefix="wdr">
<title>A wing drops near the stall: aileron or rudder?</title>
<desc>Left: using aileron to pick up a dropped wing near the stall lowers that wing's aileron, raising its angle of attack past the critical angle; the wing stalls further and drops more, and the extra drag yaws the aeroplane towards a spin. Right: keep the wings level with rudder near the stall, unstall first by easing the control column forward, then level the wings with aileron once the wing is flying.</desc>
