<text x="116" y="68" font-size="11" text-anchor="middle" fill="var(--color-info-fg)">issued by a DAME, with CASA</text>
<line x1="34" y1="80" x2="198" y2="80" stroke="var(--color-info)" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="102" font-size="12" fill="var(--color-info-fg)">The standard private pilot</text><text x="34" y="119.4" font-size="12" fill="var(--color-info-fg)">medical: no extra</text><text x="34" y="136.8" font-size="12" fill="var(--color-info-fg)">operational limits.</text><text x="34" y="154.2" font-size="12" fill="var(--color-info-fg)"></text><text x="34" y="171.6" font-size="12" fill="var(--color-info-fg)">Valid 4 years under 40,</text><text x="34" y="189" font-size="12" fill="var(--color-info-fg)">2 years over 40</text><text x="34" y="206.4" font-size="12" fill="var(--color-info-fg)">(check current periods)</text>
