<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="rmc">
<title>The three medicals an RPL holder can use</title>
<desc>Three cards compared. Class 2: issued by a DAME with CASA, the standard private pilot medical with no extra operational limits. Basic Class 2: any GP to the commercial driver standard; private, day VFR, below 10,000 ft, piston aircraft up to 8,618 kg, no more than 5 passengers. RAMPC: any GP to the private driver standard; single-engine piston up to 1,500 kg, day VFR, below 10,000 ft, no more than 1 passenger, no aerobatics, private operations.</desc>
