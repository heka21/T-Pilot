<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="sdt">
<title>Why slush can stop a take-off</title>
<desc>Force against groundspeed on the take-off roll. Propeller thrust falls as speed rises. On a dry runway drag and rolling resistance stay well below it, so the aeroplane keeps accelerating to lift-off speed. In slush, displacement and spray impingement drag grow with speed; where the slush drag meets the thrust, short of lift-off speed, the net force is zero and the aeroplane stops accelerating however much runway is left.</desc>
