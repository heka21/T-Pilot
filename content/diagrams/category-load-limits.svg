<title>Limit and ultimate load factors by category</title>
<desc>Bars for the normal, utility and aerobatic categories. The limit load factors are plus 3.8, 4.4 and 6 g; beyond the limit the structure may bend permanently, and beyond the ultimate load, normally 1.5 times the limit (5.7, 6.6 and 9 g), it may fail. A level turn at 60 degrees of bank pulls 2 g and at 75 degrees about 3.86 g.</desc>
