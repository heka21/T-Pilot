<title>Prohibited, restricted and danger areas: may you go in?</title>
<desc>Three panels. Prohibited area: may not be entered at all; the track stops at the boundary. Restricted area: treated like controlled airspace; when active you need the controlling authority's clearance to enter, without one stay out. Danger area: a hazardous activity such as parachuting or gunnery; you may enter, but knowing the risk is your responsibility. Below: hours of activity are in ERSA PRD and AIP ENR 5.1 (H24, HJ, specified UTC times, or by NOTAM), and a NOTAM can activate, deactivate or change an area.</desc>
