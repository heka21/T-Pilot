<title>Orographic cloud on the Darling Scarp</title>
<desc>Cross-section from the coast on the left to the wheatbelt on the right. A moist south-westerly behind a winter front crosses the coastal plain, then is forced up the face of the Darling Scarp, roughly 1,000 ft high. Rising, it expands and cools, and a few hundred feet above the hills it reaches its dew point: cloud caps the Scarp while the plain stays clear.</desc>
