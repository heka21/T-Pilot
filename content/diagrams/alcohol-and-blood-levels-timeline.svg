<title>Alcohol leaves at one drink an hour</title>
<desc>Worked example from the note: the 6th standard drink is finished at 2300. The liver removes about one standard drink an hour and nothing speeds it up, so blood alcohol is not near zero until about 0500. The 8-hour rule makes 0700 the earliest legal time to fly, and the hangover can last well beyond that.</desc>
