<text x="516" y="300" font-size="11" fill="var(--color-bad-fg)">STALL: nose drop</text><text x="516" y="314.3" font-size="11" fill="var(--color-bad-fg)">or wing drop, high</text><text x="516" y="328.6" font-size="11" fill="var(--color-bad-fg)">rate of descent</text>
<text x="20" y="370" font-size="12" fill="var(--color-fg-muted)">The stall is about angle of attack, not speed: it can happen at any airspeed and any attitude.</text>
<text x="20" y="388" font-size="12" fill="var(--color-fg-muted)">The cure: ease forward to lower the angle of attack until the buffet stops, then power, then roll level.</text>
