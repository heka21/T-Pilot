<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="sts">
<title>Approaching the stall</title>
<desc>Three wing sections at increasing angle of attack: airflow attached over the whole upper surface, airflow starting to separate near the trailing edge, and the stall past the critical angle with the flow separated and turbulent. Below, the warning signs in the usual order: low and decreasing airspeed with a high nose attitude, sloppy controls and a quieter airflow note, the stall warning 5 to 10 knots above the stall, buffet, then the stall itself: a nose drop or wing drop and a high rate of descent.</desc>
