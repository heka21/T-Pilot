<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="dth">
<title>A displaced threshold</title>
<desc>Plan and side view of the worked example: a 1,250 m runway whose northern threshold is displaced 220 m because of power poles under the approach. White arrows along the centreline lead to a white transverse bar; the threshold markings start at the bar. Landing towards the south you touch down beyond the bar, so 1,030 m is available for landing. The arrowed section may be used for the take-off run and for the roll-out after landing in the other direction, so the full 1,250 m is available for take-off. The side view shows that an approach to the bar clears the poles, while an approach aimed at the pavement's end would not.</desc>
