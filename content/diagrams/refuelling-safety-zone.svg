<title>Refuelling: what must be true before fuel flows</title>
<desc>Plan view of an aeroplane being refuelled from a bowser inside a refuelling zone. Keyed to a list: 1 no smoking or naked flames; 2 engines stopped; 3 aircraft and bowser bonded (earthed) with a lead so static equalises through the wire, not as a spark at the nozzle; 4 a fire extinguisher at hand; 5 passengers off the aircraft, or supervised as the rules allow; 6 no radar or HF transmissions. Afterwards: caps secured and a fuel drain check for water and the correct fuel.</desc>
