<text x="320" y="368" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Unconscious but breathing: recovery position, airway clear. Bleeding: firm direct pressure.</text>
<text x="320" y="386" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Burns: cool under clean running water for 20 minutes. Fractures: immobilise as found.</text>
