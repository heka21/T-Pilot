<text x="182" y="92" font-size="14" fill="var(--color-fg)" font-weight="700">Response</text>
<text x="182" y="112" font-size="11" fill="var(--color-fg-muted)">conscious? talk</text><text x="182" y="126.85" font-size="11" fill="var(--color-fg-muted)">and gently squeeze</text>
