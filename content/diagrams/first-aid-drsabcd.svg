<text x="336" y="92" font-size="14" fill="var(--color-fg)" font-weight="700">Send for help</text>
<text x="336" y="112" font-size="11" fill="var(--color-fg-muted)">000 (112 mobile);</text><text x="336" y="126.85" font-size="11" fill="var(--color-fg-muted)">ELT or PLB if remote</text>
