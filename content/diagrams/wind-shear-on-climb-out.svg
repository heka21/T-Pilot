<rect x="329.2" y="220.4" width="125.6" height="19.2" rx="9.6" fill="var(--color-bad-soft)" stroke="none"/><text x="392" y="234.2" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="600">IAS falls 15 kt</text>
