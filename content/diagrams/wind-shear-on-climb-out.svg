<text x="474" y="180" font-size="11" fill="var(--color-fg-muted)">lower the nose,</text><text x="474" y="194.3" font-size="11" fill="var(--color-fg-muted)">regain Vy, climb on</text>
<rect x="20" y="14" width="600" height="46" rx="8" fill="var(--color-brand-soft)" stroke="none"/>
<text x="32" y="33" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Inertia keeps the groundspeed: airspeed = groundspeed + headwind.</text>
<text x="32" y="51" font-size="12" fill="var(--color-brand-fg)">Headwind 20 → 5 kt: the airspeed drops 15 kt at once, with no change of attitude or power.</text>
<text x="20" y="396" font-size="12" fill="var(--color-fg-muted)">A sudden gain of tailwind does the same; a headwind that increases gives a brief bonus.</text>
<text x="20" y="414" font-size="12" fill="var(--color-fg-muted)">A steady wind never changes the rate of climb; only a sudden change does, and only for a while.</text>
