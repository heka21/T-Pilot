<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="wsc">
<title>Losing the headwind on climb-out</title>
<desc>Side view of a climb-out at Vy into a 20 knot headwind that suddenly drops to 5 knots higher up. Inertia keeps the groundspeed for a moment, so the airspeed falls by the 15 knots of headwind lost. The rate and angle of climb fall and the path flattens below the planned climb until the aeroplane re-accelerates; to get back to Vy the pilot lowers the nose and gives up some of the climb. Close to the ground this is dangerous.</desc>
