<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="nml">
<title>One minute of latitude is one nautical mile</title>
<desc>Left: a section through the Earth from pole to pole. One degree of latitude, measured at the centre, is divided into 60 minutes, and each minute of arc along the surface is one nautical mile, so one degree is 60 NM. Right: the latitude scale on the side of a chart works as a distance scale; dividers opened to 18 minutes measure 18 NM, about Rottnest to Jandakot. Perth to Geraldton is about 4 degrees of latitude, roughly 240 NM.</desc>
