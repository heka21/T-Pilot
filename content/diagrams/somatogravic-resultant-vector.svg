<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="sgv">
<title>Somatogravic illusion: acceleration feels like pitch-up</title>
<desc>On a dark take-off the aeroplane accelerates forward. The otoliths feel gravity straight down plus the backward lag of the crystals from the forward acceleration, and report only their sum: a total force tilted backwards. With no horizon the brain takes that tilted force as 'down' and feels a nose-up pitch: tan theta = a / g, so a quarter of g feels like about 14 degrees nose-up. The pilot who pushes forward flies into the ground.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="16" y="28" font-size="15" fill="var(--color-fg)" font-weight="700">What the otoliths feel</text>
