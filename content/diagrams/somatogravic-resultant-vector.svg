<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="sgv">
<title>Somatogravic illusion: acceleration feels like pitch-up</title>
<desc>On a dark take-off the aeroplane accelerates forward. The otoliths feel gravity straight down plus the backward lag of the crystals from the forward acceleration, and report only their sum: a total force tilted backwards. With no horizon the brain takes that tilted force as 'down' and feels a nose-up pitch: tan theta = a / g, so a quarter of g feels like about 14 degrees nose-up. The pilot who pushes forward flies into the ground.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="16" y="28" font-size="15" fill="var(--color-fg)" font-weight="700">What the otoliths feel</text>
<circle cx="200" cy="76" r="8" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2"/>
<line x1="200" y1="86" x2="200" y2="296" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="210" y="197" font-size="13" fill="var(--color-fg)" font-weight="600">gravity, 1 g</text>
<text x="210" y="213" font-size="12" fill="var(--color-fg-muted)">straight down</text>
<line x1="190" y1="76" x2="145" y2="76" stroke="var(--color-info)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="137" y="54" font-size="12" text-anchor="end" fill="var(--color-info-fg)" font-weight="600">crystals lag back:</text><text x="137" y="69.6" font-size="12" text-anchor="end" fill="var(--color-info-fg)" font-weight="600">acceleration ¼ g</text>
<line x1="145" y1="76" x2="145" y2="296" stroke="var(--color-line-strong)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="200" y1="296" x2="145" y2="296" stroke="var(--color-line-strong)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="194" y1="84" x2="149.55" y2="277.79" stroke="var(--color-brand)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="135" y="241" font-size="13" text-anchor="end" fill="var(--color-brand)" font-weight="700">the sum: felt</text><text x="135" y="257.9" font-size="13" text-anchor="end" fill="var(--color-brand)" font-weight="700">as "down"</text>
<path d="M200 146 A70 70 0 0 1 183.02 143.91" stroke="var(--color-brand)" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="190" y="168" font-size="14" text-anchor="middle" fill="var(--color-brand)" font-weight="700">θ</text>
<text x="16" y="360" font-size="14" fill="var(--color-fg)" font-weight="700" class="num">tan θ = a ÷ g = 0.25, so θ ≈ 14°</text>
<text x="16" y="382" font-size="12" fill="var(--color-fg-muted)">Deceleration does the reverse: it feels nose-down.</text>
<rect x="330" y="40" width="294" height="140" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="342" y="62" font-size="13" fill="var(--color-fg)" font-weight="700">Actual: accelerating, shallow climb</text>
<line x1="342" y1="158" x2="612" y2="158" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
