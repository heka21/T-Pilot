<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="elc">
<title>Where the oil goes</title>
<desc>A wet-sump lubrication circuit. The engine-driven pump draws oil from the sump and pushes it through the filter, with a pressure relief valve spilling the excess back to the sump when the oil is cold and thick. A thermostatic valve sends cold oil past the oil cooler and hot oil through it. Drilled galleries carry the oil to the bearings, the valve gear and the cylinder walls, and oil sprayed under the pistons picks up heat the cooling fins cannot reach. It drains back to the sump, and the cooler sheds the heat to the airflow.</desc>
