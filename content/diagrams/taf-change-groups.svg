<title>TAF change groups on a timeline</title>
<desc>Timeline of the example TAF from 0600 to 1800 UTC. The main conditions apply from 0600; FM031000 replaces them permanently from 1000 UTC with wind 090 at 8 knots and CAVOK. TEMPO 0306/0309 adds spells of 4,000 m in showers with broken cloud at 2,000 ft, each lasting 30 to 60 minutes, between 0600 and 0900. Below, the other groups: BECMG is a gradual change over the period given, INTER means fluctuations of less than 30 minutes, PROB30 or PROB40 gives the probability of the condition.</desc>
