<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="nbd">
<title>Why flying after diving causes the bends</title>
<desc>Three panels. At depth the diver breathes air at two, three or more times sea-level pressure and extra nitrogen dissolves in the blood and tissues. Back at the surface the extra nitrogen leaves slowly, over many hours. Flying soon after lowers the pressure again, like opening a soft-drink bottle a second time, and the nitrogen comes out as bubbles: decompression sickness, possible from about 5,000 to 8,000 ft cabin altitude. Wait at least 12 hours after a no-decompression dive and at least 24 hours after decompression stops or multiple dives.</desc>
