<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="dvn">
<title>Normal combustion and detonation</title>
<desc>Left: normal combustion, a smooth flame front spreading from the spark plug and a smooth rise in cylinder pressure. Right: detonation, the remaining charge explodes after the spark and hammers the piston, with a sharp pressure spike. Causes: mixture too lean at high power, high manifold pressure with low RPM, fuel of too low an octane, and high cylinder head temperature. Effects: rough running, sharp rise in CHT, power loss, damage. Remedy: enrich, reduce power, lower the nose, open cowl flaps.</desc>
