<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" data-prefix="grp">
<title>The two properties of a gyro</title>
<desc>Left, rigidity in space: the aeroplane rolls around a spinning rotor, but the rotor's spin axis keeps pointing the same way, which is what the attitude and directional indicators use. Right, precession: push on the rim of a spinning rotor and it responds as if the push had been applied 90 degrees further round in the direction of rotation, which is what the turn coordinator uses.</desc>
