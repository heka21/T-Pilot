<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="fig">
<title>Forces in a steady glide</title>
<desc>An aeroplane gliding down a straight path with no thrust. Lift acts perpendicular to the flight path, drag acts back along it, and weight acts vertically down. Lift and drag together make a resultant that is exactly equal and opposite to the weight. The glide angle between the path and the horizon is the angle whose tangent is drag over lift, so the flattest glide is at the best lift/drag ratio.</desc>
