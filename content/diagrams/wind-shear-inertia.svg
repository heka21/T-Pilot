<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="wsi">
<title>Why a loss of headwind costs airspeed</title>
<desc>Two moments on approach, aeroplane flying left to right. Before: airspeed 70 knots into a 25 knot headwind, so the groundspeed is 45 knots. The headwind suddenly falls to 10 knots. Inertia keeps the groundspeed at 45 knots for a moment, so the airspeed is 45 plus 10, 55 knots: 15 knots lost, and the wing makes lift for 55 knots, not 70.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="28" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Why does a loss of headwind cost airspeed?</text>
<text x="320" y="48" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">airspeed = groundspeed + headwind; inertia holds the groundspeed for a moment</text>
