<title>Performance penalties multiply</title>
<desc>Take-off distance as a percentage of the chart's level, nil-wind figure. A 2 percent upslope adds about 10 percent: 110. A tailwind of 10 percent of the lift-off speed then adds about 20 percent of that already longer distance, 22 more, for 132, not 130. Density height and a wet grass surface multiply the result again by amounts read from the POH.</desc>
