<text x="320" y="342" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">Δp = ρ (n g) h: the pressure needed grows in proportion to the g.</text>
<text x="320" y="364" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Reflexes raise the heart rate and tighten vessels, but take several seconds:</text>
