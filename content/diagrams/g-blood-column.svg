<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="gbc">
<title>Why g starves the brain of blood</title>
<desc>Two seated pilots. The brain is about 30 cm above the heart, and the heart must push blood up that column. The pressure needed is rho times n g times h, so it rises in direct proportion to the load factor: at 3 g the column weighs three times as much. Under positive g blood also pools in the legs and lower body, so less returns to the heart. Reflexes that raise heart rate and tighten vessels take several seconds, so a sudden onset is worse.</desc>
