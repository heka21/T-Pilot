<text x="20" y="306" font-size="12" fill="var(--color-fg-muted)">Viewed from behind, landing direction into the page: the pilot's left is on the left.</text>
<text x="20" y="324" font-size="12" fill="var(--color-fg-muted)">Worked example: runway 21, wind 240/04: about 2 kt across from the right.</text>
