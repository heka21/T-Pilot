<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" data-prefix="wdc">
<title>A light crosswind can hold a vortex over the runway</title>
<desc>Rear views of the vortices from a landing aircraft near the ground. In still air the two vortices spread outward from the runway at a few knots each. With a light crosswind from the right, about 2 knots in the worked example, the right (upwind) vortex's outward drift is cancelled and it sits over the runway, while the left vortex is carried away quickly.</desc>
