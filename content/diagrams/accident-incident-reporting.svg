<text x="340" y="390" font-size="15" fill="var(--color-warn)" font-weight="700" class="num">within 72 hours</text>
<text x="320" y="440" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">Damage limited to the engine, propeller, wheels, tyres, brakes, fairings, small dents or punctures</text>
<text x="320" y="456" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">does not by itself make it an accident. Reports go to the ATSB, not CASA.</text>
