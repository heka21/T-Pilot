<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="air">
<title>Accident, incident and what to report</title>
<desc>A decision chart. An accident is an occurrence in which a person is killed or seriously injured, the aircraft has serious damage or structural failure, or it is missing or inaccessible. Accidents, serious incidents and the listed serious events are immediately reportable: phone the ATSB as soon as practicable on 1800 011 034, then a written report within 72 hours. Other incidents that affect or could affect safety are routine reportable: a written report within 72 hours. Reports go to the ATSB, not CASA.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
