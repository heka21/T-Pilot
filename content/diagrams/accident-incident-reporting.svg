<text x="36" y="126" font-size="16" fill="var(--color-bad-fg)" font-weight="700">Accident</text>
<circle cx="42" cy="148" r="3" fill="var(--color-bad)" stroke="none"/>
<text x="52" y="152" font-size="12" fill="var(--color-bad-fg)">a person killed or seriously injured</text>
<circle cx="42" cy="168" r="3" fill="var(--color-bad)" stroke="none"/>
<text x="52" y="172" font-size="12" fill="var(--color-bad-fg)">serious damage or structural failure</text>
<circle cx="42" cy="188" r="3" fill="var(--color-bad)" stroke="none"/>
<text x="52" y="192" font-size="12" fill="var(--color-bad-fg)">aircraft missing or inaccessible</text>
<line x1="36" y1="214" x2="300" y2="214" stroke="var(--color-bad)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="36" y="236" font-size="14" fill="var(--color-bad-fg)" font-weight="700">or a serious incident</text>
<text x="36" y="256" font-size="12" fill="var(--color-bad-fg)">an accident nearly occurred: near collision,</text><text x="36" y="272.2" font-size="12" fill="var(--color-bad-fg)">runway incursion, fuel exhaustion</text>
<rect x="324" y="100" width="296" height="196" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="340" y="126" font-size="16" fill="var(--color-warn-fg)" font-weight="700">Incident</text>
<text x="340" y="150" font-size="12" fill="var(--color-warn-fg)">any other occurrence that affects or</text><text x="340" y="166.2" font-size="12" fill="var(--color-warn-fg)">could affect safety, for example:</text>
<circle cx="346" cy="196" r="3" fill="var(--color-warn)" stroke="none"/>
<text x="356" y="200" font-size="12" fill="var(--color-warn-fg)">engine failure, then a safe landing</text>
<circle cx="346" cy="216" r="3" fill="var(--color-warn)" stroke="none"/>
<text x="356" y="220" font-size="12" fill="var(--color-warn-fg)">airspace infringement</text>
<circle cx="346" cy="236" r="3" fill="var(--color-warn)" stroke="none"/>
<text x="356" y="240" font-size="12" fill="var(--color-warn-fg)">bird strike</text>
<line x1="168" y1="296" x2="168" y2="318" stroke="var(--color-bad)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="472" y1="296" x2="472" y2="318" stroke="var(--color-warn)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="20" y="322" width="296" height="92" rx="10" fill="var(--color-surface)" stroke="var(--color-bad)" stroke-width="2"/>
<text x="36" y="346" font-size="14" fill="var(--color-bad-fg)" font-weight="700">Immediately reportable</text>
<text x="36" y="368" font-size="12" fill="var(--color-fg)">phone the ATSB as soon as practicable:</text>
<text x="36" y="388" font-size="15" fill="var(--color-bad)" font-weight="700" class="num">1800 011 034</text>
<text x="160" y="388" font-size="12" fill="var(--color-fg)">then written in 72 h</text>
