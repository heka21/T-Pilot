<text x="320" y="38" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">An occurrence</text>
<text x="320" y="55" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">associated with operating an aircraft</text>
<line x1="270" y1="64" x2="168" y2="96" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
