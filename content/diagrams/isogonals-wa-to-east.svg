<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" data-prefix="iso">
<title>Why variation changes as you fly east</title>
<desc>Schematic map of Australia with dashed isogonal lines, lines of equal variation, running roughly north to south. Around Perth the variation is small and westerly, about 1 to 2 degrees west. Further east it passes through zero and becomes easterly, reaching 10 degrees east or more in the eastern states. Flying from Perth to Kalgoorlie you cross isogonals, so the variation changes; the deviation does not. Schematic only: use the values on the current chart.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="30" font-size="15" fill="var(--color-fg)" font-weight="700">Variation belongs to the place: it changes as you cross the isogonals</text>
