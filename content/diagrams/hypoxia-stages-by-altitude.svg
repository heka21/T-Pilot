<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="hsa">
<title>The four stages of hypoxia by cabin altitude</title>
<desc>Approximate cabin altitude bands: indifferent from sea level to 10,000 ft, with night vision reduced from about 5,000 ft; compensatory from 10,000 to 15,000 ft, breathing and heart rate up, drowsiness, poor judgement and reduced coordination after some time; disturbance from 15,000 to 20,000 ft, clear impairment with poor judgement, memory and coordination, cyanosis, tunnel vision and euphoria; critical above 20,000 ft, rapid mental and physical incapacity, then unconsciousness. Heights vary with the person and the day.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="112" y="270" width="512" height="140" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<text x="126" y="296" font-size="15" fill="var(--color-ok-fg)" font-weight="800">Indifferent</text>
<text x="126" y="316" font-size="12" fill="var(--color-ok-fg)">Body unbothered: haemoglobin stays nearly fully loaded.</text><text x="126" y="331.6" font-size="12" fill="var(--color-ok-fg)">Night vision reduced from about 5,000 ft; little else.</text>
<rect x="112" y="200" width="512" height="70" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="126" y="225" font-size="15" fill="var(--color-warn-fg)" font-weight="800">Compensatory</text>
<text x="126" y="245" font-size="12" fill="var(--color-warn-fg)">Breathing and heart rate increase to keep up; after some</text><text x="126" y="260.6" font-size="12" fill="var(--color-warn-fg)">time drowsiness, poor judgement, reduced coordination.</text>
<rect x="112" y="130" width="512" height="70" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<text x="126" y="155" font-size="15" fill="var(--color-bad-fg)" font-weight="800">Disturbance</text>
<text x="126" y="175" font-size="12" fill="var(--color-bad-fg)">Clear impairment: judgement, memory, coordination;</text><text x="126" y="190.6" font-size="12" fill="var(--color-bad-fg)">cyanosis, tunnel vision, euphoria.</text>
<rect x="112" y="32" width="512" height="98" fill="var(--color-bad)" stroke="var(--color-bad)" stroke-width="1.25" fill-opacity="0.28"/>
<text x="126" y="71" font-size="15" fill="var(--color-bad-fg)" font-weight="800">Critical</text>
<text x="126" y="91" font-size="12" fill="var(--color-bad-fg)">Rapid mental and physical incapacity,</text><text x="126" y="106.6" font-size="12" fill="var(--color-bad-fg)">then unconsciousness.</text>
<line x1="100" y1="410" x2="100" y2="26" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="94" y1="410" x2="100" y2="410" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
<text x="90" y="414" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" class="num">SL</text>
<line x1="94" y1="340" x2="100" y2="340" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
<text x="90" y="344" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" class="num">5,000</text>
<line x1="94" y1="270" x2="100" y2="270" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
<text x="90" y="274" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" class="num">10,000</text>
<line x1="94" y1="200" x2="100" y2="200" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
<text x="90" y="204" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" class="num">15,000</text>
<line x1="94" y1="130" x2="100" y2="130" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
<text x="90" y="134" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" class="num">20,000</text>
<line x1="94" y1="60" x2="100" y2="60" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
<text x="90" y="64" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" class="num">25,000</text>
<text x="16" y="20" font-size="12" fill="var(--color-fg-muted)" font-weight="600">Cabin altitude (ft, approx.)</text>
<line x1="112" y1="340" x2="624" y2="340" stroke="var(--color-ok)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="614" y="358" font-size="12" text-anchor="end" fill="var(--color-ok-fg)" font-weight="600">about 5,000 ft: night vision starts to fade</text>
<text x="126" y="387.6" font-size="13" fill="var(--color-ok-fg)" font-weight="600" font-style="italic">Insidious: each stage creeps in while you feel fine.</text>
