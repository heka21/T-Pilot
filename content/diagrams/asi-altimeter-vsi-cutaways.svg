<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" data-prefix="pic">
<title>Inside the three pressure instruments</title>
<desc>Airspeed indicator: pitot pressure inside a capsule, static pressure in the case around it, so the capsule moves with the difference, dynamic pressure. Altimeter: sealed, evacuated aneroid capsules in a case full of static pressure; as static pressure falls in a climb they expand. Vertical speed indicator: static pressure straight into the capsule and into the case only through a calibrated leak, so in a climb or descent the case lags and the pressure difference shows the rate.</desc>
