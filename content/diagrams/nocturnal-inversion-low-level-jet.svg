<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="nij">
<title>Nocturnal inversion and low-level jet at dawn</title>
<desc>Cross-section of the lowest few hundred feet at dawn on the coastal plain. Near the ground lies a layer of cold, dense air, cut off from the wind above, so it is calm at the surface. At the top of this inversion, a few hundred feet up, the wind jumps to 20 or 30 knots, sometimes stronger than the gradient wind: the nocturnal low-level jet, here a strong easterly. An aeroplane climbing out to the east meets a sudden headwind as it passes through the top of the inversion. A small temperature profile shows the air getting warmer with height through the inversion, then cooler above it.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="28" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Why the sudden wind change climbing out at dawn?</text>
<text x="320" y="48" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">a clear night, a summer dawn on the coastal plain, easterly above</text>
