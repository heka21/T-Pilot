<text x="66" y="42" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">lifted out of the seat</text>
<text x="378" y="26" font-size="13" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700">Positive g: pressed into the seat, blood drains to the legs</text>
