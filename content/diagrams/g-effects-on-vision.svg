<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" data-prefix="gev">
<title>What rising g does to your vision</title>
<desc>The pilot's view at each stage. Negative g, about minus 2 to minus 3 g: blood to the head, red-out, uncomfortable to painful. Plus 1 g: normal. Plus 2 to 3 g: heaviness, grey-out may begin. Plus 3 to 4 g: grey-out and tunnel vision. Plus 4 to 5 g: black-out, still conscious. Plus 5 to 6 g and above: G-LOC, incapacitated for 15 to 30 seconds or more. Vision goes before consciousness. Approximate values for a relaxed, unprotected person.</desc>
