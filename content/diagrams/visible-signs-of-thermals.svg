<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="vst">
<title>Signs of thermals you can see</title>
<desc>A hot afternoon over bare ground. Bubbles of warm air rise as thermals and build cumulus clouds with flat bases and growing tops; between the thermals the air sinks. A dust devil over the bare ground is a visible thermal, a narrow strong updraught with sharp wind changes around it. Smoke rising steadily then breaking up and birds soaring in circles also mark thermals.</desc>
