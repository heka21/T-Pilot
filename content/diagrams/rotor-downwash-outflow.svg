<title>Rotor downwash spreads outward in every direction</title>
<desc>Left: side view of a helicopter hovering close to the ground. The rotor pushes air down to hold up the helicopter's weight; the air hits the ground and spreads outward along the surface on every side. Right: plan view comparing the ring of disturbed air round a hovering helicopter with the cone behind a jet. A heavier helicopter makes a stronger and wider ring. The flow weakens with distance.</desc>
