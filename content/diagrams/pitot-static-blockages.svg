<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="psb">
<title>What each blockage does to the pressure instruments</title>
<desc>A grid of the three pressure instruments against three faults. Pitot tube and drain blocked: the ASI acts like an altimeter, over-reading in a climb and under-reading in a descent; altimeter and VSI normal. With the drain clear the ASI falls to zero. Static vent blocked: the altimeter freezes, the VSI reads zero, the ASI under-reads in a climb and over-reads in a descent. Alternate static in the cockpit: altimeter and ASI read slightly high and the VSI shows a brief climb when selected.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="32" font-size="15" fill="var(--color-fg)" font-weight="700">Static feeds all three; pitot feeds only the ASI</text>
<text x="242" y="60" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Airspeed indicator</text>
<text x="412" y="60" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Altimeter</text>
<text x="556" y="60" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="700">VSI</text>
<text x="20" y="114" font-size="13" fill="var(--color-fg)" font-weight="700">Pitot blocked</text>
<text x="20" y="130" font-size="11" fill="var(--color-fg-muted)">(drain blocked too)</text>
<rect x="148" y="74" width="188" height="84" rx="8" fill="var(--color-bad-soft)" stroke="none"/>
<text x="242" y="104" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">acts like an altimeter:</text><text x="242" y="119.6" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">over-reads climbing,</text><text x="242" y="135.2" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">under-reads descending</text>
<rect x="344" y="74" width="136" height="84" rx="8" fill="var(--color-ok-soft)" stroke="none"/>
<text x="412" y="120" font-size="12" text-anchor="middle" fill="var(--color-ok-fg)">normal</text>
