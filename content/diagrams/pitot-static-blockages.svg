<text x="556" y="120" font-size="12" text-anchor="middle" fill="var(--color-ok-fg)">normal</text>
<text x="20" y="206" font-size="13" fill="var(--color-fg)" font-weight="700">Static blocked</text>
<rect x="148" y="166" width="188" height="84" rx="8" fill="var(--color-bad-soft)" stroke="none"/>
<text x="242" y="196" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">under-reads climbing,</text><text x="242" y="211.6" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">over-reads descending</text><text x="242" y="227.2" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">(right only at that height)</text>
<rect x="344" y="166" width="136" height="84" rx="8" fill="var(--color-bad-soft)" stroke="none"/>
<text x="412" y="204" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">frozen at the</text><text x="412" y="219.6" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">blockage height</text>
<rect x="488" y="166" width="136" height="84" rx="8" fill="var(--color-bad-soft)" stroke="none"/>
<text x="556" y="212" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">reads zero</text>
