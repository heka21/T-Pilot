<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" data-prefix="hls">
<title>Which way the wind goes round highs and lows in the Southern Hemisphere</title>
<desc>Plan view, north up. Around a high the wind blows anticlockwise along the isobars; the air in it sinks, giving fine, stable weather. Around a low the wind blows clockwise; air converges and rises, giving cloud and rain. Below, the reason: between a high to the north and a low to the south the pressure gradient force pulls the air south, Coriolis deflects moving air to its left, and the two balance when the wind blows east along the isobars: a westerly, with the low on its right.</desc>
