<text x="492" y="346" font-size="11" fill="var(--color-fg)">The two balance when</text><text x="492" y="361.4" font-size="11" fill="var(--color-fg)">the wind blows along</text><text x="492" y="376.8" font-size="11" fill="var(--color-fg)">the isobars: a westerly.</text><text x="492" y="392.2" font-size="11" fill="var(--color-fg)">Back to the wind,</text><text x="492" y="407.6" font-size="11" fill="var(--color-fg)">the low is on your right.</text>
