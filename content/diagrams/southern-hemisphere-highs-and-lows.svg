<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="shl">
<title>Wind round highs and lows in the Southern Hemisphere</title>
<desc>Two plan views with north at the top. Left: a high, H, with air spiralling out of it anticlockwise, so on its northern side the wind blows from east to west. Right: a low, L, with air spiralling into it clockwise. In both, the Coriolis effect turns moving air to the left in the Southern Hemisphere. Northern Hemisphere textbooks show the reverse.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="28" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Which way does the wind go round a high and a low here?</text>
<text x="320" y="48" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">plan view, north at the top; moving air is turned to the left</text>
