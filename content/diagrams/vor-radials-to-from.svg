<title>VOR radials and the TO/FROM flag</title>
<desc>Plan view of a VOR with radials numbered clockwise from magnetic north. An aeroplane is on the 090 radial, due magnetic east of the station. A dashed line through the station at right angles to the 270/090 course divides the TO side from the FROM side. With 270 set on the OBS the needle centres and the flag reads TO: flying 270 takes you to the station. With 090 set the needle also centres but the flag reads FROM. The aeroplane's heading plays no part.</desc>
