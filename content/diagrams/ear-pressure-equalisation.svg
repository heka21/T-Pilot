t easily</text>
<text x="165" y="290" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="600">A "pop" every so often.</text>
<text x="165" y="308" font-size="13" text-anchor="middle" fill="var(--color-fg)">Rarely a problem.</text>
