 x1="588" y1="238" x2="570" y2="256" stroke="var(--color-bad)" stroke-width="3" stroke-linecap="round"/><text x="485" y="254" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="600">air can't get back in</text>
<text x="485" y="290" font-size="13" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="600">Tube swollen by a cold: ear block,</text>
<text x="485" y="308" font-size="13" text-anchor="middle" fill="var(--color-bad-fg)">pain, poor hearing, burst eardrum</text>
<rect x="16" y="332" width="608" height="54" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<text x="320" y="354" font-size="13" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="700">Equalise often on descent: swallow, yawn, Valsalva (pinch nose, gently blow).</text>
<text x="320" y="374" font-size="12" text-anchor="middle" fill="var(--color-ok-fg)">If it blocks: climb back to where it was comfortable, equalise, then descend more slowly.</text>
