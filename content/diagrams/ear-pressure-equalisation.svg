<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="epe">
<title>Why ears block on descent, not on climb</title>
<desc>Two cross-sections of the ear. On the climb the air in the middle ear expands and vents easily down the eustachian tube to the throat. On the descent outside pressure pushes the eardrum in and air must get back up the tube, whose soft end stays closed; swollen by a cold it may not open at all: ear block. Fix: climb back, equalise, descend more slowly.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="165" y="34" font-size="15" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700">Climb: outside pressure falls</text>
<text x="165" y="54" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">middle-ear air expands</text>
