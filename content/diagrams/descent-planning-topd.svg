<title>Planning the top of descent</title>
<desc>The note's descent example. Cruising at 6,500 ft, joining the circuit at 1,500 ft: 5,000 ft to lose. At 500 ft per minute that is 10 minutes; at a descent groundspeed of 110 kt the aeroplane covers 18.3 nm in that time, so the top of descent is about 18 nm before the joining point. Fuel at the illustrative cruise flow of 30 L/h is 5 L.</desc>
