<title>Which drinks rehydrate you?</title>
<desc>Five drinks compared for putting water back into a dehydrated pilot: water and diluted electrolyte drinks are absorbed quickly and kept; very sugary drinks rehydrate slowly because they hold water in the gut; alcohol and large amounts of caffeine make the kidneys pass more water than you drink. Below, the signs of dehydration, with dark urine the reliable early check and thirst a late one.</desc>
