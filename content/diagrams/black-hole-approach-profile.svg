<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="bha">
<title>Black hole approach: the path that sags</title>
<desc>Side view of a night approach over dark country to a lit runway. The normal glidepath is a straight slope to the threshold. With only the runway lights to judge by, the pilot keeps the runway's shape in the windscreen the same, and the path that does that is a curve that sags below the glidepath, low and shallow, meeting the dark scrub short of the threshold. The pilot feels high all the way down. The fix is to fly the numbers: the PAPI, a planned height against distance profile and the altimeter.</desc>
