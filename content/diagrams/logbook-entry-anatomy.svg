<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" role="img" data-prefix="lea">
<title>What a logbook entry must show</title>
<desc>One logbook entry for a one-hour solo flight of circuits and steep turns at Jandakot, split into the six questions someone checking your experience would ask: when (the date), in what (aircraft type and registration), who was in charge (the pilot in command and your role), where (departure and arrival, or the route), how long and of what kind (flight time split day and night, single or multi-engine, dual, solo and in command, with instrument and simulator time), and what was signed off (the nature of the flight and any flight test, flight review or endorsement). Each card gives the reason the column exists. A footer contrasts the logbook, which tracks the pilot, with the maintenance release, which tracks the aircraft.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
