<text x="25" y="170" font-size="12" fill="var(--color-fg-muted)">write it as soon as</text><text x="25" y="185.6" font-size="12" fill="var(--color-fg-muted)">practicable, normally</text><text x="25" y="201.2" font-size="12" fill="var(--color-fg-muted)">the same day</text>
