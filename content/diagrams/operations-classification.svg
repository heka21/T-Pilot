<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="opc">
<title>Classification of operations</title>
<desc>Four classes of operation stacked by how much the people on board rely on someone else for their safety. Private operations under CASR Part 91 only: your own purposes, equal cost sharing, flying yourself on business without hire or reward; a PPL may be pilot in command. Flight training under Parts 141 and 142: instructors, students under supervision. Aerial work under Part 138: survey, photography, agriculture, towing, dropping; a CPL. Air transport under Parts 119, 121, 133 and 135: passengers or cargo for hire or reward; a CPL or ATPL under an air operator's certificate. The one-question test: is anyone paying for the flight beyond equal cost sharing? If yes, it is not a private operation and a PPL is not enough.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="28" font-size="14" fill="var(--color-fg)" font-weight="700">Which class is this flight, and is a PPL enough?</text>
<rect x="58" y="44" width="562" height="74" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="72" y="68" font-size="14" fill="var(--color-fg)" font-weight="700">Air transport</text>
<text x="72" y="86" font-size="11.5" fill="var(--color-fg-muted)">Parts 119, 121, 133, 135</text>
<text x="250" y="66" font-size="11.5" fill="var(--color-fg)">passengers or cargo for hire or reward:</text><text x="250" y="80.95" font-size="11.5" fill="var(--color-fg)">charter and airline</text>
<text x="250" y="106" font-size="11.5" fill="var(--color-fg-muted)" font-weight="700">PIC: CPL or ATPL, under an AOC</text>
<rect x="58" y="126" width="562" height="74" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="72" y="150" font-size="14" fill="var(--color-fg)" font-weight="700">Aerial work</text>
<text x="72" y="168" font-size="11.5" fill="var(--color-fg-muted)">Part 138</text>
<text x="250" y="148" font-size="11.5" fill="var(--color-fg)">the aeroplane is the tool: survey,</text><text x="250" y="162.95" font-size="11.5" fill="var(--color-fg)">photography, agriculture, towing, dropping</text>
<text x="250" y="188" font-size="11.5" fill="var(--color-fg-muted)" font-weight="700">PIC: CPL (PPL only for specified non-commercial work)</text>
<rect x="58" y="208" width="562" height="74" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="72" y="232" font-size="14" fill="var(--color-fg)" font-weight="700">Flight training</text>
<text x="72" y="250" font-size="11.5" fill="var(--color-fg-muted)">Parts 141 and 142</text>
<text x="250" y="230" font-size="11.5" fill="var(--color-fg)">dual and solo training flights,</text><text x="250" y="244.95" font-size="11.5" fill="var(--color-fg)">flight reviews</text>
<text x="250" y="270" font-size="11.5" fill="var(--color-fg-muted)" font-weight="700">PIC: instructors; students under supervision</text>
<rect x="58" y="290" width="562" height="74" rx="8" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<text x="72" y="314" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Private operations</text>
<text x="72" y="332" font-size="11.5" fill="var(--color-brand-fg)">Part 91 only</text>
<text x="250" y="312" font-size="11.5" fill="var(--color-fg)">your own purposes, equal cost sharing,</text><text x="250" y="326.95" font-size="11.5" fill="var(--color-fg)">flying yourself on business, unpaid</text>
<text x="250" y="352" font-size="11.5" fill="var(--color-brand-fg)" font-weight="700">PIC: PPL (RPL within its narrower privileges)</text>
<line x1="34" y1="360" x2="34" y2="50" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="26" y="205" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)" transform="rotate(-90 26 205)">people on board rely more on someone else</text>
<rect x="58" y="378" width="562" height="52" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="2"/>
<text x="72" y="400" font-size="13" fill="var(--color-warn-fg)" font-weight="700">The test: is anyone paying for the flight beyond equal cost sharing?</text>
<text x="72" y="418" font-size="12" fill="var(--color-warn-fg)">Yes: not a private operation, and a PPL is not enough.</text>
