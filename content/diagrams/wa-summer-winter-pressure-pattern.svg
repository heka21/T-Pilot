<title>Summer and winter pressure patterns over Western Australia</title>
<desc>Two simplified maps of Australia. Summer, about November to March: a high in the Great Australian Bight, a west coast trough along the Western Australian coast, and a hot, dry easterly over Perth on the high's northern side. Winter: the belt of highs has moved north over the continent, the south-west lies in the westerlies beneath them, and cold fronts sweep in from the Indian Ocean every few days.</desc>
