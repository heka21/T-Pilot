<text x="320" y="28" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Why easterlies in summer and fronts in winter?</text>
<text x="320" y="48" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">where the high sits decides Perth's weather</text>
