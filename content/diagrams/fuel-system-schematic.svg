<!-- generated by tools/diagrams/sketch.mjs from tools/diagrams/schematics/fuel-system-schematic.svg; edit the schematic, not this file -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="fss">
<title>A light aeroplane fuel system, and where water collects</title>
<desc>Two wing tanks, each with a vent at the top and a drain at its lowest point, feed a fuel selector. From the selector fuel passes through the strainer (gascolator), which has its own drain at the lowest point of the system, then an electric booster pump where fitted and the engine-driven pump, to the carburettor. Water is heavier than fuel and settles at the low points, which is why the drains are there and why each is sampled before flight.</desc>
