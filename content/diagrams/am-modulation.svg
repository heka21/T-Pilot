<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" data-prefix="amm">
<title>How your voice rides on the carrier</title>
<desc>Three traces. The audio from the microphone is a slow wave. The transmitter's carrier is a steady radio-frequency wave on the selected frequency, for example 118.1 MHz. Amplitude modulation varies the carrier's strength in step with the audio while its frequency stays fixed; the outline of the result is the voice. Below, two stations transmitting at once on the same frequency: the two carriers clash and an AM receiver produces a squeal or garble, so listeners know a call was blocked.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="28" font-size="16" fill="var(--color-fg)" font-weight="700">Amplitude modulation: the voice changes the carrier's strength</text>
