<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" data-prefix="fdf">
<title>Which document answers which question</title>
<desc>Runway data comes from the ERSA FAC entry. For a prohibited, restricted or danger area: the VNC, VTC or ERC-L shows its identifier and vertical limits; the ERSA PRD section and AIP ENR 5.1 give the hours, controlling authority and conditional status; NOTAMs can activate or change it; when in doubt, call the controlling authority.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="30" font-size="14" fill="var(--color-fg)" font-weight="700">Runway data</text>
<rect x="20" y="42" width="600" height="64" rx="8" fill="var(--color-info-soft)" stroke="var(--color-line)" stroke-width="1"/><text x="32" y="62" font-size="13" fill="var(--color-info-fg)" font-weight="700">ERSA FAC entry for the aerodrome</text><text x="32" y="79.55" font-size="12" fill="var(--color-info-fg)">elevation, runway designators, length and width (m), surface, slope, lighting,</text><text x="32" y="95.15" font-size="12" fill="var(--color-info-fg)">CTAF, remarks. Runway distances supplement: TORA, TODA, ASDA, LDA.</text>
<text x="20" y="140" font-size="14" fill="var(--color-fg)" font-weight="700">Is that restricted area active? Work down the chain</text>
<rect x="20" y="156" width="600" height="42" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<circle cx="42" cy="177" r="12" fill="var(--color-brand)" stroke="none"/>
<text x="42" y="182" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700">1</text>
<text x="64" y="182" font-size="13" fill="var(--color-fg)" font-weight="700">Chart: VNC, VTC or ERC-L</text>
<text x="320" y="182" font-size="12" fill="var(--color-fg-muted)">identifier and vertical limits (not the WAC)</text>
<line x1="42" y1="190" x2="42" y2="206" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="20" y="208" width="600" height="42" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<circle cx="42" cy="229" r="12" fill="var(--color-brand)" stroke="none"/>
<text x="42" y="234" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700">2</text>
<text x="64" y="234" font-size="13" fill="var(--color-fg)" font-weight="700">ERSA PRD / AIP ENR 5.1</text>
<text x="320" y="234" font-size="12" fill="var(--color-fg-muted)">hours, controlling authority, RA status</text>
<line x1="42" y1="242" x2="42" y2="258" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="20" y="260" width="600" height="42" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<circle cx="42" cy="281" r="12" fill="var(--color-warn)" stroke="none"/>
<text x="42" y="286" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700">3</text>
<text x="64" y="286" font-size="13" fill="var(--color-fg)" font-weight="700">NOTAM</text>
<text x="320" y="286" font-size="12" fill="var(--color-fg-muted)">activated, deactivated or limits changed?</text>
<line x1="42" y1="294" x2="42" y2="310" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="20" y="312" width="600" height="42" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<circle cx="42" cy="333" r="12" fill="var(--color-ok)" stroke="none"/>
<text x="42" y="338" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700">4</text>
<text x="64" y="338" font-size="13" fill="var(--color-fg)" font-weight="700">Still unsure?</text>
<text x="320" y="338" font-size="12" fill="var(--color-fg-muted)">call the controlling authority listed in ERSA</text>
<rect x="20" y="370" width="600" height="96" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="390" font-size="13" fill="var(--color-fg)" font-weight="700">Conditional status of a restricted area</text>
<rect x="34.77" y="399.2" width="34.46" height="17.6" rx="8.8" fill="var(--color-ok-soft)" stroke="none"/><text x="52" y="411.85" font-size="11" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="600">RA1</text>
<text x="80" y="412" font-size="12" fill="var(--color-fg-muted)">clearance normally available: you may plan through it</text>
<rect x="34.77" y="419.2" width="34.46" height="17.6" rx="8.8" fill="var(--color-warn-soft)" stroke="none"/><text x="52" y="431.85" font-size="11" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="600">RA2</text>
<text x="80" y="432" font-size="12" fill="var(--color-fg-muted)">clearance not likely at short notice: plan to avoid it</text>
<rect x="34.77" y="439.2" width="34.46" height="17.6" rx="8.8" fill="var(--color-bad-soft)" stroke="none"/><text x="52" y="451.85" font-size="11" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="600">RA3</text>
<text x="80" y="452" font-size="12" fill="var(--color-fg-muted)">no clearance will be available</text>
<text x="20" y="484" font-size="11" fill="var(--color-fg-faint)">If an area is shown as activated by NOTAM and no NOTAM has activated it, it is inactive.</text>
