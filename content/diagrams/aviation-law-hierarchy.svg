<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="alh">
<title>Where the rules live</title>
<desc>A stepped stack of the aviation documents: the Civil Aviation Act at the top, then the regulations (CASR 1998 and CAR 1988), the Manuals of Standards made under CASR Parts, the remaining Civil Aviation Orders, then the operational information published by Airservices (AIP, ERSA, DAP, charts and NOTAM), and at the base the guidance material (Advisory Circulars and the Visual Flight Rules Guide), which is not law.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="30" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">From the Act down to the guidance you carry</text>
<rect x="130" y="66" width="380" height="52" rx="6" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<text x="144" y="87" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Civil Aviation Act 1988</text>
<text x="144" y="106" font-size="11.5" fill="var(--color-brand-fg)">the Act of Parliament: creates CASA and the framework</text>
<rect x="112" y="126" width="416" height="52" rx="6" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<text x="126" y="147" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Regulations: CASR 1998 and CAR 1988</text>
<text x="126" y="166" font-size="11.5" fill="var(--color-brand-fg)">CASR: Part 61 licences, 67 medicals, 91 rules; CAR: Part 4A MR</text>
<rect x="94" y="186" width="452" height="52" rx="6" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<text x="108" y="207" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Manuals of Standards (MOS)</text>
<text x="108" y="226" font-size="11.5" fill="var(--color-brand-fg)">detail made under a CASR Part: Part 61 MOS (this syllabus), Part 91 MOS</text>
<rect x="76" y="246" width="488" height="52" rx="6" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<text x="90" y="267" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Civil Aviation Orders (CAO)</text>
<text x="90" y="286" font-size="11.5" fill="var(--color-brand-fg)">remaining orders made under the CAR, mostly replaced by the CASR</text>
<rect x="58" y="306" width="524" height="52" rx="6" fill="var(--color-sky-soft)" stroke="var(--color-sky-fg)" stroke-width="1.25"/>
<text x="72" y="327" font-size="14" fill="var(--color-sky-fg)" font-weight="700">AIP · ERSA · DAP · charts · NOTAM</text>
<text x="72" y="346" font-size="11.5" fill="var(--color-sky-fg)">the operational information: how, where and when, today</text>
<rect x="40" y="366" width="560" height="52" rx="6" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="54" y="387" font-size="14" fill="var(--color-fg)" font-weight="700">Advisory Circulars and the VFRG</text>
<text x="54" y="406" font-size="11.5" fill="var(--color-fg-muted)">guidance, not law; the VFRG is permitted in the RPL and PPL exams</text>
<line x1="26" y1="66" x2="26" y2="298" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round"/>
<text x="16" y="182" font-size="13" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="700" transform="rotate(-90 16 182)">LAW</text>
<line x1="26" y1="306" x2="26" y2="358" stroke="var(--color-sky-fg)" stroke-width="2" stroke-linecap="round"/>
<text x="16" y="332" font-size="12" text-anchor="middle" fill="var(--color-sky-fg)" font-weight="700" transform="rotate(-90 16 332)">INFO</text>
<line x1="26" y1="366" x2="26" y2="418" stroke="var(--color-fg-faint)" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="16" y="392" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700" transform="rotate(-90 16 392)">GUIDE</text>
<text x="320" y="438" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">Legislation: Federal Register of Legislation.  AIP, ERSA, charts, NOTAM: Airservices Australia.</text>
<text x="320" y="456" font-size="11.5" text-anchor="middle" fill="var(--color-fg-faint)">The VFRG summarises the law in plain words; it does not replace it.</text>
