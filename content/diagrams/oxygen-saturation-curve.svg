<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="osc">
<title>Haemoglobin is forgiving, then it isn't</title>
<desc>A qualitative sketch of how fully haemoglobin is loaded with oxygen against cabin altitude. Near sea level it stays almost fully loaded, so 5,000 or 8,000 ft make little difference to the oxygen the blood carries. Somewhere above about 10,000 ft its grip weakens and saturation falls away steeply: the symptoms of hypoxia begin, and the supplemental oxygen rules start at about that height.</desc>
