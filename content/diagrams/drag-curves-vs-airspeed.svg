<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="dcv">
<title>Drag against airspeed</title>
<desc>Parasite drag rises with the square of the airspeed; induced drag falls as speed rises. Their sum, total drag, is U-shaped with its minimum where the two are equal: the speed for the best lift/drag ratio. Slower than that is the back side of the curve.</desc>
