<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="dle">
<title>A dented leading edge trips the flow</title>
<desc>Two wing sections at the same angle of attack. With a clean leading edge the airflow follows the upper surface almost to the trailing edge. With a dented leading edge, from a bird strike, the flow is tripped into turbulence and separates early, well forward on the wing. Beside them, the lift curves: the damaged wing reaches a lower maximum lift at a smaller critical angle, so it stalls at a higher speed than the POH figure, and that wing stalls first and drops.</desc>
