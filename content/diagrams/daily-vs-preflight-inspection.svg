<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" data-prefix="dvp">
<title>Daily inspection or pre-flight inspection?</title>
<desc>Comparison. Daily inspection: once a day before the first flight, to the daily inspection schedule, by a licensed engineer or an authorised pilot, certified on the maintenance release, valid for the rest of the day. Pre-flight inspection: before every flight, the POH walk-around by the pilot in command, not certified.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="150" y="30" width="240" height="36" rx="8" fill="var(--color-brand-soft)" stroke="none"/>
<rect x="400" y="30" width="220" height="36" rx="8" fill="var(--color-info-soft)" stroke="none"/>
<text x="270" y="53" font-size="15" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="700">Daily inspection</text>
<text x="510" y="53" font-size="15" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">Pre-flight inspection</text>
<line x1="20" y1="78" x2="620" y2="78" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="98" font-size="13" fill="var(--color-fg)" font-weight="700">When</text>
<text x="160" y="98" font-size="12" fill="var(--color-fg)">Before the first flight of each day</text>
<text x="410" y="98" font-size="12" fill="var(--color-fg)">Before every flight</text>
<line x1="20" y1="116" x2="620" y2="116" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="136" font-size="13" fill="var(--color-fg)" font-weight="700">To what</text>
<text x="160" y="136" font-size="12" fill="var(--color-fg)">The daily inspection schedule</text>
<text x="410" y="136" font-size="12" fill="var(--color-fg)">The POH walk-around</text>
<line x1="20" y1="154" x2="620" y2="154" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="174" font-size="13" fill="var(--color-fg)" font-weight="700">By whom</text>
<text x="160" y="174" font-size="12" fill="var(--color-fg)">Licensed engineer, or a pilot</text><text x="160" y="190.2" font-size="12" fill="var(--color-fg)">authorised by the operator for the type</text>
<text x="410" y="174" font-size="12" fill="var(--color-fg)">The pilot in command</text>
<line x1="20" y1="208" x2="620" y2="208" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="228" font-size="13" fill="var(--color-fg)" font-weight="700">Certified?</text>
<text x="160" y="228" font-size="12" fill="var(--color-fg)">Yes: on the maintenance release,</text><text x="160" y="244.2" font-size="12" fill="var(--color-fg)">valid for the rest of that day</text>
<text x="410" y="228" font-size="12" fill="var(--color-fg)" font-weight="700">No</text>
<rect x="20" y="272" width="600" height="40" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="297" font-size="12" fill="var(--color-fg-muted)">Either way, the pilot in command must be satisfied the aircraft is airworthy before flight.</text>
</svg>
