<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="sfr">
<title>What a 2 percent upslope takes away</title>
<desc>Left, an aeroplane on an upsloping runway, the slope exaggerated. Its weight splits into a part into the runway and a part acting back down the slope, very nearly the weight times the slope: about 2 percent of the weight on a 2 percent slope. Right, the force budget on the take-off roll: thrust minus drag and rolling resistance leaves a net accelerating force that is only a modest fraction of the weight, so losing 2 percent of the weight to the slope takes a real share of it. Rule of thumb: about 10 percent more take-off distance. Landing uphill, the same force helps the brakes.</desc>
