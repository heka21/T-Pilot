<title>Australia's three standard time zones</title>
<desc>Map of Australia in three standard time zones: Western Standard Time, UTC plus 8, in Western Australia; Central Standard Time, UTC plus 9 and a half, in South Australia and the Northern Territory; Eastern Standard Time, UTC plus 10, in Queensland, New South Wales, the ACT, Victoria and Tasmania. At 0200 UTC it is 1000 WST, 1130 CST and 1200 EST. The date changes at 1400 UTC in the east, 1430 UTC in the centre and 1600 UTC in the west. Western Australia has no daylight saving; some eastern and southern states move their clocks an hour forward in summer.</desc>
