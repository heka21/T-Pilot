<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" data-prefix="etp">
<title>Excess thrust sets Vx, excess power sets Vy</title>
<desc>Two graphs against airspeed for a propeller aeroplane. Above, thrust available falls as speed rises and drag is a U-shaped curve; the gap between them, the excess thrust, is greatest at a low speed: Vx, best angle. Below, power available and power required; the gap, the excess power, is greatest at a higher speed: Vy, best rate. Power is thrust times speed, so multiplying by the speed moves the peak to the right.</desc>
