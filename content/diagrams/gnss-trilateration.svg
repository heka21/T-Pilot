<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" data-prefix="gtr">
<title>Trilateration and the receiver's clock</title>
<desc>Drawn flat. Left: each satellite's range is a circle centred on the satellite; with a perfect clock the three circles meet at one point, the receiver's position. Right: the receiver's clock is wrong, so every range is wrong by the same amount (pseudoranges) and the circles no longer meet at a point but enclose a small triangle. Because the error is the same for every satellite, one extra measurement lets the receiver adjust its own clock, shrinking every range by the same amount until they meet at a single point. In three dimensions that extra measurement is the fourth satellite.</desc>
