<title>Taxiway signs: red is mandatory, yellow informs</title>
<desc>Left: plan view of taxiway A leading up to runway 24R, with a junction to taxiway B. Beside the taxiway before the junction stand a location sign (A, yellow letters on black: the taxiway you are on) and a direction sign (B with an arrow, black letters on yellow: which way to go). Beside the runway holding position marking, two solid then two dashed yellow lines, stands a mandatory sign 24R in white letters on red: stop on the solid side and do not pass without permission. Right: the three signs explained.</desc>
