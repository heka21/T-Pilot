<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="scd">
<title>Cylinder head temperature in a long descent</title>
<desc>Qualitative sketch, no scale. Cylinder head temperature against time from the top of descent to the circuit. Closing the throttle to idle for a long glide makes the CHT fall fast, because the engine makes little heat while the fast airflow removes a lot; the parts cool at different rates and the stresses can crack cylinders, and the engine ends up cold, rich and prone to fouling and carburettor ice. A descent with some power kept on, in stages, lets the CHT fall slowly and stay warm.</desc>
