<text x="392" y="246" font-size="12" fill="var(--color-ok-fg)" font-weight="600">much less noise</text>
<text x="392" y="261" font-size="11" fill="var(--color-ok-fg)">at the eardrum</text>
<rect x="16" y="286" width="608" height="62" rx="10" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="30" y="308" font-size="12" fill="var(--color-fg)" font-weight="600">Passive protection (every headset, earplugs): the seal and shell block the noise.</text>
<text x="30" y="326" font-size="12" fill="var(--color-fg-muted)">Cracked cushions, glasses arms, hair or a cap under the seal let it leak in.</text>
<text x="30" y="342" font-size="12" fill="var(--color-fg-muted)">A good seal or ANR lets you keep the radio volume low.</text>
</svg>
