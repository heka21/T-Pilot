<!-- generated by tools/diagrams; do not edit, change the generator and run `python -m tools.diagrams.build` -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" data-prefix="anr">
<title>How a headset cuts engine noise</title>
<desc>Passive protection: the ear seal and shell block noise, but only if the seal is intact. Active noise reduction: a microphone hears the low-frequency engine and propeller drone and the electronics play an opposite sound wave, so the two cancel and much less reaches the ear.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="16" y="30" font-size="14" fill="var(--color-fg)" font-weight="700">Active noise reduction (ANR): best for the low-frequency drone</text>
