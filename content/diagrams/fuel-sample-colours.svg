<text x="34" y="352" font-size="13" fill="var(--color-bad-fg)" font-weight="700">A clear sample from an AVGAS aeroplane is water or jet fuel.</text>
<text x="34" y="372" font-size="11" fill="var(--color-bad-fg)">Either way, do not fly until the cause is found. Jet fuel in a piston engine can fail it just after take-off.</text>
