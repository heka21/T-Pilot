<title>What the fuel sample should look like</title>
<desc>Fuel testers side by side: AVGAS 100LL is blue, AVGAS 100/130 is green, Jet A-1 is clear to straw coloured. A sample with clear globules or a separate layer at the bottom contains water. A clear sample from an AVGAS aeroplane means water or jet fuel: do not fly until the cause is found.</desc>
