<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" role="img" data-prefix="fai">
<title>Common injuries after a forced landing: what to do, and what not to do</title>
<desc>Six cards, each with the first aid action and the mistake to avoid, from the lesson on the ERSA's first aid guidance. Bleeding: firm direct pressure on a pad, raise the limb, keep the pressure on; do not lift the pad to look. Burns: cool under clean running water for 20 minutes and cover loosely; no ice, butter or creams. Fractures: immobilise as found with padding and a splint; do not straighten. Shock: lie them down, keep them warm, reassure them; nothing by mouth. Spinal injury: keep them still; move them only for immediate danger such as fire. Unconscious but breathing: the recovery position, on the side with the airway clear; not on the back, where vomit can go into the lungs.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="26" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">After DRSABCD: the common injuries</text>
<text x="320" y="44" font-size="12" text-anchor="end" fill="var(--color-ok-fg)" font-weight="700">do this</text>
<text x="326" y="44" font-size="12" text-anchor="middle" fill="var(--color-fg-faint)">·</text>
<text x="332" y="44" font-size="12" fill="var(--color-bad-fg)" font-weight="700">never this</text>
<rect x="16" y="60" width="194" height="178" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="28" y="84" font-size="14" fill="var(--color-fg)" font-weight="700">Bleeding</text>
<path d="M188 69 C194 77 197 82 197 86 A9 9 0 0 1 179 86 C179 82 182 77 188 69 Z" stroke="var(--color-bad)" stroke-width="1.25" fill="var(--color-bad-soft)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="106" font-size="11" fill="var(--color-ok-fg)" font-weight="700">DO</text>
<text x="28" y="122" font-size="12" fill="var(--color-fg)">Firm direct pressure</text><text x="28" y="137.6" font-size="12" fill="var(--color-fg)">on a pad, limb raised;</text><text x="28" y="153.2" font-size="12" fill="var(--color-fg)">keep the pressure on</text>
<line x1="28" y1="182" x2="198" y2="182" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="28" y="200" font-size="11" fill="var(--color-bad-fg)" font-weight="700">DON'T</text>
<text x="28" y="216" font-size="12" fill="var(--color-fg-muted)">Lift the pad to look:</text><text x="28" y="231.6" font-size="12" fill="var(--color-fg-muted)">the clot breaks</text>
<rect x="222" y="60" width="194" height="178" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="234" y="84" font-size="14" fill="var(--color-fg)" font-weight="700">Burns</text>
<path d="M394 69 C402 78 404 84 401 90 C398 94 390 94 387 90 C384 84 390 79 394 69 Z" stroke="var(--color-warn)" stroke-width="1.25" fill="var(--color-warn-soft)" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 91 C389 85 393 82 394 79 C397 84 399 87 397 91" stroke="var(--color-warn)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="234" y="106" font-size="11" fill="var(--color-ok-fg)" font-weight="700">DO</text>
<text x="234" y="122" font-size="12" fill="var(--color-fg)">Cool under clean running</text><text x="234" y="137.6" font-size="12" fill="var(--color-fg)">water for 20 minutes;</text><text x="234" y="153.2" font-size="12" fill="var(--color-fg)">cover loosely: cling film</text>
<line x1="234" y1="182" x2="404" y2="182" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="234" y="200" font-size="11" fill="var(--color-bad-fg)" font-weight="700">DON'T</text>
<text x="234" y="216" font-size="12" fill="var(--color-fg-muted)">Ice, butter or creams:</text><text x="234" y="231.6" font-size="12" fill="var(--color-fg-muted)">they damage or trap heat</text>
<rect x="428" y="60" width="194" height="178" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="440" y="84" font-size="14" fill="var(--color-fg)" font-weight="700">Fractures</text>
<line x1="592" y1="88" x2="608" y2="76" stroke="var(--color-fg-muted)" stroke-width="5" stroke-linecap="round"/><circle cx="590" cy="87" r="3.2" fill="var(--color-fg-muted)" stroke="none"/><circle cx="593" cy="91" r="3.2" fill="var(--color-fg-muted)" stroke="none"/><circle cx="610" cy="77" r="3.2" fill="var(--color-fg-muted)" stroke="none"/><circle cx="607" cy="73" r="3.2" fill="var(--color-fg-muted)" stroke="none"/>
<text x="440" y="106" font-size="11" fill="var(--color-ok-fg)" font-weight="700">DO</text>
<text x="440" y="122" font-size="12" fill="var(--color-fg)">Immobilise it as found,</text><text x="440" y="137.6" font-size="12" fill="var(--color-fg)">with padding and a splint</text>
<line x1="440" y1="182" x2="610" y2="182" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="440" y="200" font-size="11" fill="var(--color-bad-fg)" font-weight="700">DON'T</text>
<text x="440" y="216" font-size="12" fill="var(--color-fg-muted)">Straighten it to make</text><text x="440" y="231.6" font-size="12" fill="var(--color-fg-muted)">the splint fit</text>
<rect x="16" y="250" width="194" height="178" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="28" y="274" font-size="14" fill="var(--color-fg)" font-weight="700">Shock</text>
<circle cx="177" cy="274" r="4" fill="var(--color-surface)" stroke="var(--color-fg-muted)" stroke-width="1.25"/><rect x="182" y="270" width="20" height="9" rx="3" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1.25"/><line x1="173" y1="282" x2="204" y2="282" stroke="var(--color-fg-faint)" stroke-width="1" stroke-linecap="round"/>
<text x="28" y="296" font-size="11" fill="var(--color-ok-fg)" font-weight="700">DO</text>
<text x="28" y="312" font-size="12" fill="var(--color-fg)">Pale, cold, clammy, fast</text><text x="28" y="327.6" font-size="12" fill="var(--color-fg)">weak pulse: lie them</text><text x="28" y="343.2" font-size="12" fill="var(--color-fg)">down, keep them warm,</text><text x="28" y="358.8" font-size="12" fill="var(--color-fg)">reassure them</text>
<line x1="28" y1="372" x2="198" y2="372" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="28" y="390" font-size="11" fill="var(--color-bad-fg)" font-weight="700">DON'T</text>
<text x="28" y="406" font-size="12" fill="var(--color-fg-muted)">Give anything by mouth</text>
<rect x="222" y="250" width="194" height="178" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="234" y="274" font-size="14" fill="var(--color-fg)" font-weight="700">Spinal injury</text>
<rect x="388" y="258" width="12" height="5" rx="2" fill="var(--color-surface-2)" stroke="var(--color-fg-muted)" stroke-width="1"/><rect x="389" y="265" width="12" height="5" rx="2" fill="var(--color-surface-2)" stroke="var(--color-fg-muted)" stroke-width="1"/><rect x="388" y="272" width="12" height="5" rx="2" fill="var(--color-surface-2)" stroke="var(--color-fg-muted)" stroke-width="1"/><rect x="389" y="279" width="12" height="5" rx="2" fill="var(--color-surface-2)" stroke="var(--color-fg-muted)" stroke-width="1"/>
<text x="234" y="296" font-size="11" fill="var(--color-ok-fg)" font-weight="700">DO</text>
<text x="234" y="312" font-size="12" fill="var(--color-fg)">Neck or back pain,</text><text x="234" y="327.6" font-size="12" fill="var(--color-fg)">numbness, tingling, a</text><text x="234" y="343.2" font-size="12" fill="var(--color-fg)">heavy impact: keep</text><text x="234" y="358.8" font-size="12" fill="var(--color-fg)">them still</text>
<line x1="234" y1="372" x2="404" y2="372" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="234" y="390" font-size="11" fill="var(--color-bad-fg)" font-weight="700">DON'T</text>
<text x="234" y="406" font-size="12" fill="var(--color-fg-muted)">Move them, unless there</text><text x="234" y="421.6" font-size="12" fill="var(--color-fg-muted)">is fire or other danger</text>
<rect x="428" y="250" width="194" height="178" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="440" y="274" font-size="14" fill="var(--color-fg)" font-weight="700">Unconscious</text>
<circle cx="589" cy="270" r="4" fill="var(--color-surface)" stroke="var(--color-ok)" stroke-width="1.25"/><path d="M594 272 L606 273 L612 280 M606 273 L614 273 M597 272 L596 279" stroke="var(--color-ok)" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="585" y1="282" x2="616" y2="282" stroke="var(--color-fg-faint)" stroke-width="1" stroke-linecap="round"/>
<text x="440" y="296" font-size="11" fill="var(--color-ok-fg)" font-weight="700">DO</text>
<text x="440" y="312" font-size="12" fill="var(--color-fg)">Breathing normally:</text><text x="440" y="327.6" font-size="12" fill="var(--color-fg)">recovery position, on</text><text x="440" y="343.2" font-size="12" fill="var(--color-fg)">the side, airway clear;</text><text x="440" y="358.8" font-size="12" fill="var(--color-fg)">keep checking</text>
<line x1="440" y1="372" x2="610" y2="372" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="440" y="390" font-size="11" fill="var(--color-bad-fg)" font-weight="700">DON'T</text>
<text x="440" y="406" font-size="12" fill="var(--color-fg-muted)">Leave them on the back:</text><text x="440" y="421.6" font-size="12" fill="var(--color-fg-muted)">vomit goes to the lungs</text>
<text x="320" y="448" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Danger first, always: a fire risk outweighs every other rule here, including the spinal one.</text>
</svg>
