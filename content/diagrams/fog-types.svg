<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" data-prefix="fgt">
<title>Four kinds of fog and what clears each</title>
<desc>Four panels. Radiation fog: on a clear night with a light wind the ground radiates its heat and cools moist air to its dew point, and fog pools in the valleys; the sun or a stronger wind clears it. Advection or sea fog: moist air moves over a colder sea and is cooled from below, day or night with moderate winds, and drifts onto the coast; only a change of wind direction clears it. Frontal fog: rain from the warm air above a front falls into the cold air below and saturates it; it clears when the front passes. Steaming fog: very cold air flows over much warmer water and evaporation saturates it; heating clears it.</desc>
