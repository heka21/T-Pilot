<title>Slope and surface: what they do to the distances</title>
<desc>A table of the effect of runway slope and surface on take-off distance, landing distance and take-off climb. Uphill: take-off longer, landing shorter, climb reduced relative to rising ground. Downhill: take-off shorter, landing longer, climb unchanged with terrain falling away. Wet sealed: little change for take-off, landing longer. Wet grass: both longer. Slush or waterlogged: both greatly longer, climb unchanged but starting later.</desc>
