<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" data-prefix="gwp">
<title>Passing a waypoint on the GNSS receiver</title>
<desc>Plan view: an aeroplane flies a leg to a waypoint. On approach the receiver gives a waypoint alert. With turn anticipation it starts the turn early, cutting the corner, and sequences to the next leg slightly early so the desired track changes. In OBS mode there is no sequencing: the receiver keeps you on the old course past the waypoint. Below, the distance to the waypoint counts down to zero; in OBS mode it then counts up and the TO flag changes to FROM, while with auto-sequencing the display switches to the next leg and counts down to the next waypoint.</desc>
<style>.gwp-mv{animation:gwp-mv 7s linear infinite;transform-origin:0 0}
