<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="vtt">
<title>Adding forces tip to tail</title>
<desc>Three cases of adding two forces. Same direction: 300 N plus 300 N gives a resultant of 600 N. Opposite directions: 300 N forward and 300 N back give a resultant of zero, so the motion does not change. At right angles: draw the second arrow from the tip of the first; the resultant runs from the tail of the first to the tip of the second, the long side of a right-angled triangle.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="30" font-size="14" fill="var(--color-fg)" font-weight="700">Draw the second arrow from the tip of the first; the resultant joins tail to tip</text>
<rect x="14" y="48" width="196" height="288" rx="10" fill="var(--color-surface-2)" stroke="none"/>
<text x="112" y="72" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Same direction</text>
<rect x="220" y="48" width="196" height="288" rx="10" fill="var(--color-surface-2)" stroke="none"/>
<text x="318" y="72" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Opposite directions</text>
<rect x="426" y="48" width="196" height="288" rx="10" fill="var(--color-surface-2)" stroke="none"/>
<text x="524" y="72" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">At right angles</text>
<line x1="34" y1="170" x2="108" y2="170" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="110" y1="170" x2="184" y2="170" stroke="var(--color-warn)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="71" y="158" font-size="12" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700" class="num">300 N</text>
<text x="147" y="158" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700" class="num">300 N</text>
<line x1="34" y1="210" x2="184" y2="210" stroke="var(--color-brand)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="109" y="234" font-size="13" text-anchor="middle" fill="var(--color-brand)" font-weight="700" class="num">resultant 600 N</text>
<text x="112" y="300" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">add the numbers</text>
<line x1="250" y1="162" x2="370" y2="162" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="310" y="150" font-size="12" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700" class="num">300 N forward</text>
<line x1="370" y1="178" x2="250" y2="178" stroke="var(--color-warn)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="310" y="198" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700" class="num">300 N back</text>
<circle cx="250" cy="234" r="6" fill="var(--color-brand)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="264" y="239" font-size="13" fill="var(--color-brand)" font-weight="700" class="num">resultant 0</text>
<text x="318" y="284" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">the tip returns to the tail:</text>
<text x="318" y="300" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">no change of motion</text>
<line x1="454" y1="250" x2="574" y2="250" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="574" y1="250" x2="574" y2="110" stroke="var(--color-warn)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="514" y="270" font-size="13" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">A</text>
<text x="584" y="184" font-size="13" fill="var(--color-warn-fg)" font-weight="700">B</text>
<line x1="454" y1="250" x2="571" y2="114" stroke="var(--color-brand)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="504" y="174" font-size="14" text-anchor="end" fill="var(--color-brand)" font-weight="700">R</text>
