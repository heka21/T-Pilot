<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="nhd">
<title>How long before noise damages hearing?</title>
<desc>Safe daily exposure time against sound level, from the guide in the note: 85 dB(A) averaged over 8 hours risks permanent damage, and each 3 dB more halves the safe time: about 4 hours at 88, 2 at 91, 1 at 94, 30 minutes at 97 and 15 minutes at 100 dB. A piston single's cabin is typically 85 to 100 dB. A headset that lowers the level at the ear buys time.</desc>
