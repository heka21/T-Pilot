<text x="169.14" y="238.67" font-size="12" fill="var(--color-ok-fg)" font-weight="600">A good headset seal,</text>
<text x="169.14" y="253.67" font-size="12" fill="var(--color-ok-fg)">ANR or earplugs lower the</text>
<text x="169.14" y="268.67" font-size="12" fill="var(--color-ok-fg)">level at the ear: more time</text>
<text x="320" y="392" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Noise-induced hearing loss is permanent, painless and cumulative.</text>
<text x="320" y="410" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Turning the radio up adds sound energy at the eardrum; a better seal lets you keep it low.</text>
