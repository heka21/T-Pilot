<title>What the dead-cut check proves</title>
<desc>Left: with the switch at OFF, an intact P-lead connects the magneto to earth, it makes no spark and the engine falters: the switch works. Right: a broken P-lead leaves the magneto unearthed, it keeps sparking with the switch at OFF and the engine keeps running: the magneto is live and anyone who moves the propeller could start the engine.</desc>
