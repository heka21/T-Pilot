<text x="40" y="326" font-size="14" fill="var(--color-fg-muted)" font-weight="700">Dead side</text>
<text x="40" y="344" font-size="11" fill="var(--color-fg-muted)">the other side of the runway for a left-hand circuit: kept clear of circuit traffic;</text>
<text x="40" y="358" font-size="11" fill="var(--color-fg-muted)">aircraft joining from overhead descend here to circuit height, then cross to join crosswind</text>
<text x="40" y="84" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Circuit side</text>
<text x="40" y="100" font-size="11" fill="var(--color-brand-fg)">all turns to the left, 1,000 ft above aerodrome level</text>
