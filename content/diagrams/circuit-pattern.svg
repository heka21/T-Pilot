<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="cp">
<title>The standard left-hand circuit</title>
<desc>Plan view of a left-hand circuit on runway 24: upwind leg climbing straight ahead, left turn onto crosswind at or above 500 feet, downwind at 1,000 feet above aerodrome level parallel to the runway, base leg descending, final onto the runway. The dead side is the right-hand side of the runway, away from the circuit.</desc>
<style>.cp-plane{offset-path:path("M200 262 L500 262 Q540 262 540 222 L540 150 Q540 110 500 110 L140 110 Q100 110 100 150 L100 222 Q100 262 140 262 L200 262");offset-rotate:auto;animation:cp-fly 18s linear infinite}
@keyframes cp-fly{to{offset-distance:100%}}
.cp-plane-static{display:none}
@supports not (offset-path: path("M0 0")){.cp-plane{display:none}.cp-plane-static{display:inline}}</style>
