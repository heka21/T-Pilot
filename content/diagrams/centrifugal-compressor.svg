<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" data-prefix="ccw">
<title>How a centrifugal compressor squeezes the air</title>
<desc>A centrifugal compressor seen face on. Air enters at the hub of the spinning impeller, is flung outwards by its curved vanes and leaves the rim fast. The snail-shaped housing around the rim gradually widens, so the air slows down and its speed is turned into pressure before it leaves for the engine. Three gauges along the path show the speed low then high then low again, while the pressure rises at the rim and rises further in the widening housing. The faster the impeller spins, the more it squeezes. The gear-driven supercharger spins it from the crankshaft, the turbocharger from an exhaust turbine on the same shaft.</desc>
<style>.ccw-spin{animation:ccw-spin 2.4s linear infinite}@keyframes ccw-spin{to{transform:rotate(360deg)}}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="28" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Fling it out, then slow it down: speed becomes pressure</text>
