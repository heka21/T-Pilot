<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="mbe">
<title>Flying through a microburst on approach</title>
<desc>Side view of a microburst beneath a thunderstorm: a strong downdraught hits the ground and spreads out in all directions. An aeroplane on approach first meets the outflow as a headwind (airspeed and lift up, it floats above the path), then the downdraught (it sinks), then the outflow as a tailwind (airspeed and lift down) with the ground close.</desc>
