<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="adz">
<title>ADIZ entry: matching the plan to the radar</title>
<desc>Plan view of a VFR track crossing an ADIZ boundary at the planned entry point in the flight notification. A window around the planned entry point shows the track tolerance; a timeline below shows the time tolerance around the planned entry time. An aircraft on track and on time falls inside both and is identified. An aircraft off track, or late beyond the time tolerance, without telling ATS, may be treated as unidentified and may be intercepted. Advising ATS of the deviation as soon as possible, before the boundary, restores the match. The actual tolerances are in AIP ENR 2.2; no figures are shown.</desc>
