<title>How a VOR bearing error grows with distance</title>
<desc>Plan view to scale. A VOR/DME on the left and a waypoint 50 nm out along a radial. A bearing error of 1 degree puts the waypoint about 0.8 nm to either side; an error of 5 degrees about 4.2 nm. The wedge widens with distance, by the 1 in 60 rule. A GNSS position is good to about 5 to 15 m wherever you are.</desc>
