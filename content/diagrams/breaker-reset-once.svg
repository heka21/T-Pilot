<text x="230" y="250" font-size="12" fill="var(--color-ok-fg)">A single trip may be</text><text x="230" y="266.2" font-size="12" fill="var(--color-ok-fg)">a momentary spike,</text><text x="230" y="282.4" font-size="12" fill="var(--color-ok-fg)">which one reset clears.</text>
<rect x="412" y="208" width="208" height="196" rx="9" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="2"/>
<text x="426" y="231" font-size="14" fill="var(--color-bad-fg)" font-weight="700">Leave it out</text>
<text x="426" y="250" font-size="12" fill="var(--color-bad-fg)">A real overload or short</text><text x="426" y="266.2" font-size="12" fill="var(--color-bad-fg)">(a chafed wire on the</text><text x="426" y="282.4" font-size="12" fill="var(--color-bad-fg)">airframe). Holding it in or</text><text x="426" y="298.6" font-size="12" fill="var(--color-bad-fg)">resetting it again can</text><text x="426" y="314.8" font-size="12" fill="var(--color-bad-fg)">start an electrical fire.</text>
<line x1="426" y1="340" x2="610" y2="340" stroke="var(--color-bad)" stroke-width="1" stroke-linecap="round"/>
<text x="426" y="364" font-size="12.5" fill="var(--color-bad-fg)" font-weight="700">Treat the radio as failed;</text>
<text x="426" y="383" font-size="12.5" fill="var(--color-bad-fg)" font-weight="700">write it up.</text>
<text x="20" y="428" font-size="12" fill="var(--color-fg-faint)">A breaker opens itself when too much current flows, to stop the wiring overheating.</text>
