<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" role="img" data-prefix="brs">
<title>A popped circuit breaker: reset once</title>
<desc>Left, a push-button circuit breaker drawn side on: pushed in, the cap sits flush on the panel; popped, it stands out and shows its collar. Right, the flow when a radio breaker pops: reset it once. If it holds, carry on and watch it; a single trip may be a momentary spike. If it pops again, leave it out: there is a real overload or short, and holding it in or resetting it again and again can start an electrical fire. Treat the radio as failed and write it up.</desc>
