<line x1="36" y1="216" x2="176" y2="216" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="106" y="240" font-size="13" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700">Popped</text>
<line x1="106" y1="250" x2="106" y2="270" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="113" y="265" font-size="12" fill="var(--color-brand-fg)" font-weight="700">reset once</text>
<rect x="88" y="318" width="36" height="40" rx="3" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/><line x1="46" y1="318" x2="166" y2="318" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round"/><rect x="97" y="292" width="18" height="26" fill="var(--color-surface)" stroke="var(--color-warn)" stroke-width="1.25"/><line x1="97" y1="312" x2="115" y2="312" stroke="var(--color-warn)" stroke-width="1" stroke-linecap="round"/><line x1="97" y1="305" x2="115" y2="305" stroke="var(--color-warn)" stroke-width="1" stroke-linecap="round"/><line x1="97" y1="298" x2="115" y2="298" stroke="var(--color-warn)" stroke-width="1" stroke-linecap="round"/><rect x="89" y="276" width="34" height="16" rx="5" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="2"/>
<text x="106" y="376" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">stands out, collar</text>
<text x="106" y="391" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">showing: circuit off</text>
<rect x="216" y="48" width="404" height="54" rx="9" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="230" y="71" font-size="14" fill="var(--color-warn-fg)" font-weight="700">A radio breaker pops</text>
<text x="230" y="90" font-size="12" fill="var(--color-warn-fg)">the commonest cause of a radio that has gone dark on its own</text>
<line x1="418" y1="102" x2="418" y2="114" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
