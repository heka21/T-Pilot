<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="sap">
<title>The SAR alerting phases</title>
<desc>When a SARTIME expires uncancelled, the search and rescue response is staged, coordinated by the JRCC: the uncertainty phase, then the alert phase, then the distress phase, each a step higher. As it moves through them the actions escalate: attempts to contact you (calls on frequency, a phone call to your destination), then a communications search to aerodromes and contacts along your route, then a physical search by aircraft and ground parties. Effort grows only as the evidence grows. The search starts from your notified route and time.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="28" font-size="14" fill="var(--color-fg)" font-weight="700">Effort grows only as the evidence that you are in trouble grows</text>
<rect x="20" y="238" width="128" height="62" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="84" y="262" font-size="12.5" text-anchor="middle" fill="var(--color-fg)" font-weight="700">SARTIME passes</text><text x="84" y="278.25" font-size="12.5" text-anchor="middle" fill="var(--color-fg)" font-weight="700">uncancelled</text>
<rect x="164" y="236" width="144" height="64" rx="6" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="236" y="262" font-size="15" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700">Uncertainty</text>
<text x="236" y="280" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">phase</text>
<rect x="316" y="184" width="144" height="116" rx="6" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="388" y="210" font-size="15" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700">Alert</text>
<text x="388" y="228" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">phase</text>
<rect x="468" y="132" width="144" height="168" rx="6" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="2"/>
<text x="540" y="158" font-size="15" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">Distress</text>
<text x="540" y="176" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">phase</text>
<line x1="150" y1="269" x2="160" y2="269" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="20" y="70" font-size="12.5" fill="var(--color-fg)" font-weight="600">Coordinated by the JRCC, the Joint Rescue</text>
<text x="20" y="88" font-size="12.5" fill="var(--color-fg)" font-weight="600">Coordination Centre (AMSA)</text>
<text x="20" y="120" font-size="11.5" fill="var(--color-fg-muted)">Forgot to cancel? You are usually</text>
<text x="20" y="136" font-size="11.5" fill="var(--color-fg-muted)">found by the first step, at the cost</text>
<text x="20" y="152" font-size="11.5" fill="var(--color-fg-muted)">of a lot of people's time.</text>
<text x="20" y="330" font-size="13" fill="var(--color-fg)" font-weight="700">The actions escalate in this order</text>
<rect x="20" y="342" width="192" height="84" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<circle cx="40" cy="362" r="11" fill="var(--color-warn)" stroke="none"/><text x="40" y="366" font-size="12" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">1</text>
<text x="58" y="367" font-size="12" fill="var(--color-fg)" font-weight="700">Contact you</text>
<text x="34" y="388" font-size="11.5" fill="var(--color-fg-muted)">calls on frequency,</text><text x="34" y="402.95" font-size="11.5" fill="var(--color-fg-muted)">a phone call to your</text><text x="34" y="417.9" font-size="11.5" fill="var(--color-fg-muted)">destination</text>
<line x1="213" y1="384" x2="223" y2="384" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="224" y="342" width="192" height="84" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<circle cx="244" cy="362" r="11" fill="var(--color-warn)" stroke="none"/><text x="244" y="366" font-size="12" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">2</text>
<text x="262" y="367" font-size="12" fill="var(--color-fg)" font-weight="700">Communications search</text>
<text x="238" y="388" font-size="11.5" fill="var(--color-fg-muted)">aerodromes and contacts</text><text x="238" y="402.95" font-size="11.5" fill="var(--color-fg-muted)">along your notified route</text>
<line x1="417" y1="384" x2="427" y2="384" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="428" y="342" width="192" height="84" rx="8" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<circle cx="448" cy="362" r="11" fill="var(--color-bad)" stroke="none"/><text x="448" y="366" font-size="12" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">3</text>
<text x="466" y="367" font-size="12" fill="var(--color-bad-fg)" font-weight="700">Physical search</text>
<text x="442" y="388" font-size="11.5" fill="var(--color-fg-muted)">aircraft and ground</text><text x="442" y="402.95" font-size="11.5" fill="var(--color-fg-muted)">parties</text>
</svg>
