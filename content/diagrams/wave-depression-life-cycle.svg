<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 566" role="img" data-prefix="wdl">
<title>How a wave on a front becomes an occlusion</title>
<desc>Four Southern Hemisphere plan views, north up, systems moving east. 1: a stationary front with warm tropical air to the north and cold polar air to the south flowing past each other. 2: a kink forms and a low develops at its poleward tip. 3: a wave depression, with air circulating clockwise round the low, a warm front ahead of it, a cold front behind it and the warm sector between them. 4: the faster cold front catches the warm front near the low and lifts the warm sector off the ground: an occluded front.</desc>
