<title>Full-throttle power falls with altitude</title>
<desc>Power available at full throttle from a normally aspirated engine, as a percentage of sea-level power, against altitude. It falls by roughly 3 percent per 1000 ft, so by about 7000 to 8000 ft a typical trainer can only produce about 75 percent power.</desc>
