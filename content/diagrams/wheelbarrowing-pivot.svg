<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="whb">
<title>Wheelbarrowing: a pivot ahead of the weight</title>
<desc>Two cases. Normal: the main wheels, just behind the centre of gravity, carry the weight; seen from above, a swing is pulled straight again, like a trolley. Wheelbarrowing: landed fast and flat with the nose held down, the wing still lifts, the main wheels go light and the nosewheel, ahead of the centre of gravity, becomes the pivot; seen from above, any swing grows into a ground loop. Cure: ease the control column back (throttle closed) or go around.</desc>
