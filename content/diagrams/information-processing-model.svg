<text x="195" y="34" font-size="12" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="600">feedback: monitor</text>
<text x="195" y="48" font-size="12" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="600">the result</text>
<rect x="141" y="296" width="483" height="44" rx="8" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1.25"/>
<text x="153" y="315" font-size="12" fill="var(--color-info-fg)" font-weight="700">Short-term (working) memory: about 7 ± 2 items for 15 to 30 s</text>
<text x="153" y="331" font-size="12" fill="var(--color-info-fg)">an interruption wipes it: write clearances down</text>
<rect x="141" y="348" width="483" height="44" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="153" y="367" font-size="12" fill="var(--color-fg)" font-weight="700">Long-term memory: large and durable</text>
<text x="153" y="383" font-size="12" fill="var(--color-fg-muted)">but recall depends on cues and can fail under stress</text>
<line x1="320" y1="226" x2="320" y2="294" stroke="var(--color-info)" stroke-width="1.25" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="445" y1="226" x2="445" y2="294" stroke="var(--color-info)" stroke-width="1.25" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="16" y="410" font-size="12" fill="var(--color-bad)" font-weight="700">Errors enter at every stage:</text>
<text x="70" y="430" font-size="11" text-anchor="middle" fill="var(--color-bad)" font-weight="600">cue not sensed</text>
<text x="195" y="430" font-size="11" text-anchor="middle" fill="var(--color-bad)" font-weight="600">attention elsewhere</text>
<text x="320" y="430" font-size="11" text-anchor="middle" fill="var(--color-bad)" font-weight="600">cue misperceived</text>
<text x="445" y="430" font-size="11" text-anchor="middle" fill="var(--color-bad)" font-weight="600">poor decision</text>
<text x="570" y="430" font-size="11" text-anchor="middle" fill="var(--color-bad)" font-weight="600">badly executed</text>
