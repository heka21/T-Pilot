<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="ipm">
<title>How the brain turns the senses into action</title>
<desc>The information-processing model: senses with a short-lived sensory store, attention as a limited single channel, perception against experience and expectation, the mental model (situational awareness), decision and action, with feedback through the senses. Short-term memory holds about 7 plus or minus 2 items for 15 to 30 seconds; long-term memory is large but recall can fail under stress. Errors can enter at every stage.</desc>
