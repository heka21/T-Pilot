<text x="195" y="166" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">single channel:</text><text x="195" y="181.6" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">one demanding</text><text x="195" y="197.2" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">task at a time</text>
<line x1="251" y1="172" x2="264" y2="172" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="266" y="120" width="108" height="104" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<text x="320" y="144" font-size="15" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="800">Perception</text>
<text x="320" y="166" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)">compared with</text><text x="320" y="181.6" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)">experience and</text><text x="320" y="197.2" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)">expectation</text>
<line x1="376" y1="172" x2="389" y2="172" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="391" y="120" width="108" height="104" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<text x="445" y="144" font-size="15" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="800">Decision</text>
<text x="445" y="166" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)">choose what</text><text x="445" y="181.6" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)">to do</text>
<line x1="501" y1="172" x2="514" y2="172" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="516" y="120" width="108" height="104" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<text x="570" y="144" font-size="15" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="800">Action</text>
<text x="570" y="166" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)">act on the</text><text x="570" y="181.6" font-size="12" text-anchor="middle" fill="var(--color-brand-fg)">controls, radio</text>
<text x="195" y="244" font-size="11" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="600">many cues in,</text><text x="195" y="258.3" font-size="11" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="600">few get through</text>
