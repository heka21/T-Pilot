<text x="70" y="166" font-size="12" text-anchor="middle" fill="var(--color-info-fg)">eyes, ears,</text><text x="70" y="181.6" font-size="12" text-anchor="middle" fill="var(--color-info-fg)">balance, touch</text>
<line x1="126" y1="172" x2="139" y2="172" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
