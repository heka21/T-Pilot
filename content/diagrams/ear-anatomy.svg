<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="ean">
<title>The ear: outer, middle and inner</title>
<desc>Cross-section of the ear. The outer ear (ear flap and canal) collects sound and channels it to the eardrum. The air-filled middle ear holds three tiny bones (hammer, anvil, stirrup) that pass the vibration to the inner ear, and connects to the throat through the eustachian tube. The fluid-filled inner ear holds the cochlea for hearing and the vestibular apparatus for balance: three semicircular canals sensing angular acceleration and the otolith organs sensing linear acceleration and gravity. A eustachian tube blocked by a cold causes pain on descent.</desc>
