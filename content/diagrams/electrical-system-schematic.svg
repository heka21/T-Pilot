<title>How power flows in a light aeroplane's electrical system</title>
<desc>The belt-driven alternator feeds the bus bar in flight and recharges the battery. The battery, through the master switch and the ammeter, turns the starter and is the reserve if the alternator fails. Every service draws from the bus bar through its own circuit breaker, which cuts an overloaded circuit before the wiring overheats. The magnetos are not on this system.</desc>
