<text x="412" y="318" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Steady climb: forces balance</text>
<text x="412" y="340" font-size="13" fill="var(--color-brand-fg)" font-weight="600" class="num">Thrust = Drag + W sin γ</text>
<text x="412" y="360" font-size="13" fill="var(--color-brand-fg)" font-weight="600" class="num">Lift   = W cos γ  (&lt; W)</text>
