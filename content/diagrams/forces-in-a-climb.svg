<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="fic">
<title>Forces in a steady climb</title>
<desc>A climbing aeroplane with lift perpendicular to the flight path, thrust along it, drag opposite it and weight vertical. Weight splits into a part along the path, W sin of the climb angle, which adds to drag, and a part across it, W cos of the climb angle, which lift balances. So thrust must equal drag plus W sin gamma, and lift is a little less than weight.</desc>
