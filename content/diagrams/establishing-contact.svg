<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" data-prefix="ecx">
<title>Establishing two-way contact</title>
<desc>A sequence between you and Melbourne Centre. First call: the station you are calling, your call-sign, and request: 'Melbourne Centre, Cessna 172 Alpha Bravo Charlie, request traffic', short so that the controller is ready before the details. Then wait for the reply. No reply: wait at least about 10 seconds before calling again, and check the frequency, the volume, the MIC selector and range. Centre answers using your call-sign. You give the rest of the message. Centre's reply includes an item that must be read back, such as a QNH. You read it back and end with your call-sign: 'QNH one zero one niner, Alpha Bravo Charlie', which catches both your mishearing and the controller's slip.</desc>
