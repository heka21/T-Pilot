<line x1="80" y1="78" x2="80" y2="430" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="548" y1="78" x2="548" y2="430" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="86" y1="116" x2="540" y2="116" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="314" y="93" font-size="13" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="600">“Melbourne Centre, Cessna 172 Alpha Bravo Charlie,</text><text x="314" y="107.95" font-size="13" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="600">request traffic”</text>
<text x="314" y="134" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">station, call-sign, request: short, so they are ready before the details</text>
<rect x="120" y="150" width="388" height="54" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="314" y="172" font-size="13" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="600">Wait for the reply. Nothing after about 10 s?</text>
<text x="314" y="192" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">Check frequency, volume, MIC selector, range; call again</text>
<line x1="542" y1="236" x2="88" y2="236" stroke="var(--color-info)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="314" y="228" font-size="13" text-anchor="middle" fill="var(--color-info-fg)" font-weight="600">Centre answers, calling you by call-sign</text>
<line x1="86" y1="286" x2="540" y2="286" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="314" y="278" font-size="13" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="600">The rest of the message</text>
<line x1="542" y1="344" x2="88" y2="344" stroke="var(--color-info)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="314" y="336" font-size="13" text-anchor="middle" fill="var(--color-info-fg)" font-weight="600">… an item to read back, e.g. “QNH one zero one niner”</text>
<line x1="86" y1="402" x2="540" y2="402" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="314" y="394" font-size="13" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="600">Readback: “QNH one zero one niner, Alpha Bravo Charlie”</text>
<text x="544" y="424" font-size="12" text-anchor="end" fill="var(--color-brand-fg)">ends with your call-sign</text>
<text x="320" y="452" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">The readback is a two-way check: it catches your mishearing and the controller's slip.</text>
