<title>Turn radius: bank and speed</title>
<desc>Turn radius in metres against bank angle at 90 and 120 knots. At 90 knots the radius is about 380 m at 30 degrees, 220 m at 45 degrees and 125 m at 60 degrees. At 120 knots every radius is about 1.78 times larger, the square of 120 over 90. On the right, the three 90 knot circles drawn to scale. Weight does not appear.</desc>
