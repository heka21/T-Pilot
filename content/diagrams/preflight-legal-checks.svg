<title>The walk-around items the law requires</title>
<desc>Plan view of the aeroplane with eight numbered items: 1 locking devices removed (control and gust locks, pitot cover, engine blanks); 2 doors and hatches secured; 3 tank caps fitted and secure; 4 frost, ice and snow removed from wings, tail and control surfaces; 5 flight controls full, free and correct; 6 instruments checked; 7 the empty control seat's harness secured before solo; 8 fuel drained at each drain point for water and contamination, at the first flight of the day and after refuelling, once the fuel has settled.</desc>
