<text x="28" y="104" font-size="11" fill="var(--color-fg)">weather, terrain, traffic,</text><text x="28" y="119.4" font-size="11" fill="var(--color-fg)">ATC changes, defects,</text><text x="28" y="134.8" font-size="11" fill="var(--color-fg)">passengers, time pressure</text>
