<text x="320" y="58" font-size="15" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">Errors</text>
<text x="320" y="76" font-size="11" text-anchor="middle" fill="var(--color-info-fg)">your action or inaction</text>
<text x="244" y="104" font-size="11" fill="var(--color-fg)">handling, procedural,</text><text x="244" y="119.4" font-size="11" fill="var(--color-fg)">communication; e.g. the</text><text x="244" y="134.8" font-size="11" fill="var(--color-fg)">landing flap not set</text>
<rect x="448" y="34" width="176" height="128" rx="12" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="2"/>
<text x="536" y="58" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">Undesired aircraft state</text>
<text x="536" y="76" font-size="11" text-anchor="middle" fill="var(--color-bad-fg)">safety margins reduced</text>
<text x="460" y="104" font-size="11" fill="var(--color-fg)">position, speed, attitude</text><text x="460" y="119.4" font-size="11" fill="var(--color-fg)">or configuration; e.g.</text><text x="460" y="134.8" font-size="11" fill="var(--color-fg)">fast and long on final</text>
