<text x="580" y="254" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700">Incident or</text><text x="580" y="270.9" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700">accident</text>
<text x="16" y="322" font-size="14" fill="var(--color-fg)" font-weight="700">Single-pilot countermeasures, every flight</text>
<rect x="16" y="334" width="188" height="86" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/><text x="28" y="357.2" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Anticipate</text><text x="28" y="376.05" font-size="11" fill="var(--color-brand-fg)">before each phase: what</text><text x="28" y="390.9" font-size="11" fill="var(--color-brand-fg)">threats are ahead? Brief</text><text x="28" y="405.75" font-size="11" fill="var(--color-brand-fg)">yourself out loud.</text>
<rect x="226" y="334" width="188" height="86" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/><text x="238" y="357.2" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Recognise</text><text x="238" y="376.05" font-size="11" fill="var(--color-brand-fg)">monitor and cross-check</text><text x="238" y="390.9" font-size="11" fill="var(--color-brand-fg)">so threats, errors and</text><text x="238" y="405.75" font-size="11" fill="var(--color-brand-fg)">UAS are spotted early</text>
<rect x="436" y="334" width="188" height="86" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/><text x="448" y="357.2" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Recover</text><text x="448" y="376.05" font-size="11" fill="var(--color-brand-fg)">trap the error, manage</text><text x="448" y="390.9" font-size="11" fill="var(--color-brand-fg)">the threat, get out of the</text><text x="448" y="405.75" font-size="11" fill="var(--color-brand-fg)">UAS: go around, turn back</text>
<text x="320" y="444" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">Tools: planning, briefings, checklists and SOPs, monitoring, workload management, personal minimums.</text>
<text x="320" y="462" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="600">In any undesired aircraft state: aviate, navigate, communicate.</text>
