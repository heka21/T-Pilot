<text x="428" y="24" font-size="11" text-anchor="middle" fill="var(--color-bad)" font-weight="600">mismanaged</text>
<line x1="104" y1="164" x2="104" y2="252" stroke="var(--color-ok)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
