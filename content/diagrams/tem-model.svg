<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" data-prefix="tem">
<title>Threat and error management</title>
<desc>Threats (outside the pilot's control) and errors (the pilot's own actions or inactions) can each be managed, leaving the flight safe, or mismanaged, leading on: a mismanaged threat or error becomes an undesired aircraft state, the last stage before an incident or accident. Example: pre-landing flap not set, trapped by the pre-landing check; if not trapped, a fast, long approach that needs a go-around. Countermeasures: anticipate, recognise, recover.</desc>
