<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" data-prefix="scf">
<title>Why the canals miss a steady turn</title>
<desc>The horizontal semicircular canal seen from above, in three moments of a turn to the right. When rotation starts, the canal turns but the fluid lags and bends the cupula: you feel the turn. In a steady turn, after about 10 to 20 seconds, the fluid has caught up and the cupula is upright: the sensation has gone. When the rotation stops, the fluid runs on and bends the cupula the other way: you feel a turn in the opposite direction. A graph below compares the actual rate of turn with what is felt.</desc>
