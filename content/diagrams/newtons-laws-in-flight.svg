<text x="20" y="30" font-size="15" fill="var(--color-fg)" font-weight="700">Three laws, three things you see on every flight</text>
<rect x="14" y="46" width="300" height="196" rx="10" fill="var(--color-surface-2)" stroke="none"/>
<text x="28" y="70" font-size="14" fill="var(--color-fg)" font-weight="700">1  Balanced forces: no change</text>
