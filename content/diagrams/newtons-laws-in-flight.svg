<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="nlf">
<title>Newton's three laws in flight</title>
<desc>First law: in steady cruise lift equals weight and thrust equals drag, so there is no net force and no change of motion. Second law: on the take-off roll a 1,000 kg aeroplane with 2,500 N of thrust against 1,000 N of drag and rolling friction has a net force of 1,500 N and accelerates at 1.5 metres per second squared. Third law: the propeller drives air backwards and the air drives the aeroplane forwards; the wing deflects air downwards and the air pushes the wing up.</desc>
