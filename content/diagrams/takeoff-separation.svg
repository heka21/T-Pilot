<title>When you may take off behind another aircraft</title>
<desc>Side view of a runway at a non-controlled aerodrome. You may not take off until the aircraft ahead on the same runway has landed and vacated it, or has taken off and crossed the upwind end or commenced a turn, or is airborne and far enough ahead of your intended lift-off point: 600 m if both aircraft are under 2,000 kg MTOW, 1,800 m if the runway is longer than 1,800 m. Landing uses the same gaps from your touchdown point.</desc>
