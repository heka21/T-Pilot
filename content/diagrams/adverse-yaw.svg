<text x="402" y="44" font-size="14" fill="var(--color-bad)" font-weight="700">1 · Aileron alone, rolling right</text>
<text x="402" y="68" font-size="12" fill="var(--color-fg)">The down-going aileron gives the</text><text x="402" y="83.6" font-size="12" fill="var(--color-fg)">rising left wing more lift and more</text><text x="402" y="99.2" font-size="12" fill="var(--color-fg)">induced drag. The drag pulls that</text><text x="402" y="114.8" font-size="12" fill="var(--color-fg)">wing back: the nose swings away</text><text x="402" y="130.4" font-size="12" fill="var(--color-fg)">from the turn. This is adverse yaw.</text>
