<title>Adverse aileron yaw and how rudder fixes it</title>
<desc>Plan view, aeroplane flying left to right and rolling right. Top: with aileron alone, the down-going aileron on the rising left wing makes more induced drag, so the nose yaws left, away from the turn. Bottom: right rudder applied with the right aileron pushes the tail left and the nose right, so the nose follows the turn and the ball stays centred.</desc>
