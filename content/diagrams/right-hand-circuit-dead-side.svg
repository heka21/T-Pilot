<title>Right-hand circuits move the dead side</title>
<desc>Two plan views of runway 31, landing from left to right on the page. Top: the default left-hand circuit, with the circuit on the south-west side and the dead side on the north-east. Bottom: right-hand circuits for runway 31, as ERSA shows in the worked example: upwind 310, crosswind about 040, downwind 130, base about 220, final 310, all on the north-east side, so the dead side is now the south-west, to the left of the runway looking along the landing direction. An aeroplane flies the right-hand circuit.</desc>
