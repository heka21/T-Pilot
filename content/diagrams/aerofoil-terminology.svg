<title>Aerofoil terminology</title>
<desc>A cambered aerofoil section, flying to the right, with its leading edge, trailing edge, chord line, mean camber line and camber; the relative airflow meets it at the angle of attack, the angle between the chord line and the relative airflow. Lift acts through the centre of pressure at right angles to the relative airflow. An inset shows span and chord on a wing seen from above.</desc>
