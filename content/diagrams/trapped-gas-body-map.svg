<text x="16" y="330" font-size="12" fill="var(--color-bad-fg)" font-weight="600">Fix: climb back, equalise</text><text x="16" y="346.2" font-size="12" fill="var(--color-bad-fg)" font-weight="600">(swallow, yawn, Valsalva),</text><text x="16" y="362.4" font-size="12" fill="var(--color-bad-fg)" font-weight="600">then descend more slowly</text>
