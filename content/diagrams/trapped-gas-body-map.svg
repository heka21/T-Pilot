<title>Where trapped gas hurts, and when</title>
<desc>A head and torso with the four places gas is trapped. Ears (middle ear) and sinuses hurt on the descent: their air contracts and must get back in through a narrow passage that a cold or hay fever can block. Gut and teeth hurt on the climb: their gas expands inside a space it cannot leave quickly.</desc>
