<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" data-prefix="rpp">
<title>Three paths for a radio wave</title>
<desc>A transmitter on the curved earth. The ground wave (LF and MF) hugs the surface and fades with distance, further over sea than over land: this is how NDBs are received. The sky wave (HF) is refracted back down by the ionosphere, about 60 to 400 km up, and reaches the ground far away, hop after hop. The space wave (VHF and UHF) travels in a straight line: it reaches an aircraft in line of sight, and a wave aimed upwards passes through the ionosphere into space.</desc>
