<title>Where to wait behind a jet at the holding point</title>
<desc>Plan view of a holding point. A regional jet is about to line up and will use breakaway thrust, then take-off power. Directly behind its tail is the worst place to be; the best is to the side of its tail and as far back as the taxiway allows, angled so the blast does not hit your tail or a wing broadside.</desc>
