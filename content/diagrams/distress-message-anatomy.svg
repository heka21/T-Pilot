<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" role="img" data-prefix="dma">
<title>What goes in a MAYDAY, in order</title>
<desc>The lesson's engine-failure MAYDAY near Northam split into its parts in the AIP order: the signal MAYDAY three times, then the station addressed (Melbourne Centre), call-sign and type, nature of the emergency (engine failure), intentions (forced landing in a paddock), position, level and heading (8 miles north-east of Northam, passing 2,000, heading 230), and other useful information (two POB). The most essential items come first in case the call is cut short. A PAN PAN message uses the same order.</desc>
<style>.dma-read{animation:dma-read 7s steps(7,end) infinite}
@keyframes dma-read{from{transform:translateY(0)}to{transform:translateY(364px)}}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="30" font-size="16" fill="var(--color-fg)" font-weight="700">MAYDAY: who, what, what next, where, the rest</text>
<text x="20" y="50" font-size="12" fill="var(--color-fg-muted)">Engine failure near Northam, on the Melbourne Centre frequency</text>
<text x="72" y="72" font-size="12" fill="var(--color-fg-faint)" font-weight="600">Item</text>
<text x="190" y="72" font-size="12" fill="var(--color-fg-faint)" font-weight="600">What you say</text>
<text x="442" y="72" font-size="12" fill="var(--color-fg-faint)" font-weight="600">Why it is there</text>
<circle cx="52" cy="106" r="11" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1"/>
<text x="52" y="110.5" font-size="11" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="700" class="num">×3</text>
<text x="72" y="110.5" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Signal</text>
<rect x="190" y="84" width="240" height="44" rx="8" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1"/>
<text x="202" y="110.5" font-size="12.5" fill="var(--color-brand-fg)" font-style="italic">MAYDAY MAYDAY MAYDAY</text>
<text x="442" y="102" font-size="12" fill="var(--color-fg-muted)">recognised through noise;</text><text x="442" y="117.6" font-size="12" fill="var(--color-fg-muted)">clears the frequency</text>
<circle cx="52" cy="158" r="11" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="52" y="162.5" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">1</text>
<text x="72" y="154" font-size="13" fill="var(--color-fg)" font-weight="700">Station</text><text x="72" y="170.9" font-size="13" fill="var(--color-fg)" font-weight="700">addressed</text>
<rect x="190" y="136" width="240" height="44" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="202" y="162.5" font-size="12.5" fill="var(--color-fg)" font-style="italic">Melbourne Centre,</text>
<text x="442" y="154" font-size="12" fill="var(--color-fg-muted)">who you are calling; skip</text><text x="442" y="169.6" font-size="12" fill="var(--color-fg-muted)">it if unknown or no time</text>
<circle cx="52" cy="210" r="11" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="52" y="214.5" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">2</text>
<text x="72" y="206" font-size="13" fill="var(--color-fg)" font-weight="700">Call-sign</text><text x="72" y="222.9" font-size="13" fill="var(--color-fg)" font-weight="700">and type</text>
<rect x="190" y="188" width="240" height="44" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="202" y="206.5" font-size="12.5" fill="var(--color-fg)" font-style="italic">Cessna 172 Alpha Bravo Charlie,</text><text x="202" y="222.75" font-size="12.5" fill="var(--color-fg)" font-style="italic">Alpha Bravo Charlie (×3)</text>
<text x="442" y="206" font-size="12" fill="var(--color-fg-muted)">who you are; the type tells</text><text x="442" y="221.6" font-size="12" fill="var(--color-fg-muted)">searchers what to look for</text>
<circle cx="52" cy="262" r="11" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="52" y="266.5" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">3</text>
<text x="72" y="258" font-size="13" fill="var(--color-fg)" font-weight="700">Nature of the</text><text x="72" y="274.9" font-size="13" fill="var(--color-fg)" font-weight="700">emergency</text>
<rect x="190" y="240" width="240" height="44" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="202" y="266.5" font-size="12.5" fill="var(--color-fg)" font-style="italic">engine failure,</text>
<text x="442" y="258" font-size="12" fill="var(--color-fg-muted)">what kind of help</text><text x="442" y="273.6" font-size="12" fill="var(--color-fg-muted)">is needed</text>
<circle cx="52" cy="314" r="11" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="52" y="318.5" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">4</text>
<text x="72" y="318.5" font-size="13" fill="var(--color-fg)" font-weight="700">Intentions</text>
<rect x="190" y="292" width="240" height="44" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="202" y="318.5" font-size="12.5" fill="var(--color-fg)" font-style="italic">forced landing in a paddock,</text>
<text x="442" y="310" font-size="12" fill="var(--color-fg-muted)">what you will do (in a forced</text><text x="442" y="325.6" font-size="12" fill="var(--color-fg-muted)">landing: where you will be)</text>
<circle cx="52" cy="366" r="11" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="52" y="370.5" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">5</text>
<text x="72" y="362" font-size="13" fill="var(--color-fg)" font-weight="700">Position,</text><text x="72" y="378.9" font-size="13" fill="var(--color-fg)" font-weight="700">level, heading</text>
<rect x="190" y="344" width="240" height="44" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="202" y="362.5" font-size="12.5" fill="var(--color-fg)" font-style="italic">8 miles north-east of Northam,</text><text x="202" y="378.75" font-size="12.5" fill="var(--color-fg)" font-style="italic">passing 2,000, heading 230,</text>
<text x="442" y="370" font-size="12" fill="var(--color-fg-muted)">narrows the search area</text>
<circle cx="52" cy="418" r="11" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="52" y="422.5" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">6</text>
<text x="72" y="414" font-size="13" fill="var(--color-fg)" font-weight="700">Other useful</text><text x="72" y="430.9" font-size="13" fill="var(--color-fg)" font-weight="700">information</text>
<rect x="190" y="396" width="240" height="44" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="202" y="422.5" font-size="12.5" fill="var(--color-fg)" font-style="italic">two POB.</text>
<text x="442" y="414" font-size="12" fill="var(--color-fg-muted)">POB, endurance, colour:</text><text x="442" y="429.6" font-size="12" fill="var(--color-fg-muted)">useful, least essential</text>
<rect x="38" y="80" width="590" height="52" rx="10" fill="none" stroke="var(--color-brand)" stroke-width="2" class="dma-read"/>
<line x1="22" y1="90" x2="22" y2="434" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="14" y="266" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="600" transform="rotate(-90 14 266)">most essential first</text>
<rect x="20" y="458" width="600" height="40" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="475" font-size="12" fill="var(--color-fg)">Then squawk 7700, fly the aeroplane, and activate the ELT as the landing becomes certain.</text>
<text x="32" y="491" font-size="12" fill="var(--color-fg-muted)">A PAN PAN, PAN PAN, PAN PAN message uses exactly the same order.</text>
