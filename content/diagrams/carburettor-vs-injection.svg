<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="cvi">
<title>Why fuel injection does not get carburettor ice</title>
<desc>Left: in a carburettor the air speeds up through the venturi, its pressure and temperature drop, and fuel evaporating in it cools it further, upstream of the throttle butterfly, so ice can form in the venturi and at the butterfly. Right: fuel injection has no venturi; a pump and metering unit send fuel to a nozzle at each cylinder's inlet port, where it evaporates against hot metal, so the induction air is never chilled. The air intake of either can still collect impact ice.</desc>
