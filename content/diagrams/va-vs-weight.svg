<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="vaw">
<title>Why VA is lower when the aeroplane is lighter</title>
<desc>Load factor against indicated airspeed. The stall curve at maximum weight, stall speed 52 kt, meets the +3.8 g limit at VA = 52 × √3.8 ≈ 101 kt. At 80 percent of maximum weight the aeroplane stalls at a lower speed, its stall curve sits to the left, and it meets +3.8 g at about 101 × √0.8 ≈ 90 kt. Between 90 and 101 kt a full pull stalls the heavy aeroplane first but can overstress the light one.</desc>
