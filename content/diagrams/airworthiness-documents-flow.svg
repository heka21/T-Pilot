<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="awd">
<title>Is the aeroplane serviceable today?</title>
<desc>The documents that tell you whether the aircraft is serviceable: the maintenance release, the certificate of airworthiness, the certificate of registration, and the approved flight manual or POH with weight and balance data. Before flight check the maintenance release: current in hours and date, daily inspection certified today, no endorsed defect that grounds the aircraft, no maintenance due before the end of the flight.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="20" y="50" width="260" height="62" rx="8" fill="var(--color-brand-soft)" stroke="var(--color-line)" stroke-width="1"/><text x="32" y="70" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Maintenance release</text><text x="32" y="87.55" font-size="11" fill="var(--color-brand-fg)">the key document: valid for a period</text><text x="32" y="101.85" font-size="11" fill="var(--color-brand-fg)">(commonly 100 h or 12 months)</text>
<rect x="20" y="122" width="260" height="62" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line)" stroke-width="1"/><text x="32" y="142" font-size="13" fill="var(--color-fg)" font-weight="700">Certificate of airworthiness</text><text x="32" y="159.55" font-size="11" fill="var(--color-fg-muted)">type and aircraft meet the design</text><text x="32" y="173.85" font-size="11" fill="var(--color-fg-muted)">standard; in force while maintained</text>
<rect x="20" y="194" width="260" height="47" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line)" stroke-width="1"/><text x="32" y="214" font-size="13" fill="var(--color-fg)" font-weight="700">Certificate of registration</text><text x="32" y="231.55" font-size="11" fill="var(--color-fg-muted)">on the Australian register</text>
<rect x="20" y="251" width="260" height="62" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line)" stroke-width="1"/><text x="32" y="271" font-size="13" fill="var(--color-fg)" font-weight="700">Flight manual / POH</text><text x="32" y="288.55" font-size="11" fill="var(--color-fg-muted)">current amendments, weight and</text><text x="32" y="302.85" font-size="11" fill="var(--color-fg-muted)">balance data for this aircraft</text>
<text x="20" y="30" font-size="14" fill="var(--color-fg)" font-weight="700">Documents</text>
<text x="20" y="335" font-size="11" fill="var(--color-fg-faint)">Logbooks hold the history (not carried).</text>
<text x="340" y="30" font-size="14" fill="var(--color-fg)" font-weight="700">Check on the maintenance release</text>
<rect x="340" y="52" width="280" height="58" rx="8" fill="var(--color-ok-soft)" stroke="none"/>
<circle cx="362" cy="81" r="11" fill="var(--color-ok)" stroke="none"/>
<path d="M356 81 l4 5 l8 -10" stroke="var(--color-surface)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="382" y="77" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Current in hours AND date</text>
<text x="382" y="94" font-size="11" fill="var(--color-fg-muted)">whichever comes first</text>
<rect x="340" y="122" width="280" height="58" rx="8" fill="var(--color-ok-soft)" stroke="none"/>
<circle cx="362" cy="151" r="11" fill="var(--color-ok)" stroke="none"/>
<path d="M356 151 l4 5 l8 -10" stroke="var(--color-surface)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="382" y="147" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Daily inspection certified today</text>
<text x="382" y="164" font-size="11" fill="var(--color-fg-muted)">before the first flight of the day</text>
<rect x="340" y="192" width="280" height="58" rx="8" fill="var(--color-ok-soft)" stroke="none"/>
<circle cx="362" cy="221" r="11" fill="var(--color-ok)" stroke="none"/>
