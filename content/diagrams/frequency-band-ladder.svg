<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" role="img" data-prefix="fbl">
<title>The four aviation bands</title>
<desc>From the top: UHF, 300 MHz to 3 GHz, wavelength 1 m to 10 cm, DME, transponder, GNSS and the ILS glideslope, line of sight. VHF, 30 to 300 MHz, 10 m to 1 m, COM 118 to 137 MHz and VOR and ILS 108 to 118 MHz, line of sight. HF, 3 to 30 MHz, 100 m to 10 m, long-range voice in oceanic and remote areas, sky wave. MF, 300 kHz to 3 MHz, 1 km to 100 m, NDBs, ground wave. Each band is ten times the one below; higher frequencies behave more like light.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="28" font-size="16" fill="var(--color-fg)" font-weight="700">Each band ten times higher: shorter waves, straighter paths</text>
<text x="96" y="50" font-size="11.5" fill="var(--color-fg-faint)" font-weight="600">Frequency, wavelength</text>
<text x="262" y="50" font-size="11.5" fill="var(--color-fg-faint)" font-weight="600">Wave (not to scale)</text>
