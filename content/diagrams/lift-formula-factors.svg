<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="lff">
<title>What is in the lift formula</title>
<desc>Lift equals the lift coefficient times dynamic pressure, one half rho V squared, times the wing area. The pilot sets the lift coefficient with angle of attack and flap and the speed with power and attitude; density comes with height and temperature; wing area is fixed. At constant angle of attack, slowing from 100 to 70 knots leaves 0.49 of the lift.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="130" y="62" font-size="34" text-anchor="middle" fill="var(--color-fg)" font-weight="700" class="num">L</text>
<text x="176" y="62" font-size="34" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700" class="num">=</text>
<text x="230" y="62" font-size="34" text-anchor="middle" fill="var(--color-brand)" font-weight="700" class="num">CL</text>
<text x="282" y="62" font-size="34" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700" class="num">×</text>
<text x="334" y="62" font-size="34" text-anchor="middle" fill="var(--color-info)" font-weight="700" class="num">½ρ</text>
<text x="396" y="62" font-size="34" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700" class="num">V²</text>
<text x="448" y="62" font-size="34" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700" class="num">×</text>
<text x="494" y="62" font-size="34" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="700" class="num">S</text>
<text x="320" y="94" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Drag has exactly the same form, with CD in place of CL.</text>
<rect x="20" y="130" width="140" height="112" rx="8" fill="var(--color-brand-soft)" stroke="none"/>
<line x1="230" y1="104" x2="90" y2="128" stroke="var(--color-fg-faint)" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="151" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Lift coefficient</text>
<text x="30" y="171" font-size="12" fill="var(--color-fg)">Set by angle of</text><text x="30" y="186.6" font-size="12" fill="var(--color-fg)">attack, wing shape</text><text x="30" y="202.2" font-size="12" fill="var(--color-fg)">and flap.</text><text x="30" y="217.8" font-size="12" fill="var(--color-fg)">Pilot: elevator, flap.</text>
<rect x="175" y="130" width="140" height="112" rx="8" fill="var(--color-info-soft)" stroke="none"/>
<line x1="334" y1="104" x2="245" y2="128" stroke="var(--color-fg-faint)" stroke-width="1" stroke-linecap="round"/>
<text x="185" y="151" font-size="13" fill="var(--color-info-fg)" font-weight="700">Air density</text>
<text x="185" y="171" font-size="12" fill="var(--color-fg)">Thinner air: less</text><text x="185" y="186.6" font-size="12" fill="var(--color-fg)">lift at the same</text><text x="185" y="202.2" font-size="12" fill="var(--color-fg)">true airspeed.</text><text x="185" y="217.8" font-size="12" fill="var(--color-fg)">Set by height, heat.</text>
<rect x="330" y="130" width="140" height="112" rx="8" fill="var(--color-warn-soft)" stroke="none"/>
<line x1="396" y1="104" x2="400" y2="128" stroke="var(--color-fg-faint)" stroke-width="1" stroke-linecap="round"/>
<text x="340" y="151" font-size="13" fill="var(--color-warn-fg)" font-weight="700">Speed, squared</text>
<text x="340" y="171" font-size="12" fill="var(--color-fg)">Double the speed:</text><text x="340" y="186.6" font-size="12" fill="var(--color-fg)">four times the lift.</text><text x="340" y="202.2" font-size="12" fill="var(--color-fg)">Pilot: power and</text><text x="340" y="217.8" font-size="12" fill="var(--color-fg)">attitude.</text>
