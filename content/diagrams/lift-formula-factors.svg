<text x="495" y="151" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Wing area</text>
<text x="495" y="171" font-size="12" fill="var(--color-fg)">Fixed for the</text><text x="495" y="186.6" font-size="12" fill="var(--color-fg)">aeroplane.</text>
<text x="20" y="276" font-size="12" fill="var(--color-fg-muted)">½ρV² is the dynamic pressure: what the ASI measures, so IAS tells you it directly.</text>
<rect x="20" y="300" width="600" height="76" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="32" y="322" font-size="13" fill="var(--color-fg)" font-weight="700">Worked example: level flight, slowing from 100 kt to 70 kt</text>
<text x="32" y="343" font-size="13" fill="var(--color-warn-fg)" font-weight="600" class="num">Same angle of attack: lift × (70 ÷ 100)² = × 0.49</text>
<text x="32" y="363" font-size="12" fill="var(--color-fg-muted)">To stay level, raise the angle of attack until CL is roughly double: slow flight is nose-high.</text>
</svg>
