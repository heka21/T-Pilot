<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" data-prefix="rpm">
<title>What the RPL allows and what each endorsement adds</title>
<desc>On the left, the bare recreational pilot licence (aeroplane): single-engine, single-pilot aeroplane of not more than 1,500 kg maximum take-off weight, day VFR only, private or training flights, within 25 nm of the departure aerodrome, non-controlled aerodromes and Class G airspace, below 10,000 ft, passengers allowed. On the right, the endorsements that lift each limit: recreational navigation, controlled aerodrome, controlled airspace, flight above 10,000 ft, design features and aerobatics.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="28" y="30" font-size="16" fill="var(--color-brand-fg)" font-weight="700">The bare RPL(A)</text>
<text x="612" y="30" font-size="14" text-anchor="end" fill="var(--color-fg-muted)" font-weight="700">Add an endorsement to lift a limit</text>
<rect x="20" y="44" width="270" height="428" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<rect x="30" y="62" width="250" height="38" rx="6" fill="var(--color-surface)" stroke="none"/>
<text x="42" y="78" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Within 25 nm</text>
<text x="42" y="93" font-size="11" fill="var(--color-fg-muted)">of the departure aerodrome</text>
<line x1="294" y1="81" x2="352" y2="81" stroke="var(--color-ok)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="356" y="62" width="264" height="38" rx="6" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1"/>
<text x="368" y="78" font-size="13" fill="var(--color-ok-fg)" font-weight="700">+ Recreational navigation</text>
<text x="368" y="93" font-size="11" fill="var(--color-ok-fg)">fly beyond 25 nm, cross-country</text>
<rect x="30" y="108" width="250" height="38" rx="6" fill="var(--color-surface)" stroke="none"/>
<text x="42" y="124" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Non-controlled aerodromes</text>
<text x="42" y="139" font-size="11" fill="var(--color-fg-muted)">no towered aerodrome</text>
<line x1="294" y1="127" x2="352" y2="127" stroke="var(--color-ok)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="356" y="108" width="264" height="38" rx="6" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1"/>
<text x="368" y="124" font-size="13" fill="var(--color-ok-fg)" font-weight="700">+ Controlled aerodrome</text>
<text x="368" y="139" font-size="11" fill="var(--color-ok-fg)">operate at towered aerodromes</text>
<rect x="30" y="154" width="250" height="38" rx="6" fill="var(--color-surface)" stroke="none"/>
<text x="42" y="170" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Class G airspace only</text>
<text x="42" y="185" font-size="11" fill="var(--color-fg-muted)">no controlled airspace</text>
<line x1="294" y1="173" x2="352" y2="173" stroke="var(--color-ok)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="356" y="154" width="264" height="38" rx="6" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1"/>
<text x="368" y="170" font-size="13" fill="var(--color-ok-fg)" font-weight="700">+ Controlled airspace</text>
<text x="368" y="185" font-size="11" fill="var(--color-ok-fg)">enter controlled airspace</text>
<rect x="30" y="200" width="250" height="38" rx="6" fill="var(--color-surface)" stroke="none"/>
<text x="42" y="224" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Below 10,000 ft</text>
<line x1="294" y1="219" x2="352" y2="219" stroke="var(--color-ok)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="356" y="200" width="264" height="38" rx="6" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1"/>
<text x="368" y="216" font-size="13" fill="var(--color-ok-fg)" font-weight="700">+ Flight above 10,000 ft</text>
<text x="368" y="231" font-size="11" fill="var(--color-ok-fg)">if the aircraft and oxygen rules allow</text>
<rect x="30" y="246" width="250" height="38" rx="6" fill="var(--color-surface)" stroke="none"/>
<text x="42" y="262" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Basic single-engine types</text>
<text x="42" y="277" font-size="11" fill="var(--color-fg-muted)">no special design features</text>
<line x1="294" y1="265" x2="352" y2="265" stroke="var(--color-ok)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="356" y="246" width="264" height="38" rx="6" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1"/>
<text x="368" y="262" font-size="13" fill="var(--color-ok-fg)" font-weight="700">+ Design feature</text>
<text x="368" y="277" font-size="11" fill="var(--color-ok-fg)">tailwheel, retractable gear, manual prop</text>
<rect x="30" y="292" width="250" height="38" rx="6" fill="var(--color-surface)" stroke="none"/>
<text x="42" y="316" font-size="13" fill="var(--color-brand-fg)" font-weight="700">No aerobatics</text>
<line x1="294" y1="311" x2="352" y2="311" stroke="var(--color-ok)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="356" y="292" width="264" height="38" rx="6" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1"/>
<text x="368" y="308" font-size="13" fill="var(--color-ok-fg)" font-weight="700">+ Aerobatic</text>
<text x="368" y="323" font-size="11" fill="var(--color-ok-fg)">aerobatic flight</text>
<line x1="36" y1="338" x2="274" y2="338" stroke="var(--color-brand)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="36" y="356" font-size="12" fill="var(--color-brand-fg)" font-weight="700">Always, with any endorsement:</text>
<text x="36" y="376" font-size="12" fill="var(--color-brand-fg)">single-engine aeroplane, single-pilot</text><text x="36" y="392.8" font-size="12" fill="var(--color-brand-fg)">MTOW not more than 1,500 kg</text><text x="36" y="409.6" font-size="12" fill="var(--color-brand-fg)">day VFR only: no night, no IMC</text><text x="36" y="426.4" font-size="12" fill="var(--color-brand-fg)">private operations or flight training only</text><text x="36" y="443.2" font-size="12" fill="var(--color-brand-fg)">passengers allowed, with 3 take-offs and</text><text x="36" y="460" font-size="12" fill="var(--color-brand-fg)">3 landings in the previous 90 days</text>
<rect x="356" y="338" width="264" height="134" rx="8" fill="var(--color-surface-2)" stroke="none"/>
<text x="368" y="358" font-size="12.5" fill="var(--color-fg)" font-weight="700">Lifted only by another licence</text>
<text x="368" y="378" font-size="11.5" fill="var(--color-fg-muted)">PPL: removes the weight, distance</text><text x="368" y="393.52" font-size="11.5" fill="var(--color-fg-muted)">and airspace limits</text><text x="368" y="409.05" font-size="11.5" fill="var(--color-fg-muted)">CPL: allows commercial operations</text>
<text x="368" y="440" font-size="11" fill="var(--color-fg-faint)">Design features also include</text>
<text x="368" y="455" font-size="11" fill="var(--color-fg-faint)">pressurisation and floats.</text>
