<text x="20" y="28" font-size="13" fill="var(--color-fg)" font-weight="600">Western Australia: local time = UTC + 8 hours. ERSA times are UTC.</text>
<text x="20" y="270" font-size="12" fill="var(--color-fg-muted)">Another: 0000–0800 UTC Mon–Fri is 0800–1600 WST Mon–Fri.</text>
