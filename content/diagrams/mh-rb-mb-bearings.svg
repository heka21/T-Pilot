<title>Magnetic heading plus relative bearing gives magnetic bearing</title>
<desc>Plan view. Magnetic north is up. The aeroplane heads 070 degrees magnetic. A lake lies 30 degrees left of the nose, which is a relative bearing of 330, measured clockwise from the nose all the way round. Heading 070 plus relative bearing 330 is 400; take off 360 and the magnetic bearing to the lake is 040. The bearing from the lake back to the aeroplane is the reciprocal, 220 magnetic.</desc>
