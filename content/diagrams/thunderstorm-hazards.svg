<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="ths">
<title>Thunderstorm hazards and the stand-off distance</title>
<desc>Side view of a mature thunderstorm cell with an anvil top. Inside and near the cell: severe turbulence, hail, lightning, icing in the cloud and heavy rain. Beneath it a microburst downdraught hits the ground and spreads out as a gust front ahead of the storm, causing wind shear on take-off and landing. A light aeroplane stays at least 10 nm from a mature cell and never flies under the anvil.</desc>
