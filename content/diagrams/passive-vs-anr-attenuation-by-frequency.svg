<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" role="img" data-prefix="anr">
<title>Passive and ANR protection cover different pitches</title>
<desc>A sketch of noise reduction against pitch. A passive headset's shell and seal block high-frequency hiss and whine well but let much of the low-frequency engine and propeller drone through. ANR electronics cancel the low-frequency drone and do little at high frequency. Together they cover the whole range; both depend on an unbroken ear seal.</desc>
