<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="prr">
<title>Endurance and range speeds on the power-required curve</title>
<desc>Power required to fly level against true airspeed, a U-shaped curve; fuel flow follows power. The lowest point is the minimum-power speed, the maximum endurance speed: least fuel per hour. A straight line from the origin touches the curve at the minimum-drag speed, because power divided by speed is drag: that is the still-air maximum range speed, faster than the endurance speed. With a headwind the line starts from the wind speed on the speed axis and touches the curve at a higher speed: fly faster for range into a headwind. Shape only, no figures.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="28" font-size="16" fill="var(--color-fg)" font-weight="700">Bottom of the curve for time, tangent from the origin for distance</text>
