<title>Hazards to navigation: six groups</title>
<desc>Six tiles. Things you could hit that the chart does not show: an unlit or unmarked crane, mast or wind turbine, or a failed obstacle light. Things on or near the runway: birds on or near an aerodrome, bird strikes (also to the ATSB), animals, vehicles or people on a runway. Aids that are not working: navigation aids, runway lighting, a wind indicator. Weather nobody forecast: thunderstorms, severe turbulence, wind shear, dust storms, volcanic ash, a fog bank forming. Other things in the air: unmanned or model aircraft, kites, balloons, laser illumination. Activity nobody told you about: smoke, bushfire, fire-fighting, military activity, parachuting or gliding not promulgated. Report to ATS as soon as possible by radio, with a SECURITE broadcast where it is a safety broadcast, and in writing afterwards if required, so ATS can warn others and issue a NOTAM.</desc>
