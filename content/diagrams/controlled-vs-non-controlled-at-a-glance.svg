<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" data-prefix="cvn">
<title>Controlled and non-controlled airspace at a glance</title>
<desc>Two columns compared row by row. Controlled airspace (Class C and D, control zones): a clearance is required, ATC separates traffic (Class C separates IFR from VFR, Class D IFR from IFR, with traffic information to VFR), Class C requires a transponder and radio, and an RPL holder needs the controlled airspace and controlled aerodrome endorsements. Non-controlled Class G: no clearance, pilots separate themselves by lookout and radio, flight information on request, CTAF procedures at aerodromes. Below: Class E is controlled for IFR only, VFR needs no clearance; Class A is IFR only.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
