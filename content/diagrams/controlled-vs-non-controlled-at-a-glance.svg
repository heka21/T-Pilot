<rect x="392" y="280" width="228" height="68" rx="6" fill="var(--color-surface-2)" stroke="none"/>
<text x="162" y="302" font-size="12" fill="var(--color-brand-fg)">needs the controlled airspace</text><text x="162" y="317.96" font-size="12" fill="var(--color-brand-fg)">and controlled aerodrome</text><text x="162" y="333.92" font-size="12" fill="var(--color-brand-fg)">endorsements</text>
<text x="404" y="302" font-size="12" fill="var(--color-fg)">no airspace endorsement</text><text x="404" y="317.96" font-size="12" fill="var(--color-fg)">needed</text>
<rect x="20" y="366" width="296" height="84" rx="8" fill="var(--color-sky-soft)" stroke="var(--color-sky-fg)" stroke-width="1.25"/><text x="32" y="389.48" font-size="13.5" fill="var(--color-sky-fg)" font-weight="700">Class E: controlled for IFR only</text><text x="32" y="408.3" font-size="11.5" fill="var(--color-sky-fg)">VFR needs no clearance but must meet the</text><text x="32" y="423.82" font-size="11.5" fill="var(--color-sky-fg)">VMC minima and should carry a transponder;</text><text x="32" y="439.35" font-size="11.5" fill="var(--color-sky-fg)">IFR flights are controlled</text>
<rect x="324" y="366" width="296" height="84" rx="8" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1.25"/><text x="336" y="389.48" font-size="13.5" fill="var(--color-info-fg)" font-weight="700">Class A: high level</text><text x="336" y="408.3" font-size="11.5" fill="var(--color-info-fg)">IFR only; VFR not permitted</text><text x="336" y="423.82" font-size="11.5" fill="var(--color-info-fg)">(above FL180 along the east coast</text><text x="336" y="439.35" font-size="11.5" fill="var(--color-info-fg)">and in other areas)</text>
<text x="320" y="478" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="600">Class G is the only non-controlled class.</text>
