<text x="264" y="60" font-size="11.5" text-anchor="middle" fill="var(--color-surface)">Class C, D · control zones (CTR)</text>
<rect x="392" y="20" width="228" height="52" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="506" y="42" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Non-controlled</text>
<text x="506" y="60" font-size="11.5" text-anchor="middle" fill="var(--color-fg-muted)">Class G</text>
<text x="138" y="115" font-size="13" text-anchor="end" fill="var(--color-fg)" font-weight="700">Clearance</text>
<rect x="150" y="84" width="228" height="52" rx="6" fill="var(--color-brand-soft)" stroke="none"/>
<rect x="392" y="84" width="228" height="52" rx="6" fill="var(--color-surface-2)" stroke="none"/>
<text x="162" y="106" font-size="12" fill="var(--color-brand-fg)">required before entry</text><text x="162" y="121.96" font-size="12" fill="var(--color-brand-fg)">ATC clearances and instructions</text>
<text x="404" y="106" font-size="12" fill="var(--color-fg)">none required</text><text x="404" y="121.96" font-size="12" fill="var(--color-fg)">fly by the rules of the air</text>
<text x="138" y="183" font-size="13" text-anchor="end" fill="var(--color-fg)" font-weight="700">Separation</text>
<rect x="150" y="144" width="228" height="68" rx="6" fill="var(--color-brand-soft)" stroke="none"/>
<rect x="392" y="144" width="228" height="68" rx="6" fill="var(--color-surface-2)" stroke="none"/>
<text x="162" y="166" font-size="12" fill="var(--color-brand-fg)">ATC: C separates IFR from VFR;</text><text x="162" y="181.96" font-size="12" fill="var(--color-brand-fg)">D separates IFR from IFR and</text><text x="162" y="197.92" font-size="12" fill="var(--color-brand-fg)">gives VFR traffic information</text>
<text x="404" y="166" font-size="12" fill="var(--color-fg)">you: lookout and radio;</text><text x="404" y="181.96" font-size="12" fill="var(--color-fg)">flight information and traffic</text><text x="404" y="197.92" font-size="12" fill="var(--color-fg)">information on request</text>
<text x="138" y="251" font-size="13" text-anchor="end" fill="var(--color-fg)" font-weight="700">Radio</text>
<rect x="150" y="220" width="228" height="52" rx="6" fill="var(--color-brand-soft)" stroke="none"/>
<rect x="392" y="220" width="228" height="52" rx="6" fill="var(--color-surface-2)" stroke="none"/>
<text x="162" y="242" font-size="12" fill="var(--color-brand-fg)">talk to ATC; Class C requires</text><text x="162" y="257.96" font-size="12" fill="var(--color-brand-fg)">a transponder and radio</text>
<text x="404" y="242" font-size="12" fill="var(--color-fg)">broadcast on the appropriate</text><text x="404" y="257.96" font-size="12" fill="var(--color-fg)">frequency; CTAF at aerodromes</text>
<text x="138" y="319" font-size="13" text-anchor="end" fill="var(--color-fg)" font-weight="700">RPL holder</text>
