<title>Cloud heights: above sea level or above the aerodrome?</title>
<desc>The same cloud base measured two ways. In the GAF, cloud heights are above mean sea level (AMSL). In a TAF and a METAR, cloud heights are above the aerodrome. At an aerodrome above sea level the TAF figure is smaller than the GAF figure for the same base, by the aerodrome elevation.</desc>
