<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" role="img" data-prefix="wld">
<title>The weight ladder and the limit for each rung</title>
<desc>Five stacked columns, schematic heights. Empty weight; zero fuel weight adds the occupants and baggage and is checked against the maximum zero fuel weight; take-off weight adds the fuel and is checked against the maximum take-off weight; ramp weight adds the taxi and run-up fuel and is checked against any maximum ramp weight; landing weight is the take-off weight less the fuel burned and is checked against the maximum landing weight. ECHO's limits from the note: MZFW 2,630 kg, MTOW 2,950 kg, MLW 2,725 kg, so a full ECHO at MTOW must burn 225 kg before it may land.</desc>
