<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="cit">
<title>Outside air temperatures that produce engine ice</title>
<desc>Rough outside air temperature ranges for each kind of engine ice, all needing high humidity or visible moisture: throttle ice roughly minus 5 to plus 20 degrees at low power, fuel evaporation ice roughly minus 10 to plus 30 at any power, impact ice in visible moisture at or below freezing. The CASA chart shows serious icing at any power possible from well below freezing to about 30 degrees in high humidity, and serious icing at descent power over an even wider range.</desc>
