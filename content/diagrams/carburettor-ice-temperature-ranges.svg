" text-anchor="middle" fill="var(--color-fg-muted)" class="num">+10</text><text x="390" y="330" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" class="num">+15</text><text x="445" y="330" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" class="num">+20</text><text x="500" y="330" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" class="num">+25</text><text x="555" y="330" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" class="num">+30</text><text x="610" y="330" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" class="num">+35</text><text x="335" y="350" font-size="13" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="600">Outside air temperature (°C)</text>
