<title>Flap load grows with the square of speed</title>
<desc>Air load on extended flap, as a percentage of the most it is designed for at VFE, against indicated airspeed, for a hypothetical aeroplane with a full-flap VFE of 95 knots. The load rises with the square of the speed: at 95 knots it is 100 percent; at 112 knots, 1.18 times VFE, it is 1.18 squared, 139 percent, 39 percent more than the design load.</desc>
