<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="wsc">
<title>Behind and below: where the wake goes in the cruise</title>
<desc>Side view of a large aircraft in the cruise flying to the right. The pair of wing-tip vortices it leaves behind sinks at about 300 to 500 ft per minute and levels off about 500 to 1,000 ft below its flight path. The danger area is behind and below it. An aircraft crossing ahead at the same level or a little above leaves a wake that sinks across your path; passing above its path, or waiting until it is well clear, keeps you out of it.</desc>
