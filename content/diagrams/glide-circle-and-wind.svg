<title>The wind slides the glide circle downwind</title>
<desc>Plan view. Gliding from 2,800 ft at 70 knots and 700 feet per minute takes 4 minutes, so in still air the aeroplane can reach anywhere within 4.67 nautical miles: a circle around it. A 15 knot wind drifts the aeroplane 1 nautical mile in those 4 minutes, so the whole circle slides 1 mile downwind: 5.67 miles reachable downwind, only 3.67 miles upwind. A field 4 miles upwind is out of reach; one 5.5 miles downwind is not.</desc>
