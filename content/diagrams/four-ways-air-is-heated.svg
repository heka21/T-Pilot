<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="fwh">
<title>Four ways the air gets its heat</title>
<desc>Four panels. Radiation: sunlight passes through clear air and is absorbed by the ground, and the ground radiates its own heat to the sky, by night with nothing coming back. Conduction: the ground warms or chills only the thin layer of air touching it. Convection: air warmed at the ground rises in thermals and cooler air sinks to replace it, spreading the heat through thousands of feet; moving air sideways is advection. Latent heat: water absorbs heat when it evaporates and gives it back when it condenses in cloud.</desc>
<style>.fwh-bubble { animation: fwh-rise 5s ease-in-out infinite; } @keyframes fwh-rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(-112px); opacity: 0; } }</style>
