<title>UTC and Western Standard Time side by side</title>
<desc>Two time strips aligned so the same instant sits in the same column. WST is UTC plus 8 hours, so the WST date changes at 1600 UTC. Worked examples: 1530 WST is 0730 UTC the same day; 0545 WST on Tuesday 7 October is 2145 UTC on Monday 6 October.</desc>
