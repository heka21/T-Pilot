<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="hvh">
<title>Hyperventilation or hypoxia?</title>
<desc>Side-by-side comparison. Hyperventilation is too little carbon dioxide from over-breathing, can happen at any altitude, comes on fairly rapidly with anxiety and brings tingling and muscle spasm. Hypoxia is too little oxygen reaching the tissues, mainly at altitude, is gradual and insidious and brings euphoria, poor judgement and cyanosis. Both share dizziness, tingling and visual disturbance. If unsure above about 10,000 feet with oxygen available, treat as hypoxia first.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="16" y="14" width="292" height="112" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/><text x="28" y="38.8" font-size="16" fill="var(--color-brand-fg)" font-weight="700">Hyperventilation</text><text x="28" y="59.8" font-size="12" fill="var(--color-brand-fg)">Breathing faster or deeper than needed</text><text x="28" y="76" font-size="12" fill="var(--color-brand-fg)">blows off CO2: blood vessels in the brain</text><text x="28" y="92.2" font-size="12" fill="var(--color-brand-fg)">narrow, the brain runs short of oxygen</text><text x="28" y="108.4" font-size="12" fill="var(--color-brand-fg)">even though oxygen is breathed in</text>
<rect x="332" y="14" width="292" height="112" rx="10" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1.25"/><text x="344" y="38.8" font-size="16" fill="var(--color-info-fg)" font-weight="700">Hypoxia</text><text x="344" y="59.8" font-size="12" fill="var(--color-info-fg)">Too little oxygen reaches the tissues:</text><text x="344" y="76" font-size="12" fill="var(--color-info-fg)">low oxygen pressure at altitude,</text><text x="344" y="92.2" font-size="12" fill="var(--color-info-fg)">or CO, alcohol, blood loss</text>
<text x="320" y="144" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700">Where</text>
<text x="28" y="144" font-size="13" fill="var(--color-fg)">Any altitude,</text><text x="28" y="160.9" font-size="13" fill="var(--color-fg)">even on the ground</text>
<text x="612" y="144" font-size="13" text-anchor="end" fill="var(--color-fg)">Mainly at altitude</text>
<line x1="16" y1="170" x2="624" y2="170" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="320" y="188" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700">Onset</text>
<text x="28" y="188" font-size="13" fill="var(--color-fg)">Fairly rapid, often</text><text x="28" y="204.9" font-size="13" fill="var(--color-fg)">with anxiety</text>
<text x="612" y="188" font-size="13" text-anchor="end" fill="var(--color-fg)">Gradual and insidious,</text><text x="612" y="204.9" font-size="13" text-anchor="end" fill="var(--color-fg)">often unnoticed</text>
<line x1="16" y1="214" x2="624" y2="214" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<text x="320" y="232" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700">Tell-tale signs</text>
<text x="28" y="232" font-size="13" fill="var(--color-fg)">Tingling, muscle spasm,</text><text x="28" y="248.9" font-size="13" fill="var(--color-fg)">rapid breathing</text>
<text x="612" y="232" font-size="13" text-anchor="end" fill="var(--color-fg)">Euphoria, poor judgement,</text><text x="612" y="248.9" font-size="13" text-anchor="end" fill="var(--color-fg)">cyanosis (blue lips)</text>
<line x1="16" y1="258" x2="624" y2="258" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round"/>
<rect x="16" y="276" width="608" height="40" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="320" y="293" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700">Shared by both</text>
<text x="320" y="309" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="600">dizziness · tingling · visual disturbance (blurred or tunnel vision)</text>
<rect x="16" y="330" width="292" height="70" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/><text x="28" y="353.2" font-size="14" fill="var(--color-brand-fg)" font-weight="700">Fix</text><text x="28" y="373" font-size="12" fill="var(--color-brand-fg)">Slow the breathing: one breath</text><text x="28" y="389.2" font-size="12" fill="var(--color-brand-fg)">every 4 to 5 s. Talk out loud.</text>
<rect x="332" y="330" width="292" height="70" rx="10" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1.25"/><text x="344" y="353.2" font-size="14" fill="var(--color-info-fg)" font-weight="700">Fix</text><text x="344" y="373" font-size="12" fill="var(--color-info-fg)">Oxygen on, or descend</text><text x="344" y="389.2" font-size="12" fill="var(--color-info-fg)">below 10,000 ft.</text>
<rect x="16" y="412" width="608" height="46" rx="8" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="320" y="431" font-size="13" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700">Not sure, above about 10,000 ft, oxygen on board? Treat it as hypoxia first:</text>
<text x="320" y="449" font-size="12" text-anchor="middle" fill="var(--color-warn-fg)">oxygen does a hyperventilating pilot no harm; wasting time of useful consciousness does.</text>
</svg>
