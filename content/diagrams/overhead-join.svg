<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" data-prefix="ohj">
<title>Joining the circuit from overhead</title>
<desc>Plan view of a left-hand circuit on runway 24, take-off to the right. The joining aircraft crosses overhead the aerodrome above circuit height, descends on the dead side (the side away from the circuit) to circuit height, 1,000 ft above aerodrome level, then crosses the upwind end of the runway to join the crosswind leg and continue downwind.</desc>
