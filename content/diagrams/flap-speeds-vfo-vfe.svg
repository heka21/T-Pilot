<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" data-prefix="fsv">
<title>VFO and VFE on the speed scale</title>
<desc>A speed scale showing the white arc from VSO, the full-flap stall speed at maximum weight, up to VFE, the maximum speed with flap extended. On some aeroplanes VFO, the maximum speed for moving the flap, is lower than VFE: slow to VFO before selecting flap, then VFE is the limit for flying with it out.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
