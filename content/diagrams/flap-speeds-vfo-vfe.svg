<text x="225" y="98" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="600">white arc: flap range</text>
<rect x="470" y="122" width="90" height="12" fill="var(--color-warn)" stroke="none"/>
<rect x="140" y="122" width="330" height="12" fill="var(--color-ok)" stroke="none"/>
<line x1="560" y1="104" x2="560" y2="136" stroke="var(--color-bad)" stroke-width="3" stroke-linecap="round"/>
<text x="515" y="98" font-size="11" text-anchor="middle" fill="var(--color-warn-fg)">yellow arc</text>
<text x="560" y="152" font-size="11" text-anchor="middle" fill="var(--color-bad)" font-weight="600">VNE</text>
<line x1="100" y1="90" x2="100" y2="160" stroke="var(--color-fg)" stroke-width="1.25" stroke-linecap="round"/>
<text x="100" y="176" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">VSO</text>
<line x1="220" y1="106" x2="220" y2="160" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round"/>
<text x="220" y="176" font-size="14" text-anchor="middle" fill="var(--color-brand)" font-weight="700">VFO</text>
<line x1="350" y1="90" x2="350" y2="160" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round"/>
<text x="350" y="176" font-size="14" text-anchor="middle" fill="var(--color-fg)" font-weight="700">VFE</text>
<text x="100" y="194" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">full-flap stall,</text><text x="100" y="208.3" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">max weight</text>
<text x="220" y="194" font-size="11" text-anchor="middle" fill="var(--color-brand)">max speed to</text><text x="220" y="208.3" font-size="11" text-anchor="middle" fill="var(--color-brand)">MOVE the flap</text>
<text x="350" y="194" font-size="11" text-anchor="middle" fill="var(--color-fg)">max speed with</text><text x="350" y="208.3" font-size="11" text-anchor="middle" fill="var(--color-fg)">flap EXTENDED</text>
<rect x="40" y="30" width="360" height="46" rx="8" fill="var(--color-brand-soft)" stroke="none"/>
<text x="52" y="50" font-size="12" fill="var(--color-brand-fg)" font-weight="600">Slow to VFO, select the flap, then you may</text>
<text x="52" y="66" font-size="12" fill="var(--color-brand-fg)" font-weight="600">fly up to VFE with it out. Often VFO = VFE.</text>
<text x="40" y="236" font-size="11" fill="var(--color-fg-faint)">Schematic scale. Never select flap in the yellow arc; many POHs give a higher VFE for the first stage.</text>
