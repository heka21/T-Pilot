<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="vxt">
<title>Where the VOX threshold should sit</title>
<desc>Sound level at an intercom microphone against time: steady engine noise, with three bursts of speech above it, the middle one a quiet passenger. Three threshold settings and when each opens the intercom. Too low, below the engine noise: the engine holds the intercom open and every headset fills with roar. Right, above the engine but below normal speech: the intercom opens for every speaker and stays shut for the engine. Too high: the first word of each sentence is lost before the microphone opens, and the quiet speaker never opens it. VOX works the intercom only; only the press-to-talk switch transmits. Levels are illustrative.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
