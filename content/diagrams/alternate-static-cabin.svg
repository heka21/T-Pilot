<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="asc">
<title>Why the instruments read high on the alternate static source</title>
<desc>A Cessna seen from the side in flight. Air flowing fast over the cabin lowers the pressure outside the doors and windows, and the cabin leaks towards it, so cabin pressure is slightly lower than true static. The normal static vent on the fuselage side is blocked. The alternate static valve under the panel lets the instruments take their static pressure from the cabin instead. Lower static pressure looks to the instruments like more height and more speed: the altimeter reads slightly high, the airspeed indicator reads slightly high, and the vertical speed indicator shows a brief climb when you select it, then settles. The POH gives the corrections.</desc>
