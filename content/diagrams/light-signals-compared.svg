<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" role="img" data-prefix="lsc">
<title>Lights on and off: four meanings</title>
<desc>Four light patterns compared on a time strip. A single flash of the landing lights after a tower light signal at night: acknowledgement. Navigation and landing lights switched on and off intermittently and repeatedly on approach: in difficulty and compelled to land, give way. An intercepted aircraft switching all its lights on and off at regular intervals: cannot comply. An intercepted aircraft flashing its lights at irregular intervals: in distress. The context decides the meaning. A cursor sweeps along the strips.</desc>
