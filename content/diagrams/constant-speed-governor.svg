<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" data-prefix="csg">
<title>How a constant-speed governor holds the RPM</title>
<desc>Schematic of a governor reacting to a rise in RPM as the aeroplane speeds up in a descent. 1: the engine-driven flyweights swing outwards. 2: they lift the pilot valve against the speeder spring, whose force the propeller lever sets. 3: oil, boosted by the governor pump, flows to the piston in the propeller hub. 4: the blades turn to a coarser angle, the angle of attack and the load are restored and the RPM returns to the setting.</desc>
