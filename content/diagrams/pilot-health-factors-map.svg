<text x="30" y="76" font-size="16" fill="var(--color-brand)" font-weight="800">Fuel</text>
<text x="30" y="94" font-size="12" fill="var(--color-fg-muted)">food and water</text>
<circle cx="34" cy="116" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="42" y="120" font-size="12" fill="var(--color-fg)">skipped meal: low sugar</text>
<circle cx="34" cy="141" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="42" y="145" font-size="12" fill="var(--color-fg)">heavy meal: drowsy</text>
<circle cx="34" cy="166" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="42" y="170" font-size="12" fill="var(--color-fg)">dehydration</text>
<rect x="26" y="181" width="176" height="22" rx="11" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<circle cx="38" cy="192" r="7" fill="var(--color-bad)" stroke="none"/>
<text x="38" y="196.5" font-size="11" text-anchor="middle" fill="var(--color-surface)" font-weight="800">!</text>
<text x="52" y="196" font-size="12" fill="var(--color-bad-fg)" font-weight="700">food poisoning</text>
<rect x="222" y="50" width="196" height="190" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="236" y="76" font-size="16" fill="var(--color-brand)" font-weight="800">Oxygen delivery</text>
<text x="236" y="94" font-size="12" fill="var(--color-fg-muted)">heart, lungs, blood</text>
<circle cx="240" cy="116" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="248" y="120" font-size="12" fill="var(--color-fg)">coronary risk factors:</text>
<text x="248" y="139" font-size="12" fill="var(--color-fg)">smoking, cholesterol,</text>
<text x="248" y="158" font-size="12" fill="var(--color-fg)">obesity, heredity</text>
<rect x="232" y="169" width="176" height="22" rx="11" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<circle cx="244" cy="180" r="7" fill="var(--color-bad)" stroke="none"/>
<text x="244" y="184.5" font-size="11" text-anchor="middle" fill="var(--color-surface)" font-weight="800">!</text>
<text x="258" y="184" font-size="12" fill="var(--color-bad-fg)" font-weight="700">heart attack</text>
<circle cx="240" cy="204" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="248" y="208" font-size="12" fill="var(--color-fg)">blood donation</text>
<rect x="428" y="50" width="196" height="190" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="442" y="76" font-size="16" fill="var(--color-brand)" font-weight="800">Structure</text>
<text x="442" y="94" font-size="12" fill="var(--color-fg-muted)">can you reach and push?</text>
<circle cx="446" cy="116" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="454" y="120" font-size="12" fill="var(--color-fg)">injury: full rudder and</text>
<text x="454" y="139" font-size="12" fill="var(--color-fg)">brakes still possible?</text>
<circle cx="446" cy="160" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="454" y="164" font-size="12" fill="var(--color-fg)">pregnancy: reach, belts</text>
<circle cx="446" cy="185" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="454" y="189" font-size="12" fill="var(--color-fg)">ageing: slower reactions</text>
<rect x="16" y="250" width="196" height="190" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="30" y="276" font-size="16" fill="var(--color-brand)" font-weight="800">Sensors</text>
<text x="30" y="294" font-size="12" fill="var(--color-fg-muted)">eyes, ears, balance</text>
<circle cx="34" cy="316" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="42" y="320" font-size="12" fill="var(--color-fg)">cold, hay fever: ears</text>
<text x="42" y="339" font-size="12" fill="var(--color-fg)">and sinuses block</text>
<rect x="26" y="350" width="176" height="22" rx="11" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<circle cx="38" cy="361" r="7" fill="var(--color-bad)" stroke="none"/>
<text x="38" y="365.5" font-size="11" text-anchor="middle" fill="var(--color-surface)" font-weight="800">!</text>
<text x="52" y="365" font-size="12" fill="var(--color-bad-fg)" font-weight="700">migraine aura</text>
<circle cx="34" cy="385" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="42" y="389" font-size="12" fill="var(--color-fg)">ageing: near focus,</text>
<text x="42" y="408" font-size="12" fill="var(--color-fg)">high-pitch hearing</text>
<rect x="222" y="250" width="196" height="190" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="236" y="276" font-size="16" fill="var(--color-brand)" font-weight="800">Processor</text>
<text x="236" y="294" font-size="12" fill="var(--color-fg-muted)">the brain</text>
<circle cx="240" cy="316" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="248" y="320" font-size="12" fill="var(--color-fg)">alcohol, hangover</text>
<circle cx="240" cy="341" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="248" y="345" font-size="12" fill="var(--color-fg)">medication, even OTC</text>
<circle cx="240" cy="366" r="2.5" fill="var(--color-fg-muted)" stroke="none"/>
<text x="248" y="370" font-size="12" fill="var(--color-fg)">anxiety, depression,</text>
<text x="248" y="389" font-size="12" fill="var(--color-fg)">fears, headache</text>
<rect x="232" y="400" width="176" height="22" rx="11" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<circle cx="244" cy="411" r="7" fill="var(--color-bad)" stroke="none"/>
<text x="244" y="415.5" font-size="11" text-anchor="middle" fill="var(--color-surface)" font-weight="800">!</text>
<text x="258" y="415" font-size="12" fill="var(--color-bad-fg)" font-weight="700">a faint</text>
<rect x="428" y="250" width="196" height="190" rx="10" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1.25"/>
<text x="442" y="276" font-size="14" fill="var(--color-fg)" font-weight="700">Two kinds of failure</text>
<text x="442" y="302" font-size="13" fill="var(--color-fg)" font-weight="700">Subtle impairment</text>
<text x="442" y="320" font-size="12" fill="var(--color-fg-muted)">you fly worse and may</text><text x="442" y="335.6" font-size="12" fill="var(--color-fg-muted)">not notice it</text>
<rect x="438" y="350" width="176" height="22" rx="11" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<circle cx="450" cy="361" r="7" fill="var(--color-bad)" stroke="none"/>
<text x="450" y="365.5" font-size="11" text-anchor="middle" fill="var(--color-surface)" font-weight="800">!</text>
<text x="464" y="365" font-size="12" fill="var(--color-bad-fg)" font-weight="700">Sudden</text>
<text x="442" y="392" font-size="12" fill="var(--color-fg-muted)">incapacitation in seconds:</text><text x="442" y="407.6" font-size="12" fill="var(--color-fg-muted)">usually fatal flying solo</text>
<rect x="16" y="448" width="608" height="32" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<text x="320" y="469" font-size="13" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="700">Most of the medical standard exists to screen out the sudden kind.</text>
