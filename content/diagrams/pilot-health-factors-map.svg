<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" role="img" data-prefix="phm">
<title>The pilot as a system</title>
<desc>Five parts of the pilot, like the systems of an aeroplane, and the health factors that attack each one. Fuel (food and water): skipped meals, heavy meals, dehydration, food poisoning. Oxygen delivery: coronary risk factors, smoking, blood donation. Structure: injuries, pregnancy, ageing. Sensors: colds and hay fever blocking ears and sinuses, migraine aura, ageing eyes and ears. Processor (the brain): alcohol, medication, anxiety, depression, fears, headache. Factors that can cause sudden incapacitation, such as a heart attack, food poisoning, a migraine or a faint, are marked.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="30" font-size="15" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Which part does each factor degrade, and could it fail suddenly?</text>
