<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 526" role="img" data-prefix="vsi">
<title>When your balance senses lie</title>
<desc>Four illusions. The leans: after a slow, unnoticed roll and a quick correction you feel banked the opposite way when level. Somatogravic: forward acceleration on a dark take-off feels like a nose-up pitch, and pushing forward flies into the ground. Graveyard spiral: the canals adapt to a sustained turn, the wings feel level, and pulling back tightens the spiral. Autokinetic: a single light stared at in darkness appears to move. In every case, believe the instruments.</desc>
