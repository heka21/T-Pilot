<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" data-prefix="rsb">
<title>How your voice reaches the tower</title>
<desc>Block diagram of a light-aircraft radio installation. Power: the battery and the alternator feed the main bus through the master switch; the avionics master feeds the avionics bus, and each radio has its own circuit breaker. Transmit path: microphone and press-to-talk switch, transmitter, antenna. Receive path: antenna, receiver with squelch, headset or speaker. The transmitter and receiver share one box, the COM transceiver, and one antenna.</desc>
