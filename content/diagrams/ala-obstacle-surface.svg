<title>A 1 in 20 surface beyond the end of the strip</title>
<desc>Side view beyond the end of an ALA, heights exaggerated. The take-off surface rises 1 ft for every 20 ft out. A 50 ft tree must be at least 1,000 ft, about 300 m, beyond the start of the surface to stay below it. A line of tall gums 150 m past the end, where the surface is only about 25 ft up, breaks it however long the strip.</desc>
