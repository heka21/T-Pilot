<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" data-prefix="bca">
<title>One frequency, one talker at a time</title>
<desc>Fourteen seconds on a busy tower frequency, time running down the page, with a column for the tower, for you, for an aircraft on final, and for what everyone on the frequency hears. You read back your landing clearance with your call-sign, then add a polite thanks lasting two to three seconds. The aircraft on final presses its PTT during the thanks to say it is going around; the two transmissions clash into a squeal and both are lost, so the tower has to ask for a repeat and the go-around call is heard late. Courtesy on the radio is brevity. Timings are illustrative.</desc>
<style>.bca-head{animation:bca-head 7s linear infinite}
@keyframes bca-head{from{transform:translateY(0)}to{transform:translateY(294px)}}</style>
