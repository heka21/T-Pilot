<title>Fitting a foam earplug</title>
<desc>Three steps and the result. Roll the foam plug into a thin cylinder. Pull the top of the ear up and back to straighten the canal. Push the plug well in and hold it while it expands to fill the canal. A plug pushed well in seals and protects; a plug resting in the outer canal, half sticking out, protects very little.</desc>
