<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="tow">
<title>Working a take-off weight chart, panel by panel</title>
<desc>A stylised take-off weight chart, not a real one, worked with the note's Northam inputs: pressure height 1,330 ft, 33 degrees, TODA 1,100 m, 13 kt headwind component, 1 percent upslope, grass. Go up from 33 degrees to a line interpolated between the sea-level and 2,000 ft lines, across to the first reference line, then in each correction panel follow the sloping guide lines from the reference line to the input value before carrying straight across to the next. A headwind and more runway raise the weight; upslope and grass lower it. The answer is read on the weight scale at the right. The climb weight limit is read from pressure height and temperature alone. Use the workbook chart: this one shows only the method.</desc>
