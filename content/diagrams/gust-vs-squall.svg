<text x="320" y="462" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">A gust is a few seconds of turbulence in a steady wind; a squall is a new wind that arrives and stays,</text><text x="320" y="476.3" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">often with a direction change, a temperature drop and heavy rain. Traces illustrative.</text>
