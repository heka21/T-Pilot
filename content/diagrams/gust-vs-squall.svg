<title>A gust and a squall, side by side</title>
<desc>Two traces of wind speed against time over five minutes. Top: a gusty wind, mean 15 kt, with gusts lasting a few seconds; the strongest reaches 27 kt, more than 10 kt above the mean, so the report is 25015G27KT. Bottom: a squall, the wind jumping from 12 kt by 18 kt to 30 kt within seconds and staying there for more than two minutes: an increase of at least 16 kt, to 22 kt or more, lasting at least a minute, reported as SQ.</desc>
