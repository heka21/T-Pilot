<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="bgl">
<title>Trapped gas expands as you climb</title>
<desc>Boyle's law: trapped gas volume against altitude. About 1.5 times the sea-level volume at 10,000 feet, about 2 times at 18,000 feet where the pressure is half, about 2.7 times at 25,000 feet. Gut and teeth hurt on the climb as gas expands; ears and sinuses hurt on the descent when air cannot get back in.</desc>
