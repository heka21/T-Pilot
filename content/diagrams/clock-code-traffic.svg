<text x="464" y="148" font-size="14" fill="var(--color-fg)" font-weight="700">Heading 090</text>
<text x="464" y="166" font-size="12" fill="var(--color-fg-muted)">each hour = 30°</text>
<text x="464" y="192" font-size="12" fill="var(--color-brand)" class="num">2 h × 30° = 60° right</text>
<text x="464" y="210" font-size="13" fill="var(--color-brand)" font-weight="700" class="num">090 + 60 = 150</text>
