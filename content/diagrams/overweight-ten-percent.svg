<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" data-prefix="ovw">
<title>What 10 percent overweight costs</title>
<desc>Three before-and-after comparisons from the note, at the MTOW of 1,150 kg and at 1,265 kg, 10 percent over. Stall speed scales with the square root of weight: 48 kt becomes 50.3 kt, so a take-off safety speed meant to be 1.2 times the stall is only about 1.14 times it. Take-off distance grows with about the square of the weight: 1.1 squared is 1.21, about 20 percent more runway. The normal-category limit of 3.8 g at the MTOW becomes 3.8 divided by 1.1, about 3.45 g.</desc>
