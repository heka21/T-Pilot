<title>What AC 91-02 asks of an ALA</title>
<desc>Plan view of a farm strip, not to scale. The runway is about 15 m wide for a light single-engine aeroplane, with a cleared runway strip beyond its edges and ends. At each end an obstacle-free approach and take-off area slopes up and out at about 5 percent, 1 in 20, with lateral transitional surfaces along the sides. Longitudinal slope not more than about 2 percent, a firm, even, short-grass surface, a windsock and boundary markers. A 15 m strip leaves an 11 m-span trainer about 2 m beyond each wingtip. Figures as the note has them from AC 91-02: verify against the current AC.</desc>
