<title>Where to look on the maintenance release</title>
<desc>A schematic of the maintenance release, not a facsimile of the real form. Part 1, the release itself, gives the expiry date and the expiry time in service, whichever comes first, and any maintenance due within the period. Part 2 records defects and permissible unserviceabilities. Part 3 holds the daily inspection certifications. The four pre-flight questions: current in hours and date, daily certified today, no grounding defect, nothing due before you land.</desc>
