<text x="428" y="236" font-size="12" fill="var(--color-fg)" font-weight="600">Anything due before</text><text x="428" y="251.6" font-size="12" fill="var(--color-fg)" font-weight="600">you land? Hours now</text><text x="428" y="267.2" font-size="12" fill="var(--color-fg)" font-weight="600">+ flight time.</text>
