<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="gst">
<title>The same gust hits harder at higher speed</title>
<desc>A V-n diagram for a normal category aeroplane (schematic speeds). Gust lines fan out from 1 g at zero speed: the extra load from a given gust grows in proportion to airspeed. An example gust that adds 1.0 g at 100 kt (2.0 g in all) adds 1.3 g at 130 kt (2.3 g). The strongest design gust stays inside the +3.8 g limit up to VNO and crosses it just beyond VNO. At low speed the same gust line runs into the stall curve first: the wing stalls momentarily instead of overloading the structure.</desc>
