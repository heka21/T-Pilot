<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" role="img" data-prefix="wfx">
<title>A warm front approaching, west to east</title>
<desc>Cross-section of a warm front moving east. Warm air on the left rides up over a wedge of retreating cold air on a very shallow slope, about 1 in 150. Cloud forms along the frontal surface and lowers towards the surface front: cirrus far ahead, then cirrostratus, altostratus and nimbostratus with continuous rain. Rain falling into the cold air saturates it and frontal fog forms ahead of the front. The frontal surface is about 12,000 ft up some 300 nm ahead of the surface front.</desc>
<style>.wfx-flow{stroke-dasharray:8 7;animation:wfx-flow 1.6s linear infinite}
@keyframes wfx-flow{to{stroke-dashoffset:-30}}</style>
