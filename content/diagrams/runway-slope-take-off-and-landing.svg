<text x="164" y="42" font-size="16" text-anchor="middle" fill="var(--color-bad)" font-weight="700">Take off uphill</text>
<text x="164" y="60" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">longer run: about +10% for a 2% upslope</text>
