<title>Uphill or downhill?</title>
<desc>Two side views of a sloping runway. Taking off uphill, part of the thrust climbs the slope, so the run is longer: a 2 percent upslope can add around 10 percent to the take-off distance. Landing uphill, the slope helps the aeroplane slow down, so the landing roll is shorter. With light wind, land uphill and take off downhill.</desc>
