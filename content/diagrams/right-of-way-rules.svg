<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" role="img" data-prefix="row">
<title>Who gives way</title>
<desc>Four plan and side views. Converging: the aircraft that has the other on its right gives way. Head-on: both alter heading to the right. Overtaking: the aircraft being overtaken has right of way; the overtaking aircraft alters to the right and keeps clear. Landing: of two aircraft approaching to land, the lower has right of way but must not cut in front of an aircraft on final. Below: power-driven aircraft give way to airships, gliders, balloons and aircraft towing or carrying a sling load; an aircraft in distress has right of way over everything.</desc>
