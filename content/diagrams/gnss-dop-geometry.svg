<title>Satellite geometry and dilution of precision</title>
<desc>Two panels with the same range error on every satellite. Left: satellites spread across the sky, their range bands cross at nearly 90 degrees and the area where the fix could be is small: low DOP, an accurate fix. Right: satellites bunched in one part of the sky, the bands cross at a shallow angle and the same error makes a long thin area: high DOP, a less accurate fix, even when plenty of satellites are in view.</desc>
