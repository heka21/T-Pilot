<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" role="img" data-prefix="cfx">
<title>A cold front passing, west to east</title>
<desc>Cross-section of a cold front moving east. Cold maritime polar air on the left drives under the warm air as a steep wedge, the frontal surface rising about 1 in 50 to 1 in 100. The warm air is lifted fast at the front into a narrow band of cumulus, towering cumulus and cumulonimbus with heavy showers, thunderstorms and hail. Ahead, altostratus and altocumulus with a strengthening north-westerly wind. Behind, scattered showery cumulus in the colder air, with good visibility, and the wind has backed to the south-west.</desc>
<style>.cfx-flow{stroke-dasharray:8 7;animation:cfx-flow 1.2s linear infinite}
@keyframes cfx-flow{to{stroke-dashoffset:-30}}</style>
