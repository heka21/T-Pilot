<title>How fog forms overnight and clears</title>
<desc>Four panels from evening to mid-morning. Evening: clear sky, calm, humid air. Overnight: the ground radiates its heat to the clear sky and the air touching it cools to its dew point. Dawn: fog lies in the river valleys and along the coast. Mid-morning: the sun heats the ground and the fog clears.</desc>
