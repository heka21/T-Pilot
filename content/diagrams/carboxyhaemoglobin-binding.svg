<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" data-prefix="cob">
<title>Carbon monoxide takes oxygen's seats</title>
<desc>Two panels. In clean air each haemoglobin molecule's oxygen sites carry oxygen. With a little carbon monoxide in the cabin air, CO binds to the same sites about 200 to 250 times more readily than oxygen, so a small amount of CO takes over a large share of the haemoglobin, forming carboxyhaemoglobin. The lungs have their full share of oxygen but the blood cannot carry it: anaemic hypoxia. CO lets go only slowly, over many hours.</desc>
