<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" data-prefix="smn">
<title>Cabin noise masks the consonants</title>
<desc>A sketch of sound level against pitch. Steady engine and airflow noise covers the whole range. Vowels are louder and lower, so they stand above the noise and you hear that someone spoke. Consonants such as s, t, f, th and k are quiet and high-pitched, so the noise drowns them and similar words blur. Noise-induced hearing loss starts around 4,000 Hz, in the same band. Turning the volume up raises the noise as well; a better headset seal lowers the noise at the ear.</desc>
