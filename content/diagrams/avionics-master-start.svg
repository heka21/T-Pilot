<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" role="img" data-prefix="avm">
<title>When the avionics master goes on and off</title>
<desc>A qualitative trace of the electrical bus voltage from before start to shutdown, with the avionics master switch below it. Before start the avionics master is off. While the starter cranks it draws a very large current and pulls the voltage down; when it disengages the voltage can surge. Once the alternator is charging (ammeter or voltmeter, no low-voltage light) the system settles, and only then does the avionics master go on and the radios self-test. At the end of the flight the avionics master goes off before the engine is shut down, for the same reason. The dip and the surge are what the off periods keep away from the solid-state avionics. Levels are illustrative.</desc>
