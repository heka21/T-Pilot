<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" role="img" data-prefix="rds">
<title>The readability scale</title>
<desc>The readability scale from AIP GEN 3.4, used to answer a radio check. Each grade shows the request 'radio check one two zero decimal three' as the other station hears it. 1 unreadable: nothing but noise. 2 readable now and then: a word here and there. 3 readable but with difficulty: all the words come through the noise, with effort. 4 readable. 5 perfectly readable. Grades 4 and 5 are fine; anything below 4 is worth investigating on the ground before you leave: the microphone position, the plugs and the other COM radio.</desc>
