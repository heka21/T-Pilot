<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="mrl">
<title>Mixture: too rich, about right, too lean</title>
<desc>Qualitative sketch of engine power and exhaust gas temperature as the mixture is leaned from full rich. Power peaks near the correct mixture and falls on both sides. Too rich: rough running, power loss, high fuel burn, cool running, plug fouling, black smoke. EGT peaks a little lean of best power and falls again as the mixture gets leaner. Too lean: power loss, rough running, high temperatures and a risk of detonation near the peak.</desc>
