<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="vnd">
<title>The flight envelope (V-n diagram)</title>
<desc>Load factor against airspeed for a normal category aeroplane with a 52 knot stall speed. The stall curve rises with the square of the speed and meets the +3.8 g limit at the manoeuvring speed VA, about 101 knots. Below VA a full control movement stalls the wing before the limit load is reached; above VA it can overstress the structure. The negative limit is -1.52 g. VNO marks the end of normal operation and VNE the never-exceed speed.</desc>
