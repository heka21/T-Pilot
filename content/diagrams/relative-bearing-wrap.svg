<text x="424" y="116" font-size="14" fill="var(--color-fg)" font-weight="700">Worked example</text>
<text x="424" y="142" font-size="12" fill="var(--color-fg-muted)" class="num">2 h × 30° = 60° right</text>
<text x="424" y="166" font-size="14" fill="var(--color-warn-fg)" font-weight="700" class="num">350 + 60 = 410</text>
<text x="424" y="184" font-size="12" fill="var(--color-fg-muted)">past 360: remove a full circle</text>
<text x="424" y="208" font-size="14" fill="var(--color-brand)" font-weight="700" class="num">410 − 360 = 050</text>
