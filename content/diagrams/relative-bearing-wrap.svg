<text x="424" y="244" font-size="12" fill="var(--color-fg-muted)">10° takes you to north,</text><text x="424" y="259.6" font-size="12" fill="var(--color-fg-muted)">the other 50° is past it.</text>
<text x="424" y="282" font-size="12" fill="var(--color-fg)" font-weight="600">Below 000? Add 360.</text>
<text x="410" y="326" font-size="12" fill="var(--color-fg-muted)">Same rule for any relative bearing:</text><text x="410" y="341.6" font-size="12" fill="var(--color-fg-muted)">300 + 100 = 400 → 040°M</text>
