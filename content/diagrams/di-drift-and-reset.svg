<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" data-prefix="ddr">
<title>Why the directional indicator must be reset</title>
<desc>Qualitative sketch. The heading error of the directional indicator grows steadily with time, from friction in its bearings and gimbals and from the Earth turning beneath a gyro that holds a fixed direction in space. Resetting it to the magnetic compass about every 10 to 15 minutes, in straight and level flight, brings the error back to zero. Resetting during a turn copies the compass's turning error into the DI.</desc>
