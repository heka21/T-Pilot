<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" data-prefix="sbf">
<title>The sea breeze and its front</title>
<desc>Cross-section of the west coast on a warm afternoon, sea on the left. The land heats, warm air rises over it, and cool, moist sea air flows onshore underneath as the sea breeze, returning seaward aloft and sinking over the sea. Where the cool sea air meets the warm inland air it pushes in as a shallow wedge, the sea breeze front, marked by cumulus and wind shear. Moist sea air moving inland can also bring low cloud.</desc>
