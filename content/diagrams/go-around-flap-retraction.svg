<title>Go-around: flap up in stages</title>
<desc>Side view of a go-around from a full-flap approach. Raising all the flap at once removes its extra lift: the stall speed jumps towards the clean figure while the aeroplane is still slow, and it sinks towards the ground. Flown properly: first full power and climb attitude together, then the first, high-drag stage of flap once climbing, then accelerate and raise the rest in stages at the POH speeds, keeping below VFE until the flap is up.</desc>
