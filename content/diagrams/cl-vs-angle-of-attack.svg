<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="cla">
<title>Lift coefficient against angle of attack</title>
<desc>Lift coefficient rises in a straight line with angle of attack until the critical angle of about 16 degrees, where it peaks and the wing stalls; beyond it lift falls as the airflow separates.</desc>
