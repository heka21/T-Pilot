<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" role="img" data-prefix="cfa">
<title>The COM radio face</title>
<desc>A typical COM radio. The display shows the active frequency, 126.700, which the radio transmits and receives on, and the standby frequency, 120.025, a scratch pad. The concentric knobs change only the standby: the outer knob whole megahertz, the inner knob kilohertz. The flip-flop button swaps standby and active. The volume knob is often the on/off switch, and pulling it opens the squelch to test for hiss. A TX indicator lights while the transmitter is keyed; lit with no PTT pressed means a stuck microphone.</desc>
<style>.cfa-ff{animation:cfa-ff 3s ease-in-out infinite}
@keyframes cfa-ff{0%,60%,100%{opacity:.3}75%{opacity:1}}</style>
