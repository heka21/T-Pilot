<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="pbt">
<title>Why a propeller blade is twisted</title>
<desc>Three sections of one blade at the same forward speed, 80 knots. Near the hub the section moves round slowly, so its helical path is steep and the blade angle is large. Three-quarters out it moves round at about 345 knots at 2,400 RPM: helix angle 13 degrees, blade angle 21 degrees, angle of attack 8. Near the tip it moves fastest, the helical path is flattest and the blade angle smallest. The twist keeps each section at a sensible angle of attack.</desc>
