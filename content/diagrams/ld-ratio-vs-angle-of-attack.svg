<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" data-prefix="lda">
<title>Most efficient at 4 degrees, most lift at 16</title>
<desc>Two graphs against the same angle of attack scale. Above, the lift/drag ratio rises quickly to a peak at about 4 degrees, the best L/D, and falls away either side. Below, the lift coefficient rises in a straight line to its maximum at about 16 degrees, the critical angle, and then collapses. The two peaks are about 12 degrees apart: the efficient wing has a large margin to the stall.</desc>
