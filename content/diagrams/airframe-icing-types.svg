<text x="476" y="284" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Small supercooled drops: about −10 to</text><text x="476" y="299.6" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">−20 °C, in stratiform cloud.</text><text x="476" y="315.2" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Freezes instantly, trapping air: white,</text><text x="476" y="330.8" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">brittle and rough, on the leading edge.</text>
<text x="320" y="364" font-size="11" text-anchor="middle" fill="var(--color-fg-faint)">Either kind adds weight and drag, destroys lift and raises the stall speed.</text><text x="320" y="378.3" font-size="11" text-anchor="middle" fill="var(--color-fg-faint)">A VFR pilot stays out of cloud and notes the freezing level in the GAF.</text>
