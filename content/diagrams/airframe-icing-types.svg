<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" role="img" data-prefix="ait">
<title>Clear ice and rime ice on a wing</title>
<desc>Two wing sections with the airflow from the left. Left, clear ice: large supercooled drops, 0 to minus 10 degrees in cumulus and cumulonimbus or freezing rain, freeze slowly, so the water runs back over the wing before it sets into a hard, heavy, clear sheet: the most dangerous. Right, rime ice: small supercooled drops, about minus 10 to minus 20 degrees in stratiform cloud, freeze instantly, trapping air, and build a white, brittle, rough shape forward on the leading edge.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker><clipPath id="ait-clip0"><rect x="14" y="44" width="300" height="218" rx="10"/></clipPath><clipPath id="ait-clip1"><rect x="326" y="44" width="300" height="218" rx="10"/></clipPath></defs>
<text x="320" y="26" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Why is clear ice worse than rime?</text>
<rect x="14" y="44" width="300" height="218" rx="10" fill="var(--color-surface-2)" stroke="none"/>
