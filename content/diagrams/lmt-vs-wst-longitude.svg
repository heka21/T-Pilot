<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="lmt">
<title>How far each WA town's sun time sits from WST</title>
<desc>A west to east strip of longitude from 114 to 122 degrees east. WST is the local mean time of the 120 degrees east meridian, UTC plus 8. Each degree of longitude is 4 minutes. Geraldton at 114 42 E runs about 21 minutes behind WST, Bunbury at 115 40 E about 17, Perth Airport at 115 58 E about 16, and Kalgoorlie at 121 28 E about 6 minutes ahead. Below, the Perth worked example: 1815 LMT minus 7 hours 44 is 1031 UTC, plus 8 hours is 1831 WST, the same as 1815 plus 16 minutes.</desc>
<style>.lmt-sun { animation: lmt-move 8s linear infinite; } @keyframes lmt-move { from { transform: translateX(0); } to { transform: translateX(-470px); } }</style>
