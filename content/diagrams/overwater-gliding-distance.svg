<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="owg">
<title>Over water: within gliding distance of land?</title>
<desc>Side view of a crossing from the coast to an island. Two dashed glide lines rise from each shoreline: above them, an aeroplane could glide to that shore if the engine stopped. At 1,500 ft the middle of the crossing lies below both glide lines, beyond gliding distance of land, where life jackets must be carried for each person in a single-engine aeroplane. At 6,500 ft the track stays above the glide lines all the way, so the whole crossing may be within gliding distance. Heights exaggerated, not to scale.</desc>
