<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" data-prefix="bls">
<title>Two angles of attack, two speeds, at two weights</title>
<desc>Angle of attack needed for level flight against airspeed, at maximum weight and at a lighter weight. The best lift/drag angle of about 4 degrees gives the best glide speed: 70 knots at maximum weight, about 63 knots lighter. The critical angle of about 16 degrees gives the stall speed, which is also lower when lighter. The angles stay the same.</desc>
