<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" data-prefix="vil">
<title>Landing illusions: what you think, what you do</title>
<desc>Six small panels. Black hole: dark ground before a lit runway makes you feel high, so you fly too low and land short. A narrow or long runway looks high: too low. A wide runway looks low: too high. An upsloping runway looks high: too low. A downsloping runway looks low: too high. A sloping cloud top is a false horizon: you bank to level with it. The fix is the PAPI or a planned descent profile, not the look of the lights.</desc>
