<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" data-prefix="vlr">
<title>VHF range against height</title>
<desc>Line-of-sight range to a station at sea level, range in nautical miles about 1.23 times the square root of the height in feet. 1,500 ft gives about 48 nm and 5,000 ft about 87 nm. Four times the height, 1,500 to 6,000 ft, only doubles the range, from 48 to about 95 nm. Terrain, transmitter power and antenna shielding often make the real range less.</desc>
