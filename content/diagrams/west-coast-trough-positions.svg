<title>Where the west coast trough lies decides Perth's weather</title>
<desc>Two maps of south-west Western Australia, north up. Left: the trough lies off the coast, Perth is on its eastern side and gets hot, dry easterly to north-easterly winds from the interior; the sea breeze is held offshore and the temperature climbs past 40 degrees. Right: the trough has moved inland, Perth is on its western side and the wind swings south to south-westerly as the sea breeze, the Fremantle Doctor, arrives and the temperature drops; inland, convergence along the trough sets off high-based storms and dust.</desc>
