<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" data-prefix="mpd">
<title>MAYDAY or PAN PAN?</title>
<desc>One test separates the two calls: is the aircraft threatened by grave and imminent danger, requiring immediate assistance? Yes: distress, MAYDAY three times, absolute priority, squawk 7700; examples engine failure with a forced landing, fire or structural failure, pilot incapacitated with no other pilot, lost with fuel nearly exhausted. No, but a safety concern for the aircraft or someone on board or in sight: urgency, PAN PAN three times, priority over all except distress; examples a rough engine still producing power, lost with fuel to spare, alternator failure, sick passenger, bird strike with the aircraft controllable. Upgrade a PAN if it worsens; cancel a MAYDAY when the danger is over.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="320" y="28" font-size="16" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Do I need help now, or do people need to know?</text>
<rect x="150" y="45" width="340" height="30" rx="15" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="320" y="64.5" font-size="12.5" text-anchor="middle" fill="var(--color-fg)" font-weight="700">Something is wrong: fly the aeroplane first</text>
<line x1="320" y1="76" x2="320" y2="96" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="150" y="98" width="340" height="62" rx="12" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<text x="320" y="122" font-size="14" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="700">Grave and imminent danger,</text>
<text x="320" y="142" font-size="14" text-anchor="middle" fill="var(--color-brand-fg)" font-weight="700">needing immediate assistance?</text>
<path d="M150 129 L100 129 L100 186" stroke="var(--color-bad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="124" y="120" font-size="12.5" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="700">YES</text>
<path d="M490 129 L540 129 L540 186" stroke="var(--color-warn)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="516" y="120" font-size="12.5" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="700">NO</text>
<rect x="20" y="190" width="290" height="230" rx="10" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="2"/>
<text x="34" y="216" font-size="15" fill="var(--color-bad-fg)" font-weight="700">MAYDAY MAYDAY MAYDAY</text>
<text x="34" y="236" font-size="12" fill="var(--color-bad-fg)">Distress: help now</text>
<line x1="34" y1="248" x2="296" y2="248" stroke="var(--color-bad)" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="406" font-size="12" fill="var(--color-bad-fg)" font-weight="600">absolute priority · squawk 7700</text>
<rect x="330" y="190" width="290" height="230" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="2"/>
<text x="344" y="216" font-size="15" fill="var(--color-warn-fg)" font-weight="700">PAN PAN, PAN PAN, PAN PAN</text>
<text x="344" y="236" font-size="12" fill="var(--color-warn-fg)">Urgency: no immediate help needed</text>
<line x1="344" y1="248" x2="606" y2="248" stroke="var(--color-warn)" stroke-width="1" stroke-linecap="round"/>
<text x="344" y="406" font-size="12" fill="var(--color-warn-fg)" font-weight="600">priority over all except distress</text>
<circle cx="38" cy="268" r="3" fill="var(--color-bad)" stroke="none"/>
<text x="48" y="272" font-size="12.5" fill="var(--color-bad-fg)">Engine failure, forced landing</text>
