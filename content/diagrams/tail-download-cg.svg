<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="tdc">
<title>How CG position changes the tail's job</title>
<desc>Two side views. Forward CG: the CG is well ahead of the centre of lift, so the tail must push down hard; the wing must carry the weight plus that download, so it flies at a higher angle of attack and stalls at a higher speed, but the long distance to the tail makes it very stable. Aft CG: the CG is close to the centre of lift, the tail pushes down only lightly and the wing carries less, so the stall speed is lower, but the tail's leverage over the CG is short and the restoring moment weak: less stable, light and over-sensitive in pitch.</desc>
