<text x="322" y="346" font-size="14" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="700">May fly again (within any conditions)</text>
<text x="20" y="28" font-size="13" fill="var(--color-fg)" font-weight="600">A pilot in command must not fly with a known defect that has not been dealt with.</text>
<text x="20" y="372" font-size="11" fill="var(--color-fg-faint)">A defect that affects safety may also need a transport safety report.</text>
