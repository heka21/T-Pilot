<title>What happens after a defect is found</title>
<desc>Flow: a defect is found (or appears in flight, then after landing); it is endorsed in the defect section, Part 2, of the maintenance release with a description, the date and time in service, and the signature and licence number. The aircraft cannot fly until a licensed engineer rectifies it and signs it off, or endorses it as a permissible unserviceability with any conditions.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<rect x="20" y="40" width="170" height="86" rx="8" fill="var(--color-warn-soft)" stroke="var(--color-line)" stroke-width="1"/><text x="32" y="60" font-size="13" fill="var(--color-warn-fg)" font-weight="700">Defect found</text><text x="32" y="77.55" font-size="11" fill="var(--color-warn-fg)">before or after a flight;</text><text x="32" y="91.85" font-size="11" fill="var(--color-warn-fg)">in flight: endorse it</text><text x="32" y="106.15" font-size="11" fill="var(--color-warn-fg)">after landing</text>
<line x1="192" y1="83" x2="222" y2="83" stroke="var(--color-fg-muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="224" y="40" width="200" height="86" rx="8" fill="var(--color-brand-soft)" stroke="var(--color-line)" stroke-width="1"/><text x="236" y="60" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Endorse the MR, Part 2</text><text x="236" y="77.55" font-size="11" fill="var(--color-brand-fg)">clear description; date and</text><text x="236" y="91.85" font-size="11" fill="var(--color-brand-fg)">time in service; signature</text><text x="236" y="106.15" font-size="11" fill="var(--color-brand-fg)">and licence number</text>
<line x1="426" y1="83" x2="456" y2="83" stroke="var(--color-fg-muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="458" y="40" width="162" height="86" rx="8" fill="var(--color-bad-soft)" stroke="var(--color-line)" stroke-width="1"/><text x="470" y="60" font-size="13" fill="var(--color-bad-fg)" font-weight="700">Grounded</text><text x="470" y="77.55" font-size="11" fill="var(--color-bad-fg)">cannot fly again until</text><text x="470" y="91.85" font-size="11" fill="var(--color-bad-fg)">an engineer deals</text><text x="470" y="106.15" font-size="11" fill="var(--color-bad-fg)">with it</text>
<path d="M539 128 L539 160 L150 160 L150 190" stroke="var(--color-fg-muted)" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
