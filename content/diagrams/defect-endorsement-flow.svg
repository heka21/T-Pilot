<rect x="40" y="192" width="230" height="86" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-line)" stroke-width="1"/><text x="52" y="212" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Rectified</text><text x="52" y="229.55" font-size="11" fill="var(--color-ok-fg)">licensed engineer fixes it</text><text x="52" y="243.85" font-size="11" fill="var(--color-ok-fg)">and signs it off</text>
<rect x="360" y="192" width="260" height="86" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-line)" stroke-width="1"/><text x="372" y="212" font-size="13" fill="var(--color-ok-fg)" font-weight="700">Permissible unserviceability</text><text x="372" y="229.55" font-size="11" fill="var(--color-ok-fg)">engineer finds it does not affect</text><text x="372" y="243.85" font-size="11" fill="var(--color-ok-fg)">safety and endorses it, with</text><text x="372" y="258.15" font-size="11" fill="var(--color-ok-fg)">any conditions</text>
