<title>Secrecy: use it for safety, never spread it</title>
<desc>You may and should listen. A message not addressed to you may be used for the safety purpose it was sent for: acting on broadcasts to all stations, avoiding traffic you hear about, and relaying a distress call that has not been answered. You may not divulge it to anyone, publish it, use it for personal gain, or record and broadcast or post it.</desc>
