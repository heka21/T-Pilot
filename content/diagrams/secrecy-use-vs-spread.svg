<text x="58" y="196" font-size="12.5" fill="var(--color-ok-fg)" font-weight="600">Act on broadcasts to all stations:</text>
<text x="58" y="212" font-size="12" fill="var(--color-ok-fg)">“Northam traffic …” is for you</text>
