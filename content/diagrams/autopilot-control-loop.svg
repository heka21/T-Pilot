<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="apl">
<title>The parts of an autopilot</title>
<desc>Sensors (attitude gyro, turn coordinator or AHRS, heading indicator, VOR or GNSS) tell the computer what the aeroplane is doing; the mode controller tells it what to hold (ROL, HDG, NAV, PIT, ALT, VS). The computer works out the correction and the servos, electric motors driving the control cables through slip clutches, move the ailerons, elevator and sometimes the trim. The aeroplane responds and the sensors see the result, closing the loop. No mode moves the throttle.</desc>
