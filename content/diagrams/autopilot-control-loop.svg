<rect x="321.77" y="79.2" width="34.46" height="17.6" rx="8.8" fill="var(--color-info-soft)" stroke="none"/><text x="339" y="91.85" font-size="11" text-anchor="middle" fill="var(--color-info-fg)" font-weight="600">PIT</text>
