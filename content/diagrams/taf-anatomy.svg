<title>Anatomy of a TAF</title>
<desc>The Jandakot TAF from the note, group by group. TAF YPJT: aerodrome forecast for Jandakot. 030400Z: issued on the 3rd at 0400 UTC. 0306/0318: valid 0600 to 1800 UTC on the 3rd. 12012KT: wind 120 degrees true at 12 knots. 9999: visibility 10 km or more. FEW030 SCT045: few cloud at 3,000 ft and scattered at 4,500 ft above the aerodrome. FM031000 09008KT CAVOK: from 1000 UTC a permanent change to wind 090 at 8 knots and CAVOK. TEMPO 0306/0309 4000 SHRA BKN020: between 0600 and 0900 UTC temporary spells of 4,000 m in showers of rain with broken cloud at 2,000 ft. T and Q: temperatures and QNH at 3-hourly intervals.</desc>
