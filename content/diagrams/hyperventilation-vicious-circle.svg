<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" data-prefix="hvc">
<title>Hyperventilation feeds on itself</title>
<desc>A loop: anxiety makes you breathe faster or deeper; over-breathing blows off carbon dioxide; low CO2 narrows the brain's blood vessels, makes haemoglobin hold on to its oxygen and makes nerves irritable; that brings dizziness, tingling and spasm; the alarming symptoms make you more anxious. Break the circle by recognising it, slowing the breathing to one breath every 4 to 5 seconds and talking out loud; at altitude use oxygen or descend. Do not take deep breaths.</desc>
