<text x="208" y="73" font-size="14" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="800">Anxiety</text>
<text x="208" y="90" font-size="11" text-anchor="middle" fill="var(--color-warn-fg)">stress, fear, a first solo</text>
<rect x="260" y="175" width="140" height="62" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="2"/>
<text x="330" y="195" font-size="14" text-anchor="middle" fill="var(--color-warn-fg)" font-weight="800">Over-breathing</text>
<text x="330" y="212" font-size="11" text-anchor="middle" fill="var(--color-warn-fg)">faster or deeper</text><text x="330" y="226.3" font-size="11" text-anchor="middle" fill="var(--color-warn-fg)">than you need</text>
<rect x="138" y="297" width="140" height="62" rx="10" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="2"/>
<text x="208" y="317" font-size="14" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="800">CO₂ falls</text>
<text x="208" y="334" font-size="11" text-anchor="middle" fill="var(--color-bad-fg)">brain vessels narrow,</text><text x="208" y="348.3" font-size="11" text-anchor="middle" fill="var(--color-bad-fg)">haemoglobin grips O₂</text>
<rect x="16" y="175" width="140" height="62" rx="10" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="2"/>
<text x="86" y="195" font-size="14" text-anchor="middle" fill="var(--color-bad-fg)" font-weight="800">Symptoms</text>
<text x="86" y="212" font-size="11" text-anchor="middle" fill="var(--color-bad-fg)">dizzy, tingling,</text><text x="86" y="226.3" font-size="11" text-anchor="middle" fill="var(--color-bad-fg)">spasm: alarming</text>
<text x="208" y="202" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">builds over</text><text x="208" y="217.6" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">a minute or so</text>
