<text x="454" y="190" font-size="12" fill="var(--color-ok-fg)">Talk out loud: speech</text><text x="454" y="205.6" font-size="12" fill="var(--color-ok-fg)">forces slow breathing</text>
<circle cx="434" cy="246" r="11" fill="var(--color-surface)" stroke="var(--color-ok)" stroke-width="1.25"/>
<text x="434" y="251" font-size="13" text-anchor="middle" fill="var(--color-ok-fg)" font-weight="800" class="num">4</text>
<text x="454" y="246" font-size="12" fill="var(--color-ok-fg)">At altitude: oxygen or</text><text x="454" y="261.6" font-size="12" fill="var(--color-ok-fg)">descend: it may be hypoxia</text>
