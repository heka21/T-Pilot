<text x="68" y="324" font-size="12" text-anchor="end" fill="var(--color-brand-fg)" font-weight="700">about a</text><text x="68" y="339.6" font-size="12" text-anchor="end" fill="var(--color-brand-fg)" font-weight="700">hazard</text><text x="68" y="355.2" font-size="12" text-anchor="end" fill="var(--color-brand-fg)" font-weight="700">to others</text>
<text x="20" y="412" font-size="12" fill="var(--color-fg-muted)">No prefix for a routine traffic call (“turning base, runway 27”).</text>
<text x="20" y="430" font-size="12" fill="var(--color-fg-muted)">If the hazard has already harmed your aircraft, the call is PAN PAN or MAYDAY, not SECURITE.</text>
