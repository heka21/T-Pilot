<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="spl">
<title>MAYDAY, PAN PAN or SECURITE</title>
<desc>Three radio prefixes, each said three times. MAYDAY, distress: grave and imminent danger, immediate help needed; example: smoke from behind the panel has become a fire. PAN PAN, urgency: a problem that needs attention, without immediate danger; example: a bird strike has cracked the windscreen. Both are about the caller's own aircraft. SECURITE, the safety signal: a safety-of-navigation or important weather message for everyone else, nobody in danger yet; example: kangaroos on runway 27, western half. A routine traffic call such as turning base takes no prefix.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="30" font-size="15" fill="var(--color-fg)" font-weight="700">Which prefix? Ask who the message is about, and how bad it is</text>
<rect x="92" y="52" width="528" height="104" rx="10" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<text x="108" y="82" font-size="18" fill="var(--color-bad-fg)" font-weight="800">MAYDAY × 3</text>
<text x="108" y="104" font-size="13" fill="var(--color-bad-fg)" font-weight="700">Distress</text>
<text x="282" y="78" font-size="12.5" fill="var(--color-bad-fg)">grave and imminent danger:</text><text x="282" y="94.88" font-size="12.5" fill="var(--color-bad-fg)">you need immediate help</text>
<text x="108" y="136" font-size="12.5" fill="var(--color-fg)" font-style="italic">e.g. “the smoke from behind the panel has become a fire”</text>
<rect x="92" y="166" width="528" height="104" rx="10" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.25"/>
<text x="108" y="196" font-size="18" fill="var(--color-warn-fg)" font-weight="800">PAN PAN × 3</text>
<text x="108" y="218" font-size="13" fill="var(--color-warn-fg)" font-weight="700">Urgency</text>
<text x="282" y="192" font-size="12.5" fill="var(--color-warn-fg)">a problem that needs attention,</text><text x="282" y="208.88" font-size="12.5" fill="var(--color-warn-fg)">no immediate danger yet</text>
<text x="108" y="250" font-size="12.5" fill="var(--color-fg)" font-style="italic">e.g. “a bird strike has cracked the windscreen”</text>
<rect x="92" y="280" width="528" height="104" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2"/>
<text x="108" y="310" font-size="18" fill="var(--color-brand-fg)" font-weight="800">SECURITE × 3</text>
<text x="108" y="332" font-size="13" fill="var(--color-brand-fg)" font-weight="700">Safety signal</text>
<text x="282" y="306" font-size="12.5" fill="var(--color-brand-fg)">safety of navigation or an important</text><text x="282" y="322.88" font-size="12.5" fill="var(--color-brand-fg)">weather warning for everyone listening</text>
<text x="108" y="364" font-size="12.5" fill="var(--color-fg)" font-style="italic">e.g. “kangaroos on runway 27, western half”</text>
<path d="M86 58 Q78 58 78 68 L78 254 Q78 264 86 264" stroke="var(--color-fg-muted)" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="153" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" font-weight="700">about</text><text x="68" y="168.6" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" font-weight="700">my own</text><text x="68" y="184.2" font-size="12" text-anchor="end" fill="var(--color-fg-muted)" font-weight="700">aircraft</text>
