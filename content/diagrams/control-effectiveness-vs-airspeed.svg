<title>Control effectiveness with airspeed and power</title>
<desc>A grid rating the elevator, rudder and ailerons in three cases. Low airspeed with power off: all three weak and sloppy. Low airspeed with high power: the slipstream over the tail makes the elevator and rudder effective, the ailerons, outside the slipstream, stay weak. High airspeed: all three effective and heavier.</desc>
