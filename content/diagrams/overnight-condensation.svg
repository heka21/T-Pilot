<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" data-prefix="onc">
<title>Why fill the tanks before overnight parking</title>
<desc>Two wing tanks overnight. A partly filled tank has a large air space; as the air cools overnight its moisture condenses on the tank walls and runs down into the fuel as water. A full tank has little air, so little water forms. The trade-off: you may be over weight for the next flight, and fuel expands and vents as the day warms.</desc>
