<title>A collision course does not move on the windscreen</title>
<desc>Plan view of two aircraft on converging tracks, shown at equal time intervals. The line of sight between them stays parallel to itself: a constant relative bearing. From the cockpit the other aircraft stays fixed on the windscreen and only grows, slowly at first and then very fast, so peripheral vision, which hunts for movement, does not notice it.</desc>
