<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" data-prefix="int">
<title>Interception: the three signals and your replies</title>
<desc>Three panels. One: the interceptor, ahead and to your left, rocks its wings then makes a slow level turn onto the desired heading: you have been intercepted, follow me; reply by rocking your wings and following. Two: the interceptor makes an abrupt breakaway, a climbing turn of 90 degrees or more without crossing ahead of you: you may proceed; reply by rocking your wings. Three: the interceptor lowers its gear if fitted, shows its landing lights and overflies the runway: land at this aerodrome; reply by lowering your gear if fitted, following and landing if safe. At night, flashing navigation lights replace wing rocking.</desc>
