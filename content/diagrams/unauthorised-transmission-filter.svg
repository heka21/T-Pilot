<title>May I make this call?</title>
<desc>A call must pass six gates before you press the PTT: is it necessary, in clean language, true, identified with your call-sign, on the right frequency for its purpose, and from an approved radio? Failing any gate makes it an unauthorised transmission; the examples come from the lesson's worked example. A call that passes every gate is made once, short and in standard words.</desc>
