<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 514" role="img" data-prefix="apm">
<title>Talk on one radio, listen to several</title>
<desc>Two audio panel set-ups side by side. The MIC selector connects the microphone and press-to-talk switch to one transmitter only, COM 1 or COM 2. The receive buttons (COM 1, COM 2, NAV, ADF, marker) each add a radio to the headset. Left, set correctly: MIC on COM 1, which is tuned to the CTAF, with COM 1 and COM 2 both selected to receive, so you call on the CTAF and also monitor the area frequency on COM 2. Right, the classic trap: the CTAF is on COM 2 and heard clearly, but the MIC selector is on COM 1, tuned to the area frequency, so every call goes out on the wrong frequency and nobody answers. Hearing a frequency proves nothing about where you transmit; the TX light on the radio that is transmitting confirms it during the test call.</desc>
