<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" role="img" data-prefix="rfa">
<title>When the radio fault will not clear</title>
<desc>The corrective actions in order, each with the reason for it. In the air: squawk 7600 if you were, or were about to be, talking to ATC, which tells a radar controller without a word that you have lost communications; follow the ERSA EMERG radio failure procedure, staying in VMC and landing at the most suitable aerodrome, so ATC can expect a known procedure rather than improvisation; transmit blind, prefixing calls with 'transmitting blind', because your transmitter may work even if your receiver does not. On the ground: report arrival, which stops a search being started; write the defect on the maintenance release, or it is a trap for the next pilot.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<text x="20" y="28" font-size="16" fill="var(--color-fg)" font-weight="700">Stop fault-finding and cope: each action tells someone</text>
<text x="64" y="58" font-size="12" fill="var(--color-fg-faint)" font-weight="700">Action</text>
<text x="290" y="58" font-size="12" fill="var(--color-fg-faint)" font-weight="700">Tells</text>
<text x="446" y="58" font-size="12" fill="var(--color-fg-faint)" font-weight="700">Why</text>
<line x1="36" y1="90" x2="36" y2="428" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round"/>
<circle cx="36" cy="90" r="13" fill="var(--color-brand)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="36" y="95" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">1</text>
<text x="64" y="95" font-size="15" fill="var(--color-fg)" font-weight="700">Squawk 7600</text>
<text x="64" y="113" font-size="11.5" fill="var(--color-fg-muted)">if you were, or were about</text><text x="64" y="127.95" font-size="11.5" fill="var(--color-fg-muted)">to be, talking to ATC</text>
<line x1="250" y1="90" x2="282" y2="90" stroke="var(--color-info)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="288" y="78" width="142" height="24" rx="12" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1"/>
<text x="359" y="94.5" font-size="12" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">radar controller</text>
<text x="446" y="94" font-size="12" fill="var(--color-fg-muted)">Says “lost communications”</text><text x="446" y="109.6" font-size="12" fill="var(--color-fg-muted)">without a word</text>
<circle cx="36" cy="166" r="13" fill="var(--color-brand)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="36" y="171" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">2</text>
<text x="64" y="171" font-size="15" fill="var(--color-fg)" font-weight="700">Follow ERSA EMERG</text>
<text x="64" y="189" font-size="11.5" fill="var(--color-fg-muted)">radio failure procedure:</text><text x="64" y="203.95" font-size="11.5" fill="var(--color-fg-muted)">stay in VMC, land at the</text><text x="64" y="218.9" font-size="11.5" fill="var(--color-fg-muted)">most suitable aerodrome</text>
<line x1="250" y1="166" x2="282" y2="166" stroke="var(--color-info)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="288" y="154" width="142" height="24" rx="12" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1"/>
<text x="359" y="170.5" font-size="12" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">ATC and traffic</text>
<text x="446" y="170" font-size="12" fill="var(--color-fg-muted)">They expect a known</text><text x="446" y="185.6" font-size="12" fill="var(--color-fg-muted)">procedure, not improvisation</text>
<circle cx="36" cy="242" r="13" fill="var(--color-brand)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="36" y="247" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">3</text>
<text x="64" y="247" font-size="15" fill="var(--color-fg)" font-weight="700">Transmit blind</text>
<text x="64" y="265" font-size="11.5" fill="var(--color-fg-muted)">prefix your calls with</text><text x="64" y="279.95" font-size="11.5" fill="var(--color-fg-muted)">“transmitting blind”</text>
<line x1="250" y1="242" x2="282" y2="242" stroke="var(--color-info)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="288" y="230" width="142" height="24" rx="12" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1"/>
<text x="359" y="246.5" font-size="12" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">anyone listening</text>
<text x="446" y="246" font-size="12" fill="var(--color-fg-muted)">Your transmitter may work</text><text x="446" y="261.6" font-size="12" fill="var(--color-fg-muted)">even if you hear nothing</text>
<circle cx="36" cy="352" r="13" fill="var(--color-brand)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="36" y="357" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">4</text>
<text x="64" y="357" font-size="15" fill="var(--color-fg)" font-weight="700">Report arrival</text>
<text x="64" y="375" font-size="11.5" fill="var(--color-fg-muted)">once on the ground</text><text x="64" y="389.95" font-size="11.5" fill="var(--color-fg-muted)">(if required)</text>
<line x1="250" y1="352" x2="282" y2="352" stroke="var(--color-info)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="288" y="340" width="142" height="24" rx="12" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1"/>
<text x="359" y="356.5" font-size="12" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">search and rescue</text>
<text x="446" y="356" font-size="12" fill="var(--color-fg-muted)">Stops a search</text><text x="446" y="371.6" font-size="12" fill="var(--color-fg-muted)">being started</text>
<circle cx="36" cy="428" r="13" fill="var(--color-brand)" stroke="var(--color-surface)" stroke-width="2"/>
<text x="36" y="433" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="700" class="num">5</text>
<text x="64" y="433" font-size="15" fill="var(--color-fg)" font-weight="700">Write it up</text>
<text x="64" y="451" font-size="11.5" fill="var(--color-fg-muted)">on the maintenance release:</text><text x="64" y="465.95" font-size="11.5" fill="var(--color-fg-muted)">what failed, when, what tried</text>
<line x1="250" y1="428" x2="282" y2="428" stroke="var(--color-info)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="288" y="416" width="142" height="24" rx="12" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1"/>
<text x="359" y="432.5" font-size="12" text-anchor="middle" fill="var(--color-info-fg)" font-weight="700">the next pilot</text>
<text x="446" y="432" font-size="12" fill="var(--color-fg-muted)">Otherwise it is a trap</text><text x="446" y="447.6" font-size="12" fill="var(--color-fg-muted)">set for the next pilot</text>
<line x1="64" y1="315" x2="620" y2="315" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-dasharray="4 3" stroke-linecap="round"/>
<rect x="244" y="304" width="176" height="22" fill="var(--color-surface)" stroke="none"/>
<text x="332" y="319.5" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)" font-weight="700">landed: on the ground ↓</text>
<text x="620" y="306" font-size="11" text-anchor="end" fill="var(--color-fg-faint)">in the air ↑</text>
<text x="20" y="492" font-size="12" fill="var(--color-fg-faint)">Fly first throughout: stay in VMC and keep a good lookout.</text>
