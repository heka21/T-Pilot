<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" data-prefix="cfh">
<title>The ten cloud genera by height of base</title>
<desc>Three height bands. High cloud, above about 20,000 ft, of ice crystals: cirrus, cirrocumulus and cirrostratus with its halo. Middle cloud, about 6,500 to 20,000 ft: altocumulus, altostratus and nimbostratus, whose base often lowers to near the ground. Low cloud, below about 6,500 ft: stratocumulus and stratus. On the right, the two clouds with a low base and great vertical extent: cumulus and cumulonimbus, which reaches the tropopause and spreads into an anvil.</desc>
