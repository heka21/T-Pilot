<text x="104" y="120" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">CO: colourless,</text><text x="104" y="136.2" font-size="12" text-anchor="middle" fill="var(--color-bad-fg)">odourless, tasteless</text>
<text x="16" y="332" font-size="13" fill="var(--color-fg)" font-weight="700">Suspect CO (headache, drowsiness soon after the heater goes on)? Act at once:</text>
<rect x="16" y="344" width="147" height="48" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<circle cx="38" cy="368" r="12" fill="var(--color-ok)" stroke="none"/>
<text x="38" y="373" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="800">1</text>
<text x="58" y="364" font-size="12" fill="var(--color-ok-fg)" font-weight="700">Cabin heat</text><text x="58" y="379.6" font-size="12" fill="var(--color-ok-fg)" font-weight="700">OFF</text>
<rect x="169" y="344" width="147" height="48" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<circle cx="191" cy="368" r="12" fill="var(--color-ok)" stroke="none"/>
<text x="191" y="373" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="800">2</text>
<text x="211" y="364" font-size="12" fill="var(--color-ok-fg)" font-weight="700">Fresh-air vents</text><text x="211" y="379.6" font-size="12" fill="var(--color-ok-fg)" font-weight="700">OPEN</text>
<rect x="322" y="344" width="147" height="48" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<circle cx="344" cy="368" r="12" fill="var(--color-ok)" stroke="none"/>
<text x="344" y="373" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="800">3</text>
<text x="364" y="364" font-size="12" fill="var(--color-ok-fg)" font-weight="700">Oxygen</text><text x="364" y="379.6" font-size="12" fill="var(--color-ok-fg)" font-weight="700">if carried</text>
<rect x="475" y="344" width="147" height="48" rx="8" fill="var(--color-ok-soft)" stroke="var(--color-ok)" stroke-width="1.25"/>
<circle cx="497" cy="368" r="12" fill="var(--color-ok)" stroke="none"/>
<text x="497" y="373" font-size="13" text-anchor="middle" fill="var(--color-surface)" font-weight="800">4</text>
<text x="517" y="364" font-size="12" fill="var(--color-ok-fg)" font-weight="700">Land ASAP,</text><text x="517" y="379.6" font-size="12" fill="var(--color-ok-fg)" font-weight="700">see a doctor</text>
<text x="320" y="418" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Prevent: a CO detector (an electronic alarm is better), exhaust and heater muff inspections, no smoking.</text>
<text x="320" y="436" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">An exhaust smell means CO is probably there too; no smell does not mean no CO.</text>
