<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" data-prefix="coh">
<title>How carbon monoxide gets into the cabin</title>
<desc>Cutaway of a light aeroplane's nose, engine on the right. Cabin heat is fresh air warmed in a muff around the exhaust. A crack in the exhaust inside the muff puts exhaust gas, with its colourless, odourless carbon monoxide, straight into the cabin through the heater outlet at the pilot's feet. First actions: cabin heat off, fresh-air vents open, oxygen if carried, land as soon as possible.</desc>
