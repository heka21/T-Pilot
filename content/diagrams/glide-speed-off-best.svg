<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 546" role="img" data-prefix="gsb">
<title>Any other speed glides less far</title>
<desc>Above, the lift/drag ratio against airspeed: it peaks at 9 to 1 at the best glide speed and falls either side, to 7 to 1 at a speed somewhat slower (induced drag) or somewhat faster (parasite drag). Below, the result from an engine failure at 3,000 ft above ground: at the best glide speed the aeroplane reaches 27,000 ft, about 4.4 nautical miles; at a speed giving only 7 to 1 it reaches 21,000 ft, about 3.5 nautical miles. Almost a mile lost.</desc>
