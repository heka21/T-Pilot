services:
  casa-theory:
    build: .
    ports:
      - "8081:8080"
    environment:
      - MEDIA_DIR=/app/media
    volumes:
      - casa_data:/app/data
      # Narrated lessons rendered on the host by `python -m tools.audio.build` (not in git, not in the image).
      - ./media:/app/media:ro
      # Uncomment to edit content/ on the host and pick it up with `docker compose restart`:
      # - ./content:/app/content:ro
    restart: unless-stopped

volumes:
  casa_data:
