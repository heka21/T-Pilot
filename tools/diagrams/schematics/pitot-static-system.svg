<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" data-prefix="pss">
<title>The pitot-static system</title>
<desc>The pitot tube faces the airflow and senses pitot (total) pressure; it feeds only the airspeed indicator. The static vent on the side of the fuselage senses static (ambient) pressure and feeds all three pressure instruments: the airspeed indicator, the altimeter and the vertical speed indicator. The airspeed indicator measures the difference between pitot and static pressure. An alternate static source inside the cockpit can replace a blocked static vent.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<!-- airflow -->
<line x1="10" y1="84" x2="44" y2="84" stroke="var(--color-sky-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="10" y1="100" x2="44" y2="100" stroke="var(--color-sky-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="10" y="70" font-size="11" fill="var(--color-sky-fg)" font-weight="600">airflow</text>
<!-- wing and pitot tube -->
<path class="sketch" d="M40 40 C 90 28 170 30 220 44 L 220 52 C 170 56 90 56 40 52 Z" fill="var(--color-surface-2)" stroke="var(--color-fg-muted)" stroke-width="1.5" data-fill-style="solid"/>
<text x="130" y="24" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">under the wing</text>
<path class="sketch" d="M52 86 L 150 86 L 150 98 L 52 98 Z" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="2" data-fill-style="solid"/>
<line x1="130" y1="86" x2="130" y2="52" stroke="var(--color-fg-muted)" stroke-width="3" stroke-linecap="round"/>
<circle cx="110" cy="100" r="2.5" fill="var(--color-fg)"/>
<text x="100" y="122" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">drain hole</text>
<text x="52" y="146" font-size="13" fill="var(--color-brand)" font-weight="700">Pitot tube</text>
<text x="52" y="162" font-size="11" fill="var(--color-fg-muted)">faces the airflow: senses</text>
<text x="52" y="176" font-size="11" fill="var(--color-fg-muted)">pitot (total) pressure</text>
<!-- fuselage side with static vent -->
<path class="sketch" d="M20 268 C 80 250 180 248 250 256 L 250 350 C 180 358 80 356 20 340 Z" fill="var(--color-surface-2)" stroke="var(--color-fg-muted)" stroke-width="1.5" data-fill-style="solid"/>
<circle cx="70" cy="300" r="8" fill="var(--color-surface)" stroke="var(--color-info)" stroke-width="2.5"/>
<circle cx="70" cy="300" r="2.5" fill="var(--color-info)"/>
<text x="30" y="378" font-size="13" fill="var(--color-info)" font-weight="700">Static vent</text>
<text x="30" y="394" font-size="11" fill="var(--color-fg-muted)">flush on the fuselage side:</text>
<text x="30" y="408" font-size="11" fill="var(--color-fg-muted)">senses static (ambient) pressure</text>
<!-- pitot line: to the ASI only -->
<path d="M150 92 L 236 92 L 236 186 L 300 186 L 300 150" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- static line: to all three -->
<path d="M78 300 L 330 300 L 330 220 L 590 220" fill="none" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 220 L 330 158" fill="none" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round"/>
<path d="M460 220 L 460 158" fill="none" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round"/>
<path d="M590 220 L 590 158" fill="none" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round"/>
<!-- instruments -->
<circle class="sketch" cx="315" cy="110" r="46" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2" data-fill-style="solid"/>
<circle class="sketch" cx="460" cy="110" r="46" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2" data-fill-style="solid"/>
<circle class="sketch" cx="590" cy="110" r="44" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2" data-fill-style="solid"/>
<text x="315" y="106" font-size="15" text-anchor="middle" fill="var(--color-fg)" font-weight="700">ASI</text>
<text x="315" y="124" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">pitot − static</text>
<text x="460" y="106" font-size="15" text-anchor="middle" fill="var(--color-fg)" font-weight="700">ALT</text>
<text x="460" y="124" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">static only</text>
<text x="590" y="106" font-size="15" text-anchor="middle" fill="var(--color-fg)" font-weight="700">VSI</text>
<text x="590" y="124" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">static only</text>
<text x="315" y="44" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">dynamic pressure</text>
<text x="460" y="44" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">aneroid capsule</text>
<text x="590" y="44" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">capsule + leak</text>
<!-- alternate static -->
<path d="M200 300 L 200 330 L 300 330" fill="none" stroke="var(--color-warn)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="sketch" x="300" y="318" width="34" height="24" rx="4" fill="var(--color-warn-soft)" stroke="var(--color-warn)" stroke-width="1.5" data-fill-style="solid"/>
<text x="346" y="328" font-size="12" fill="var(--color-warn-fg)" font-weight="700">Alternate static (in the cockpit)</text>
<text x="346" y="344" font-size="11" fill="var(--color-fg-muted)">cabin air is usually slightly below ambient:</text>
<text x="346" y="358" font-size="11" fill="var(--color-fg-muted)">altimeter and ASI read slightly high,</text>
<text x="346" y="372" font-size="11" fill="var(--color-fg-muted)">VSI shows a brief climb when selected</text>
<!-- legend -->
<line x1="346" y1="256" x2="376" y2="256" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round"/>
<text x="384" y="260" font-size="12" fill="var(--color-brand)" font-weight="600">pitot pressure: ASI only</text>
<line x1="346" y1="278" x2="376" y2="278" stroke="var(--color-info)" stroke-width="3" stroke-linecap="round"/>
<text x="384" y="282" font-size="12" fill="var(--color-info)" font-weight="600">static pressure: all three</text>
</svg>
