<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" data-prefix="fss">
<title>A light aeroplane fuel system, and where water collects</title>
<desc>Two wing tanks, each with a vent at the top and a drain at its lowest point, feed a fuel selector. From the selector fuel passes through the strainer (gascolator), which has its own drain at the lowest point of the system, then an electric booster pump where fitted and the engine-driven pump, to the carburettor. Water is heavier than fuel and settles at the low points, which is why the drains are there and why each is sampled before flight.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<!-- fuel lines (drawn first, under the components) -->
<path d="M210 112 L210 140 L296 170" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M430 112 L430 140 L344 170" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320 194 L320 236" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round"/>
<path d="M320 286 L320 340 L340 340" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M444 340 L468 340" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round"/>
<path d="M524 316 L524 276" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round"/>
<!-- tanks -->
<rect class="sketch" x="40" y="70" width="200" height="22" fill="var(--color-brand-soft)" stroke="none" data-fill-style="solid" transform="translate(0 18)"/>
<rect class="sketch" x="40" y="50" width="200" height="62" rx="10" fill="none" stroke="var(--color-fg)" stroke-width="2"/>
<rect class="sketch" x="400" y="70" width="200" height="22" fill="var(--color-brand-soft)" stroke="none" data-fill-style="solid" transform="translate(0 18)"/>
<rect class="sketch" x="400" y="50" width="200" height="62" rx="10" fill="none" stroke="var(--color-fg)" stroke-width="2"/>
<text x="140" y="76" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="700">left wing tank</text>
<text x="500" y="76" font-size="13" text-anchor="middle" fill="var(--color-fg)" font-weight="700">right wing tank</text>
<!-- vents -->
<path d="M60 50 L60 30 L76 30" fill="none" stroke="var(--color-fg-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M580 50 L580 30 L564 30" fill="none" stroke="var(--color-fg-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="34" font-size="11" fill="var(--color-fg-muted)">vent: air in as fuel is used</text>
<text x="556" y="34" font-size="11" text-anchor="end" fill="var(--color-fg-muted)">vent</text>
<!-- water at the tank low points, and the tank drains -->
<g fill="var(--color-sky-fg)"><circle cx="222" cy="106" r="3"/><circle cx="230" cy="104" r="2.5"/><circle cx="418" cy="106" r="3"/><circle cx="410" cy="104" r="2.5"/></g>
<path d="M224 112 L224 124" stroke="var(--color-warn)" stroke-width="3" stroke-linecap="round"/>
<path d="M416 112 L416 124" stroke="var(--color-warn)" stroke-width="3" stroke-linecap="round"/>
<text x="232" y="134" font-size="11" fill="var(--color-warn-fg)" font-weight="600">drain</text>
<text x="408" y="134" font-size="11" text-anchor="end" fill="var(--color-warn-fg)" font-weight="600">drain</text>
<!-- selector -->
<circle class="sketch" cx="320" cy="170" r="24" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2"/>
<path d="M320 170 L320 152" stroke="var(--color-fg)" stroke-width="3" stroke-linecap="round"/>
<text x="356" y="194" font-size="12" fill="var(--color-fg)" font-weight="700">fuel selector</text>
<text x="356" y="209" font-size="11" fill="var(--color-fg-muted)">LEFT · RIGHT · BOTH · OFF</text>
<!-- strainer / gascolator: the lowest point -->
<rect class="sketch" x="296" y="236" width="48" height="50" rx="10" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2"/>
<g fill="var(--color-sky-fg)"><circle cx="312" cy="278" r="3"/><circle cx="322" cy="280" r="3.5"/><circle cx="332" cy="277" r="2.5"/></g>
<path d="M320 286 L320 296" stroke="var(--color-warn)" stroke-width="3" stroke-linecap="round" transform="translate(-14 0)"/>
<text x="292" y="252" font-size="12" text-anchor="end" fill="var(--color-fg)" font-weight="700">strainer (gascolator)</text>
<text x="292" y="267" font-size="11" text-anchor="end" fill="var(--color-fg-muted)">lowest point of the system</text>
<text x="292" y="296" font-size="11" text-anchor="end" fill="var(--color-warn-fg)" font-weight="600">drain</text>
<!-- pumps and carburettor -->
<rect class="sketch" x="340" y="316" width="104" height="48" rx="8" fill="var(--color-surface-2)" stroke="var(--color-fg)" stroke-width="1.5" data-fill-style="solid"/>
<text x="392" y="337" font-size="11" text-anchor="middle" fill="var(--color-fg)" font-weight="600">electric</text>
<text x="392" y="351" font-size="11" text-anchor="middle" fill="var(--color-fg)" font-weight="600">booster pump</text>
<text x="392" y="380" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">(if fitted)</text>
<rect class="sketch" x="468" y="316" width="112" height="48" rx="8" fill="var(--color-surface-2)" stroke="var(--color-fg)" stroke-width="1.5" data-fill-style="solid"/>
<text x="524" y="337" font-size="11" text-anchor="middle" fill="var(--color-fg)" font-weight="600">engine-driven</text>
<text x="524" y="351" font-size="11" text-anchor="middle" fill="var(--color-fg)" font-weight="600">pump</text>
<rect class="sketch" x="476" y="236" width="96" height="40" rx="8" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2"/>
<text x="524" y="260" font-size="12" text-anchor="middle" fill="var(--color-fg)" font-weight="700">carburettor</text>
<line x1="572" y1="256" x2="616" y2="256" stroke="var(--color-fg)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="600" y="240" font-size="11" text-anchor="middle" fill="var(--color-fg-muted)">engine</text>
<!-- the lesson -->
<rect x="20" y="318" width="290" height="96" rx="10" fill="var(--color-sky-soft)"/>
<text x="34" y="340" font-size="13" fill="var(--color-sky-fg)" font-weight="700">Water sinks to the low points</text>
<text x="34" y="358" font-size="11" fill="var(--color-sky-fg)">It is heavier than fuel, so the drains sit at the</text>
<text x="34" y="372" font-size="11" fill="var(--color-sky-fg)">bottom of each tank and the strainer. Sample</text>
<text x="34" y="386" font-size="11" fill="var(--color-sky-fg)">every drain into a clear tester before flight,</text>
<text x="34" y="400" font-size="11" fill="var(--color-sky-fg)">after refuelling and after rain.</text>
</svg>
