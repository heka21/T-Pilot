<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" data-prefix="ean">
<title>The ear: outer, middle and inner</title>
<desc>Cross-section of the ear. The outer ear (ear flap and canal) collects sound and channels it to the eardrum. The air-filled middle ear holds three tiny bones (hammer, anvil, stirrup) that pass the vibration to the inner ear, and connects to the throat through the eustachian tube. The fluid-filled inner ear holds the cochlea for hearing and the vestibular apparatus for balance: three semicircular canals sensing angular acceleration and the otolith organs sensing linear acceleration and gravity. A eustachian tube blocked by a cold causes pain on descent.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
<!-- region brackets -->
<line x1="24" y1="40" x2="226" y2="40" stroke="var(--color-fg-muted)" stroke-width="1.25"/>
<text x="125" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-fg)">Outer ear</text>
<line x1="234" y1="40" x2="318" y2="40" stroke="var(--color-sky-fg)" stroke-width="1.25"/>
<text x="276" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-sky-fg)">Middle (air)</text>
<line x1="326" y1="40" x2="440" y2="40" stroke="var(--color-fg-muted)" stroke-width="1.25"/>
<text x="383" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-fg)">Inner (fluid)</text>
<!-- skull / temporal bone background -->
<path class="sketch" d="M96 70 L440 70 L440 360 L96 360 Z" fill="var(--color-surface-2)" stroke="none" data-fill-style="solid" data-roughness="0.6"/>
<!-- ear flap (pinna) -->
<path class="sketch" d="M98 92 C40 70 18 130 34 180 C44 210 30 236 46 268 C62 300 92 304 98 296 Z" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="2" data-fill-style="solid"/>
<path d="M76 120 C52 130 50 170 66 190" fill="none" stroke="var(--color-fg-muted)" stroke-width="1.25" stroke-linecap="round"/>
<!-- ear canal -->
<rect class="sketch" x="96" y="172" width="134" height="34" fill="var(--color-sky-soft)" stroke="var(--color-fg)" stroke-width="2" data-fill-style="solid"/>
<!-- middle ear cavity -->
<rect class="sketch" x="236" y="132" width="82" height="110" rx="20" fill="var(--color-sky-soft)" stroke="var(--color-fg)" stroke-width="2" data-fill-style="solid"/>
<!-- eustachian tube to the throat -->
<path class="sketch" d="M286 240 C296 280 320 312 366 340 L376 326 C334 300 314 272 304 238 Z" fill="var(--color-sky-soft)" stroke="var(--color-bad)" stroke-width="2" data-fill-style="solid"/>
<!-- eardrum -->
<path d="M233 164 Q238 189 233 214" fill="none" stroke="var(--color-warn)" stroke-width="4" stroke-linecap="round"/>
<!-- ossicles: hammer, anvil, stirrup -->
<path class="sketch" d="M238 186 L252 160 L262 158 L258 168 Z" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="1.5" data-fill-style="solid"/>
<ellipse class="sketch" cx="274" cy="164" rx="12" ry="8" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="1.5" data-fill-style="solid"/>
<path class="sketch" d="M284 170 L300 186 L314 180 L314 194 L298 194 Z" fill="var(--color-surface)" stroke="var(--color-fg)" stroke-width="1.5" data-fill-style="solid"/>
<!-- vestibule, semicircular canals (balance) -->
<ellipse class="sketch" cx="340" cy="186" rx="18" ry="20" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="2" data-fill-style="solid"/>
<ellipse class="sketch" cx="362" cy="116" rx="30" ry="22" fill="none" stroke="var(--color-info)" stroke-width="5"/>
<ellipse class="sketch" cx="398" cy="150" rx="26" ry="18" fill="none" stroke="var(--color-info)" stroke-width="5" transform="rotate(60 398 150)"/>
<ellipse class="sketch" cx="326" cy="132" rx="14" ry="26" fill="none" stroke="var(--color-info)" stroke-width="5"/>
<!-- cochlea (hearing) -->
<path class="sketch" d="M352 206 C392 196 414 222 408 250 C402 280 366 288 350 266 C336 246 352 226 372 232 C390 238 390 260 374 262 C364 263 362 252 370 250" fill="none" stroke="var(--color-brand)" stroke-width="5"/>
<!-- auditory nerve -->
<path d="M410 238 C430 236 438 230 446 222" fill="none" stroke="var(--color-brand)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>
<!-- labels -->
<text x="56" y="330" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">ear flap</text>
<text x="160" y="226" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">ear canal</text>
<text x="160" y="160" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">sound in →</text>
<line x1="233" y1="214" x2="200" y2="262" stroke="var(--color-fg-muted)" stroke-width="1"/>
<text x="196" y="276" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-warn-fg)">eardrum</text>
<line x1="268" y1="156" x2="214" y2="112" stroke="var(--color-fg-muted)" stroke-width="1"/>
<text x="112" y="96" font-size="12" fill="var(--color-fg)">3 tiny bones (ossicles):</text>
<text x="112" y="111" font-size="11" fill="var(--color-fg-muted)">hammer, anvil, stirrup</text>
<text x="226" y="352" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-bad)">eustachian tube</text>
<text x="226" y="366" font-size="11" text-anchor="middle" fill="var(--color-bad)">to the back of the throat</text>
<line x1="296" y1="292" x2="256" y2="338" stroke="var(--color-fg-muted)" stroke-width="1"/>
<!-- legend panel -->
<rect x="462" y="60" width="162" height="98" rx="10" fill="var(--color-info-soft)" stroke="var(--color-info)" stroke-width="1.25"/>
<text x="474" y="82" font-size="14" font-weight="700" fill="var(--color-info-fg)">Balance</text>
<text x="474" y="100" font-size="11" fill="var(--color-info-fg)">semicircular canals:</text>
<text x="474" y="114" font-size="11" fill="var(--color-info-fg)">angular acceleration</text>
<text x="474" y="128" font-size="11" fill="var(--color-info-fg)">(roll, pitch, yaw)</text>
<text x="474" y="146" font-size="11" fill="var(--color-info-fg)">otoliths: linear acc., gravity</text>
<line x1="462" y1="110" x2="426" y2="130" stroke="var(--color-info)" stroke-width="1"/>
<rect x="462" y="172" width="162" height="84" rx="10" fill="var(--color-brand-soft)" stroke="var(--color-brand)" stroke-width="1.25"/>
<text x="474" y="194" font-size="14" font-weight="700" fill="var(--color-brand-fg)">Hearing</text>
<text x="474" y="212" font-size="11" fill="var(--color-brand-fg)">cochlea: hair cells turn</text>
<text x="474" y="226" font-size="11" fill="var(--color-brand-fg)">vibration into signals on</text>
<text x="474" y="240" font-size="11" fill="var(--color-brand-fg)">the auditory nerve</text>
<rect x="400" y="290" width="224" height="70" rx="10" fill="var(--color-bad-soft)" stroke="var(--color-bad)" stroke-width="1.25"/>
<text x="412" y="311" font-size="13" font-weight="700" fill="var(--color-bad-fg)">Tube swollen by a cold?</text>
<text x="412" y="329" font-size="12" fill="var(--color-bad-fg)">Air can't get back into the</text>
<text x="412" y="345" font-size="12" fill="var(--color-bad-fg)">middle ear: pain on descent</text>
<line x1="400" y1="324" x2="376" y2="330" stroke="var(--color-bad)" stroke-width="1"/>
<text x="320" y="392" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">Outer ear collects sound · middle ear passes it on and is kept at outside pressure by the tube</text>
<text x="320" y="410" font-size="12" text-anchor="middle" fill="var(--color-fg-muted)">· inner ear hears (cochlea) and senses balance (vestibular apparatus)</text>
<text x="320" y="430" font-size="11" text-anchor="middle" fill="var(--color-fg-faint)">Schematic, not to scale</text>
</svg>
