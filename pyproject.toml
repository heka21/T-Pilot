[project]
name = "casa-theory"
version = "0.1.0"
description = "Self-hosted study app for the CASA RPL(A) and PPL(A) theory exams"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "markdown>=3.6",
    "pymdown-extensions>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Narrating lessons (python -m tools.audio.build); not needed to run the app.
audio = ["kokoro-onnx>=0.6", "lameenc>=1.8", "numpy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.seed", "app.services", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
